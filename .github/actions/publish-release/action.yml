name: "Publish a plugin release"
description: >
  The mechanical publish shared by every plugin release lane: verify the
  requested version against the plugin's own manifest, cut the release notes
  from its own CHANGELOG, create the namespaced tag and GitHub Release
  idempotently, and read back what was actually published.

outputs:
  tag-object-sha:
    description: "Exact immutable annotated tag object retained by the remote"
    value: ${{ steps.publish.outputs.tag-object-sha }}

# Issue #382 added the ca-sandbox and ca-pi lanes. The `release` and
# `release-codex` jobs were byte-identical apart from nine parameters, so a
# fourth and fifth copy would have put the #380 tag classifier, the #380
# read-back, and the notes extraction in FOUR places. Every one of those is a
# guard against publishing something irreversible at the wrong commit, and a
# guard that exists in four copies is a guard that will be fixed in three.
#
# So the mechanics live here, once, and each lane is a thin job that supplies
# its own manifest, changelog, tag namespace, and latest-badge policy. What
# stays in release.yml is exactly what a contract test must read there: the
# `needs: preflight` edge, the `contents: write` grant, and the single-target
# `if:` condition. Those are per-job facts; these steps are not.
#
# STALENESS (#382 AC). No lane re-runs the built/generated-payload freshness
# gates here. They already hold: the preflight refuses to authorize any
# publisher unless `[GATE ] | [REPO] | Merge readiness` is green for GITHUB_SHA
# ITSELF (#385), and that aggregate includes the surface, sync-core, and
# esbuild staleness jobs. A stale payload is therefore a red gate and an
# unauthorized dispatch, before this action runs at all. A second freshness
# policy implemented here would be a second thing to keep in agreement with
# ci.yml, and the first time they disagreed the publish path would be the copy
# nobody noticed was wrong.

inputs:
  target:
    description: "The resolved target label, for log lines (e.g. ca-pi)"
    required: true
  manifest:
    description: "Path to the plugin manifest whose `.version` is authoritative"
    required: true
  companion-manifest:
    description: >
      Optional second manifest that MUST already agree with `manifest`. ca-pi
      needs it: the repository-root package.json is the manifest Pi itself
      reads on `pi install git:...@<tag>`, so a root that disagrees with the
      plugin manifest would install a package claiming a version the tag does
      not name.
    required: false
    default: ""
  changelog:
    description: "Path to the CHANGELOG holding this version's section"
    required: true
  version-policy:
    description: "Declared version policy used to parse the changelog heading"
    required: false
    default: "semver"
  initial-version:
    description: "Declared initial version for policies that require one"
    required: false
    default: ""
  tag-prefix:
    description: "Tag namespace, e.g. `v` for ca or `ca-pi-v` for ca-pi"
    required: true
  title-prefix:
    description: "Release-title prefix, e.g. `codeArbiter` or `ca-pi`"
    required: true
  requested-version:
    description: "The dispatched version; must equal the manifest version"
    required: true
  summary:
    description: "Optional release-title summary, appended after the version"
    required: false
    default: ""
  mark-latest:
    description: >
      "true" only for the repository's primary release (ca). Every sibling
      plugin is independently versioned and must never displace ca's "Latest"
      badge, so this defaults to false and a lane has to ask for it.
    required: false
    default: "false"
  create-release:
    description: >
      "false" skips the GitHub Release entirely — only the tag is created and
      pushed. This is useful only for callers that intentionally need a tag
      without a public release. Defaults to "true".
    required: false
    default: "true"
  package-host:
    description: "Qualified release-package host to verify and attach; empty for non-artifact targets"
    required: false
    default: ""
  attach-package:
    description: "Whether the verified package is a GitHub Release asset (Pi publishes to npm)"
    required: false
    default: "true"
  ci-run-id:
    description: "Protected successful CI run retaining the exact package cohort"
    required: false
    default: ""
  source-commit:
    description: "Exact source commit bound to the retained package cohort"
    required: false
    default: ""
  cohort-targets:
    description: "Comma-separated qualified targets owned by this exact hosted cohort"
    required: false
    default: ""
  finalize-release:
    description: "Publish the qualified draft after receipt readback; Pi defers until npm readback"
    required: false
    default: "true"
  github-token:
    description: "Token with `contents: write` for the tag and Release"
    required: true
  codex-publisher-actor-id:
    description: "Dedicated Codex distribution GitHub App actor ID"
    required: false
    default: ""
  codex-ruleset-verifier-token:
    description: "Token from a separate non-bypass App that can observe complete ruleset details"
    required: false
    default: ""
  codex-ruleset-verifier-actor-id:
    description: "Separate non-bypass Codex ruleset verifier GitHub App actor ID"
    required: false
    default: ""
  npm-token:
    description: "npm automation token for the qualified ca-codex publication"
    required: false
    default: ""

runs:
  using: composite
  steps:
    - name: Download exact promoted host payloads
      if: ${{ inputs.package-host != '' }}
      uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
      with:
        name: artifact-host-payloads-${{ inputs.source-commit }}
        path: ${{ runner.temp }}/artifact-publication-stage
        run-id: ${{ inputs.ci-run-id }}
        github-token: ${{ inputs.github-token }}
    - name: Download exact normal release package cohort
      if: ${{ inputs.package-host != '' }}
      uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
      with:
        name: artifact-release-packages-${{ inputs.source-commit }}
        path: ${{ runner.temp }}/artifact-publication-packages
        run-id: ${{ inputs.ci-run-id }}
        github-token: ${{ inputs.github-token }}
    - name: Download exact cold-execution receipt matrix
      if: ${{ inputs.package-host != '' }}
      uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
      with:
        pattern: artifact-package-cold-*-${{ inputs.source-commit }}
        path: ${{ runner.temp }}/artifact-publication-cold
        merge-multiple: false
        run-id: ${{ inputs.ci-run-id }}
        github-token: ${{ inputs.github-token }}
    - name: Acquire reviewed npm@11.19.1 CLI
      id: npm-cli
      if: ${{ inputs.package-host != '' }}
      shell: bash
      run: |
        set -euo pipefail
        root="$(mktemp -d "$RUNNER_TEMP/npm-cli.XXXXXXXX")"
        archive="$root/npm.tgz"
        curl --disable --fail --show-error --silent --proto '=https' --tlsv1.2 --max-redirs 0 \
          --output "$archive" "https://registry.npmjs.org/npm/-/npm-11.19.1.tgz"
        actual="sha512-$(openssl dgst -sha512 -binary "$archive" | openssl base64 -A)"
        test "$actual" = "sha512-ztsxKxt/kkIaAs+2i0GU6I+DRmUdrNasxTZKJe9TCdSjKxlhah/4r/hl5ygMD6XAg1qZ9c2TNomR4qgOydp10g=="
        python3 - "$archive" <<'PY'
        import pathlib, sys, tarfile
        with tarfile.open(sys.argv[1], "r:gz") as stream:
            for member in stream.getmembers():
                path = pathlib.PurePosixPath(member.name)
                if (path.is_absolute() or ".." in path.parts or member.issym()
                        or member.islnk() or member.isdev() or member.isfifo()):
                    raise SystemExit(f"unsafe npm CLI archive member: {member.name}")
        PY
        tar --extract --gzip --no-same-owner --no-same-permissions --file "$archive" --directory "$root"
        cli="$(realpath "$root/package/bin/npm-cli.js")"
        case "$cli" in "$root"/*) ;; *) exit 1 ;; esac
        test ! -L "$cli" && test "$("$cli" --version)" = "11.19.1"
        echo "executable=$cli" >> "$GITHUB_OUTPUT"
    - name: Reverify exact retained package cohort before publication
      id: artifact-package
      if: ${{ inputs.package-host != '' }}
      shell: bash
      env:
        PACKAGE_HOST: ${{ inputs.package-host }}
        SOURCE_COMMIT: ${{ inputs.source-commit }}
        CI_RUN_ID: ${{ inputs.ci-run-id }}
        STAGE_ROOT: ${{ runner.temp }}/artifact-publication-stage
        PACKAGE_ROOT: ${{ runner.temp }}/artifact-publication-packages
        COLD_ROOT: ${{ runner.temp }}/artifact-publication-cold
        NPM_CLI: ${{ steps.npm-cli.outputs.executable }}
        WORKFLOW_SHA: ${{ github.sha }}
      run: |
        set -euo pipefail
        python3 .github/scripts/_npm_publishlib.py verify-cohort \
          --package-root "$PACKAGE_ROOT" --stage-root "$STAGE_ROOT" --cold-root "$COLD_ROOT" \
          --source-repo . --source-commit "$SOURCE_COMMIT" --ci-run-id "$CI_RUN_ID" \
          --workflow-sha "$WORKFLOW_SHA" --npm "$NPM_CLI" --trusted-repo . \
          --host "$PACKAGE_HOST" --output "$GITHUB_OUTPUT"

    - name: Resolve and verify version against the manifest
      id: v
      shell: bash
      env:
        CONFIRM: ${{ inputs.requested-version }}
        MANIFEST: ${{ inputs.manifest }}
        COMPANION: ${{ inputs.companion-manifest }}
        TAG_PREFIX: ${{ inputs.tag-prefix }}
      run: |
        set -euo pipefail
        MANIFEST_VERSION=$(node -p "require('./$MANIFEST').version")
        REQ="$CONFIRM"
        # An EMPTY request trusts the manifest's own version outright — the
        # auto-tag lanes have no dispatch input to compare against, only the
        # manifest a merge just advanced. The manual dispatch lanes always
        # supply a non-empty version, so this carve-out never weakens the
        # existing "requested must equal manifest" guard for them.
        if [ -n "$REQ" ] && [ "$REQ" != "$MANIFEST_VERSION" ]; then
          echo "::error::requested '$REQ' does not equal $MANIFEST version '$MANIFEST_VERSION' — bump/align first"
          exit 1
        fi
        # ca-pi only: the manifest the host installs must already agree with the
        # plugin manifest. CI's bump gate enforces this on every PR; asserting it
        # again here costs one `node -p` and is the last point before an
        # irreversible public tag.
        if [ -n "$COMPANION" ]; then
          COMPANION_VERSION=$(node -p "require('./$COMPANION').version")
          if [ "$COMPANION_VERSION" != "$MANIFEST_VERSION" ]; then
            echo "::error::$COMPANION says '$COMPANION_VERSION' but $MANIFEST says '$MANIFEST_VERSION' — the installed manifest would not match the tag"
            exit 1
          fi
        fi
        echo "version=$MANIFEST_VERSION" >> "$GITHUB_OUTPUT"
        echo "tag=${TAG_PREFIX}${MANIFEST_VERSION}" >> "$GITHUB_OUTPUT"

    - name: Extract the CHANGELOG section as release notes
      shell: bash
      env:
        VER: ${{ steps.v.outputs.version }}
        TAG: ${{ steps.v.outputs.tag }}
        CHANGELOG: ${{ inputs.changelog }}
        VERSION_POLICY: ${{ inputs.version-policy }}
        INITIAL_VERSION: ${{ inputs.initial-version }}
      run: |
        set -euo pipefail
        # Use the same policy-aware, duplicate-rejecting extraction as the
        # interactive release contract. A first-match awk extractor can accept
        # ambiguous notes and push an immutable tag before the duplicate is
        # noticed anywhere else.
        python3 core/pysrc/_releaselib.py changelog-section \
          "$GITHUB_WORKSPACE" "$GITHUB_SHA" "$CHANGELOG" "$VER" \
          "$VERSION_POLICY" "$INITIAL_VERSION" > notes.md
        python3 core/pysrc/_releaselib.py notes-match \
          "$TAG" notes.md "$VERSION_POLICY" "$INITIAL_VERSION"
        RELEASE_DATE=$(python3 - <<'PY'
        import re
        heading=open("notes.md",encoding="utf-8").readline().rstrip("\n")
        match=re.search(r"(?: - | — )(\d{4}-\d{2}-\d{2})$",heading)
        if not match: raise SystemExit("committed changelog section has no canonical release date")
        print(match.group(1))
        PY
        )
        printf '%s\nReleased-at: %s\n' "$(cat notes.md)" "$RELEASE_DATE" > tagmsg.txt
        python3 core/pysrc/_releaselib.py dates-match \
          notes.md tagmsg.txt "$VERSION_POLICY" "$INITIAL_VERSION"
        echo "---- notes.md ----"; head -1 notes.md

    - name: Create exact immutable cohort-start marker
      if: ${{ inputs.package-host != '' }}
      shell: bash
      env:
        TARGET: ${{ inputs.target }}
        HOST: ${{ inputs.package-host }}
        TAG: ${{ steps.v.outputs.tag }}
        SOURCE_COMMIT: ${{ inputs.source-commit }}
        SOURCE_TREE: ${{ steps.artifact-package.outputs.source-tree }}
        CI_RUN_ID: ${{ inputs.ci-run-id }}
        COHORT_SHA256: ${{ steps.artifact-package.outputs.cohort-sha256 }}
        COHORT_TARGETS: ${{ inputs.cohort-targets }}
      run: |
        set -euo pipefail
        python3 - <<'PY'
        import base64, hashlib, json, os
        versions = {"ca": json.load(open("plugins/ca/.claude-plugin/plugin.json"))["version"],
                    "ca-codex": json.load(open("plugins/ca-codex/.codex-plugin/plugin.json"))["version"],
                    "ca-pi": json.load(open("plugins/ca-pi/package.json"))["version"]}
        targets = os.environ["COHORT_TARGETS"].split(",")
        if (targets != sorted(set(targets)) or os.environ["TARGET"] not in targets
                or not set(targets) <= {"ca", "ca-codex", "ca-pi"}):
            raise SystemExit("hosted cohort targets are missing, duplicate, or unexpected")
        notes = open("notes.md", "rb").read()
        if not notes.endswith(b"\n"):
            raise SystemExit("canonical release notes must end in exactly retained LF bytes")
        marker = {"format": "codearbiter.cohort-start/0.1.0",
                  "target": os.environ["TARGET"], "host": os.environ["HOST"],
                  "tag": os.environ["TAG"], "source_commit": os.environ["SOURCE_COMMIT"],
                  "source_tree": os.environ["SOURCE_TREE"],
                  "workflow": ".github/workflows/ci.yml", "ci_run_id": os.environ["CI_RUN_ID"],
                  "cohort_sha256": os.environ["COHORT_SHA256"],
                  "release_notes_sha256": hashlib.sha256(notes).hexdigest(),
                  "cohort_tags": {"ca": "v" + versions["ca"],
                                  "ca-codex": "ca-codex-v" + versions["ca-codex"],
                                  "ca-pi": "ca-pi-v" + versions["ca-pi"]},
                  "cohort_targets": targets}
        raw = json.dumps(marker, sort_keys=True, separators=(",", ":")).encode()
        encoded = base64.urlsafe_b64encode(raw).decode().rstrip("=")
        open("cohort-marker.json", "wb").write(raw + b"\n")
        open("qualified-notes.md", "wb").write(
            notes + b"\n<!-- codearbiter-cohort-start-v1:" + encoded.encode() + b" -->\n")
        PY

    - name: Create the tag and GitHub Release (resumable, mismatch-aborting)
      id: publish
      shell: bash
      env:
        GH_TOKEN: ${{ inputs.github-token }}
        SUMMARY: ${{ inputs.summary }}
        TITLE_PREFIX: ${{ inputs.title-prefix }}
        MARK_LATEST: ${{ inputs.mark-latest }}
        CREATE_RELEASE: ${{ inputs.create-release }}
        TAG: ${{ steps.v.outputs.tag }}
        VER: ${{ steps.v.outputs.version }}
        ASSET_PATH: ${{ inputs.attach-package == 'true' && steps.artifact-package.outputs.path || '' }}
        ASSET_FILE: ${{ steps.artifact-package.outputs.file }}
        ASSET_SHA256: ${{ steps.artifact-package.outputs.sha256 }}
        PACKAGE_HOST: ${{ inputs.package-host }}
      run: |
        set -euo pipefail
        # The publisher App token must own Git credentials before either tag
        # push; an actions/checkout job token must never shadow it.
        gh auth setup-git
        PACKAGE_HOST="${PACKAGE_HOST:-}"
        SUM="$SUMMARY"
        if [ -n "$SUM" ]; then TITLE="$TITLE_PREFIX $VER: $SUM"; else TITLE="$TITLE_PREFIX $VER"; fi
        export TITLE

        # Only the primary release claims the "Latest" badge; every sibling
        # plugin versions independently and must not steal it.
        #
        # `--latest=false` EXPLICITLY, never an omitted flag. Omitting it is not
        # neutral: GitHub defaults `make_latest` to true for any non-prerelease,
        # so a sibling that simply "does not pass --latest" still takes the
        # badge. Measured the hard way — ca-pi-v0.1.32, the first ca-pi release,
        # displaced ca v2.8.13 from the position every visitor sees, and the
        # comment here previously claimed that could not happen.
        #
        # Deliberately unquoted below: each value is a single word, and this way
        # the flag is always present rather than conditionally absent.
        if [ "$MARK_LATEST" = "true" ]; then LATEST=--latest; else LATEST=--latest=false; fi

        # An annotated tag needs a committer identity; the runner has none by default.
        git config user.name "github-actions[bot]"
        git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
        RELEASE_DATE=$(sed -n 's/^Released-at: //p' tagmsg.txt)
        [ "$(printf '%s\n' "$RELEASE_DATE" | wc -l)" -eq 1 ]
        printf '%s\n' "$RELEASE_DATE" | grep -Eq '^[0-9]{4}-[0-9]{2}-[0-9]{2}$'
        TAGGER_DATE="$RELEASE_DATE 00:00:00 +0000"
        TAGGER_EPOCH=$(python3 - "$RELEASE_DATE" <<'PY'
        import datetime,sys
        print(int(datetime.datetime.strptime(sys.argv[1], "%Y-%m-%d").replace(
            tzinfo=datetime.timezone.utc).timestamp()))
        PY
        )
        {
          printf 'object %s\ntype commit\ntag %s\n' "$GITHUB_SHA" "$TAG"
          printf 'tagger github-actions[bot] <41898282+github-actions[bot]@users.noreply.github.com> %s +0000\n\n' "$TAGGER_EPOCH"
          cat tagmsg.txt
        } > "$RUNNER_TEMP/expected-tag-object.txt"
        EXPECTED_TAG_OBJECT_SHA=$(git hash-object -t tag --stdin < "$RUNNER_TEMP/expected-tag-object.txt")

        # PEEL the remote tag (#380). An annotated tag's own object id is not
        # the commit it names, so the `^{}` line is the one that can be
        # compared against GITHUB_SHA. Empty output = no such tag.
        TAG_SHA=$(git ls-remote --tags origin "refs/tags/$TAG" "refs/tags/$TAG^{}" \
          | python3 .github/scripts/_releaselib.py peel-tag "$TAG")
        if [ -n "$TAG_SHA" ]; then TAG_EXISTS=true; else TAG_EXISTS=false; fi
        # The tag name is built from the manifest version, so this is the
        # version the REMOTE tag claims; the load-bearing comparison here is
        # TAG_SHA against GITHUB_SHA.
        TAG_VERSION="${TAG##*v}"

        # GitHub's by-tag endpoint returns published Releases only, so its 404
        # is not proof that a draft is absent. Enumerate every Release page with
        # this write-capable repository token (which can see drafts), then let
        # the hermetic classifier distinguish missing, draft, published,
        # duplicate/malformed, and unavailable evidence before any tag can be
        # created or pushed. Any incomplete/API-failed listing blocks.
        RELEASE_RESPONSE="${RUNNER_TEMP:-.}/publish-release-list.json"
        RELEASE_ERROR="${RUNNER_TEMP:-.}/publish-release-response.error"
        set +e
        gh api --paginate --slurp "repos/$GITHUB_REPOSITORY/releases?per_page=100" \
          > "$RELEASE_RESPONSE" 2> "$RELEASE_ERROR"
        RELEASE_API_EXIT=$?
        set -e
        set +e
        RELEASE_LOOKUP=$(python3 .github/scripts/check_command_route_release_state.py api-lookup \
          --expected-tag "$TAG" \
          --api-response "$RELEASE_RESPONSE" \
          --api-exit "$RELEASE_API_EXIT")
        RELEASE_LOOKUP_EXIT=$?
        set -e
        if [ "$RELEASE_LOOKUP_EXIT" -ne 0 ] && ! { [ -n "$PACKAGE_HOST" ] && [ "$RELEASE_LOOKUP" = draft ]; }; then
          [ ! -s "$RELEASE_ERROR" ] || cat "$RELEASE_ERROR" >&2
          echo "::error::refusing to publish $TAG: Release lookup classified as '$RELEASE_LOOKUP'"
          exit 1
        fi
        if [ "$RELEASE_LOOKUP" = "published" ]; then
          RELEASE_NONDRAFT=true
        else
          RELEASE_NONDRAFT=false
        fi
        RELEASE_PHASE="$RELEASE_LOOKUP"

        if [ -n "$PACKAGE_HOST" ]; then
          [ "$CREATE_RELEASE" = "true" ] || { echo "::error::qualified publication requires its marker-owned draft Release"; exit 1; }
          case "$RELEASE_PHASE" in
            missing)
              [ "$TAG_EXISTS" = false ] || { echo "::error::markerless current qualified tag is an unresolved partial publication"; exit 1; }
              # GitHub retains this draft body before it creates the named ref;
              # qualified publication deliberately relies on that lazy-tag
              # behavior so the durable marker always precedes the tag.
              gh api --method POST "repos/$GITHUB_REPOSITORY/releases" \
                -f tag_name="$TAG" -f target_commitish="$GITHUB_SHA" \
                -f name="$TITLE" -F body=@qualified-notes.md \
                -F draft=true -F prerelease=false -f make_latest="$MARK_LATEST" >/dev/null
              ;;
            draft) ;;
            *)
              echo "::error::qualified Release is not the exact marker-owned draft"
              exit 1
              ;;
          esac

          # The marker-owned draft must be durably readable and exact before
          # the first qualified tag mutation. GitHub may not expose a freshly
          # created draft in the paginated inventory immediately, so repeat the
          # same strict validation for a bounded interval without accepting any
          # weaker state.
          DRAFT_VISIBLE=false
          for delay in 0 1 2 4 8; do
            [ "$delay" -eq 0 ] || sleep "$delay"
            if gh api --paginate --slurp "repos/$GITHUB_REPOSITORY/releases?per_page=100" \
                 > "$RELEASE_RESPONSE" \
                && python3 .github/scripts/_npm_publishlib.py qualified-draft \
                     --releases "$RELEASE_RESPONSE" --tag "$TAG" \
                     --marker cohort-marker.json >/dev/null; then
              DRAFT_VISIBLE=true
              break
            fi
          done
          [ "$DRAFT_VISIBLE" = true ] || {
            echo "::error::qualified Release did not become durably readable and exact"
            exit 1
          }
          TAG_SHA=$(git ls-remote --tags origin "refs/tags/$TAG" "refs/tags/$TAG^{}" \
            | python3 .github/scripts/_releaselib.py peel-tag "$TAG")
          if [ -z "$TAG_SHA" ]; then
            GIT_COMMITTER_DATE="$TAGGER_DATE" git tag -a "$TAG" -F tagmsg.txt --cleanup=verbatim "$GITHUB_SHA"
            git cat-file tag "$TAG" > "$RUNNER_TEMP/stored-qualified-tag.txt"
            python3 .github/scripts/_releaselib.py notes-match "$TAG" "$RUNNER_TEMP/stored-qualified-tag.txt"
            [ "$(git rev-parse "$TAG^{tag}")" = "$EXPECTED_TAG_OBJECT_SHA" ]
            git push origin "refs/tags/$TAG"
            echo "qualified publish state: marker_durable_tag_created"
          elif [ "$TAG_SHA" = "$GITHUB_SHA" ]; then
            echo "qualified publish state: exact_marker_and_tag_resume"
          else
            echo "::error::qualified tag $TAG resolves to '$TAG_SHA', not exact source '$GITHUB_SHA'"
            exit 1
          fi
          git cat-file tag "$TAG" > "$RUNNER_TEMP/stored-qualified-tag.txt"
          python3 .github/scripts/_releaselib.py notes-match "$TAG" "$RUNNER_TEMP/stored-qualified-tag.txt"
          python3 core/pysrc/_releaselib.py dates-match notes.md "$RUNNER_TEMP/stored-qualified-tag.txt"
          [ "$(git rev-parse "$TAG^{tag}")" = "$EXPECTED_TAG_OBJECT_SHA" ]
          git ls-remote --tags origin "refs/tags/$TAG" "refs/tags/$TAG^{}" > "$RUNNER_TEMP/qualified-tag-identity.txt"
          TAG_OBJECT_SHA=$(python3 .github/scripts/_npm_publishlib.py tag-identity \
            --remote "$RUNNER_TEMP/qualified-tag-identity.txt" --tag "$TAG" --source "$GITHUB_SHA" \
            --expected-object "$EXPECTED_TAG_OBJECT_SHA")
          echo "tag-object-sha=$TAG_OBJECT_SHA" >> "$GITHUB_OUTPUT"
          exit 0
        fi

        # One classifier shared with the /ca:release skill: the hosted and the
        # local publish path must not disagree about what an existing tag means.
        STATE=$(python3 .github/scripts/_releaselib.py classify \
          "$TAG_EXISTS" "$TAG_SHA" "$GITHUB_SHA" "$TAG_VERSION" "$VER" "$RELEASE_NONDRAFT")
        echo "publish state: $STATE (tag=$TAG tag_sha='$TAG_SHA' head='$GITHUB_SHA')"

        case "$STATE" in
          publish_fresh)
            GIT_COMMITTER_DATE="$TAGGER_DATE" git tag -a "$TAG" -F tagmsg.txt --cleanup=verbatim "$GITHUB_SHA"
            git cat-file tag "$TAG" > "$RUNNER_TEMP/stored-tag.txt"
            python3 .github/scripts/_releaselib.py notes-match "$TAG" "$RUNNER_TEMP/stored-tag.txt"
            [ "$(git rev-parse "$TAG^{tag}")" = "$EXPECTED_TAG_OBJECT_SHA" ]
            git push origin "refs/tags/$TAG"
            if [ "$CREATE_RELEASE" = "true" ]; then
              gh release create "$TAG" \
                --title "$TITLE" \
                --notes-file notes.md \
                --target "$GITHUB_SHA" \
                $LATEST --verify-tag
            else
              echo "create-release is false -- tag published, GitHub Release intentionally skipped"
            fi
            ;;
          resume_publish)
            if [ "$CREATE_RELEASE" = "true" ]; then
              echo "tag $TAG is already at $GITHUB_SHA with no published Release -- creating the Release only"
              gh release create "$TAG" \
                --title "$TITLE" \
                --notes-file notes.md \
                --target "$GITHUB_SHA" \
                $LATEST --verify-tag
            else
              echo "tag $TAG is already at $GITHUB_SHA; create-release is false -- nothing to do"
            fi
            ;;
          already_published)
            echo "release $TAG is already published at $GITHUB_SHA -- nothing to publish"
            ;;
          *)
            echo "::error::refusing to publish $TAG: state '$STATE' -- the existing tag resolves to '$TAG_SHA', this dispatch targets '$GITHUB_SHA'"
            exit 1
            ;;
        esac
        git ls-remote --tags origin "refs/tags/$TAG" "refs/tags/$TAG^{}" > "$RUNNER_TEMP/tag-identity.txt"
        TAG_OBJECT_SHA=$(python3 .github/scripts/_npm_publishlib.py tag-identity \
          --remote "$RUNNER_TEMP/tag-identity.txt" --tag "$TAG" --source "$GITHUB_SHA")
        echo "tag-object-sha=$TAG_OBJECT_SHA" >> "$GITHUB_OUTPUT"

    - name: Read back exact cohort-start marker before public package mutation
      if: ${{ inputs.package-host != '' }}
      shell: bash
      env:
        GH_TOKEN: ${{ inputs.github-token }}
        TAG: ${{ steps.v.outputs.tag }}
      run: |
        set -euo pipefail
        gh api --paginate --slurp "repos/$GITHUB_REPOSITORY/releases?per_page=100" > "$RUNNER_TEMP/marker-readback.json"
        python3 .github/scripts/_npm_publishlib.py qualified-draft \
          --releases "$RUNNER_TEMP/marker-readback.json" --tag "$TAG" \
          --marker cohort-marker.json >/dev/null

    # A push can succeed before Release creation fails. Preserve the observed
    # identity in that case too; never infer a successful publication from it.
    # Reconciliation requires this run's trusted artifact and a reviewed PR.
    - name: Capture published tag identity receipt
      id: receipt
      if: ${{ always() && steps.publish.outcome != 'skipped' && steps.v.outputs.tag != '' }}
      shell: bash
      env:
        TAG: ${{ steps.v.outputs.tag }}
        RECEIPT_PATH: ${{ runner.temp }}/tag-publication-${{ github.job }}-${{ github.run_attempt }}.json
      run: |
        set -euo pipefail
        python3 .github/scripts/tag_publication_receipt.py capture \
          --repo "$GITHUB_REPOSITORY" --tag "$TAG" \
          --expected-commit "$GITHUB_SHA" --workflow-sha "$GITHUB_SHA" \
          --run-id "$GITHUB_RUN_ID" --run-attempt "$GITHUB_RUN_ATTEMPT" \
          --output "$RECEIPT_PATH"

    - name: Retain published tag identity receipt
      if: ${{ always() && steps.receipt.outcome != 'skipped' }}
      uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
      with:
        name: tag-publication-${{ github.job }}-${{ github.run_id }}-${{ github.run_attempt }}
        path: ${{ runner.temp }}/tag-publication-${{ github.job }}-${{ github.run_attempt }}.json
        if-no-files-found: error
        retention-days: 90

    - name: Verify the published Release names this tag at this commit
      shell: bash
      env:
        GH_TOKEN: ${{ inputs.github-token }}
        TAG: ${{ steps.v.outputs.tag }}
        CREATE_RELEASE: ${{ inputs.create-release }}
        PACKAGE_HOST: ${{ inputs.package-host }}
      run: |
        set -euo pipefail
        PACKAGE_HOST="${PACKAGE_HOST:-}"
        # Verify publication rather than assume it (a create can partially succeed),
        # and verify WHAT was published: non-draft alone says nothing about which
        # commit the tag installs (#380).
        #
        # The Release-specific checks only apply when one was actually asked
        # for. A caller that deliberately passes `create-release: "false"`
        # never calls `gh release create` above, so asserting a Release exists
        # here would reject its intentional tag-only publication.
        if [ "$CREATE_RELEASE" = "true" ]; then
          if [ -n "$PACKAGE_HOST" ]; then
            gh api --paginate --slurp "repos/$GITHUB_REPOSITORY/releases?per_page=100" \
              | python3 -c 'import json,sys; tag=sys.argv[1]; pages=json.load(sys.stdin); found=[r for p in pages for r in p if r.get("tag_name")==tag]; assert len(found)==1 and found[0].get("draft") in (True,False)' "$TAG"
          else
            gh release view "$TAG" --json url,isDraft,tagName
            DRAFT=$(gh release view "$TAG" --json isDraft --jq .isDraft)
            [ "$DRAFT" = "false" ] || { echo "::error::release $TAG is draft/unpublished"; exit 1; }
            NAMED=$(gh release view "$TAG" --json tagName --jq .tagName)
            [ "$NAMED" = "$TAG" ] || { echo "::error::release read back names tag '$NAMED', expected '$TAG'"; exit 1; }
          fi
        fi
        FINAL_SHA=$(git ls-remote --tags origin "refs/tags/$TAG" "refs/tags/$TAG^{}" \
          | python3 .github/scripts/_releaselib.py peel-tag "$TAG")
        [ "$FINAL_SHA" = "$GITHUB_SHA" ] || { echo "::error::tag $TAG resolves to '$FINAL_SHA', not the dispatched commit '$GITHUB_SHA'"; exit 1; }

    - name: Upload and read back exact draft package asset
      id: package-readback
      if: ${{ inputs.package-host != '' && inputs.attach-package == 'true' }}
      shell: bash
      env:
        GH_TOKEN: ${{ inputs.github-token }}
        TAG: ${{ steps.v.outputs.tag }}
        ASSET_FILE: ${{ steps.artifact-package.outputs.file }}
        ASSET_SHA256: ${{ steps.artifact-package.outputs.sha256 }}
        ASSET_PATH: ${{ steps.artifact-package.outputs.path }}
      run: |
        set -euo pipefail
        releases="$RUNNER_TEMP/draft-release-assets.json"
        require_exact_draft() {
          gh api --paginate --slurp "repos/$GITHUB_REPOSITORY/releases?per_page=100" > "$releases"
          python3 .github/scripts/_npm_publishlib.py qualified-draft \
            --releases "$releases" --tag "$TAG" --marker cohort-marker.json \
            --asset "$ASSET_FILE"
        }
        read -r RELEASE_ID ASSET_URL < <(require_exact_draft)
        if [ "$ASSET_URL" = missing ]; then
          # Narrow the listing-to-upload window: an early publish observed by
          # this fresh check fails closed. GitHub has no atomic draft-only
          # upload primitive, so a later external/manual publish can only be
          # detected by the strict post-upload re-fetch below.
          read -r RELEASE_ID ASSET_URL < <(require_exact_draft)
          if [ "$ASSET_URL" = missing ]; then
            gh api --method POST -H "Content-Type: application/gzip" --input "$ASSET_PATH" \
              "https://uploads.github.com/repos/$GITHUB_REPOSITORY/releases/$RELEASE_ID/assets?name=$ASSET_FILE" >/dev/null
          fi
        fi
        # Re-fetch immediately before either new-upload or reuse readback.
        read -r RELEASE_ID ASSET_URL < <(require_exact_draft)
        [ "$ASSET_URL" != missing ] || { echo "::error::qualified package asset is missing after upload"; exit 1; }
        gh api -H "Accept: application/octet-stream" "$ASSET_URL" > "$RUNNER_TEMP/$ASSET_FILE"
        printf '%s  %s\n' "$ASSET_SHA256" "$RUNNER_TEMP/$ASSET_FILE" | sha256sum --check --strict

    - name: Retain immutable durable cohort receipt on the Release
      if: ${{ inputs.package-host != '' && inputs.attach-package == 'true' }}
      shell: bash
      env:
        GH_TOKEN: ${{ inputs.github-token }}
        TARGET: ${{ inputs.target }}
        HOST: ${{ inputs.package-host }}
        TAG: ${{ steps.v.outputs.tag }}
        SOURCE_COMMIT: ${{ inputs.source-commit }}
        SOURCE_TREE: ${{ steps.artifact-package.outputs.source-tree }}
        CI_RUN_ID: ${{ inputs.ci-run-id }}
        COHORT_SHA256: ${{ steps.artifact-package.outputs.cohort-sha256 }}
        PACKAGE_FILE: ${{ steps.artifact-package.outputs.file }}
        PACKAGE_SHA256: ${{ steps.artifact-package.outputs.sha256 }}
        TAG_OBJECT_SHA: ${{ steps.publish.outputs.tag-object-sha }}
        COHORT_TARGETS: ${{ inputs.cohort-targets }}
      run: |
        set -euo pipefail
        receipt="$RUNNER_TEMP/codearbiter-cohort-publication-v1.json"
        python3 - "$receipt" <<'PY'
        import json, os, sys
        versions = {"ca": json.load(open("plugins/ca/.claude-plugin/plugin.json"))["version"],
                    "ca-codex": json.load(open("plugins/ca-codex/.codex-plugin/plugin.json"))["version"],
                    "ca-pi": json.load(open("plugins/ca-pi/package.json"))["version"]}
        cohort_targets = os.environ["COHORT_TARGETS"].split(",")
        if (cohort_targets != sorted(set(cohort_targets))
                or os.environ["TARGET"] not in cohort_targets
                or not set(cohort_targets) <= {"ca", "ca-codex", "ca-pi"}):
            raise SystemExit("hosted cohort targets are missing, duplicate, or unexpected")
        receipt = {"format": "codearbiter.cohort-publication/0.1.0",
                   "target": os.environ["TARGET"], "host": os.environ["HOST"],
                   "tag": os.environ["TAG"], "source_commit": os.environ["SOURCE_COMMIT"],
                   "source_tree": os.environ["SOURCE_TREE"], "ci_run_id": os.environ["CI_RUN_ID"],
                   "cohort_sha256": os.environ["COHORT_SHA256"],
                   "package_file": os.environ["PACKAGE_FILE"],
                   "package_sha256": os.environ["PACKAGE_SHA256"],
                   "tag_object_sha": os.environ["TAG_OBJECT_SHA"],
                   "release_notes_sha256": json.load(open("cohort-marker.json"))["release_notes_sha256"],
                   "cohort_tags": {"ca": "v" + versions["ca"],
                                   "ca-codex": "ca-codex-v" + versions["ca-codex"],
                                   "ca-pi": "ca-pi-v" + versions["ca-pi"]},
                   "cohort_targets": cohort_targets,
                   "readback": "verified", "disposition": "published-and-read-back"}
        with open(sys.argv[1], "x", encoding="utf-8", newline="\n") as stream:
            json.dump(receipt, stream, indent=2, sort_keys=True); stream.write("\n")
        PY
        releases="$RUNNER_TEMP/durable-receipt-releases.json"
        require_exact_draft() {
          gh api --paginate --slurp "repos/$GITHUB_REPOSITORY/releases?per_page=100" > "$releases"
          python3 .github/scripts/_npm_publishlib.py qualified-draft \
            --releases "$releases" --tag "$TAG" --marker cohort-marker.json \
            --asset codearbiter-cohort-publication-v1.json
        }
        read -r RELEASE_ID RECEIPT_URL < <(require_exact_draft)
        if [ "$RECEIPT_URL" = missing ]; then
          # Re-observe the exact draft immediately before the irreversible
          # upload. As above, a later external/manual publish is detected by
          # the strict post-upload re-fetch; GitHub offers no atomic draft-only
          # upload primitive.
          read -r RELEASE_ID RECEIPT_URL < <(require_exact_draft)
          if [ "$RECEIPT_URL" = missing ]; then
            gh api --method POST -H "Content-Type: application/json" --input "$receipt" \
              "https://uploads.github.com/repos/$GITHUB_REPOSITORY/releases/$RELEASE_ID/assets?name=codearbiter-cohort-publication-v1.json" >/dev/null
          fi
        fi
        # Re-fetch immediately before either new-upload or reuse readback.
        read -r RELEASE_ID RECEIPT_URL < <(require_exact_draft)
        [ "$RECEIPT_URL" != missing ] || { echo "::error::durable cohort receipt is missing after upload"; exit 1; }
        gh api -H "Accept: application/octet-stream" "$RECEIPT_URL" > "$RUNNER_TEMP/receipt-readback.json"
        cmp "$receipt" "$RUNNER_TEMP/receipt-readback.json"

    - name: Verify live Codex distribution rulesets
      if: ${{ inputs.package-host == 'codex' && inputs.attach-package == 'true' && inputs.finalize-release == 'true' }}
      shell: bash
      env:
        GH_TOKEN: ${{ inputs.codex-ruleset-verifier-token }}
      run: |
        set -euo pipefail
        python3 .github/scripts/verify_codex_distribution_rulesets.py \
          --repository "$GITHUB_REPOSITORY" \
          --publisher-actor-id "${{ inputs.codex-publisher-actor-id }}" \
          --verifier-actor-id "${{ inputs.codex-ruleset-verifier-actor-id }}"

    - name: Stage immutable qualified Codex distribution tag
      if: ${{ inputs.package-host == 'codex' && inputs.attach-package == 'true' && inputs.finalize-release == 'true' }}
      shell: bash
      env:
        GH_TOKEN: ${{ inputs.github-token }}
        SOURCE_COMMIT: ${{ inputs.source-commit }}
        COHORT_SHA256: ${{ steps.artifact-package.outputs.cohort-sha256 }}
        VERSION: ${{ steps.v.outputs.version }}
        PACKAGE_ROOT: ${{ runner.temp }}/artifact-publication-packages
      run: |
        set -euo pipefail
        # This is intentionally after verify-cohort (which replays package/member
        # and cold-install qualification) and durable receipt readback. A failed
        # qualification therefore cannot create either public Git ref.
        # Stage only the immutable tree/tag. The public marketplace channel is
        # deliberately untouched until the GitHub Release is finalized.
        gh auth setup-git
        REMOTE_URL=$(git remote get-url origin)
        case "$REMOTE_URL" in
          "https://github.com/$GITHUB_REPOSITORY"|"https://github.com/$GITHUB_REPOSITORY.git"|"git@github.com:$GITHUB_REPOSITORY.git") ;;
          *) echo "::error::origin does not name the release repository: $REMOTE_URL"; exit 1 ;;
        esac
        EXPECTED_MARKETPLACE_HEAD=$(git ls-remote "$REMOTE_URL" refs/heads/ca-codex-marketplace | awk '{print $1}')
        printf '%s\n' "${EXPECTED_MARKETPLACE_HEAD:-absent}" > "$RUNNER_TEMP/codex-marketplace-expected-head"
        python3 tools/promote-codex-marketplace.py \
          --package-root "$PACKAGE_ROOT" \
          --cohort-sha256 "$COHORT_SHA256" \
          --source-repo . \
          --source-commit "$SOURCE_COMMIT" \
          --remote-url "$REMOTE_URL" \
          --catalog-url "https://github.com/$GITHUB_REPOSITORY.git" \
          --version "$VERSION" \
          --work "$RUNNER_TEMP/codex-marketplace-promotion-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT" \
          --push

    - name: Prepare exact qualified Codex npm package
      id: codex-npm
      if: ${{ inputs.package-host == 'codex' && inputs.attach-package == 'true' && inputs.finalize-release == 'true' }}
      shell: bash
      env:
        SOURCE_COMMIT: ${{ inputs.source-commit }}
        COHORT_SHA256: ${{ steps.artifact-package.outputs.cohort-sha256 }}
        SOURCE_ARCHIVE_SHA256: ${{ steps.artifact-package.outputs.sha256 }}
        PACKAGE_ROOT: ${{ runner.temp }}/artifact-publication-packages
        NPM_CLI: ${{ steps.npm-cli.outputs.executable }}
      run: |
        set -euo pipefail
        NPM_ROOT="$RUNNER_TEMP/codex-npm-package"
        METADATA="$RUNNER_TEMP/codex-npm-package.json"
        python3 tools/build-host-packages.py \
          --codex-npm-package-root "$PACKAGE_ROOT" \
          --codex-npm-cohort-sha256 "$COHORT_SHA256" \
          --codex-npm-output "$NPM_ROOT" > "$METADATA"
        mv -- "$METADATA" "$NPM_ROOT/codex-npm-package.json"
        METADATA="$NPM_ROOT/codex-npm-package.json"
        TARBALL=$(python3 - "$METADATA" "$NPM_ROOT" <<'PY'
        import json,pathlib,sys
        metadata=json.load(open(sys.argv[1],encoding="utf-8"))
        root=pathlib.Path(sys.argv[2]).resolve(strict=True)
        path=(root/metadata["file"]).resolve(strict=True)
        path.relative_to(root)
        print(path)
        PY
        )
        python3 .github/scripts/_npm_publishlib.py prepare-codex \
          --metadata "$METADATA" --tarball "$TARBALL" \
          --expected-sha "$SOURCE_COMMIT" --trusted-sha "$GITHUB_SHA" \
          --expected-cohort-sha256 "$COHORT_SHA256" \
          --expected-source-archive-sha256 "$SOURCE_ARCHIVE_SHA256" \
          --trusted-repo . --npm "$NPM_CLI" --output "$GITHUB_OUTPUT"

    - name: Configure authenticated npm scope for exact qualified Codex package
      if: ${{ inputs.package-host == 'codex' && inputs.attach-package == 'true' && inputs.finalize-release == 'true' }}
      uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
      with:
        registry-url: https://registry.npmjs.org
        scope: '@arbiterforge'

    - name: Publish exact qualified Codex npm package from authenticated scope
      if: ${{ inputs.package-host == 'codex' && inputs.attach-package == 'true' && inputs.finalize-release == 'true' && steps.codex-npm.outputs.skip != 'true' }}
      shell: bash
      env:
        NODE_AUTH_TOKEN: ${{ inputs.npm-token }}
        NPM_CLI: ${{ steps.npm-cli.outputs.executable }}
        TARBALL: ${{ steps.codex-npm.outputs.tarball }}
      run: '"$NPM_CLI" publish "$TARBALL" --ignore-scripts --provenance --access public --registry=https://registry.npmjs.org/ --@arbiterforge:registry=https://registry.npmjs.org/'

    - name: Verify Codex npm integrity and provenance readback
      if: ${{ inputs.package-host == 'codex' && inputs.attach-package == 'true' && inputs.finalize-release == 'true' }}
      shell: bash
      env:
        SOURCE_COMMIT: ${{ inputs.source-commit }}
        NPM_CLI: ${{ steps.npm-cli.outputs.executable }}
        VERSION: ${{ steps.codex-npm.outputs.version }}
        INTEGRITY: ${{ steps.codex-npm.outputs.integrity }}
      run: |
        set -euo pipefail
        python3 .github/scripts/_npm_publishlib.py verify-codex \
          --version "$VERSION" --integrity "$INTEGRITY" \
          --expected-sha "$SOURCE_COMMIT" --trusted-sha "$GITHUB_SHA" \
          --repo . --npm "$NPM_CLI"

    - name: Cold-install exact Codex npm package through a real marketplace
      if: ${{ inputs.package-host == 'codex' && inputs.attach-package == 'true' && inputs.finalize-release == 'true' }}
      shell: bash
      env:
        NPM_CLI: ${{ steps.npm-cli.outputs.executable }}
        VERSION: ${{ steps.codex-npm.outputs.version }}
        NPM_METADATA: ${{ steps.codex-npm.outputs.metadata }}
        CA_REQUIRE_CODEX: "1"
        NPM_CONFIG_USERCONFIG: ${{ runner.temp }}/codex-public-npmrc
      run: |
        set -euo pipefail
        printf '%s\n' \
          'registry=https://registry.npmjs.org/' \
          '@arbiterforge:registry=https://registry.npmjs.org/' \
          > "$NPM_CONFIG_USERCONFIG"
        for CODEX_VERSION in 0.143.0 0.145.0; do
          "$NPM_CLI" install --global "@openai/codex@$CODEX_VERSION" \
            --registry=https://registry.npmjs.org/
          python3 .github/scripts/check_codex_host.py \
            --npm-marketplace-version "$VERSION" \
            --qualified-npm-metadata "$NPM_METADATA" \
            --require-artifact-capability
        done

    - name: Publish qualified Release only after receipt readback
      if: ${{ inputs.package-host != '' && inputs.attach-package == 'true' && inputs.finalize-release == 'true' }}
      shell: bash
      env:
        GH_TOKEN: ${{ inputs.github-token }}
        TAG: ${{ steps.v.outputs.tag }}
        MARK_LATEST: ${{ inputs.mark-latest }}
        ASSET_FILE: ${{ steps.artifact-package.outputs.file }}
        ASSET_SHA256: ${{ steps.artifact-package.outputs.sha256 }}
      run: |
        set -euo pipefail
        releases="$RUNNER_TEMP/finalize-qualified-release.json"
        validate_final_state() {
          gh api --paginate --slurp "repos/$GITHUB_REPOSITORY/releases?per_page=100" > "$releases"
          read -r RELEASE_ID RECEIPT_URL PACKAGE_URL < <(
            python3 .github/scripts/_npm_publishlib.py qualified-finalize \
              --releases "$releases" --tag "$TAG" --marker cohort-marker.json \
              --asset codearbiter-cohort-publication-v1.json --asset "$ASSET_FILE")
          python3 .github/scripts/_npm_publishlib.py cohort-receipt \
            --receipt "$RUNNER_TEMP/codearbiter-cohort-publication-v1.json" --marker cohort-marker.json
          gh api -H "Accept: application/octet-stream" "$RECEIPT_URL" > "$RUNNER_TEMP/final-receipt.json"
          cmp "$RUNNER_TEMP/codearbiter-cohort-publication-v1.json" "$RUNNER_TEMP/final-receipt.json"
          gh api -H "Accept: application/octet-stream" "$PACKAGE_URL" > "$RUNNER_TEMP/final-$ASSET_FILE"
          printf '%s  %s\n' "$ASSET_SHA256" "$RUNNER_TEMP/final-$ASSET_FILE" | sha256sum --check --strict
          TAG_OBJECT_SHA=$(python3 - "$RUNNER_TEMP/final-receipt.json" <<'PY'
        import json,sys
        print(json.load(open(sys.argv[1],encoding="utf-8"))["tag_object_sha"])
        PY
          )
          git ls-remote --tags origin "refs/tags/$TAG" "refs/tags/$TAG^{}" > "$RUNNER_TEMP/final-tag.txt"
          python3 .github/scripts/_npm_publishlib.py tag-identity \
            --remote "$RUNNER_TEMP/final-tag.txt" --tag "$TAG" --source "$GITHUB_SHA" \
            --expected-object "$TAG_OBJECT_SHA" >/dev/null
        }
        # Validate every publication datum, then make a second complete Release
        # inventory validation the literal final operation before PATCH.
        validate_final_state
        python3 - "$RUNNER_TEMP/final-asset-identity.json" "$RECEIPT_URL" "$PACKAGE_URL" <<'PY'
        import json,os,sys
        with open(sys.argv[1],"w",encoding="utf-8",newline="\n") as stream:
            json.dump({"codearbiter-cohort-publication-v1.json":sys.argv[2],
                       os.environ["ASSET_FILE"]:sys.argv[3]},stream,
                      sort_keys=True,separators=(",",":")); stream.write("\n")
        PY
        gh api --paginate --slurp "repos/$GITHUB_REPOSITORY/releases?per_page=100" > "$releases"
        read -r RELEASE_ID _ _ < <(
          python3 .github/scripts/_npm_publishlib.py qualified-finalize \
            --releases "$releases" --tag "$TAG" --marker cohort-marker.json \
            --asset codearbiter-cohort-publication-v1.json --asset "$ASSET_FILE" \
            --expected-assets "$RUNNER_TEMP/final-asset-identity.json")
        gh api --method PATCH -F draft=false -f make_latest="$MARK_LATEST" \
          "repos/$GITHUB_REPOSITORY/releases/$RELEASE_ID" >/dev/null
        gh api "repos/$GITHUB_REPOSITORY/releases/tags/$TAG" --jq '.draft == false' | grep -qx true

    - name: Reverify live Codex distribution rulesets before channel advance
      if: ${{ inputs.package-host == 'codex' && inputs.attach-package == 'true' && inputs.finalize-release == 'true' }}
      shell: bash
      env:
        GH_TOKEN: ${{ inputs.codex-ruleset-verifier-token }}
      run: |
        set -euo pipefail
        # Release finalization can be a long boundary, so the pre-tag proof is
        # not timeless authority. Keep this read-only credential in its own
        # process boundary; the publisher token is not exposed here.
        python3 .github/scripts/verify_codex_distribution_rulesets.py \
          --repository "$GITHUB_REPOSITORY" \
          --publisher-actor-id "${{ inputs.codex-publisher-actor-id }}" \
          --verifier-actor-id "${{ inputs.codex-ruleset-verifier-actor-id }}"

    - name: Advance protected Codex marketplace channel
      if: ${{ inputs.package-host == 'codex' && inputs.attach-package == 'true' && inputs.finalize-release == 'true' }}
      shell: bash
      env:
        GH_TOKEN: ${{ inputs.github-token }}
        SOURCE_COMMIT: ${{ inputs.source-commit }}
        COHORT_SHA256: ${{ steps.artifact-package.outputs.cohort-sha256 }}
        VERSION: ${{ steps.v.outputs.version }}
        PACKAGE_ROOT: ${{ runner.temp }}/artifact-publication-packages
        NPM_INTEGRITY: ${{ steps.codex-npm.outputs.integrity }}
        NPM_SHA256: ${{ steps.codex-npm.outputs.sha256 }}
      run: |
        set -euo pipefail
        # Retry/recovery is explicit: rebuilding is deterministic, the immutable
        # tag must read back first, and the protected channel advances only from
        # the head captured before Release finalization.
        gh auth setup-git
        REMOTE_URL=$(git remote get-url origin)
        case "$REMOTE_URL" in
          "https://github.com/$GITHUB_REPOSITORY"|"https://github.com/$GITHUB_REPOSITORY.git"|"git@github.com:$GITHUB_REPOSITORY.git") ;;
          *) echo "::error::origin does not name the release repository: $REMOTE_URL"; exit 1 ;;
        esac
        EXPECTED_MARKETPLACE_HEAD=$(cat "$RUNNER_TEMP/codex-marketplace-expected-head")
        python3 tools/promote-codex-marketplace.py \
          --package-root "$PACKAGE_ROOT" \
          --cohort-sha256 "$COHORT_SHA256" \
          --source-repo . \
          --source-commit "$SOURCE_COMMIT" \
          --remote-url "$REMOTE_URL" \
          --catalog-url "https://github.com/$GITHUB_REPOSITORY.git" \
          --version "$VERSION" \
          --work "$RUNNER_TEMP/codex-marketplace-channel-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT" \
          --expected-marketplace-head "$EXPECTED_MARKETPLACE_HEAD" \
          --expected-npm-integrity "$NPM_INTEGRITY" \
          --expected-npm-sha256 "$NPM_SHA256" \
          --advance-channel \
          --push

    - name: Capture package publication disposition
      if: ${{ always() && inputs.package-host != '' && inputs.attach-package == 'true' }}
      shell: bash
      env:
        PACKAGE_HOST: ${{ inputs.package-host }}
        SOURCE_COMMIT: ${{ inputs.source-commit }}
        CI_RUN_ID: ${{ inputs.ci-run-id }}
        TAG: ${{ steps.v.outputs.tag }}
        PACKAGE_VERSION: ${{ steps.v.outputs.version }}
        ASSET_FILE: ${{ steps.artifact-package.outputs.file }}
        ASSET_SHA256: ${{ steps.artifact-package.outputs.sha256 }}
        COHORT_SHA256: ${{ steps.artifact-package.outputs.cohort-sha256 }}
        PUBLISH_OUTCOME: ${{ steps.publish.outcome }}
        READBACK_OUTCOME: ${{ steps.package-readback.outcome }}
        RECEIPT_PATH: ${{ runner.temp }}/artifact-package-publication-${{ inputs.package-host }}-${{ github.run_id }}-${{ github.run_attempt }}.json
      run: |
        python3 - <<'PY'
        import json, os
        receipt = {
            "format": "codearbiter.artifact-package-publication/0.1.0",
            "host": os.environ["PACKAGE_HOST"], "source_commit": os.environ["SOURCE_COMMIT"],
            "ci_run_id": os.environ["CI_RUN_ID"], "release_run_id": os.environ["GITHUB_RUN_ID"],
            "release_run_attempt": os.environ["GITHUB_RUN_ATTEMPT"], "tag": os.environ["TAG"],
            "version": os.environ["PACKAGE_VERSION"],
            "cohort_sha256": os.environ["COHORT_SHA256"], "asset_file": os.environ["ASSET_FILE"],
            "asset_sha256": os.environ["ASSET_SHA256"], "publish_outcome": os.environ["PUBLISH_OUTCOME"],
            "readback_outcome": os.environ["READBACK_OUTCOME"],
            "disposition": "published-and-read-back" if os.environ["READBACK_OUTCOME"] == "success" else "partial-publication-stop",
        }
        with open(os.environ["RECEIPT_PATH"], "x", encoding="utf-8", newline="\n") as stream:
            json.dump(receipt, stream, indent=2, sort_keys=True); stream.write("\n")
        PY

    - name: Retain package publication disposition
      if: ${{ always() && inputs.package-host != '' && inputs.attach-package == 'true' }}
      uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
      with:
        name: artifact-package-publication-${{ inputs.package-host }}-${{ github.run_id }}-${{ github.run_attempt }}
        path: ${{ runner.temp }}/artifact-package-publication-${{ inputs.package-host }}-${{ github.run_id }}-${{ github.run_attempt }}.json
        if-no-files-found: error
        retention-days: 90
