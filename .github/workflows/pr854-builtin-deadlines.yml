name: PR854 built-in mutation deadlines (temporary)
on:
  push:
    branches: [codex/farm-readiness-canary-isolation]
    paths: [.github/workflows/pr854-builtin-deadlines.yml]
permissions:
  contents: read
jobs:
  validate:
    if: github.repository == 'arbiterForge/codeArbiter' && github.ref == 'refs/heads/codex/farm-readiness-canary-isolation'
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            node: '22.19.0'
            label: linux
          - os: windows-latest
            node: '20'
            label: windows
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: e7ed9490dfb1106a96294c7b573dcc56f1731389
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.14'
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: ${{ matrix.node }}
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e
        with:
          go-version: '1.27.1'
          check-latest: false
          cache: false
          go-download-base-url: https://go.dev/dl
      - name: Acquire exact reviewed patch as inert data
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python - <<'PY'
          import base64,hashlib,json,lzma,os,pathlib,urllib.request
          assert os.environ['GITHUB_REPOSITORY']=='arbiterForge/codeArbiter'
          assert os.environ['GITHUB_REF']=='refs/heads/codex/farm-readiness-canary-isolation'
          out=pathlib.Path(os.environ['RUNNER_TEMP'])/'pr854-builtin';out.mkdir()
          class NoRedirect(urllib.request.HTTPRedirectHandler):
              def redirect_request(self,*args,**kwargs): raise RuntimeError('Unexpected redirect')
          def blob(sha):
              req=urllib.request.Request('https://api.github.com/repos/arbiterForge/codeArbiter/git/blobs/'+sha,headers={'Authorization':'Bearer '+os.environ['GH_TOKEN'],'Accept':'application/vnd.github+json'})
              with urllib.request.build_opener(NoRedirect).open(req,timeout=45) as response: row=json.load(response)
              assert row['sha']==sha and row['encoding']=='base64'
              data=base64.b64decode(row['content'])
              assert hashlib.sha1(b'blob '+str(len(data)).encode()+b'\0'+data).hexdigest()==sha
              return data
          packed=b''.join(blob(s) for s in ['2db6c4136f20cac0b83d8a869a156e379b1fb26b','f07fe8f89a2c9efb693fef8de660a16cfb0de77b'])
          assert len(packed)==10876
          data=lzma.decompress(packed)
          assert len(data)==37152 and hashlib.sha256(data).hexdigest()=='97149c6d2c12e545227228260ed6e1715862840fdc9579f993b1f09074ce2b56'
          payload=json.loads(data)
          assert payload['parent']=='e7ed9490dfb1106a96294c7b573dcc56f1731389'
          assert payload['base_tree']=='1b305ca9726a931a48de3151c1a4f432423fc80c'
          assert len(payload['files'])==14 and len({x['path'] for x in payload['files']})==14
          for row in payload['files']:
              path=pathlib.PurePosixPath(row['path'])
              assert not path.is_absolute() and '..' not in path.parts and str(path)==row['path']
              assert row['mode'] in {'100644','100755'} and len(row['old_sha'])==40 and len(row['sha'])==40
          (out/'payload.json').write_bytes(data)
          (out/'reviewed.patch').write_bytes(payload['source_patch'].encode())
          PY
      - name: Build and test the exact candidate on this platform
        shell: bash
        run: |
          python - <<'PY'
          import hashlib,json,os,pathlib,subprocess,sys,time,zipfile
          root=pathlib.Path.cwd();out=pathlib.Path(os.environ['RUNNER_TEMP'])/'pr854-builtin'
          payload=json.loads((out/'payload.json').read_text());base=payload['parent']
          assert subprocess.check_output(['git','rev-parse','HEAD'],text=True).strip()==base
          assert subprocess.check_output(['git','rev-parse','HEAD^{tree}'],text=True).strip()==payload['base_tree']
          assert subprocess.check_output(['go','env','GOVERSION'],text=True).strip()=='go1.27.1'
          def oid(path):
              b=(root/path).read_bytes();return hashlib.sha1(b'blob '+str(len(b)).encode()+b'\0'+b).hexdigest()
          for row in payload['files']:
              assert oid(row['path'])==row['old_sha'],row['path']
              assert subprocess.check_output(['git','ls-tree','HEAD','--',row['path']],text=True).split()[0]==row['mode']
          subprocess.run(['git','apply','--check','--index','--unidiff-zero',str(out/'reviewed.patch')],check=True)
          subprocess.run(['git','apply','--index','--unidiff-zero',str(out/'reviewed.patch')],check=True)
          tools=root/'plugins/ca/tools'
          npm='npm.cmd' if os.name=='nt' else 'npm'
          subprocess.run([npm,'ci','--ignore-scripts','--no-fund','--no-audit'],cwd=tools,check=True)
          subprocess.run([npm,'audit','--include=dev','--audit-level=high'],cwd=tools,check=True)
          subprocess.run([npm,'run','typecheck'],cwd=tools,check=True)
          subprocess.run([npm,'run','build'],cwd=tools,check=True)
          subprocess.run([sys.executable,'tools/build-surface.py'],check=True)
          expected={row['path'] for row in payload['files']}
          assert set(subprocess.check_output(['git','diff','HEAD','--name-only'],text=True).splitlines())==expected
          for row in payload['files']: assert oid(row['path'])==row['sha'],row['path']
          for path in ['plugins/ca/tools/package-lock.json','plugins/ca/tools/vitest.config.ts','plugins/ca/tools/exec.ts','plugins/ca/tools/worktree-fs.ts','core/surface/arbiter.md','core/surface/command-routes.json','core/surface/includes/maturity-coverage.md','.github/workflows/ci.yml']:
              assert (root/path).read_bytes()==subprocess.check_output(['git','show',base+':'+path])
          subprocess.run(['git','add','--',*sorted(expected)],check=True)
          subprocess.run(['git','diff','--cached','--check'],check=True)
          tree=subprocess.check_output(['git','write-tree'],text=True).strip()
          message='fix: bound built-in mutation trials without crediting timeouts\n\nPreserve completed adverse evidence and original restoration guards.\nUse the remaining monotonic trial budget even when general gate timing\nis disabled, and retain ordinary warning versus containment boundaries.\n\nCHANGELOG: Keep interrupted mutation screening distinct from scores.\n'
          env=dict(os.environ,GIT_AUTHOR_NAME='Validation fixture',GIT_AUTHOR_EMAIL='validation@example.invalid',GIT_COMMITTER_NAME='Validation fixture',GIT_COMMITTER_EMAIL='validation@example.invalid')
          fixture=subprocess.check_output(['git','commit-tree',tree,'-p',base],input=message,text=True,env=env).strip()
          subprocess.run(['git','checkout','--detach',fixture],check=True)
          checks=[([npm,'run','coverage'],tools)]
          names=['test_ci_impact','test_host_descriptors','test_routing_and_cleanup_surface','test_build_surface','test_public_codex_docs','test_provenance_wiring','test_payload_version_gate','test_artifact_farm']
          checks += [([sys.executable,'.github/scripts/'+name+'.py'],root) for name in names]
          checks += [([sys.executable,p,'--check'],root) for p in ['tools/build-surface.py','tools/sync-core.py','tools/build-host-packages.py']]
          checks += [([sys.executable,'.github/scripts/'+name+'.py'],root) for name in ['check_destructive_registry','check_routing_index_parity','check_docs_contract']]
          checks += [([sys.executable,'.github/scripts/check-plugin-refs.py',host],root) for host in ['ca','ca-codex','ca-pi']]
          results=[]
          for i,(args,cwd) in enumerate(checks):
              log=f'{i:02d}-'+('coverage' if args[0]==npm else pathlib.Path(args[1]).stem)+'.log';start=time.monotonic()
              try:
                  done=subprocess.run(args,cwd=cwd,capture_output=True,text=True,timeout=360,env=dict(os.environ,PYTHONDONTWRITEBYTECODE='1'))
                  code=done.returncode;content=done.stdout+done.stderr
              except subprocess.TimeoutExpired:
                  code=124;content='Timed out; not a passing check.\n'
              (out/log).write_text(content,encoding='utf-8')
              results.append({'command':args,'cwd':str(cwd.relative_to(root)),'exit_code':code,'seconds':round(time.monotonic()-start,3),'log':log})
              (out/'tests.json').write_text(json.dumps(results,indent=2));print(code,' '.join(args),flush=True)
          for row in payload['files']: assert oid(row['path'])==row['sha'],row['path']
          assert not subprocess.check_output(['git','diff','--name-only'],text=True).strip()
          (out/'candidate.diff').write_bytes(subprocess.check_output(['git','diff','--binary','--full-index',base,fixture]))
          with zipfile.ZipFile(out/'candidate-files.zip','w',zipfile.ZIP_DEFLATED) as z:
              for row in payload['files']: z.write(root/row['path'],row['path'])
          report={'source_parent':base,'workflow_head':os.environ['GITHUB_SHA'],'tree':tree,'local_validation_commit':fixture,'platform':sys.platform,'files':payload['files'],'message':message,'all_commands_passed':all(r['exit_code']==0 for r in results),'command_count':len(results)}
          (out/'manifest.json').write_text(json.dumps(report,indent=2))
          assert report['all_commands_passed'],'Validation failed; inspect retained logs.'
          PY
      - name: Store verified blobs without changing any ref
        if: matrix.label == 'linux'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python - <<'PY'
          import hashlib,json,os,pathlib,urllib.request
          out=pathlib.Path(os.environ['RUNNER_TEMP'])/'pr854-builtin'
          report=json.loads((out/'manifest.json').read_text())
          assert report['all_commands_passed'] and report['workflow_head']==os.environ['GITHUB_SHA']
          assert os.environ['GITHUB_REPOSITORY']=='arbiterForge/codeArbiter'
          assert os.environ['GITHUB_REF']=='refs/heads/codex/farm-readiness-canary-isolation'
          class NoRedirect(urllib.request.HTTPRedirectHandler):
              def redirect_request(self,*args,**kwargs): raise RuntimeError('Unexpected redirect')
          def api(method,path,payload=None):
              req=urllib.request.Request('https://api.github.com/repos/arbiterForge/codeArbiter'+path,method=method,data=json.dumps(payload).encode() if payload is not None else None,headers={'Authorization':'Bearer '+os.environ['GH_TOKEN'],'Accept':'application/vnd.github+json','Content-Type':'application/json'})
              with urllib.request.build_opener(NoRedirect).open(req,timeout=45) as response: return json.load(response)
          assert api('GET','/git/ref/heads/codex/farm-readiness-canary-isolation')['object']['sha']==report['workflow_head']
          uploaded=[]
          for row in report['files']:
              b=pathlib.Path(row['path']).read_bytes()
              assert hashlib.sha1(b'blob '+str(len(b)).encode()+b'\0'+b).hexdigest()==row['sha']
              sha=api('POST','/git/blobs',{'content':b.decode(),'encoding':'utf-8'})['sha']
              assert sha==row['sha'];uploaded.append({'path':row['path'],'sha':sha,'mode':row['mode']})
          (out/'uploaded-blobs.json').write_text(json.dumps({'files':uploaded,'branch_updated':False},indent=2))
          PY
      - name: Retain platform outcomes and exact candidate
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: pr854-builtin-${{ matrix.label }}-${{ github.run_id }}
          path: ${{ runner.temp }}/pr854-builtin/
          if-no-files-found: error
          retention-days: 3
