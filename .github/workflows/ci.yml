name: ci

# Scoped to the repo's executable surface. The bulk of codeArbiter is prose
# (skills/commands/agents) governed by each plugin's own authoring gates - CI's
# job here is the mechanical things review can't catch: a stale shipped build
# artifact, a regression in the farm dispatcher, or a manifest that won't parse.
# A pure skill/docs PR matches none of these paths and skips CI entirely.
#
# ADR-0007: the repo hosts two sibling plugins (ca, ca-sandbox) with PATH-SCOPED
# CI - a diff touching only plugins/ca-sandbox/** runs the docker-gated
# ca-sandbox tools job and SKIPS every ca job (tools tests, refs graph,
# version-bump guard); a diff touching only plugins/ca/** skips the ca-sandbox
# job. The `changes` job below computes per-plugin flags via dorny/paths-filter
# and every plugin-specific job gates on them. Shared infra (hooks, JSON
# manifests) stays repo-wide - it is owned by neither plugin.

on:
  pull_request:
    # Campaign-branch coverage (issue #258): feat/codex-support-m0 integrates
    # every ca-codex fix PR before it lands on main, so PRs targeting it need
    # the same CI gate PRs targeting main get - otherwise the whole codex
    # campaign merges with zero CI. Drop this once the campaign branch is
    # closed out and merged to main.
    branches: [main, feat/codex-support-m0]
  # Issue #383. main's ONLY required context is the `[GATE ] | [REPO] | Merge
  # readiness` aggregate below, and it merges on `strict: false` - so a green
  # aggregate computed against an OLDER base is enough, and two individually
  # green PRs can interact after one lands while the second keeps a valid check
  # from its stale merge base. The ruling was a merge queue: it synthesises the
  # exact prospective merge commit and runs the gate on THAT, which is stricter
  # than up-to-dateness because it catches interactions currency does not.
  #
  # SEQUENCING - this trigger MUST be live on main BEFORE the queue is enabled.
  # A queue whose required context never reports under `merge_group` stalls
  # every queued merge, with nothing able to satisfy the gate. Enabling the
  # queue is a maintainer settings action that FOLLOWS this workflow landing,
  # never precedes it. `checks_requested` is the only merge_group activity type
  # there is; it is named rather than defaulted so a future type cannot silently
  # join the gate.
  #
  # No `paths:` filter here, deliberately. On push a filter only decides whether
  # to spend runner time on main; in a merge group it would decide whether the
  # required context reports AT ALL, and a filtered-out merge group waits
  # forever. The per-job path scoping ADR-0007 asks for still applies - it runs
  # inside the workflow, via the `changes` job, where a skipped job is a skipped
  # job and not an absent check run.
  merge_group:
    types: [checks_requested]
  push:
    branches: [main]
    paths:
      - "plugins/ca/**"
      - "plugins/ca-sandbox/**"
      - "plugins/ca-codex/**"
      - "plugins/ca-pi/**"
      - "core/**"
      - "**/*.json"
      - "README.md"
      - "LICENSE"
      - ".github/workflows/ci.yml"
      - ".github/scripts/**"
      - "tools/host_descriptors.py"
      - "tools/build-surface.py"
      - "tools/sync-core.py"
      - "tools/build-host-packages.py"
      - "tools/ci-impact.py"
      # Issue #384: the hooks job runs this generator's own unit tests
      # (.github/scripts/test_codex_parity_fixture.py), so a push that edits
      # only the generator must still start a run.
      - "tools/codex-parity-fixture.py"
      # Issue #507: GateCommandTest asserts this file defines every command the
      # gates read from it. `plugins/ca/**` already starts a run for the prose
      # side; without this line a push that ONLY deletes the coverage section
      # starts no run at all, so the guard never evaluates.
      - ".codearbiter/tech-stack.md"
      # Same defect class, same fix: test_ci_impact.py is the ONLY guard on the
      # secret-scan allowlist (#404) and on docs.yml's site CVE gate (#403), so
      # a change to either must start a run that can execute it.
      - ".gitleaks.toml"
      - ".github/workflows/docs.yml"
      # Same defect class again (#378/#380/#385): the hooks job runs
      # test_release_workflow.py, which is the ONLY guard on the release
      # workflow's dispatch-exclusivity, merge-readiness, and tag-integrity
      # gates. A push that weakens only release.yml must still start a run.
      - ".github/workflows/release.yml"
      # The publish mechanics moved out of release.yml into a shared
      # composite action (#382), so the same reasoning covers it.
      - ".github/actions/**"

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    name: "[CHECK] | [REPO] | Impact selection"
    runs-on: ubuntu-latest
    outputs:
      ca: ${{ steps.filter.outputs.ca }}
      ca-sandbox: ${{ steps.filter.outputs.ca-sandbox }}
      ca-codex: ${{ steps.filter.outputs.ca-codex }}
      ca-pi: ${{ steps.filter.outputs.ca-pi }}
      host-descriptors: ${{ steps.filter.outputs.host-descriptors }}
      hooks: ${{ steps.filter.outputs.hooks }}
      impact: ${{ steps.filter.outputs.impact }}
      manifests: ${{ steps.filter.outputs.manifests }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dorny/paths-filter@7b450fff21473bca461d4b92ce414b9d0420d706 # v4.0.2
        id: filter
        with:
          list-files: shell
          # A change to shared CI infra (.github/) flags BOTH plugins so the
          # full mechanical surface re-runs. A plugin-only change flags just
          # that plugin - this is the path-scoping ADR-0007 requires.
          #
          # core/** is the canonical-copy source every host-neutral hook file
          # is vendored FROM (tools/sync-core.py, ADR-0011 M1) into BOTH
          # plugins/ca/hooks/ and plugins/ca-codex/hooks/ - a core/** edit can
          # drift either vendored copy, so it flags ca, ca-codex, AND hooks.
          filters: |
            all:
              - '**'
            ca:
              - 'plugins/ca/**'
              - 'core/**'
              - 'README.md'
              - '.github/workflows/ci.yml'
              - '.github/scripts/check-plugin-refs.py'
              - '.github/scripts/check_badge_consistency.py'
            ca-sandbox:
              - 'plugins/ca-sandbox/**'
              - '.github/workflows/ci.yml'
              - '.github/scripts/check-plugin-refs.py'
            ca-codex:
              - 'plugins/ca-codex/**'
              - 'core/**'
              - '.github/workflows/ci.yml'
            ca-pi:
              - 'plugins/ca-pi/**'
              - 'core/**'
              # The ca-pi extension bundles EMBED the shared farm redactor
              # (tools/src/redaction.ts imports ../../../ca/tools/redactor.ts),
              # so a change there makes the committed bundles stale while
              # touching nothing under plugins/ca-pi/. #487 widened that
              # redactor, rebuilt farm.js, and left both ca-pi bundles behind -
              # main shipped stale bundles until the next ca-pi-touching PR
              # happened to run this job and fail. A cross-plugin import needs a
              # cross-plugin filter.
              - 'plugins/ca/tools/redactor.ts'
              - 'package.json'
              - 'tools/build-host-packages.py'
              - '.github/scripts/test_pi_package.py'
              - '.github/scripts/test_pi_parity.py'
              - '.github/scripts/pi_benchmark.py'
              - '.github/scripts/test_pi_benchmark.py'
              - '.github/scripts/test_pi_platform_contract.py'
              - '.github/scripts/test_pi_security.py'
              - '.github/workflows/codeql.yml'
              - '.github/workflows/ci.yml'
            host-descriptors:
              - 'core/hosts.json'
              - 'core/surface/**'
              - 'plugins/ca-pi/**'
              - 'tools/host_descriptors.py'
              - 'tools/build-surface.py'
              - 'tools/sync-core.py'
              - 'tools/build-host-packages.py'
              - '.github/scripts/test_host_descriptors.py'
              - '.github/workflows/ci.yml'
            hooks:
              - 'plugins/ca/hooks/**'
              - 'plugins/ca-codex/hooks/**'
              - 'plugins/ca-pi/hooks/**'
              - 'core/**'
              - '.github/scripts/**'
              # Issue #384: test_codex_parity_fixture.py runs in the hooks job
              # below, so a PR touching only the generator it tests must flag
              # this filter - otherwise the fixture skips its own test.
              - 'tools/codex-parity-fixture.py'
              - '.github/workflows/ci.yml'
              # test_release_workflow.py runs in the hooks job and is the only
              # guard on the release workflow's publish gates (#378/#380/#385).
              - '.github/workflows/release.yml'
              # The publish mechanics moved out of release.yml into a
              # shared composite action (#382); without this, the one
              # file that can weaken the #380 tag guards is unwatched.
              - '.github/actions/**'
              # Issue #416: check_adr_identity.py runs in the hooks job and is
              # the only guard on ADR identity. A PR that ONLY adds a decision
              # file - the exact shape of a duplicate-number collision - would
              # skip this job and land the ambiguity unchecked.
              - '.codearbiter/decisions/**'
            impact:
              - '.github/ci-impact-map.json'
              - '.github/scripts/test_ci_impact.py'
              # Issue #435: payload_scope.py owns what the version gates count as
              # a shipped change, and test_payload_scope.py is its only guard. A
              # PR that ONLY widened the exclusion - the exact shape of a gate
              # quietly stopping - would otherwise skip the job that checks it.
              - '.github/scripts/payload_scope.py'
              - '.github/scripts/check_codex_host.py'
              - '.github/scripts/test_payload_scope.py'
              # Issue #530: payload_version_gate.py decides whether a shipped
              # payload change may ride the current manifest version, and
              # test_payload_version_gate.py is its only guard. Same reasoning as
              # payload_scope.py above - a PR that ONLY loosened the rule is the
              # exact shape of a gate quietly stopping, and would otherwise skip
              # the job that checks it.
              - '.github/scripts/payload_version_gate.py'
              - '.github/scripts/test_payload_version_gate.py'
              # Issue #507: test_ci_impact.py's GateCommandTest is the only guard
              # that a command a gate READS from tech-stack.md is actually
              # DEFINED there. Its two subjects are the gate prose and the file
              # it points at, so both must reach the job that runs it - a PR
              # deleting the coverage section, or rewording the phrase the guard
              # keys on, is exactly the regression it exists to stop. Same
              # omission as #384, #403/#404 and #416; listing them here is the
              # established fix, not a new pattern.
              - '.codearbiter/tech-stack.md'
              - 'plugins/ca/skills/**'
              - 'plugins/ca/agents/**'
              - 'core/surface/skills/**'
              - 'core/surface/agents/**'
              - 'core/hosts.json'
              - 'tools/ci-impact.py'
              - 'tools/host_descriptors.py'
              # test_ci_impact.py is the only guard on the secret-scan allowlist
              # (#404) and on docs.yml's site CVE gate (#403). Until these two
              # were listed, a PR that ONLY weakened .gitleaks.toml - or ONLY
              # deleted the site audit step - skipped the job that checks them.
              # The allowlist contract additionally runs unconditionally in the
              # secret-scan job, so it survives a future edit to this filter.
              - '.gitleaks.toml'
              - '.github/workflows/docs.yml'
              - '.github/workflows/ci.yml'
            manifests:
              - '**/*.json'
              - '.github/workflows/ci.yml'
      - name: Write impact receipt
        id: impact
        env:
          CHANGED_FILES: ${{ steps.filter.outputs.all_files }}
        run: |
          python tools/ci-impact.py \
            --map .github/ci-impact-map.json \
            --hosts core/hosts.json \
            --changed-files "$CHANGED_FILES" \
            --output impact.json \
            --summary "$GITHUB_STEP_SUMMARY"
      - name: Store impact receipt
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ci-impact-receipt
          path: impact.json
          if-no-files-found: error
          retention-days: 14
          include-hidden-files: false
          overwrite: false

  host-descriptors:
    name: "[CHECK] | [CORE] | Host descriptor contract"
    needs: changes
    if: needs.changes.outputs.host-descriptors == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.x"
      - name: Run the complete host descriptor and generated-only suite
        run: python .github/scripts/test_host_descriptors.py

  ci-impact:
    name: "[CHECK] | [REPO] | Impact planner contract"
    needs: changes
    if: needs.changes.outputs.impact == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.x"
      - name: Validate impact-map fallback, receipt, and name contracts
        run: python .github/scripts/test_ci_impact.py
      - name: Validate the version gates' shipped-payload scope
        # Issue #435. The version gates decide "did anything an installed user
        # can observe change?", and they answer it with a git pathspec - the
        # kind of thing that looks right and matches nothing. This runs the rule
        # against a real throwaway repository in both directions: a dev-only
        # lockfile bump must NOT demand a version advance, and a committed
        # esbuild artifact must.
        run: python .github/scripts/test_payload_scope.py
      - name: Validate the payload-version gate
        # Issue #530. payload_scope.py above answers "did anything an installed
        # user can observe change?"; this answers "may that change ride the
        # current version?" - and it used to answer it with a git TAG lookup,
        # while `claude plugin update` keys on the MANIFEST VERSION. Runs the
        # rule against real throwaway repositories in both directions, including
        # the untagged-but-already-shipped case that produced the issue.
        run: python .github/scripts/test_payload_version_gate.py

  coverage-union:
    # Issue #521 / DECISION-0031. The coverage GATE is orchestrator-run (`tdd`
    # Phase 5), not a required check - this job exists to PRODUCE the number
    # that gate quotes, on every host the tree actually forks across.
    #
    # A single-host report scores the other platform's arm as uncovered no
    # matter how well tested it is: exec.ts's `awaitTaskkill` and win32
    # `treeKill` cannot execute on Linux, and the POSIX arm cannot execute on
    # Windows - an 11-point gap on that file alone. Neither number is wrong;
    # both are incomplete.
    #
    # ADVISORY BY DESIGN. `ci-passed` awaits it so a hang stays visible, but
    # never enforces it: a Windows runner flake (#535 is live) must not block a
    # merge on a figure no check consumes. That is the trade DECISION-0031 made
    # when it weighed Available, and test_ci_impact.py pins it.
    #
    # KNOWN RED on windows-latest, tracked in #539. This tree had never run on
    # Windows in CI - the `tools` job is ubuntu-only - and the first run here
    # surfaced 15 failures, all downstream of one lexical containment check that
    # refuses a legitimate worktree root when the 8.3 short path and the long
    # path spell the same directory differently. The failure is real, it predates
    # this job, and the cell is advisory so it blocks nothing. It goes green when
    # #539 lands; do NOT silence it with continue-on-error in the meantime.
    #
    # Scoped to plugins/ca/tools. ca-pi/tools is the other platform-forked tree
    # per tech-stack.md and is NOT covered here - deliberately, and tracked:
    # this job installs a graph, and the audited-graph contract is satisfied by
    # the sibling job that audits the SAME literal directory, which requires the
    # working directory to be literal rather than matrix-templated.
    name: "Coverage union  <os: ${{ matrix.os }}>"
    needs: changes
    if: needs.changes.outputs.ca == 'true'
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    defaults:
      run:
        working-directory: plugins/ca/tools
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: plugins/ca/tools/package-lock.json
      - name: Install (locked)
        # --ignore-scripts for the same reason every sibling job uses it: this
        # graph's output is a committed artifact. The graph itself is audited by
        # the `tools` job, which runs under the identical `ca` path filter - the
        # derived audited-graph rule in test_ci_impact.py checks exactly that.
        run: npm ci --ignore-scripts
      - name: Coverage (blob)
        # A BLOB report is what `--merge-reports` recombines, and vitest
        # recomputes coverage across blobs rather than letting the last one win.
        # Verified on two disjoint suites - 7 + 65 branches merge to 72, 18 + 69
        # lines to 87.
        #
        # `default` is requested ALONGSIDE it because blob REPLACES the console
        # reporter: the first run of this job failed on Windows and the log
        # showed only "exit code 1" with no summary, no failing test name and no
        # assertion. A cell that cannot say what broke is not worth having.
        run: npx vitest run --coverage --reporter=blob --reporter=default --outputFile.blob=coverage-blobs/${{ matrix.os }}.json
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        # NOT vitest's default `.vitest-reports/`: upload-artifact defaults to
        # `include-hidden-files: false`, so a dot-directory uploads NOTHING and
        # the merge job silently reported `blobs merged: 0` for every run since
        # this job shipped. A non-hidden directory needs no flag to be correct.
        #
        # always(): a FAILING host's blob is the one most worth having. Without
        # this the upload is skipped exactly when the run needs diagnosing, and
        # the merge job silently reports a one-host figure as though the other
        # host had nothing to add.
        if: always()
        with:
          name: coverage-blob-ca-os-${{ matrix.os }}
          path: plugins/ca/tools/coverage-blobs/
          retention-days: 5

  coverage-union-merge:
    # The union half of #521: every host's blob merged into the single figure
    # `tdd` Phase 5 is meant to quote. Advisory, like the cells that feed it.
    name: "[CHECK] | [REPO] | Coverage union"
    needs: [changes, coverage-union]
    if: always() && needs.changes.outputs.ca == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: plugins/ca/tools
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: plugins/ca/tools/package-lock.json
      - name: Install (locked)
        run: npm ci --ignore-scripts
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          pattern: coverage-blob-ca-os-*
          merge-multiple: true
          path: plugins/ca/tools/coverage-blobs/
      - name: Merge and report the union
        # A missing blob (a cancelled or flaked host cell) degrades to "report
        # what we have and name what is missing" rather than failing a lane
        # nothing gates on - the same thing maturity-coverage.md tells a human
        # reading a partial local report.
        run: |
          echo "### Coverage union - plugins/ca/tools" >> "$GITHUB_STEP_SUMMARY"
          blobs=$(ls coverage-blobs/*.json 2>/dev/null | wc -l)
          echo "blobs merged: $blobs" | tee -a "$GITHUB_STEP_SUMMARY"
          ls coverage-blobs/ 2>/dev/null | sed 's/^/  - /' >> "$GITHUB_STEP_SUMMARY" || true
          if [ "$blobs" -eq 0 ]; then
            echo "no host produced a blob - nothing to merge (advisory)" | tee -a "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          if [ "$blobs" -lt 2 ]; then
            echo "PARTIAL: only $blobs of 2 hosts reported - this is NOT the union figure"               | tee -a "$GITHUB_STEP_SUMMARY"
          fi
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          npx vitest --merge-reports coverage-blobs --coverage --coverage.reporter=text-summary             2>&1 | tee -a "$GITHUB_STEP_SUMMARY" || true
          echo '```' >> "$GITHUB_STEP_SUMMARY"

  coverage-union-pi:
    # Issue #521 / DECISION-0031. The coverage GATE is orchestrator-run (`tdd`
    # Phase 5), not a required check - this job exists to PRODUCE the number
    # that gate quotes, on every host the tree actually forks across.
    #
    # ca-pi forks on platform in its Windows supervisor and process-tree paths,
    # so a single-host report scores the other platform's arm as uncovered no
    # matter how well tested it is. tech-stack.md's per-tree table is what
    # decides which trees earn a second host.
    #
    # ADVISORY BY DESIGN. `ci-passed` awaits it so a hang stays visible, but
    # never enforces it: a Windows runner flake (#535 is live) must not block a
    # merge on a figure no check consumes. That is the trade DECISION-0031 made
    # when it weighed Available, and test_ci_impact.py pins it.
    #
    # Issue #537. A literal working directory, not a matrix over trees: the
    # audited-graph contract attributes a job's dependency graph BY its working
    # directory, and a templated one resolves to `.`, which nothing audits.
    # Compensating with extra `npm audit` steps breaks the contract pinning the
    # exact audit inventory. Hence one job per tree - mechanical duplication,
    # not a design choice. `ca-pi-checks` audits this same literal directory
    # under the identical path filter.
    name: "Coverage union (Pi)  <os: ${{ matrix.os }}>"
    needs: changes
    if: needs.changes.outputs.ca-pi == 'true'
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    defaults:
      run:
        working-directory: plugins/ca-pi/tools
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: plugins/ca-pi/tools/package-lock.json
      - name: Install (locked)
        # --ignore-scripts for the same reason every sibling job uses it: this
        # graph's output is a committed artifact. The graph itself is audited by
        # the `ca-pi-checks` job, which runs under the identical `ca-pi` path filter - the
        # derived audited-graph rule in test_ci_impact.py checks exactly that.
        run: npm ci --ignore-scripts
      - name: Coverage (blob)
        # A BLOB report is what `--merge-reports` recombines, and vitest
        # recomputes coverage across blobs rather than letting the last one win.
        # Verified on two disjoint suites - 7 + 65 branches merge to 72, 18 + 69
        # lines to 87.
        #
        # `default` is requested ALONGSIDE it because blob REPLACES the console
        # reporter: the first run of this job failed on Windows and the log
        # showed only "exit code 1" with no summary, no failing test name and no
        # assertion. A cell that cannot say what broke is not worth having.
        run: npx vitest run --coverage --reporter=blob --reporter=default --outputFile.blob=coverage-blobs/${{ matrix.os }}.json
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        # NOT vitest's default `.vitest-reports/`: upload-artifact defaults to
        # `include-hidden-files: false`, so a dot-directory uploads NOTHING and
        # the merge job silently reported `blobs merged: 0` for every run since
        # this job shipped. A non-hidden directory needs no flag to be correct.
        #
        # always(): a FAILING host's blob is the one most worth having. Without
        # this the upload is skipped exactly when the run needs diagnosing, and
        # the merge job silently reports a one-host figure as though the other
        # host had nothing to add.
        if: always()
        with:
          name: coverage-blob-ca-pi-os-${{ matrix.os }}
          path: plugins/ca-pi/tools/coverage-blobs/
          retention-days: 5

  coverage-union-pi-merge:
    # The union half of #521: every host's blob merged into the single figure
    # `tdd` Phase 5 is meant to quote. Advisory, like the cells that feed it.
    name: "[CHECK] | [PI  ] | Coverage union"
    needs: [changes, coverage-union-pi]
    if: always() && needs.changes.outputs.ca-pi == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: plugins/ca-pi/tools
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: plugins/ca-pi/tools/package-lock.json
      - name: Install (locked)
        run: npm ci --ignore-scripts
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          pattern: coverage-blob-ca-pi-os-*
          merge-multiple: true
          path: plugins/ca-pi/tools/coverage-blobs/
      - name: Merge and report the union
        # A missing blob (a cancelled or flaked host cell) degrades to "report
        # what we have and name what is missing" rather than failing a lane
        # nothing gates on - the same thing maturity-coverage.md tells a human
        # reading a partial local report.
        run: |
          echo "### Coverage union - plugins/ca-pi/tools" >> "$GITHUB_STEP_SUMMARY"
          blobs=$(ls coverage-blobs/*.json 2>/dev/null | wc -l)
          echo "blobs merged: $blobs" | tee -a "$GITHUB_STEP_SUMMARY"
          ls coverage-blobs/ 2>/dev/null | sed 's/^/  - /' >> "$GITHUB_STEP_SUMMARY" || true
          if [ "$blobs" -eq 0 ]; then
            echo "no host produced a blob - nothing to merge (advisory)" | tee -a "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          if [ "$blobs" -lt 2 ]; then
            echo "PARTIAL: only $blobs of 2 hosts reported - this is NOT the union figure"               | tee -a "$GITHUB_STEP_SUMMARY"
          fi
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          npx vitest --merge-reports coverage-blobs --coverage --coverage.reporter=text-summary             2>&1 | tee -a "$GITHUB_STEP_SUMMARY" || true
          echo '```' >> "$GITHUB_STEP_SUMMARY"

  tools:
    name: "[CHECK] | [CA  ] | Farm dispatcher contract"
    needs: changes
    if: needs.changes.outputs.ca == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: plugins/ca/tools
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: plugins/ca/tools/package-lock.json
      - name: Install (locked)
        # --ignore-scripts: this graph's OUTPUT is a committed artifact, so an
        # install-time script from a compromised dev dependency would execute
        # alongside the build that produces it - the blast radius the
        # dev-inclusive CVE gate below exists for. esbuild declares an install
        # script; it is a binary-placement optimization, and both the module
        # and CLI paths resolve the platform package without it. Asserted by
        # test_ci_impact.py so the next tools job cannot omit it.
        run: npm ci --ignore-scripts
      - name: Audit (CVE gate - fail on HIGH)
        # Supply-chain gate per security-controls.md: a HIGH-or-worse advisory
        # in a production dependency fails the build. --omit=dev scopes to
        # shipped deps so routine dev-tool advisories don't block unrelated PRs.
        #
        # HONEST SCOPE: plugins/ca/tools declares ZERO production dependencies,
        # so `--omit=dev` audits an empty graph here and this step is inert
        # today at ANY threshold. It is a DURABILITY setting - it decides what
        # happens the day the farm takes on a runtime dependency. #400's three
        # HIGH advisories were all in site/package-lock.json, the only graph in
        # this repo with production deps and one nothing audited until #403;
        # that gate lives in docs.yml, not here. Issue #434 tracks extending the
        # sweep to the dev trees, where this package's advisories actually are.
        # One threshold applies to every audited graph (farm, sandbox, ca-pi,
        # docs site); test_ci_impact.py asserts that.
        run: npm audit --omit=dev --audit-level=high
      - name: Audit build toolchain (CVE gate - fail on HIGH, dev deps included)
        # Issue #434. The step above is `--omit=dev`, and all three tools graphs
        # declare no production dependencies - so on its own it audits an empty
        # graph and sees nothing. Every dependency here is a dev dependency, and
        # they are the ones that BUILD the committed, shipped artifacts
        # (farm.js, sandbox.js, the ca-pi extension bundles). A build-time
        # compromise lands in a reviewed-and-committed artifact, so "dev
        # dependency" understates the blast radius when the dev dependency's
        # output is the product.
        #
        # This is what actually caught GHSA-r28c-9q8g-f849 (postcss, HIGH) in
        # plugins/ca/tools: `--omit=dev --audit-level=critical` reported zero
        # against the vulnerable lockfile AND against the fixed one, and the
        # advisory only ever surfaced because dependabot happened to file the
        # bump. That is luck, not a control.
        #
        # Same HIGH threshold as every other audited graph, so one policy covers
        # the repo; test_ci_impact.py asserts that no audit step in this
        # workflow uses a different one.
        run: npm audit --audit-level=high
      - name: Typecheck
        run: npm run typecheck
      - name: Rebuild farm.js
        # Issue #407: the rebuild moves AHEAD of the tests, so the shard that
        # executes the shipped bundle runs against a freshly built one rather
        # than against whatever happens to be committed. The staleness gate
        # below is unaffected - it still compares the rebuild to the committed
        # copy, and now does so before the suite rather than after.
        run: npm run build
      - name: Fail if committed farm.js is stale
        run: |
          if ! git diff --quiet -- farm.js; then
            echo "::error file=plugins/ca/tools/farm.js::farm.js is out of date with farm.ts. Run 'npm run build' in plugins/ca/tools and commit the result - the plugin ships farm.js, not farm.ts."
            git --no-pager diff -- farm.js
            exit 1
          fi
          echo "farm.js is in sync with farm.ts"
      - name: Test
        # Includes farm-dist.test.ts (issue #407), which executes the REBUILT
        # farm.js under plain Node. Before it, CI proved source behaviour and
        # deterministic generation but never that the ESM bundle users actually
        # run starts, parses argv, resolves its bundled modules, or preserves
        # exit semantics. A byte-identical artifact is not a working one.
        run: npm test

  ca-sandbox-tools:
    name: "[CHECK] | [SBX ] | Sandbox driver contract"
    needs: changes
    if: needs.changes.outputs.ca-sandbox == 'true'
    runs-on: ubuntu-latest
    # Issue #406. Docker is a REQUIRED prerequisite for this job, not a nicety.
    # ca-sandbox is the driver that clones UNTRUSTED repositories into a
    # container, and every real-container suite used to convert a failed
    # `docker info` probe into `describe.skip` - here too. A runner Docker
    # outage, a daemon that failed to start, a permissions regression or a
    # runtime incompatibility therefore deleted the ONLY isolation, mount,
    # network, lifecycle and teardown evidence while this job exited 0 off the
    # pure argv-builder specs. CA_SANDBOX_REQUIRE_DOCKER makes an unavailable
    # daemon throw from module scope instead; CA_SANDBOX_DOCKER_SENTINEL is the
    # append-only record of which gated layers actually STARTED, asserted below.
    # Developer machines set neither and keep the old self-skipping behavior.
    #
    # OPERATIONAL CONSEQUENCE, accepted deliberately: a runner-side Docker
    # outage is now a merge blocker for every ca-sandbox PR. That is the point -
    # a sandbox contract that cannot be exercised has not been verified.
    env:
      CA_SANDBOX_REQUIRE_DOCKER: "1"
      CA_SANDBOX_DOCKER_SENTINEL: ${{ github.workspace }}/sandbox-docker-layers.sentinel
    defaults:
      run:
        working-directory: plugins/ca-sandbox/tools
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: plugins/ca-sandbox/tools/package-lock.json
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.x"
      - name: Install (locked)
        # --ignore-scripts: this graph's OUTPUT is a committed artifact, so an
        # install-time script from a compromised dev dependency would execute
        # alongside the build that produces it - the blast radius the
        # dev-inclusive CVE gate below exists for. esbuild declares an install
        # script; it is a binary-placement optimization, and both the module
        # and CLI paths resolve the platform package without it. Asserted by
        # test_ci_impact.py so the next tools job cannot omit it.
        run: npm ci --ignore-scripts
      - name: Audit (CVE gate - fail on HIGH)
        # Same threshold as every other audited graph (issue #403), and the same
        # caveat as the farm: ca-sandbox/tools declares no production
        # dependencies either, so this audits an empty graph today and is a
        # durability setting rather than a live gate.
        run: npm audit --omit=dev --audit-level=high
      - name: Audit build toolchain (CVE gate - fail on HIGH, dev deps included)
        # Issue #434. The step above is `--omit=dev`, and all three tools graphs
        # declare no production dependencies - so on its own it audits an empty
        # graph and sees nothing. Every dependency here is a dev dependency, and
        # they are the ones that BUILD the committed, shipped artifacts
        # (farm.js, sandbox.js, the ca-pi extension bundles). A build-time
        # compromise lands in a reviewed-and-committed artifact, so "dev
        # dependency" understates the blast radius when the dev dependency's
        # output is the product.
        #
        # This is what actually caught GHSA-r28c-9q8g-f849 (postcss, HIGH) in
        # plugins/ca/tools: `--omit=dev --audit-level=critical` reported zero
        # against the vulnerable lockfile AND against the fixed one, and the
        # advisory only ever surfaced because dependabot happened to file the
        # bump. That is luck, not a control.
        #
        # Same HIGH threshold as every other audited graph, so one policy covers
        # the repo; test_ci_impact.py asserts that no audit step in this
        # workflow uses a different one.
        run: npm audit --audit-level=high
      - name: Typecheck
        run: npm run typecheck
      - name: Docker preflight (REQUIRED prerequisite - fail, never skip)
        # Fails the job BEFORE the suite rather than letting it degrade into a
        # green run of argv-builder tests only.
        run: |
          if ! docker info --format '{{.OSType}}'; then
            echo "::error::The ca-sandbox contract job requires a working Docker daemon. Without one the real isolation, mount, network, lifecycle and teardown suites cannot run, and this job would otherwise report green having exercised none of the container behaviour that contains an untrusted repository (issue #406)."
            exit 1
          fi
      - name: Test (Docker required - a missing daemon fails the run)
        run: npm test
      - name: Assert every real-container layer executed
        # The preflight only proves the daemon answered once. This proves each
        # docker-gated layer actually ran, so a suite that silently stops
        # registering cannot pass on an exit code alone.
        working-directory: ${{ github.workspace }}
        run: python3 .github/scripts/check_sandbox_docker_layers.py --sentinel "$CA_SANDBOX_DOCKER_SENTINEL"
      - name: Rebuild sandbox.js
        run: npm run build
      - name: Fail if a committed ca-sandbox artifact is stale
        # Issue #377: ca-sandbox ships TWO binaries now. claude-inside.js is
        # deliberately separate from sandbox.js - it starts a container holding
        # a live OAuth token, and the sandbox-claude-inside skill's five BLOCK
        # gates are what make that safe, so it is not a `sandbox` subcommand
        # anyone can reach. A second shipped artifact needs its own staleness
        # gate or it silently rots, which is the exact failure #407 found for
        # farm.js: a byte-identical rebuild proves generation, not behaviour.
        run: |
          stale=0
          for artifact in sandbox.js claude-inside.js; do
            if ! git diff --quiet -- "$artifact"; then
              echo "::error file=plugins/ca-sandbox/tools/$artifact::$artifact is out of date with the TypeScript sources. Run 'npm run build' in plugins/ca-sandbox/tools and commit the result - the plugin ships the bundles, not the sources."
              git --no-pager diff -- "$artifact"
              stale=1
            fi
          done
          [ "$stale" -eq 0 ] || exit 1
          echo "sandbox.js and claude-inside.js are in sync with the TypeScript sources"

  ca-pi-checks:
    name: "[CHECK] | [PI  ] | Host-independent adapter contract"
    # Issue #390: everything in this job consumes NEITHER matrix.os NOR
    # matrix.pi-version, so the six-cell ca-pi-tools matrix below was producing
    # six identical verdicts for it (1,423 runner-seconds on run 29870271440).
    # It now runs exactly once per workflow run: package metadata, typecheck,
    # the COMPLETE Vitest suite, the static security/parity scripts, the bundle
    # rebuild + staleness gate, the release package contract, and the relative
    # benchmark. ca-pi-tools keeps only the checks whose verdict genuinely
    # depends on the installed Pi version or the host OS.
    #
    # Issue #405: the unfiltered `npm test` below is what makes every committed
    # plugins/ca-pi/tools/test/*.test.ts file a required merge gate. Before
    # this, required CI named 6 of 23 files and the rest (policy, plan-mode,
    # dispatch, background-jobs, windows-supervisor, ...) could regress with
    # the whole board green. Do NOT re-introduce a file filter here -
    # test_ci_impact.py's partition contract fails if you do.
    #
    # REGISTRATION CONTRACT: this job must be listed in BOTH ci-passed's
    # `needs:` block AND its `required_results` string. One without the other
    # silently drops the verdict; test_ci_impact.py asserts the two agree.
    needs: changes
    if: needs.changes.outputs.ca-pi == 'true'
    runs-on: ubuntu-latest
    # Issue #399. Observed p95 for the equivalent ubuntu matrix cell is ~135s
    # (runs 29870271440 and 30123976665: 120/125/130/132s); the complete Vitest
    # suite and the 100-sample benchmark add the rest, so ~5 minutes expected.
    # 20 minutes is ~4x that and far below the hosted 6-hour job ceiling.
    timeout-minutes: 20
    defaults:
      run:
        working-directory: plugins/ca-pi/tools
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22.19.0
          cache: npm
          cache-dependency-path: plugins/ca-pi/tools/package-lock.json
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.x"
      - name: Resolve the pinned upstream Pi version from repository policy
        # package.test.ts discovers the live Pi package root from PATH, so this
        # job needs a real Pi installed. The version is READ from the repo's own
        # support policy rather than hardcoded, so a Pi promotion (which rewrites
        # the policy and the matrix, see .github/pi-promotion-targets.json) can
        # never leave this job pinned to a stale runtime.
        id: pinned
        working-directory: .
        shell: bash
        run: |
          policy="$(python .github/scripts/pi_promotion.py policy)"
          version="$(python -c 'import json,sys; print(json.loads(sys.argv[1])["last_verified"])' "$policy")"
          echo "resolved pinned Pi version: $version"
          echo "version=$version" >> "$GITHUB_OUTPUT"
      - name: Install external Pi host (scripts disabled)
        run: npm install --global @earendil-works/pi-coding-agent@${{ steps.pinned.outputs.version }} --ignore-scripts
      - name: Install reviewed toolchain (scripts disabled)
        run: npm ci --ignore-scripts
      - name: Audit (CVE gate - fail on HIGH)
        # plugins/ca-pi/tools is a PUBLISHED host package, so its graph belongs
        # under the same gate as the farm, sandbox, and docs site - without this
        # step tech-stack.md's claim to cover "every dependency graph the repo
        # ships or publishes" was false. Like the first two it declares no
        # production dependencies today, so this audits an empty graph; it
        # exists so the gate is already in place when that changes. Hosted here
        # rather than in the six-cell ca-pi-tools matrix - the verdict does not
        # depend on OS or Pi version.
        run: npm audit --omit=dev --audit-level=high
      - name: Audit build toolchain (CVE gate - fail on HIGH, dev deps included)
        # Issue #434. The step above is `--omit=dev`, and all three tools graphs
        # declare no production dependencies - so on its own it audits an empty
        # graph and sees nothing. Every dependency here is a dev dependency, and
        # they are the ones that BUILD the committed, shipped artifacts
        # (farm.js, sandbox.js, the ca-pi extension bundles). A build-time
        # compromise lands in a reviewed-and-committed artifact, so "dev
        # dependency" understates the blast radius when the dev dependency's
        # output is the product.
        #
        # This is what actually caught GHSA-r28c-9q8g-f849 (postcss, HIGH) in
        # plugins/ca/tools: `--omit=dev --audit-level=critical` reported zero
        # against the vulnerable lockfile AND against the fixed one, and the
        # advisory only ever surfaced because dependabot happened to file the
        # bump. That is luck, not a control.
        #
        # Same HIGH threshold as every other audited graph, so one policy covers
        # the repo; test_ci_impact.py asserts that no audit step in this
        # workflow uses a different one.
        run: npm audit --audit-level=high
      - name: Check generated root package metadata
        working-directory: .
        run: python tools/build-host-packages.py --check
      - name: Typecheck
        run: npm run typecheck
      - name: Test the complete Pi adapter suite
        run: npm test
      - name: Test adversarial Pi security promotion contract
        working-directory: .
        run: python .github/scripts/test_pi_security.py
      - name: Test three-host enforcement and descriptor parity
        working-directory: .
        run: python .github/scripts/test_pi_parity.py
      - name: Rebuild externalized bundles
        run: npm run build
      - name: Fail if committed bundles are stale
        working-directory: .
        shell: bash
        run: |
          if ! git diff --quiet -- plugins/ca-pi/extensions plugins/ca-pi/helpers; then
            echo "::error file=plugins/ca-pi/helpers/windows-supervisor.js::Pi bundles or the Windows supervisor are stale. Run npm --prefix plugins/ca-pi/tools run build."
            git --no-pager diff -- plugins/ca-pi/extensions plugins/ca-pi/helpers
            exit 1
          fi
      - name: Test release package contract
        working-directory: .
        run: python .github/scripts/test_pi_package.py
      - name: Measure the three-host relative adapter benchmark
        working-directory: .
        run: python .github/scripts/pi_benchmark.py --samples 100

  ca-pi-tools:
    name: "[CHECK] | [PI  ] | Adapter contract  <os: ${{ matrix.os }} · runtime: Pi ${{ matrix.pi-version }}>"
    # Issue #390: the lean compatibility matrix. Only steps whose verdict is a
    # function of matrix.os or matrix.pi-version live here - the installed-Pi
    # admission boundary, live package RPC activation, the cross-platform
    # platform contract, and the Vitest suites that branch on the LIVE host
    # platform. Everything host-independent moved to ca-pi-checks above; adding
    # a host-independent step back here re-multiplies it by six and fails
    # test_ci_impact.py.
    #
    # THE PARTITION RULE, stated once. A Pi Vitest file belongs here - not in
    # the canonical ubuntu job alone - exactly when it compares the live
    # `process.platform` against a literal, because then a Linux runner cannot
    # reach the Windows/macOS branch at all:
    #
    #   test.skipIf(process.platform !== "win32")(...)      whole test skipped
    #   process.platform === "win32" ? "junction" : "dir"   different OS primitive
    #
    # A platform value that is INJECTED (`buildChildEnv({ platform: "win32" })`)
    # or merely forwarded into a pure function (`platform: process.platform`)
    # does NOT qualify - child-env/compaction/status/tool-guard exercise the
    # same code on every host, which is why they run once on ca-pi-checks.
    # test_ci_impact.py derives this set from the sources; it is not a list a
    # human keeps in sync.
    needs: changes
    if: needs.changes.outputs.ca-pi == 'true'
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        pi-version: ["0.80.5", "0.80.10"]
    runs-on: ${{ matrix.os }}
    # Issue #399. Worst observed cell before this split was 452s (windows-latest,
    # run 30123976665); the Windows cold `npm install --global` dominates and is
    # unchanged by the split. That 452s cell also carried typecheck, the bundle
    # build, the 100-sample benchmark and four Python scripts, all of which have
    # moved to ca-pi-checks - so this job is a net reduction even with the
    # platform-gated Vitest suites kept here. 25 minutes is ~3.3x the recorded
    # worst case, leaves room for a slow registry day, and still terminates a
    # wedged install or a leaked process tree far short of the 6-hour ceiling.
    timeout-minutes: 25
    defaults:
      run:
        working-directory: plugins/ca-pi/tools
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22.19.0
          cache: npm
          cache-dependency-path: plugins/ca-pi/tools/package-lock.json
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.x"
      - name: Install external Pi host (scripts disabled)
        run: npm install --global @earendil-works/pi-coding-agent@${{ matrix.pi-version }} --ignore-scripts
      - name: Install reviewed toolchain (scripts disabled)
        run: npm ci --ignore-scripts
      - name: Test package, module identity, compatibility, and native binding
        run: npm test -- test/package.test.ts
      # The host-dependent Vitest set, per the partition rule above. bridge,
      # runner-isolation, process-tree and package are platform-gated too, but
      # test_pi_platform_contract.py below already re-runs them in every cell,
      # so they are not repeated here. Kept on ONE line on purpose: the workflow
      # contracts in .github/scripts are textual (stdlib-only, no YAML parser)
      # and read the covered file set straight off a `run: npm test -- ...` line.
      - name: Test the platform-gated adapter suites on this operating system
        run: npm test -- test/activation.test.ts test/audit-sink.test.ts test/background-jobs.test.ts test/child-env.test.ts test/commands.test.ts test/plan-mode.test.ts test/runtime-resolver.test.ts test/security.test.ts test/windows-supervisor.test.ts
      - name: Test real package RPC activation and aliases
        working-directory: .
        run: python .github/scripts/test_pi_package.py --rpc-commands
      - name: Test cross-platform paths, encoding, cancellation, process trees, prune, and generation
        working-directory: .
        run: python .github/scripts/test_pi_platform_contract.py --pi-version ${{ matrix.pi-version }}

  ca-pi-latest:
    name: "[WATCH] | [PI  ] | Upstream compatibility  <runtime: npm latest>"
    # Issue #381: this is a WATCH lane, not a gate. Upstream publishing a Pi
    # outside the validated support window is the SIGNAL this job exists to
    # report - it belongs in the job summary, never as a red check on an
    # otherwise merge-ready PR. So the two upstream-compatibility probes below
    # absorb their own failure at STEP level and the job publishes an advisory
    # receipt and concludes green.
    #
    # There is deliberately NO job-level `continue-on-error` here. GitHub still
    # reports a job-level continue-on-error job's check run with conclusion
    # `failure` (observed on PR #313 and again on PR #420), which is the exact
    # false alarm this fixes. Keeping the job honest means a failure in the
    # canary HARNESS - checkout, toolchain install, receipt publication - is a
    # real defect in the watch itself and still turns this check red.
    needs: changes
    if: needs.changes.outputs.ca-pi == 'true'
    runs-on: ubuntu-latest
    # Issue #399. Observed 17-18s when the probe fails fast; a compatible latest
    # runs the package suite plus the full platform contract, so budget like the
    # ubuntu adapter cell. 20 minutes bounds a wedged npm install without ever
    # truncating a healthy run.
    timeout-minutes: 20
    defaults:
      run:
        working-directory: plugins/ca-pi/tools
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22.19.0
          cache: npm
          cache-dependency-path: plugins/ca-pi/tools/package-lock.json
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.x"
      # HARNESS - not absorbed. If the toolchain or the latest-Pi install fails,
      # the canary itself is broken and this check must go red.
      - name: Install reviewed toolchain and external latest Pi (scripts disabled)
        run: |
          npm ci --ignore-scripts
          npm install --global @earendil-works/pi-coding-agent@latest --ignore-scripts
      # PROBES - absorbed. Their outcome is the observation, not the verdict.
      - name: Report latest version and test installed runtime admission
        id: admission
        continue-on-error: true
        run: |
          pi --version
          npm test -- test/package.test.ts -t "installed Pi runtime is admitted by the production boundary"
          npm test -- test/package.test.ts
      - name: Run the latest Pi platform contract as a nonblocking canary
        id: platform-contract
        continue-on-error: true
        working-directory: .
        run: python .github/scripts/test_pi_platform_contract.py --pi-version latest
      # RECEIPT - not absorbed, and always published. A failure to publish the
      # advisory verdict is a harness failure and must be visible.
      - name: Publish the advisory upstream-compatibility receipt
        if: always()
        working-directory: .
        shell: bash
        env:
          ADMISSION: ${{ steps.admission.outcome }}
          PLATFORM_CONTRACT: ${{ steps.platform-contract.outcome }}
        run: |
          # `shell: bash` runs with -eo pipefail, so the probe is wrapped: an
          # absent or broken `pi` must degrade to "unresolved", never fail the
          # receipt step and turn this advisory check red.
          latest="$({ pi --version 2>/dev/null || true; } | tr -d '\r' | tail -n 1)"
          [ -n "$latest" ] || latest="unresolved"
          {
            echo "## Pi upstream compatibility (advisory)"
            echo
            echo "This is a WATCH lane. It reports whether npm-latest Pi is inside"
            echo "the validated support window; it never blocks merge."
            echo
            echo "| probe | outcome |"
            echo "| --- | --- |"
            echo "| npm latest Pi | \`$latest\` |"
            echo "| installed-runtime admission | \`$ADMISSION\` |"
            echo "| latest platform contract | \`$PLATFORM_CONTRACT\` |"
          } >> "$GITHUB_STEP_SUMMARY"
          if [ "$ADMISSION" = success ] && [ "$PLATFORM_CONTRACT" = success ]; then
            echo "latest Pi ($latest) is inside the validated support window"
          else
            echo "::warning title=Pi upstream compatibility::latest Pi ($latest) is outside the validated support window (admission=$ADMISSION, platform-contract=$PLATFORM_CONTRACT). Advisory only - run the Pi promotion workflow to validate and promote it."
          fi

  ca-pi-codeql:
    name: "[CHECK] | [PI  ] | Security analysis  <language: JavaScript/TypeScript>"
    needs: changes
    # Issue #383: `merge_group` joins `pull_request` here rather than replacing
    # the event gate. Analysing the prospective merge commit is the whole point
    # of a queue - the code that actually lands is the merge result, not either
    # parent - while `push` on main stays excluded, where the analysis would be
    # a post-mortem of code already merged.
    if: (github.event_name == 'pull_request' || github.event_name == 'merge_group') && needs.changes.outputs.ca-pi == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.x"
      - name: Initialize scoped Pi CodeQL database
        uses: github/codeql-action/init@e4fba868fa4b1b91e1fdab776edc8cfbe6e9fb81 # v4.37.3
        with:
          languages: javascript-typescript
          build-mode: none
          config: |
            name: ca-pi-security
            queries:
              - uses: security-extended
            paths:
              - plugins/ca-pi/tools/src
              - plugins/ca-pi/extensions
            paths-ignore:
              - plugins/ca-pi/tools/node_modules
      - name: Analyze Pi without duplicating default code-scanning uploads
        uses: github/codeql-action/analyze@e4fba868fa4b1b91e1fdab776edc8cfbe6e9fb81 # v4.37.3
        with:
          category: "/language:javascript-typescript"
          output: codeql-results
          upload: never
      - name: Fail unresolved high-severity findings
        run: python .github/scripts/test_pi_security.py --sarif codeql-results

  hooks:
    name: "[CHECK] | [CORE] | Hook contract  <os: ${{ matrix.os }}>"
    # MR-10: proves host-specific interpreter fallback on every OS - REAL (no
    # double execution), STUB (preferred interpreter fails), PY2 (`python`
    # exists but is not Python 3; ca must fall back and preserve exit-2 blocks),
    # and NONE (no Python; fail LOUD, never silently dormant). The Windows ca
    # path also proves a successful python3/MSIX alias is never activated.
    # See .github/scripts/test_hooks_cold_install.py.
    # Shared infra (the ca plugin's hooks) - runs whenever CI runs; not gated
    # per-plugin because the hook payload belongs to neither sandbox driver.
    needs: changes
    if: needs.changes.outputs.hooks == 'true'
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.x"
      - name: Sync-core drift gate (ADR-0011 M1)
        # core/pysrc/ is the canonical copy of every host-neutral hook file;
        # plugins/ca/hooks/ and plugins/ca-codex/hooks/ each vendor a
        # byte-identical copy (tools/sync-core.py). A vendored copy that
        # drifts from core silently forks the enforcement logic between the
        # two hosts - fail the build before that ships.
        run: python tools/sync-core.py --check
      - name: Run sync-core tool unit tests
        # FINDING 2 (2026-07 review): sync/--check pass-fail matrix (in-sync,
        # drifted, missing), write-mode drift repair, and the hardened
        # non-zero/clear-message error paths for an unreadable source file,
        # an unwritable destination, and an empty/missing core dir.
        run: python .github/scripts/test_sync_core.py
      - name: Run codex-parity-fixture tool unit tests
        # FINDING 4 (2026-07 review): normal + --bare fixture creation,
        # existing-target rejection, and every git/filesystem failure path
        # exiting non-zero with a clear stderr message (no swallowed
        # subprocess return codes, no raw traceback on a creation failure).
        run: python .github/scripts/test_codex_parity_fixture.py
      - name: Run surface-generator unit tests
        # codex-support M3: determinism/idempotence of tools/build-surface.py,
        # token inversion (Claude render inverts extraction byte-exactly),
        # host conditionals, Codex path rewrites + frontmatter synthesis, and
        # --check drift detection in both directions against synthetic trees.
        run: python .github/scripts/test_build_surface.py
      - name: Run §6 routing + post-merge-cleanup surface contract
        # Issue #308 / ADR-0022. Both halves of #308 are prose contracts
        # projected into three host surfaces, so what silently regresses is a
        # paragraph reverting, or landing on one host and not the others. This
        # pins the three routing tiers, the destructive set that keeps an
        # obvious-but-irreversible command at tier 2, the preserved §6
        # invariant (route the command, never improvise the operation), the
        # never-steer-to-override rule, and the cleanup owner's own acceptance
        # gates - on every generated projection.
        run: python .github/scripts/test_routing_and_cleanup_surface.py
      - name: Run cold-install interpreter matrix
        run: python .github/scripts/test_hooks_cold_install.py
      - name: Run ca-codex host-adapter parity suite
        # ADR-0011 M2: Codex payload normalization, apply_patch envelope
        # parsing, project_root resolution, and cross-host blocked-verdict
        # parity (H-05/H-11/H-18/H-19/H-20/H-21) via real subprocess
        # invocations of each plugin's vendored pre-write.py/pre-bash.py.
        run: python .github/scripts/test_codex_adapter.py
      - name: Validate public Codex documentation
        # Public claims stay pinned to the verified host/version evidence,
        # installation status, command spellings, and canonical support page.
        run: python .github/scripts/test_public_codex_docs.py
      - name: Validate public Pi documentation
        # The Codex gate above has run since it was written; its PI SIBLING was
        # wired into no workflow at all, so the Pi public-docs contract had
        # never executed on a merge gate. It drifted exactly as an unrun gate
        # does: the README and the parity runbook still advertised the command
        # and entry-skill counts from before `/ca:cleanup` landed, understating
        # all three by one, and nothing said so. A test nobody runs is not a
        # gate, it is a file.
        run: python .github/scripts/test_public_pi_docs.py
      - name: Run dual-host shared-store contract
        # ADR-0012: sequential initialization shares one store; concurrency is
        # asserted only for append-only gate events, never RMW state or the
        # repo-global dev marker.
        run: python .github/scripts/test_dual_host_store.py
      - name: Run guard-logic matrix
        # The cold-install matrix proves the interpreter plumbing; this proves
        # the guard decisions themselves - every blocked spelling of
        # H-01/02/03/05/11/09b blocks, every legitimate spelling still allows.
        run: python .github/scripts/test_hook_guards.py
      - name: Run /ca:preview helper unit tests
        # Unit tests for the /ca:preview diff-collection + secret-scan helpers
        # (_previewlib): collect_diff over the three change kinds it unions and
        # the redacting secret scan, including the no-raise edges.
        run: python .github/scripts/test_preview_lib.py
      - name: Run UX-conversion-trio structural copy tests
        # Content-presence/absence assertions for the #82/#84/#83 prose changes:
        # the Receipt close, stakes lines on substantive finding-blocks, the
        # register split, and the negatives (no saves-ledger/statusline segment).
        run: python .github/scripts/test_ux_conversion.py
      - name: Run cold-miss nudge unit tests
        # O1-O11: nudge_decision pure helper, advisory builder, idle extraction,
        # hook_run integration (armed->2/stderr, resubmit->0, flag-off->today's
        # behavior), and docs gate (prune.md references CODEARBITER_PRUNE_NUDGE).
        run: python .github/scripts/test_prune_nudge.py
      - name: Run H-14 migration backstop tests
        # OB-01..11 + OB-C1/OB-S1 (#77): is_migration_path detection (defaults +
        # security-controls.md extend/exclude), migration-pass.py content-digest
        # marker, and pre-bash.py H-14 block/admit/edit-reblock/dormant/-a.
        run: python .github/scripts/test_migration_backstop.py
      - name: Run /ca:metrics helper unit tests
        # AC-01..AC-07: window tiling, 3-metric collection, empty-source safety,
        # and read-only enforcement (_metricslib).
        run: python .github/scripts/test_metrics_lib.py
      - name: Run task-board lifecycle helper unit tests
        # AC-01..AC-10: in-flight count (excludes done), dotted-ID grammar,
        # field parsing, stale-in-progress nudge, oversize degradation, and the
        # session-start/statusline readers routing through _taskboardlib.
        run: python .github/scripts/test_taskboardlib.py
      - name: Run task-board writer + harvest unit tests
        # AC-01..AC-11: next_seq, add_entry (ID-less + mint), set_state (dated
        # start/done + assign-on-pickup), dedup, the 3 harvest extractors, and
        # promote routing/modes (work->board, decision->questions).
        run: python .github/scripts/test_taskwriter.py
      - name: Run release-skill hardening helper unit tests
        # AC-1..AC-6 of release-skill-hardening: last_tag_select (ca-only,
        # pre-release-excluded baseline), notes_heading_matches, release_dates_
        # consistent, classify_publish_state, the CLI dispatch, and the SKILL.md
        # structural wiring (_releaselib).
        run: python .github/scripts/test_release_lib.py
      - name: Run hosted release-workflow contract tests
        # #378/#380/#385: release.yml holds `contents: write` and publishes
        # public, irreversible tags and Releases. This parses the SHIPPED
        # workflow, so deleting the exactly-one-target preflight, the
        # merge-readiness gate for GITHUB_SHA, or the peel-and-compare on an
        # existing tag turns CI red even while _releaselib stays green.
        run: python .github/scripts/test_release_workflow.py
      - name: Run the unit tests for CI's own machinery
        # These four suites existed and ran on NOTHING. Each one guards a script
        # that CI itself depends on, which is what makes the gap matter rather
        # than merely being untidy:
        #
        #   test_pi_promotion.py          pi_promotion.py drives the whole
        #                                 pi-promotion workflow (18 references)
        #   test_sandbox_docker_layers.py check_sandbox_docker_layers.py is what
        #                                 stops "the container layers were
        #                                 skipped" reading as "they passed"
        #   test_license_consistency.py   check_license_consistency.py is a
        #                                 required repo-wide gate
        #   test_planfilelib.py           canonical planning-file CAS publication
        #
        # The repository already states this discipline for payload_scope.py -
        # "payload_scope.py owns the rule; test_payload_scope.py is its only
        # guard" - and that pair IS wired. These four are the same shape and
        # were not. A guard whose own guard never runs is a guard on trust.
        run: |
          python .github/scripts/test_pi_promotion.py
          python .github/scripts/test_sandbox_docker_layers.py
          python .github/scripts/test_license_consistency.py
          python .github/scripts/test_planfilelib.py
      - name: Run provenance-store helper unit tests
        # AC-01: write_provenance/read_provenance round-trip, on-disk JSON shape
        # with schema/doc/created/interview_derived/entries[] (_provenancelib).
        run: python .github/scripts/test_provenancelib.py
      - name: Run README badge-consistency unit tests
        # The guard's own logic: version-badge parse, count-badge parse, prose
        # counts, table-row slugs, and each drift kind (version/count/prose/
        # catalog/missing-row) failing - plus the live HEAD-is-consistent check.
        run: python .github/scripts/test_badge_consistency.py
      - name: Run shared hook-helper unit tests (_hooklib)
        # CRYPTO_RE / SECRET_RE branch coverage + the path/frontmatter/marker/
        # digest helpers every enforcement hook routes through. Ran nowhere in CI
        # before (checkpoint 2026-06-22 gap); the ~18 CRYPTO_RE branches now have
        # direct assertions.
        run: python .github/scripts/test_hooklib.py
      - name: Run commit-gate board-sync structural tests
        # AC-04..07 (ADR-0008): Phase 6 board-edit exemption names the classifier,
        # retains a clean transition, still flags arbitrary edits; task.md and
        # future prose checks enforce the co-location contract.
        run: python .github/scripts/test_board_sync.py
      - name: Run commit-gate provenance auto-heal wiring tests
        # AC-14 (T-17): Phase 5.5 heal_worklist, incremental re-scout scoped to
        # those paths only, re-baseline rides work commit, claim-changed routes to
        # Phase 6 diff-review; Phase 6/7 provenance exemption + staging wiring.
        run: python .github/scripts/test_provenance_wiring.py
      - name: Run file-scoped-context-injection lib unit tests
        # AC-03/09/10/12 (_readinjectlib): allow_output hookSpecificOutput shape,
        # four-tier context map/budget/dedup/index assembly, cache round-trip.
        run: python .github/scripts/test_readinjectlib.py
      - name: Run pre-read hook entry-point integration tests
        # AC-03/09/10/12 (pre-read.py): governed-file injection, dedup (same
        # session+file -> first injects, second silent), .codearbiter/ self-read
        # silent allow, fail-open on malformed stdin, miss, and dormant-repo paths.
        run: python .github/scripts/test_pre_read.py
      - name: Run the hooks/tests unittest suite
        # plugins/ca/hooks/tests/ - the hook enforcement + helper logic. Ran only
        # locally per CONTRIBUTING; wired here so the guards are mechanically
        # enforced. Stdlib-only, cross-platform (discovered on every matrix OS).
        run: python -m unittest discover -s plugins/ca/hooks/tests -p "test_*.py"
      - name: Enforce suite hermeticity (issues #442, #462)
        # The suite used to mutate the DEVELOPER'S REAL HOME - rewriting
        # ~/.claude/settings.json and littering ~/.codearbiter/ - and to leak
        # file handles and child processes, which on Windows turns a later
        # teardown into an intermittent ERROR rather than a FAILURE. CI never
        # noticed either: a fresh runner has no settings to clobber, and a
        # ResourceWarning is not a test result.
        #
        # This runs each suite under a PRISTINE redirected home seeded with a
        # stale-but-real settings.json, and asserts that home comes back
        # byte-identical and the run emits no ResourceWarning. It re-runs the
        # hook suite twice over, so it is deliberately placed after the suite
        # itself rather than in place of it.
        run: python .github/scripts/test_suite_hermeticity.py
      - name: Run ADR identity + supersession contract tests
        # #416: two ADRs share the number 0014, so a bare `supersedes: 0014`
        # named two documents at once. The identifier is the filename STEM;
        # this pins both hook-side indexers to that derivation and proves an
        # ambiguous bare number errors instead of resolving arbitrarily.
        run: python .github/scripts/test_adr_identity.py
      - name: Enforce the ADR identity contract on the live decision record
        # The contract applied to .codearbiter/decisions/ itself: stems unique,
        # no NEW file on an already-used number (the 0014 pair is grandfathered
        # by stem, so a third one still fails), and every supersedes: resolving
        # to exactly one ADR. Ambiguity fails the build rather than being
        # silently resolved to whichever file sorts first.
        #
        # Last in the job deliberately: this pair guards the decision RECORD,
        # not the payload, so a governance breach must not mask the hook
        # enforcement results above it by halting the job early.
        run: python .github/scripts/check_adr_identity.py

  version-bump:
    name: "[GATE ] | [CA  ] | Payload version"
    # `claude plugin update` is a NO-OP when plugin.json's version string is
    # unchanged - verified live 2026-06-10: a months-stale hooks.json survived
    # a marketplace refresh until uninstall+reinstall. So any change to the
    # shipped payload (plugins/ca/**) that rides an already-published version
    # silently never reaches installed users. This guard fails such a PR.
    # Pre-publication PRs pass: the rule only bites when tag v<version>
    # already exists. Gated to ca-touching diffs (ADR-0007 path-scoping).
    needs: changes
    # Issue #383: this guard asks a question ABOUT THE BASE - whether the
    # payload version on the tip of main is already published - so it is
    # precisely the check a merge queue exists to re-run against the real base.
    # Two PRs can each bump ca to the same version and pass individually; only
    # the second one's merge-group run can see that the first already took it.
    if: (github.event_name == 'pull_request' || github.event_name == 'merge_group') && needs.changes.outputs.ca == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Fail if a published version ships a changed payload
        env:
          # `github.base_ref` is a pull_request-only context and is EMPTY under
          # merge_group, which would silently compare against nothing. The merge
          # group carries its target as a full ref, normalized to a branch name
          # below so the rest of this script is unchanged.
          BASE: ${{ github.base_ref || github.event.merge_group.base_ref }}
        run: |
          BASE="${BASE#refs/heads/}"
          git fetch -q origin "$BASE" --tags
          # Issue #435 scopes the payload (the plugin MINUS its tools/ BUILD
          # directory, PLUS the committed esbuild artifacts inside it, since
          # TypeScript sources and a lockfile never run on an installed machine).
          # Issue #530 decides what makes a version unusable for a FURTHER
          # payload change. Both rules live in Python so they can be unit-tested
          # against a real repository rather than asserted about shell embedded
          # in YAML - payload_scope.py and payload_version_gate.py, pinned by
          # test_payload_scope.py and test_payload_version_gate.py.
          #
          # #530: this step used to ask "does tag v$ver exist?" and allow
          # everything else. A marketplace install populates its cache from the
          # MANIFEST VERSION with no tag involved, so an untagged-but-already-
          # shipped version bought unlimited free payload changes that could
          # reach no installed user. Three merged PRs shipped that way on 2.9.1.
          python3 .github/scripts/payload_version_gate.py --plugin plugins/ca --base "origin/$BASE"

  version-bump-sandbox:
    name: "[GATE ] | [SBX ] | Payload version"
    # Per-plugin twin of the ca version-bump guard (ADR-0007): the two plugins
    # version independently, so a changed ca-sandbox payload on an
    # already-published ca-sandbox version (tag ca-sandbox-v<version>) is the
    # same silent-staleness trap and is failed here. The sandbox plugin's tags
    # are namespaced (ca-sandbox-v*) so they never collide with ca's v* tags.
    needs: changes
    if: (github.event_name == 'pull_request' || github.event_name == 'merge_group') && needs.changes.outputs.ca-sandbox == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Fail if a published version ships a changed payload
        env:
          # See the ca guard above: `github.base_ref` is empty under merge_group.
          BASE: ${{ github.base_ref || github.event.merge_group.base_ref }}
        run: |
          BASE="${BASE#refs/heads/}"
          git fetch -q origin "$BASE" --tags
          # See the ca guard above. Same two rules, same scripts, one plugin
          # argument apart: issue #435 owns the payload scope, issue #530 owns
          # what makes a version unusable for a further payload change. The
          # first-introduction case (no plugin.json on base) and the
          # unresolvable-base case both moved into payload_version_gate.py,
          # where they are unit-tested rather than asserted about shell.
          python3 .github/scripts/payload_version_gate.py --plugin plugins/ca-sandbox --base "origin/$BASE"

  version-bump-codex:
    name: "[GATE ] | [CDX ] | Payload version"
    # Per-plugin twin of the ca / ca-sandbox version-bump guards (ADR-0007
    # path-scoping, ADR-0011 Codex host): ca-codex versions independently, so
    # a changed ca-codex payload on an already-published ca-codex version
    # (tag ca-codex-v<version>) is the same silent-staleness trap and is
    # failed here. Namespaced tags (ca-codex-v*) never collide with ca's bare
    # v* series or ca-sandbox's ca-sandbox-v* series.
    needs: changes
    if: (github.event_name == 'pull_request' || github.event_name == 'merge_group') && needs.changes.outputs.ca-codex == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Fail if a published version ships a changed payload
        env:
          # See the ca guard above: `github.base_ref` is empty under merge_group.
          BASE: ${{ github.base_ref || github.event.merge_group.base_ref }}
        run: |
          BASE="${BASE#refs/heads/}"
          git fetch -q origin "$BASE" --tags
          # See the ca guard above. This lane additionally GAINS the #435 payload
          # scope, which it never had: it used to diff `plugins/ca-codex`
          # wholesale. That is behaviour-neutral today because ca-codex has no
          # tools/ directory and ships no committed .js, and it means the tree
          # is already correct the day it grows one.
          python3 .github/scripts/payload_version_gate.py --plugin plugins/ca-codex --base "origin/$BASE"

  version-bump-pi:
    name: "[GATE ] | [PI  ] | Payload version"
    needs: changes
    if: (github.event_name == 'pull_request' || github.event_name == 'merge_group') && needs.changes.outputs.ca-pi == 'true'
    runs-on: ubuntu-latest
    # Issue #399. Observed 4-7s (a full-history fetch plus one Python check);
    # 10 minutes bounds a wedged `git fetch` with three orders of headroom.
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Fail if a tagged Pi payload changes without synchronized release metadata
        env:
          # Issue #383: both spellings are a base COMMIT, so the guard needs no
          # other change - but the pull_request one is empty in a merge group,
          # and this is the exact gate whose stale-base pass was observed on
          # PR #446 after main advanced underneath it.
          BASE_COMMIT: ${{ github.event.pull_request.base.sha || github.event.merge_group.base_sha }}
        run: python tools/build-host-packages.py --check --release-guard-base "$BASE_COMMIT"

  prose:
    name: "[CHECK] | [CA  ] | Reference graph"
    needs: changes
    if: needs.changes.outputs.ca == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.x"
      - name: Check cross-reference graph (ca)
        run: python3 .github/scripts/check-plugin-refs.py ca

  badge-consistency:
    name: "[CHECK] | [CA  ] | Documentation consistency"
    # The mechanical backstop the 2.5.0 release proved was missing: the README
    # version badge, the command/skill/agent count badges, their prose echoes,
    # and the full-catalog table must all match the repo. A release that bumps
    # the payload but forgets the README (the original bug) fails here.
    needs: changes
    if: needs.changes.outputs.ca == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.x"
      - name: Check README badge/count/catalog consistency (ca)
        run: python3 .github/scripts/check_badge_consistency.py

  prose-sandbox:
    name: "[CHECK] | [SBX ] | Reference graph"
    needs: changes
    if: needs.changes.outputs.ca-sandbox == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.x"
      - name: Check cross-reference graph (ca-sandbox)
        run: python3 .github/scripts/check-plugin-refs.py ca-sandbox

  manifests:
    name: "[CHECK] | [REPO] | Manifest contract"
    # Shared infra - a broken plugin.json / marketplace.json / hooks.json breaks
    # install for every user regardless of which plugin it belongs to, so this
    # is repo-wide and not gated per-plugin.
    needs: changes
    if: needs.changes.outputs.manifests == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.x"
      - name: Validate every tracked JSON parses
        run: |
          fail=0
          while IFS= read -r f; do
            [ -L "$f" ] && continue   # skip symlinks - a tracked .json must be a real file
            if ! err=$(node -e "JSON.parse(require('fs').readFileSync(process.argv[1],'utf8'))" "$f" 2>&1); then
              echo "::error file=$f::invalid JSON: $err"
              fail=1
            fi
          done < <(git ls-files '*.json')
          if [ "$fail" -eq 0 ]; then echo "all tracked JSON valid"; fi
          exit $fail
      - name: Validate ca-codex package against pinned schema
        run: |
          codex --version 2>/dev/null || echo "codex CLI not installed; schema baseline is recorded by the validator"
          python3 .github/scripts/validate_codex_plugin.py
      - name: Test the pinned ca-codex package validator
        run: python3 .github/scripts/test_validate_codex_plugin.py

  license-consistency:
    name: "[CHECK] | [REPO] | License consistency"
    # Shared infra - the project's own license declarations (both plugin
    # manifests, the LICENSE file, and the README badge + notice) must all agree
    # with the canonical SPDX, so a partial relicense can't ship (the v2.6.0
    # relicense left three surfaces stale, caught only by human review). Repo-wide
    # and always-on: a license edit can ride any PR. See
    # specs/license-consistency-check.md.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.x"
      - name: Check license declarations agree across surfaces
        run: python3 .github/scripts/check_license_consistency.py .

  surface:
    name: "[CHECK] | [CORE] | Generated surface"
    # Shared infra - the whole markdown surface (commands/skills/includes/
    # COMMANDS.md/SPRINT.md/ORCHESTRATOR.md of BOTH plugins) is generated from
    # core/surface/ templates by tools/build-surface.py (ADR-0011 M3). This
    # re-renders every template in memory and byte-compares against the
    # checked-in trees, failing on drift in EITHER direction (template edited
    # without regenerating, or a rendered file hand-edited) and on orphans.
    # It is the strict successor of the retired orchestrator-parity job
    # (issue #262): the two ORCHESTRATOR.md files now deliberately diverge
    # per host, and their shared source of truth is the template. Repo-wide
    # and always-on, like license-consistency: a template or surface edit can
    # ride any PR, and tools/** is not in the path filters.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.x"
      - name: Check rendered surfaces match core/surface/ templates (both hosts)
        run: python3 tools/build-surface.py --check

  codex-host:
    name: "[CHECK] | [CDX ] | Real-host install"
    # Issue #408. Every other ca-codex gate invokes Python directly and proves
    # what the GUARD answers; none of them proves the HOST calls it, or even
    # that the host can load the plugin at all. The live-parity runbook says so
    # explicitly, and the shipped manifest still advertises Codex >= 0.143.0 on
    # the strength of one manual check.
    #
    # This lane installs the CHECKED-OUT plugin through a real Codex runtime and
    # reads it back. Deliberately credential-free, which a 2026-07-26 spike
    # measured: `plugin marketplace add <local path>` + `plugin add` + `plugin
    # list` need no provider key and no network, so this can be REQUIRED and
    # still run on fork PRs.
    #
    # What it does NOT cover is stated rather than implied: proving a hook FIRES
    # needs a turn, a turn needs a model, and a provider credential cannot be a
    # required check on forks. That half is tracked separately.
    needs: changes
    if: needs.changes.outputs.ca-codex == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.x"
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"
      - name: Install the pinned Codex runtime
        # Pinned, not @latest: an unpinned host makes this gate report upstream
        # drift as a ca-codex regression, and the version claim in the manifest
        # has to mean something continuously tested.
        run: npm install -g @openai/codex@0.145.0
      - name: Install ca-codex through the real host and read it back
        env:
          # A missing runtime must FAIL here rather than skip. On a developer
          # machine the same script skips with a notice; on the merge gate,
          # "the host check did not run" must never look like "it passed"
          # (the docker-gate discipline from #406).
          CA_REQUIRE_CODEX: "1"
        run: python3 .github/scripts/check_codex_host.py

  prose-codex:
    name: "[CHECK] | [CDX ] | Reference graph"
    needs: changes
    if: needs.changes.outputs.ca-codex == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.x"
      - name: Check cross-reference graph (ca-codex)
        run: python3 .github/scripts/check-plugin-refs.py ca-codex

  secret-scan:
    name: "[CHECK] | [REPO] | Secret scan"
    # Issue #404: until this job existed the repository had NO independent
    # secret scanner. Both existing layers are COOPERATIVE - the H-10b commit
    # hook and /ca:preview's sweep only run inside a contributor's local
    # Claude/Codex/Pi session. A bot, a fork, a github.com web edit, or a plain
    # `git push` runs neither, so a real credential could merge and stay in
    # history with every hosted check green.
    #
    # Repo-wide and always-on, like license-consistency and surface: a
    # credential can ride any diff, so there is deliberately no `needs: changes`
    # path gate here. On push the workflow's own path filter still applies -
    # main's branch protection requires this check on the pull request, which is
    # the enforcement point.
    #
    # PINNED: the scanner is an image digest, not a tag. A tag can be re-pointed
    # by anyone who compromises the upstream registry account, and a scanner
    # runs over the entire repository - it is exactly the thing that must not be
    # swappable. Bump the digest deliberately, the way the SHA-pinned actions
    # above are bumped.
    #
    # READ-ONLY: the tree is mounted `:ro` into a network-isolated, capability-
    # stripped, read-only-rootfs container running as a non-root uid. The
    # scanner cannot rewrite what it audits and cannot phone home with what it
    # finds.
    #
    # ACTIONABLE WITHOUT LEAKING: `--redact` replaces every secret with
    # REDACTED, and `--verbose` is what actually prints the finding. With
    # `--redact` alone the log contains only `leaks found: N` - no file, no
    # line, no rule id - which is unactionable and would force a maintainer to
    # re-run the scanner unredacted to triage it. Measured against the pinned
    # image: the pair prints `File:`/`Line:`/`RuleID:`/`Fingerprint:` (plus
    # `Commit:` in git mode) alongside `Secret: REDACTED`.
    #
    # TWO SCANS, TWO BLIND SPOTS: the tree scan sees the merge result, so it
    # catches anything that would LAND on main. It cannot see a credential added
    # in one PR commit and deleted in the next - measured on a scratch repo,
    # that tree scan reports `no leaks found` (exit 0) while the history still
    # carries the key and the range scan reports it with its commit sha
    # (exit 1). This repo allows merge and rebase merges as well as squash, so
    # those commits reach main verbatim; #404 AC-1 asks for the commit RANGE and
    # the second scan step below is what covers it.
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    env:
      # gitleaks v8.30.1
      GITLEAKS_IMAGE: ghcr.io/gitleaks/gitleaks@sha256:c00b6bd0aeb3071cbcb79009cb16a60dd9e0a7c60e2be9ab65d25e6bc8abbb7f
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # The range scan below walks the PR's own commits; a shallow checkout
          # leaves nothing to walk.
          fetch-depth: 0
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.x"
      - name: Prove the allowlist is still narrow before trusting it
        # This scan is only as strong as .gitleaks.toml, and a waiver that
        # un-scans a file or matches a substring makes a green result
        # meaningless. That contract lives in test_ci_impact.py, which runs in
        # the path-scoped `ci-impact` job - and a PR touching only the allowlist
        # used to skip it entirely. The path filter is now fixed, but a filter
        # is a promise that has already been broken twice here (#384, and this).
        # Running the contract HERE - in a job with no `needs: changes` gate -
        # makes it unskippable: every PR that reaches CI re-proves the allowlist
        # whatever the filters say.
        working-directory: .github/scripts
        run: |
          python -m unittest -v \
            test_ci_impact.WorkflowContractTest.test_the_secret_scan_allowlist_stays_narrow_and_value_scoped \
            test_ci_impact.WorkflowContractTest.test_a_broad_secret_scan_waiver_is_rejected_by_the_narrowness_contract
      - name: Materialize the tracked tree
        # Scan exactly the committed content: no .git internals, no runner-
        # generated files, no node_modules. On a pull_request HEAD is the merge
        # result, which is the tree that would land on main.
        run: |
          mkdir -p "$RUNNER_TEMP/secret-scan"
          git archive --format=tar HEAD | tar -x -C "$RUNNER_TEMP/secret-scan"
      - name: Scan the tracked tree for credentials
        run: |
          docker run --rm \
            --network none \
            --read-only \
            --cap-drop ALL \
            --security-opt no-new-privileges \
            --user "$(id -u):$(id -g)" \
            --workdir /repo \
            --volume "$RUNNER_TEMP/secret-scan:/repo:ro" \
            "$GITLEAKS_IMAGE" \
            dir . \
              --config /repo/.gitleaks.toml \
              --no-banner \
              --redact \
              --verbose \
              --exit-code 1
      - name: Scan the pull request's commit range for credentials
        # Issue #404 AC-1. Only meaningful on a pull_request - the only event
        # with a base to diff against, and the enforcement point main's branch
        # protection actually requires. On push the tree scan carries the job.
        #
        # The repository is mounted read-only WITH its .git, so gitleaks runs
        # `git log -p` over the range and never writes. `safe.directory` is
        # passed through GIT_CONFIG_* rather than written to a config file
        # (nothing here is writable), pre-empting git's dubious-ownership
        # refusal; /tmp is a small noexec tmpfs so git has scratch space without
        # the rootfs becoming writable. Verified locally under this exact flag
        # set, including --user, against a repo whose HEAD had already deleted
        # the planted credential.
        #
        # Issue #383: a merge group has a base too - `merge_group.base_sha` is
        # the tip of main the group was built on - so the range scan runs there
        # as well. Only `push` is left out, where the commits have already
        # landed and the tree scan carries the job.
        if: github.event_name == 'pull_request' || github.event_name == 'merge_group'
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.merge_group.base_sha }}
        run: |
          base="$(git merge-base "$BASE_SHA" HEAD)"
          echo "scanning commit range ${base}..HEAD"
          docker run --rm \
            --network none \
            --read-only \
            --tmpfs /tmp:rw,noexec,nosuid,size=64m \
            --cap-drop ALL \
            --security-opt no-new-privileges \
            --user "$(id -u):$(id -g)" \
            --env HOME=/tmp \
            --env GIT_CONFIG_COUNT=1 \
            --env GIT_CONFIG_KEY_0=safe.directory \
            --env GIT_CONFIG_VALUE_0=/repo \
            --workdir /repo \
            --volume "$GITHUB_WORKSPACE:/repo:ro" \
            "$GITLEAKS_IMAGE" \
            git . \
              --config /repo/.gitleaks.toml \
              --log-opts "${base}..HEAD" \
              --no-banner \
              --redact \
              --verbose \
              --exit-code 1

  documentation-contract:
    name: "[CHECK] | [REPO] | Documentation contract"
    # Repository documentation is a cross-cutting public interface: validate
    # its links, current facts, and generated surface on every pull request.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.x"
      - name: Check repository documentation contract
        run: python3 .github/scripts/check_docs_contract.py

  tag-immutability:
    name: "[CHECK] | [REPO] | Published tag immutability"
    # Issue #386 AC-3. This repo publishes four installable tag series and the
    # README tells Pi consumers to PIN `ca-pi-v<version>`. A git tag is a
    # mutable ref: anything with contents:write can retarget one, and a moved
    # tag makes a pinned install fetch code that the review behind that version
    # never covered. Repo-wide and always-on, like license-consistency and
    # surface - the regression this detects has no diff to path-scope against,
    # because it happens in refs, not in files.
    #
    # UNLIKE the branch-protection audit beside it, this one runs LIVE in
    # ordinary CI: listing `/git/refs/tags` needs only contents:read, which the
    # default GITHUB_TOKEN grants. It still skips loudly rather than failing on
    # a transport failure or rate limit, because a merge gate must report a
    # history regression, never a network problem. Read-only: paginated GETs,
    # no mutations, and a partial listing is discarded rather than audited.
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.x"
      - name: Verify every published tag still resolves to its published commit
        env:
          GH_TOKEN: ${{ github.token }}
        run: python .github/scripts/check_tag_immutability.py --repo "$GITHUB_REPOSITORY"
      - name: Test the audit's own logic
        # The audit can skip; its unit tests cannot. They are offline and
        # tokenless, and they pin the drift and deletion verdicts against a
        # recorded copy of the live tag provenance.
        run: python .github/scripts/test_tag_immutability.py

  branch-protection:
    name: "[CHECK] | [REPO] | Branch protection"
    # Issue #383 AC-3. Everything else in this workflow guards the CODE; this
    # guards the setting that makes the workflow binding. Merge-readiness
    # enforcement lives in repository settings, so it can be switched off with
    # no diff, no review, and no red check anywhere - which is exactly how the
    # `strict: false` this issue reports went unnoticed. Repo-wide and
    # always-on, like license-consistency and surface: there is no diff to
    # path-scope against, because the regression this detects has no diff.
    #
    # IT SKIPS WITHOUT A TOKEN, BY DESIGN AND OUT LOUD. Reading a branch's
    # protection document requires Administration:read, and GITHUB_TOKEN has no
    # permission key that grants it - so in ordinary CI this cannot see the
    # document and says so rather than failing. A merge gate must never depend
    # on a permission that cannot be granted. Set the optional
    # BRANCH_PROTECTION_AUDIT_TOKEN repository secret to an admin-scoped token
    # to turn the audit live; the script's skip note explains the same thing to
    # whoever reads the log. Read-only either way: two queries, no mutations.
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.x"
      - name: Audit main's merge-readiness enforcement (read-only; skips without admin rights)
        env:
          GH_TOKEN: ${{ secrets.BRANCH_PROTECTION_AUDIT_TOKEN }}
        run: python .github/scripts/check_branch_protection.py --repo "$GITHUB_REPOSITORY" --branch main
      - name: Test the audit's own logic
        # The audit itself skips when it cannot see the setting, so its unit
        # tests are what stay unconditional - they are offline, tokenless, and
        # pin both the pass and the fail verdict against a recorded copy of the
        # live protection document.
        run: python .github/scripts/test_branch_protection.py

  ci-passed:
    name: "[GATE ] | [REPO] | Merge readiness"
    # REGISTRATION CONTRACT (issue #390): this gate enforces a job through TWO
    # independent registrations - the `needs:` list below (which makes the gate
    # WAIT for it) and the `required_results` string in the step (which makes
    # the gate CARE about its verdict). Adding a job to one and not the other
    # silently drops coverage with nothing else in CI to catch it. The only
    # sanctioned divergence is ca-pi-latest, the advisory WATCH canary
    # (issue #381), which is awaited so the run settles but never enforced.
    # test_ci_impact.py asserts exactly that: needs - required == {ca-pi-latest}.
    if: always()
    needs:
      - documentation-contract
      - branch-protection
      - tag-immutability
      - changes
      - host-descriptors
      - ci-impact
      - tools
      - ca-sandbox-tools
      - ca-pi-checks
      - ca-pi-tools
      - ca-pi-latest
      - coverage-union
      - coverage-union-merge
      - coverage-union-pi
      - coverage-union-pi-merge
      - ca-pi-codeql
      - hooks
      - version-bump
      - version-bump-sandbox
      - version-bump-codex
      - codex-host
      - version-bump-pi
      - prose
      - badge-consistency
      - prose-sandbox
      - manifests
      - license-consistency
      - surface
      - prose-codex
      - secret-scan
    runs-on: ubuntu-latest
    steps:
      - name: Require every required job to have succeeded or been skipped
        run: |
          required_results="${{ needs['documentation-contract'].result }} ${{ needs['branch-protection'].result }} ${{ needs['tag-immutability'].result }} ${{ needs.changes.result }} ${{ needs['host-descriptors'].result }} ${{ needs['ci-impact'].result }} ${{ needs.tools.result }} ${{ needs['ca-sandbox-tools'].result }} ${{ needs['ca-pi-checks'].result }} ${{ needs['ca-pi-tools'].result }} ${{ needs['ca-pi-codeql'].result }} ${{ needs.hooks.result }} ${{ needs['version-bump'].result }} ${{ needs['version-bump-sandbox'].result }} ${{ needs['version-bump-codex'].result }} ${{ needs['codex-host'].result }} ${{ needs['version-bump-pi'].result }} ${{ needs.prose.result }} ${{ needs['badge-consistency'].result }} ${{ needs['prose-sandbox'].result }} ${{ needs.manifests.result }} ${{ needs['license-consistency'].result }} ${{ needs.surface.result }} ${{ needs['prose-codex'].result }} ${{ needs['secret-scan'].result }}"
          canary_result="${{ needs.ca-pi-latest.result }}"
          echo "upstream required results: $required_results"
          echo "advisory Pi canary result: $canary_result"
          for r in $required_results; do
            case "$r" in
              success|skipped) ;;
              *) echo "::error::a required CI job concluded '$r'"; exit 1 ;;
            esac
          done
          echo "all required CI jobs passed or were skipped"
