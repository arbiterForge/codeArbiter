name: Mobile repair inputs
on:
  push:
    branches: [docs/guide-discovery-and-review-journey]
    paths: [.github/workflows/mobile-repair-inputs.yml]
permissions:
  contents: read
jobs:
  capture:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Capture existing source without executing product code
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/mobile-repair"
          git bundle create "$RUNNER_TEMP/mobile-repair/source.bundle" HEAD ^d504cb12a868d4f608f5357f2be77b3a5b264053
          git rev-parse HEAD HEAD^{tree} > "$RUNNER_TEMP/mobile-repair/identity.txt"
          cd "$RUNNER_TEMP/mobile-repair"
          sha256sum source.bundle identity.txt > SHA256SUMS
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: mobile-repair-inputs
          path: ${{ runner.temp }}/mobile-repair/
          retention-days: 1
          if-no-files-found: error
