name: PR854 repair validation (temporary)
on:
  push:
    branches: [codex/farm-readiness-canary-isolation]
    paths: [.github/workflows/pr854-repair-preparation.yml]
permissions:
  contents: read
jobs:
  validate:
    if: github.repository == 'arbiterForge/codeArbiter' && github.ref == 'refs/heads/codex/farm-readiness-canary-isolation'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805da76410c181273ba90b1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          fetch-tags: true
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.14'
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: '22.19.0'
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e
        with:
          go-version: '1.27.1'
          check-latest: false
          cache: false
          go-download-base-url: https://go.dev/dl
      - name: Acquire reviewed source patch as integrity-checked inert data
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          python - <<'PY'
          import base64,hashlib,json,lzma,os,pathlib,urllib.request
          assert os.environ['GITHUB_REPOSITORY']=='arbiterForge/codeArbiter'
          assert os.environ['GITHUB_REF']=='refs/heads/codex/farm-readiness-canary-isolation'
          out=pathlib.Path(os.environ['RUNNER_TEMP'])/'pr854-repair'
          out.mkdir()
          class NoRedirect(urllib.request.HTTPRedirectHandler):
              def redirect_request(self,*args,**kwargs): raise RuntimeError('Unexpected redirect')
          pieces=[]
          for sha in ['7009f684234b891b320cc23754ad37a877ba5ab7','b1c91f91dee59a8595edb3290218e31691de14f8','db090fc88ff20211139a2727c5f87606a9c81d27']:
              req=urllib.request.Request('https://api.github.com/repos/arbiterForge/codeArbiter/git/blobs/'+sha,headers={'Authorization':'Bearer '+os.environ['GH_TOKEN'],'Accept':'application/vnd.github+json'})
              with urllib.request.build_opener(NoRedirect).open(req,timeout=45) as response: item=json.load(response)
              assert item['sha']==sha and item['encoding']=='base64'
              data=base64.b64decode(item['content'])
              assert hashlib.sha1(b'blob '+str(len(data)).encode()+b'\0'+data).hexdigest()==sha
              pieces.append(data)
          data=lzma.decompress(b''.join(pieces))
          assert len(data)==62831
          assert hashlib.sha256(data).hexdigest()=='c35fa61082a54f832023b23503d39278e4c46b341d2001615770077851efa479'
          payload=json.loads(data)
          for row in payload['expected_against_main']:
              p=pathlib.PurePosixPath(row['path'])
              assert not p.is_absolute() and '..' not in p.parts and str(p)==row['path']
              assert row['status']=='M' and row['mode'] in {'100644','100755'} and len(row['sha'])==40
          (out/'payload.json').write_bytes(data)
          (out/'reviewed.patch').write_text(payload['source_patch'])
          PY
      - name: Preserve upstream and apply the exact candidate
        shell: bash
        run: |
          python - <<'PY'
          import hashlib,json,os,pathlib,subprocess,sys
          root=pathlib.Path.cwd();out=pathlib.Path(os.environ['RUNNER_TEMP'])/'pr854-repair'
          p=json.loads((out/'payload.json').read_text());head=os.environ['GITHUB_SHA']
          temporary='.github/workflows/pr854-repair-preparation.yml'
          def git(*args,check=True):
              r=subprocess.run(['git',*args],capture_output=True,text=True,check=check)
              return r.stdout
          assert git('rev-parse','HEAD').strip()==head
          assert git('diff','--name-only',p['pr_head'],head).splitlines()==[temporary]
          git('merge-base','--is-ancestor',p['pr_head'],head)
          git('cat-file','-e',p['main']+'^{commit}')
          git('config','user.name','Validation fixture');git('config','user.email','validation@example.invalid')
          merge=subprocess.run(['git','merge','--no-commit','--no-ff',p['main']],capture_output=True,text=True)
          (out/'merge.log').write_text(merge.stdout+merge.stderr)
          conflicts=git('diff','--name-only','--diff-filter=U').splitlines()
          assert merge.returncode in {0,1}
          if conflicts:
              assert conflicts==['.github/published-tags.json'],conflicts
              ours=json.loads(git('show',':2:.github/published-tags.json'))
              theirs=json.loads(git('show',':3:.github/published-tags.json'))
              assert ours==theirs,'Publication conflict has semantic changes; do not overwrite'
              git('checkout','--theirs','--','.github/published-tags.json')
              git('add','--','.github/published-tags.json')
          assert not git('diff','--name-only','--diff-filter=U').strip()
          git('apply','--check','--index',str(out/'reviewed.patch'))
          git('apply','--index',str(out/'reviewed.patch'))
          tools=root/'plugins/ca/tools'
          subprocess.run(['npm','ci','--ignore-scripts','--no-fund'],cwd=tools,check=True)
          subprocess.run(['npm','audit','--audit-level=high'],cwd=tools,check=True)
          subprocess.run(['npm','run','typecheck'],cwd=tools,check=True)
          subprocess.run(['npm','run','build'],cwd=tools,check=True)
          for name in ['tools/build-surface.py','tools/sync-core.py','tools/build-host-packages.py']:
              subprocess.run([sys.executable,name],check=True)
          for row in p['slice_files']:
              data=(root/row['path']).read_bytes()
              assert hashlib.sha1(b'blob '+str(len(data)).encode()+b'\0'+data).hexdigest()==row['sha'],row['path']
          git('add','--',*[r['path'] for r in p['slice_files']])
          git('rm','--',temporary)
          git('diff','--cached','--check')
          tree=git('write-tree').strip()
          assert tree==p['target_tree'],(tree,p['target_tree'])
          message='fix: qualify retained farm candidates and preserve complete CI proof\n\nMerge current main without changing identical publication identities.\nKeep generated alternatives through task-worktree qualification before\nretrying; preserve scope, integrity, cleanup and mutation warning policy.\nRetain all native CI checks within a bounded 30-minute job budget.\n\nCHANGELOG: Retained-candidate farm qualification and native CI completion.\n'
          env=dict(os.environ,GIT_AUTHOR_NAME='Validation fixture',GIT_AUTHOR_EMAIL='validation@example.invalid',GIT_COMMITTER_NAME='Validation fixture',GIT_COMMITTER_EMAIL='validation@example.invalid')
          commit=subprocess.check_output(['git','commit-tree',tree,'-p',head,'-p',p['main']],input=message,text=True,env=env).strip()
          git('checkout','--detach',commit)
          assert not git('status','--porcelain','--untracked-files=no').strip()
          (out/'prepared.json').write_text(json.dumps({'parent':head,'other_parent':p['main'],'tree':tree,'validation_commit':commit,'message':message},indent=2))
          PY
      - name: Execute current farm and CI contracts without skipped proof
        shell: bash
        run: |
          python - <<'PY'
          import hashlib,json,os,pathlib,subprocess,sys,time,zipfile
          root=pathlib.Path.cwd();tools=root/'plugins/ca/tools'
          out=pathlib.Path(os.environ['RUNNER_TEMP'])/'pr854-repair'
          p=json.loads((out/'payload.json').read_text())
          jobs=[(['npm','run','coverage'],tools)]
          suites=['test_ci_impact','test_hook_ci_partition','test_host_descriptors','test_routing_and_cleanup_surface','test_build_surface','test_artifact_surface','test_artifact_farm','test_public_codex_docs','test_provenance_wiring','test_payload_version_gate','test_reconcile_tag_receipt','test_auto_release_candidate']
          jobs += [([sys.executable,'.github/scripts/'+name+'.py'],root) for name in suites]
          jobs += [([sys.executable,name,'--check'],root) for name in ['tools/build-surface.py','tools/sync-core.py','tools/build-host-packages.py']]
          jobs += [([sys.executable,'.github/scripts/'+name+'.py'],root) for name in ['check_destructive_registry','check_routing_index_parity','check_docs_contract']]
          jobs += [([sys.executable,'.github/scripts/check-plugin-refs.py',host],root) for host in ['ca','ca-codex','ca-pi']]
          jobs += [([sys.executable,'.github/scripts/payload_version_gate.py','--plugin',host,'--base',p['main']],root) for host in ['plugins/ca','plugins/ca-codex']]
          jobs += [([sys.executable,'tools/build-host-packages.py','--release-guard-base',p['main']],root),
                   ([sys.executable,'.github/scripts/check_auto_release_candidate.py','--candidate','HEAD','--run-pre-tag'],root)]
          env=dict(os.environ,PYTHONDONTWRITEBYTECODE='1')
          results=[]
          for i,(args,cwd) in enumerate(jobs):
              label='farm-coverage' if args[0]=='npm' else pathlib.Path(args[1]).stem
              log=f'{i:02d}-'+label+'.log';start=time.monotonic()
              try:
                  r=subprocess.run(args,cwd=cwd,capture_output=True,text=True,timeout=480,env=env)
                  code=r.returncode;content=r.stdout+r.stderr
              except subprocess.TimeoutExpired as error:
                  code=124;content='Timed out; not a passing result.\n'
                  for stream in [error.stdout,error.stderr]:
                      if stream: content+=stream.decode(errors='replace') if isinstance(stream,bytes) else stream
              (out/log).write_text(content)
              results.append({'command':args,'cwd':str(cwd.relative_to(root)),'exit_code':code,'seconds':round(time.monotonic()-start,3),'log':log})
              (out/'tests.json').write_text(json.dumps(results,indent=2))
              print(code,' '.join(args),flush=True)
          def git(*args):return subprocess.check_output(['git',*args],text=True)
          assert not git('status','--porcelain','--untracked-files=no').strip()
          assert git('rev-parse','HEAD^{tree}').strip()==p['target_tree']
          assert set(git('diff','--name-only',p['main'],'HEAD').splitlines())=={r['path'] for r in p['expected_against_main']}
          with zipfile.ZipFile(out/'candidate-files.zip','w',zipfile.ZIP_DEFLATED) as archive:
              for row in p['expected_against_main']:
                  data=(root/row['path']).read_bytes()
                  assert hashlib.sha1(b'blob '+str(len(data)).encode()+b'\0'+data).hexdigest()==row['sha'],row['path']
                  assert git('ls-tree','HEAD','--',row['path']).split()[0]==row['mode']
                  archive.write(root/row['path'],row['path'])
          (out/'candidate.diff').write_bytes(subprocess.check_output(['git','diff','--binary','--full-index',p['main'],'HEAD']))
          report=json.loads((out/'prepared.json').read_text())
          report.update(files=p['expected_against_main'],all_commands_passed=all(r['exit_code']==0 for r in results),commands=len(results))
          (out/'manifest.json').write_text(json.dumps(report,indent=2))
          assert report['all_commands_passed'],'Inspect recorded failures; no candidate object publication'
          PY
      - name: Store tested two-parent candidate without advancing a ref
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python - <<'PY'
          import hashlib,json,os,pathlib,urllib.request
          out=pathlib.Path(os.environ['RUNNER_TEMP'])/'pr854-repair'
          report=json.loads((out/'manifest.json').read_text())
          assert report['all_commands_passed'] and report['parent']==os.environ['GITHUB_SHA']
          assert os.environ['GITHUB_REPOSITORY']=='arbiterForge/codeArbiter'
          assert os.environ['GITHUB_REF']=='refs/heads/codex/farm-readiness-canary-isolation'
          class NoRedirect(urllib.request.HTTPRedirectHandler):
              def redirect_request(self,*args,**kwargs):raise RuntimeError('Unexpected redirect')
          def api(method,path,payload=None):
              req=urllib.request.Request('https://api.github.com/repos/arbiterForge/codeArbiter'+path,method=method,data=json.dumps(payload).encode() if payload is not None else None,headers={'Authorization':'Bearer '+os.environ['GH_TOKEN'],'Accept':'application/vnd.github+json','Content-Type':'application/json'})
              with urllib.request.build_opener(NoRedirect).open(req,timeout=45) as response:return json.load(response)
          assert api('GET','/git/ref/heads/codex/farm-readiness-canary-isolation')['object']['sha']==report['parent']
          entries=[]
          for row in report['files']:
              data=pathlib.Path(row['path']).read_bytes()
              assert hashlib.sha1(b'blob '+str(len(data)).encode()+b'\0'+data).hexdigest()==row['sha']
              blob=api('POST','/git/blobs',{'content':data.decode(),'encoding':'utf-8'})['sha']
              assert blob==row['sha']
              entries.append({'path':row['path'],'mode':row['mode'],'type':'blob','sha':blob})
          base=api('GET','/git/commits/'+report['other_parent'])['tree']['sha']
          tree=api('POST','/git/trees',{'base_tree':base,'tree':entries})['sha']
          assert tree==report['tree']
          parents=[report['parent'],report['other_parent']]
          commit=api('POST','/git/commits',{'message':report['message'],'tree':tree,'parents':parents})['sha']
          (out/'candidate.json').write_text(json.dumps({'commit':commit,'tree':tree,'parents':parents,'branch_updated':False},indent=2))
          PY
      - name: Retain exact outcomes and candidate bytes
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: pr854-repair-validation-${{ github.run_id }}
          path: ${{ runner.temp }}/pr854-repair/
          if-no-files-found: error
          retention-days: 3
