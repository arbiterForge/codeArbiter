name: PR850 command consolidation validation (temporary)
on:
  push:
    branches: [codex/spec-continuation-checkpoint-remediation]
    paths: [.github/workflows/pr850-command-consolidation.yml]
permissions:
  contents: read
jobs:
  validate:
    if: github.repository == 'arbiterForge/codeArbiter' && github.ref == 'refs/heads/codex/spec-continuation-checkpoint-remediation'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          fetch-tags: true
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.14'
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e
        with:
          go-version: '1.27.1'
          check-latest: false
          cache: false
          go-download-base-url: https://go.dev/dl
      - name: Acquire reviewed changes as integrity-checked inert data
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python - <<'PY'
          import base64,hashlib,json,lzma,os,pathlib,urllib.request
          assert os.environ['GITHUB_REPOSITORY']=='arbiterForge/codeArbiter'
          assert os.environ['GITHUB_REF']=='refs/heads/codex/spec-continuation-checkpoint-remediation'
          out=pathlib.Path(os.environ['RUNNER_TEMP'])/'command-consolidation'
          out.mkdir()
          class NoRedirect(urllib.request.HTTPRedirectHandler):
              def redirect_request(self,*args,**kwargs): raise RuntimeError('Unexpected redirect')
          def blob(sha):
              req=urllib.request.Request('https://api.github.com/repos/arbiterForge/codeArbiter/git/blobs/'+sha,headers={'Authorization':'Bearer '+os.environ['GH_TOKEN'],'Accept':'application/vnd.github+json'})
              with urllib.request.build_opener(NoRedirect).open(req,timeout=45) as response: record=json.load(response)
              assert record['sha']==sha and record['encoding']=='base64'
              data=base64.b64decode(record['content'])
              assert hashlib.sha1(b'blob '+str(len(data)).encode()+b'\0'+data).hexdigest()==sha
              return data
          data=lzma.decompress(blob('feccbe3eb7d12eb8c7494c1be0c8e2f98dce1d18'))
          assert len(data)==48946 and hashlib.sha256(data).hexdigest()=='7d0c6f2fcae12a4cb117cd5ed08b74e36af43858e55db4215f215264137259a2'
          primary=json.loads(data)
          extra=blob('54928e0cead2581a857b908fe41bd0d9b62767a3')
          assert hashlib.sha256(extra).hexdigest()=='59cfb1003cbaa725a5ace36255fe550958d12d011039cf6aa98dbcdb5ee14261'
          extra=json.loads(extra)
          manifest=primary['manifest'];manifest['files']+=extra['files']
          assert len(manifest['files'])==37 and len({r['path'] for r in manifest['files']})==37
          for row in manifest['files']:
              path=pathlib.PurePosixPath(row['path'])
              assert not path.is_absolute() and '..' not in path.parts and str(path)==row['path']
              assert row['mode']=='100644' and len(row['sha'])==40
          (out/'manifest-input.json').write_text(json.dumps(manifest,indent=2))
          (out/'source.patch').write_text(primary['source_patch'])
          (out/'notes.patch').write_text(extra['source_patch'])
          PY
      - name: Generate and test the exact preserving candidate
        shell: bash
        run: |
          python - <<'PY'
          import hashlib,importlib.util,json,os,pathlib,shlex,subprocess,sys,time,zipfile
          root=pathlib.Path.cwd();out=pathlib.Path(os.environ['RUNNER_TEMP'])/'command-consolidation'
          manifest=json.loads((out/'manifest-input.json').read_text())
          base=manifest['parent'];head=os.environ['GITHUB_SHA'];temporary='.github/workflows/pr850-command-consolidation.yml'
          assert base=='f361d039d329a8a2932bd9dc14ec42d7b32d4ca3'
          assert subprocess.check_output(['git','rev-parse','HEAD'],text=True).strip()==head
          subprocess.run(['git','merge-base','--is-ancestor',base,head],check=True)
          assert subprocess.check_output(['git','diff','--name-only',base,head],text=True).splitlines()==[temporary]
          assert subprocess.check_output(['go','env','GOVERSION'],text=True).strip()=='go1.27.1'
          for name in ['source.patch','notes.patch']:
              subprocess.run(['git','apply','--check','--index','--unidiff-zero',str(out/name)],check=True)
              subprocess.run(['git','apply','--index','--unidiff-zero',str(out/name)],check=True)
          for tool in ['tools/build-surface.py','tools/sync-core.py','tools/build-host-packages.py']:
              subprocess.run([sys.executable,tool],check=True)
          def oid(path):
              b=(root/path).read_bytes();return hashlib.sha1(b'blob '+str(len(b)).encode()+b'\0'+b).hexdigest()
          expected={r['path']:r for r in manifest['files']}
          for path,row in expected.items():
              assert oid(path)==row['sha'],path
              assert subprocess.check_output(['git','ls-tree',base,'--',path],text=True).split()[0]==row['mode'],path
          assert set(subprocess.check_output(['git','diff','HEAD','--name-only'],text=True).splitlines())==set(expected)
          gate='core/surface/skills/commit-gate/SKILL.md'
          previous=subprocess.check_output(['git','show',base+':'+gate],text=True)
          current=(root/gate).read_text()
          assert previous[previous.index('## Pre-flight'):]==current[current.index('## Pre-flight'):]
          for name in ['core/surface/command-routes.json','core/hosts.json','core/surface/arbiter.md']:
              assert (root/name).read_bytes()==subprocess.check_output(['git','show',base+':'+name])
          subprocess.run(['git','add','--',*sorted(expected)],check=True)
          subprocess.run(['git','rm','--',temporary],check=True)
          subprocess.run(['git','diff','--cached','--check'],check=True)
          tree=subprocess.check_output(['git','write-tree'],text=True).strip()
          message='refactor: generate command entries from their owning skills\n\nConsolidate commit and new-skill without removing explicit names or\nchanging commit gates. Preserve ADR-0028 skill discovery on Claude,\nprivate routine references on Codex/Pi, and host-specific entry metadata.\n\nCHANGELOG: Consolidated command-backed procedure ownership.\n'
          fixture_env=dict(os.environ,GIT_AUTHOR_NAME='Validation fixture',GIT_AUTHOR_EMAIL='validation@example.invalid',GIT_COMMITTER_NAME='Validation fixture',GIT_COMMITTER_EMAIL='validation@example.invalid')
          fixture=subprocess.check_output(['git','commit-tree',tree,'-p',head],input=message,text=True,env=fixture_env).strip()
          subprocess.run(['git','checkout','--detach',fixture],check=True)
          spec=importlib.util.spec_from_file_location('partition',root/'.github/scripts/test_hook_ci_partition.py')
          partition=importlib.util.module_from_spec(spec);spec.loader.exec_module(partition)
          workflow=(root/'.github/workflows/ci.yml').read_text();partition.validate(workflow)
          commands=[]
          for step in partition.step_blocks(partition.job_block(workflow,'hooks')):
              text=partition.command(step)
              if text:
                  for line in text.splitlines():
                      if not line.strip(): continue
                      args=shlex.split(line)
                      assert args[0]=='python' and 'python' not in args[1:],line
                      assert not any(arg in {';','&&','||','|'} for arg in args),line
                      commands.append([sys.executable,*args[1:]])
          inventory_count=len(commands)
          additions=['test_build_surface','test_host_descriptors','test_command_catalog','test_command_route_compatibility','test_artifact_authoring','test_artifact_workflow','test_artifact_consumers','test_artifact_approval_adapter','test_artifact_authority_adapter','test_artifact_reconciliation_adapter','test_artifact_prerequisite_adapter','test_public_codex_docs']
          commands += [[sys.executable,'.github/scripts/'+name+'.py'] for name in additions]
          commands += [[sys.executable,tool,'--check'] for tool in ['tools/build-surface.py','tools/sync-core.py','tools/build-host-packages.py']]
          commands += [[sys.executable,'.github/scripts/'+name+'.py'] for name in ['check_destructive_registry','check_routing_index_parity','check_command_catalog','check_docs_contract','check_skill_portability']]
          commands += [[sys.executable,'.github/scripts/check-plugin-refs.py',host] for host in ['ca','ca-codex','ca-pi']]
          unique=[]
          for args in commands:
              if args not in unique: unique.append(args)
          results=[];env=dict(os.environ,PYTHONDONTWRITEBYTECODE='1')
          for index,args in enumerate(unique):
              label=pathlib.Path(args[1]).stem if args[1]!='-m' else 'direct-hook-suite'
              log=f'{index:02d}-'+label+'.log';start=time.monotonic()
              try:
                  done=subprocess.run(args,capture_output=True,text=True,timeout=420,env=env)
                  code=done.returncode;content=done.stdout+done.stderr
              except subprocess.TimeoutExpired:
                  code=124;content='Timed out; not a passing check.\n'
              (out/log).write_text(content)
              results.append({'command':args,'exit_code':code,'seconds':round(time.monotonic()-start,3),'log':log})
              (out/'tests.json').write_text(json.dumps(results,indent=2))
              print(code,' '.join(args),flush=True)
          for path,row in expected.items(): assert oid(path)==row['sha'],path
          assert not subprocess.check_output(['git','diff','--name-only'],text=True).strip()
          (out/'candidate.diff').write_bytes(subprocess.check_output(['git','diff','--binary','--full-index',base,fixture]))
          with zipfile.ZipFile(out/'candidate-files.zip','w',zipfile.ZIP_DEFLATED) as archive:
              for path in sorted(expected): archive.write(root/path,path)
          report={'base':base,'parent':head,'tree':tree,'local_validation_commit':fixture,'files':manifest['files'],'message':message,'all_tests_passed':all(r['exit_code']==0 for r in results),'hook_inventory_commands':inventory_count,'total_commands':len(results),'commit_gates_unchanged':True,'public_registry_unchanged':True}
          (out/'manifest.json').write_text(json.dumps(report,indent=2))
          assert report['all_tests_passed'],'Validation failed: inspect actual logs; no candidate commit uploaded.'
          PY
      - name: Store tested candidate objects without updating the branch
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python - <<'PY'
          import hashlib,json,os,pathlib,urllib.request
          out=pathlib.Path(os.environ['RUNNER_TEMP'])/'command-consolidation'
          report=json.loads((out/'manifest.json').read_text())
          assert report['all_tests_passed'] and report['parent']==os.environ['GITHUB_SHA']
          assert os.environ['GITHUB_REPOSITORY']=='arbiterForge/codeArbiter'
          assert os.environ['GITHUB_REF']=='refs/heads/codex/spec-continuation-checkpoint-remediation'
          class NoRedirect(urllib.request.HTTPRedirectHandler):
              def redirect_request(self,*args,**kwargs): raise RuntimeError('Unexpected redirect')
          def api(method,path,payload=None):
              req=urllib.request.Request('https://api.github.com/repos/arbiterForge/codeArbiter'+path,method=method,data=json.dumps(payload).encode() if payload is not None else None,headers={'Authorization':'Bearer '+os.environ['GH_TOKEN'],'Accept':'application/vnd.github+json','Content-Type':'application/json'})
              with urllib.request.build_opener(NoRedirect).open(req,timeout=45) as response: return json.load(response)
          assert api('GET','/git/ref/heads/codex/spec-continuation-checkpoint-remediation')['object']['sha']==report['parent']
          entries=[]
          for row in report['files']:
              data=pathlib.Path(row['path']).read_bytes()
              assert hashlib.sha1(b'blob '+str(len(data)).encode()+b'\0'+data).hexdigest()==row['sha']
              blob=api('POST','/git/blobs',{'content':data.decode(),'encoding':'utf-8'})['sha'];assert blob==row['sha']
              entries.append({'path':row['path'],'mode':row['mode'],'type':'blob','sha':blob})
          entries.append({'path':'.github/workflows/pr850-command-consolidation.yml','mode':'100644','type':'blob','sha':None})
          previous=api('GET','/git/commits/'+report['parent'])['tree']['sha']
          tree=api('POST','/git/trees',{'base_tree':previous,'tree':entries})['sha'];assert tree==report['tree']
          commit=api('POST','/git/commits',{'message':report['message'],'tree':tree,'parents':[report['parent']]})['sha']
          (out/'candidate.json').write_text(json.dumps({'commit':commit,'tree':tree,'parent':report['parent'],'branch_updated':False},indent=2))
          PY
      - name: Retain logs and exact candidate identity
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: pr850-command-consolidation-${{ github.run_id }}
          path: ${{ runner.temp }}/command-consolidation/
          if-no-files-found: error
          retention-days: 3
