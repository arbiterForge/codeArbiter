name: PR850 final authority validation (temporary)
on:
  push:
    branches: [codex/spec-continuation-checkpoint-remediation]
    paths: [.github/workflows/pr850-authority-source.yml]
permissions:
  contents: read
jobs:
  validate:
    if: github.repository == 'arbiterForge/codeArbiter' && github.ref == 'refs/heads/codex/spec-continuation-checkpoint-remediation'
    runs-on: ubuntu-latest
    timeout-minutes: 40
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          fetch-tags: true
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.14'
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e
        with:
          go-version: '1.27.1'
          check-latest: false
          cache: false
          go-download-base-url: https://go.dev/dl
      - name: Acquire exact prior candidate and reviewed delta
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python - <<'PY'
          import base64,hashlib,json,lzma,os,pathlib,urllib.error,urllib.parse,urllib.request
          assert os.environ['GITHUB_REPOSITORY']=='arbiterForge/codeArbiter'
          assert os.environ['GITHUB_REF']=='refs/heads/codex/spec-continuation-checkpoint-remediation'
          out=pathlib.Path(os.environ['RUNNER_TEMP'])/'authority-final';out.mkdir()
          class NoRedirect(urllib.request.HTTPRedirectHandler):
              def redirect_request(self,*args,**kwargs):return None
          opener=urllib.request.build_opener(NoRedirect)
          def request(path):
              return urllib.request.Request('https://api.github.com/repos/arbiterForge/codeArbiter'+path,headers={'Authorization':'Bearer '+os.environ['GH_TOKEN'],'Accept':'application/vnd.github+json'})
          def blob(sha):
              with opener.open(request('/git/blobs/'+sha),timeout=45) as response:record=json.load(response)
              assert record['sha']==sha and record['encoding']=='base64'
              data=base64.b64decode(record['content'])
              assert hashlib.sha1(b'blob '+str(len(data)).encode()+b'\0'+data).hexdigest()==sha
              return data
          raw=lzma.decompress(blob('f9b54c910be9bf8beb1c44f2e30e2a83aa16061c'))
          assert len(raw)==45213 and hashlib.sha256(raw).hexdigest()=='0a90df3739484cc99bcceb6dba35b43e37c847c145839c9e2c400e62711251c6'
          delta=json.loads(raw);(out/'delta.json').write_bytes(raw)
          (out/'driver.py').write_bytes(blob('14e4309dcc0aa2e005926904903ca6176ecd96f6'))
          try:
              with opener.open(request('/actions/artifacts/'+str(delta['base_artifact'])+'/zip'),timeout=45) as response:data=response.read(4000001)
          except urllib.error.HTTPError as exc:
              assert exc.code in (301,302,303,307,308)
              url=exc.headers['Location'];parts=urllib.parse.urlsplit(url)
              assert parts.scheme=='https' and not parts.username and not parts.password
              assert parts.hostname and any(parts.hostname.endswith(s) for s in ('.blob.core.windows.net','.actions.githubusercontent.com','.githubusercontent.com'))
              # A signed archive URL must never receive the GitHub credential.
              with opener.open(urllib.request.Request(url),timeout=45) as response:data=response.read(4000001)
          assert len(data)<=4000000 and hashlib.sha256(data).hexdigest()==delta['base_artifact_sha256']
          (out/'base.zip').write_bytes(data)
          PY
      - name: Acquire the existing pinned secret scanner
        shell: bash
        run: |
          set -euo pipefail
          IMAGE=ghcr.io/gitleaks/gitleaks@sha256:c00b6bd0aeb3071cbcb79009cb16a60dd9e0a7c60e2be9ab65d25e6bc8abbb7f
          docker pull "$IMAGE"
          CID=$(docker create "$IMAGE")
          trap 'docker rm "$CID" >/dev/null' EXIT
          docker cp "$CID:/usr/bin/gitleaks" "$RUNNER_TEMP/authority-final/gitleaks"
          chmod 755 "$RUNNER_TEMP/authority-final/gitleaks"
          echo "09d435057df51b800201bc3bbe0820554b1cac3cd98162e9e02b20c8b441b5bd  $RUNNER_TEMP/authority-final/gitleaks" | sha256sum --check -
          test "$("$RUNNER_TEMP/authority-final/gitleaks" version)" = 8.30.1
      - name: Execute complete-checkout tests without write credentials
        run: python "$RUNNER_TEMP/authority-final/driver.py"
      - name: Store tested preserving objects without changing a ref
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python - <<'PY'
          import hashlib,json,os,pathlib,urllib.request
          out=pathlib.Path(os.environ['RUNNER_TEMP'])/'authority-final';report=json.loads((out/'manifest.json').read_text())
          assert report['all_tests_passed'] and report['parent']==os.environ['GITHUB_SHA']
          assert os.environ['GITHUB_REPOSITORY']=='arbiterForge/codeArbiter'
          assert os.environ['GITHUB_REF']=='refs/heads/codex/spec-continuation-checkpoint-remediation'
          class NoRedirect(urllib.request.HTTPRedirectHandler):
              def redirect_request(self,*args,**kwargs):raise RuntimeError('Unexpected redirect')
          def api(method,path,data=None):
              req=urllib.request.Request('https://api.github.com/repos/arbiterForge/codeArbiter'+path,method=method,data=None if data is None else json.dumps(data).encode(),headers={'Authorization':'Bearer '+os.environ['GH_TOKEN'],'Content-Type':'application/json','Accept':'application/vnd.github+json'})
              with urllib.request.build_opener(NoRedirect).open(req,timeout=45) as response:return json.load(response)
          assert api('GET','/git/ref/heads/codex/spec-continuation-checkpoint-remediation')['object']['sha']==report['parent']
          assert api('GET','/git/ref/heads/main')['object']['sha']==report['main']
          entries=[];uploaded=set()
          for row in report['files']:
              data=pathlib.Path(row['path']).read_bytes()
              assert hashlib.sha1(b'blob '+str(len(data)).encode()+b'\0'+data).hexdigest()==row['sha']
              if row['sha'] not in uploaded:
                  assert api('POST','/git/blobs',{'content':data.decode('utf-8'),'encoding':'utf-8'})['sha']==row['sha']
                  uploaded.add(row['sha'])
              entries.append({'path':row['path'],'type':'blob','mode':row['mode'],'sha':row['sha']})
          base=api('GET','/git/commits/'+report['main'])['tree']['sha']
          tree=api('POST','/git/trees',{'base_tree':base,'tree':entries})['sha']
          assert tree==report['tree']
          commit=api('POST','/git/commits',{'message':report['message'],'tree':tree,'parents':[report['parent'],report['main']]})['sha']
          (out/'candidate.json').write_text(json.dumps({'commit':commit,'tree':tree,'parent':report['parent'],'main':report['main'],'branch_updated':False},indent=2))
          PY
      - name: Retain actual evidence without executables or installation caches
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: pr850-authority-final-${{ github.run_id }}
          path: |
            ${{ runner.temp }}/authority-final/*.json
            ${{ runner.temp }}/authority-final/*.log
            ${{ runner.temp }}/authority-final/*.py
            ${{ runner.temp }}/authority-final/*.patch
            ${{ runner.temp }}/authority-final/*.diff
            ${{ runner.temp }}/authority-final/candidate-files.zip
          if-no-files-found: error
          retention-days: 3
