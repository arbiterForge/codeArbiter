name: PR850 authority integration (temporary)
on:
  push:
    branches: [codex/spec-continuation-checkpoint-remediation]
    paths: [.github/workflows/pr850-authority-source.yml]
permissions:
  contents: read
jobs:
  validate:
    if: github.repository == 'arbiterForge/codeArbiter' && github.ref == 'refs/heads/codex/spec-continuation-checkpoint-remediation'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.14'
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e
        with:
          go-version: '1.27.1'
          check-latest: false
          cache: false
          go-download-base-url: https://go.dev/dl
      - name: Acquire explicitly pinned authored inputs
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python - <<'PY'
          import base64,hashlib,json,os,pathlib,urllib.request
          assert os.environ['GITHUB_REPOSITORY']=='arbiterForge/codeArbiter'
          assert os.environ['GITHUB_REF']=='refs/heads/codex/spec-continuation-checkpoint-remediation'
          out=pathlib.Path(os.environ['RUNNER_TEMP'])/'authority-integration';out.mkdir()
          class NoRedirect(urllib.request.HTTPRedirectHandler):
              def redirect_request(self,*args,**kwargs):raise RuntimeError('Unexpected redirect')
          rows=[
            ('55863c2e8408dd41f8978ac613c68139e7e3b6bf','observation-sprint.go'),
            ('d41beb207fbfd8e89ee6677bd1b5532375dd26f2','operations-sprint.go'),
            ('80c0b4448120c585803082b1d1f844e63ee9669e','sprint-tests.go'),
            ('d5b715afba8c7d1714add72980ff2f9c81feb554','pair-adapter.py'),
            ('22ae37c8aaf6d24ecca788b6c03a21164001697d','pair-tests.py'),
            ('16f525a313bf34736073ed2be42954c0cd261a6c','apply.py'),
            ('d40a3f994e70e5774841fec8974a7668157365f4','driver.py'),
            ('a043fa68eb22cc692c08b5da2ed83205142713aa','docs.py'),
          ]
          for sha,name in rows:
              req=urllib.request.Request('https://api.github.com/repos/arbiterForge/codeArbiter/git/blobs/'+sha,headers={'Authorization':'Bearer '+os.environ['GH_TOKEN'],'Accept':'application/vnd.github+json'})
              with urllib.request.build_opener(NoRedirect).open(req,timeout=45) as response: record=json.load(response)
              assert record['sha']==sha and record['encoding']=='base64'
              data=base64.b64decode(record['content'])
              assert hashlib.sha1(b'blob '+str(len(data)).encode()+b'\0'+data).hexdigest()==sha
              (out/name).write_bytes(data)
          (out/'inputs.json').write_text(json.dumps(rows,indent=2))
          p=out/'sprint-tests.go';text=p.read_text()
          old='h.run("recover",object{"operation_id":r["operation_id"],"mode":mode})'
          assert text.count(old)==1
          p.write_text(text.replace(old,'if _,err:=h.request("recover",object{"operation_id":r["operation_id"],"mode":mode});err!=nil{t.Fatal(err)}'))
          PY
      - name: Execute candidate preparation and regression suite without credentials
        run: python "$RUNNER_TEMP/authority-integration/driver.py"
      - name: Retain source transformations and actual test results
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: pr850-authority-integration-${{ github.run_id }}
          path: ${{ runner.temp }}/authority-integration/
          if-no-files-found: error
          retention-days: 3
