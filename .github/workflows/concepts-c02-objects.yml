name: Concepts C02 checked objects
on:
  push:
    branches: [docs/concepts-decisions-evidence]
    paths: [.github/workflows/concepts-c02-objects.yml]
permissions:
  contents: write
jobs:
  objects:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Materialize only fixed reviewed data and preserve the complete base tree
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import base64, gzip, hashlib, json, os, pathlib, subprocess, urllib.request
          repo = 'arbiterForge/codeArbiter'
          base = 'b82117cb7507d8f6f84578d33d239d5292e02f54'
          base_tree = 'e65ef68b25f1f45ba5231c11a8ae5a8ccb67c572'
          expected_tree = '7c56754259049a0196678037a5fb4f36df2f1fe3'
          digest = '5fb128568e6049b7147827bad8c61903f9eff9aaf4358e4c5943348cb2fcbb6a'
          chunks = [
              'c27b58318af7f45072a0676fa81261ea94657316',
              'e9d6285233d60d7b9625ed368318280b38fa520b',
              'd4fbc2706be6a937a215b171258126e6ab2020dc',
              'cfc2f7cd9493571f33e145cd31da5e65c5e48138',
              '66e529ff13c8f5d9c9382e8ff51a9b78f5382b8a',
              '6e0b820d02fdf5553dfaaf0c8e2fe8f5c3256334',
              '3e8f17e2ca0b2014f016af01c2f938a2a06123de',
              '2525044ac292dcd1c771fce9e6080da6f1aad9a6',
              '45f65f4e1c5b497a256dbe8c33eecdd3e4bee8b5',
              '1b27b6c951ad7047819b2aa21437cea9611cf4cf',
          ]
          def api(path, data=None):
              raw = None if data is None else json.dumps(data).encode()
              request = urllib.request.Request('https://api.github.com/repos/' + repo + '/' + path,
                  data=raw, headers={'Authorization': 'Bearer ' + os.environ['GH_TOKEN'],
                  'Accept': 'application/vnd.github+json', 'Content-Type': 'application/json'},
                  method='GET' if data is None else 'POST')
              with urllib.request.urlopen(request, timeout=30) as response:
                  return json.load(response)
          compressed = b''
          for sha in chunks:
              obj = api('git/blobs/' + sha)
              assert obj['encoding'] == 'base64' and obj['sha'] == sha
              part = base64.b64decode(obj['content'])
              assert hashlib.sha1(b'blob ' + str(len(part)).encode() + b'\0' + part).hexdigest() == sha
              compressed += part
          raw = gzip.decompress(compressed)
          assert len(raw) < 250000 and hashlib.sha256(raw).hexdigest() == digest
          delta = json.loads(raw)
          assert delta['base'] == base and delta['base_tree'] == base_tree and delta['tree'] == expected_tree
          assert len(delta['files']) == 26
          assert subprocess.check_output(['git', 'rev-parse', base + '^{tree}'], text=True).strip() == base_tree
          entries = []
          seen = set()
          for entry in delta['files']:
              path = entry['path']
              assert path not in seen and '..' not in pathlib.PurePosixPath(path).parts and not path.startswith('/')
              seen.add(path)
              assert path.startswith('site/') or (path == '.github/workflows/concepts-c02-inputs.yml' and entry.get('delete'))
              if entry.get('delete'):
                  subprocess.check_call(['git', 'cat-file', '-e', base + ':' + path])
                  entries.append({'path': path, 'mode': '100644', 'type': 'blob', 'sha': None})
                  continue
              assert entry['mode'] == '100644'
              old = subprocess.run(['git', 'show', base + ':' + path], stdout=subprocess.PIPE, stderr=subprocess.PIPE)
              assert old.returncode in (0, 128)
              lines = old.stdout.decode('utf-8').splitlines(keepends=True) if old.returncode == 0 else []
              last_end = 0
              for start, end, replacement in entry['edits']:
                  assert isinstance(start, int) and isinstance(end, int) and last_end <= start <= end <= len(lines)
                  assert isinstance(replacement, str)
                  last_end = end
              for start, end, replacement in reversed(entry['edits']):
                  lines[start:end] = replacement.splitlines(keepends=True)
              content = ''.join(lines).encode('utf-8')
              sha = hashlib.sha1(b'blob ' + str(len(content)).encode() + b'\0' + content).hexdigest()
              assert sha == entry['sha'], path
              stored = api('git/blobs', {'content': base64.b64encode(content).decode(), 'encoding': 'base64'})
              assert stored['sha'] == sha
              entries.append({'path': path, 'mode': entry['mode'], 'type': 'blob', 'sha': sha})
          tree = api('git/trees', {'base_tree': base_tree, 'tree': entries})
          assert tree['sha'] == expected_tree
          evidence = pathlib.Path(os.environ['RUNNER_TEMP']) / 'c02-objects'
          evidence.mkdir()
          (evidence / 'receipt.json').write_text(json.dumps({'repository': repo, 'source_base': base,
              'delta_sha256': digest, 'expected_tree': expected_tree, 'created_tree': tree['sha'],
              'file_count': len(entries), 'branch_updated': False, 'product_code_executed': False,
              'entries': entries}, indent=2) + '\n')
          print('Verified C02 tree:', tree['sha'], 'No ref or commit was created by this workflow.')
          PY
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: concepts-c02-objects
          path: ${{ runner.temp }}/c02-objects/
          retention-days: 1
          if-no-files-found: error
