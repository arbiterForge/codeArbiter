name: PR859 correction objects
on:
  push:
    branches: [prep/pr859-finish-source-20260924]
    paths: [.github/workflows/pr859-finish-objects.yml]
permissions:
  contents: write
jobs:
  prepare:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: e7ad85b6defb0b7ec4ca39e12cfb08bd8e20dab4
          persist-credentials: false
      - name: Reconstruct only the reviewed patch and create unreferenced blobs
        shell: python
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          import base64, gzip, hashlib, json, os, pathlib, subprocess, urllib.request
          expected = {
              '.github/scripts/test_public_codex_docs.py': '4ff4b50389def5ebe95c38d5567981a5822ae98d',
              'site/reviews/CONCEPTS-C03-SOURCES.md': '3f61a45dace7699317116184540f7ac6c108ea95',
              'site/src/content/docs/concepts/persona-and-context.mdx': 'bab5fd4b89c0037af640d2d01b8df4825d27c7b3',
              'site/test/browser/concepts-context.spec.ts': 'bdc6f5cff75651525921003692003d10e14fc6f8',
              'site/test/content/concepts-context.test.ts': 'fcc8770ce84ae3c499bff5d82b2f2b9c47328237',
          }
          encoded = ''
          patch = gzip.decompress(base64.b64decode(encoded, validate=True))
          assert len(patch) == 13773
          assert hashlib.sha256(patch).hexdigest() == '2b56721b841d5a973a0e1dc1abf1e5baff1665f6cdf72f69129de0daa2cb4c14'
          assert subprocess.check_output(['git','rev-parse','HEAD'], text=True).strip() == 'e7ad85b6defb0b7ec4ca39e12cfb08bd8e20dab4'
          subprocess.run(['git','apply','--check','--index','-'], input=patch, check=True)
          subprocess.run(['git','apply','--index','-'], input=patch, check=True)
          paths = subprocess.check_output(['git','diff','--cached','--name-only'], text=True).splitlines()
          assert sorted(paths) == sorted(expected)
          tree = subprocess.check_output(['git','write-tree'], text=True).strip()
          assert tree == 'd475d4924a7db704cf678b3b5ec515462e2cee28'
          entries = []
          for path in paths:
              raw = pathlib.Path(path).read_bytes()
              digest = hashlib.sha1(f'blob {len(raw)}\0'.encode() + raw).hexdigest()
              assert digest == expected[path]
              request = urllib.request.Request('https://api.github.com/repos/arbiterForge/codeArbiter/git/blobs', data=json.dumps({'content':base64.b64encode(raw).decode(),'encoding':'base64'}).encode(), headers={'Authorization':'Bearer '+os.environ['GH_TOKEN'],'Accept':'application/vnd.github+json','Content-Type':'application/json'}, method='POST')
              with urllib.request.urlopen(request, timeout=30) as response:
                  returned = json.load(response)
              assert returned['sha'] == digest
              entries.append({'path':path,'mode':'100644','type':'blob','sha':digest})
          out = pathlib.Path(os.environ['RUNNER_TEMP'])/'pr859-correction-objects'
          out.mkdir()
          (out/'objects.json').write_text(json.dumps({'base':'e7ad85b6defb0b7ec4ca39e12cfb08bd8e20dab4','tree':tree,'entries':entries}, indent=2)+'\n')
          print(json.dumps({'tree':tree,'blob_count':len(entries)}))
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: pr859-correction-objects
          path: ${{ runner.temp }}/pr859-correction-objects/
          retention-days: 1
          if-no-files-found: error
