name: native platform pipeline

# Called at the same commit as ci.yml. Each native platform starts its consumers
# when ITS candidate is ready, not after the slowest build in a global matrix.
on:
  workflow_call:
    inputs:
      os:
        type: string
        required: true
      expected_platform:
        type: string
        required: true
      artifact_binary:
        type: string
        required: true

permissions:
  contents: read

jobs:
  artifact-candidate:
    name: "[CHECK] | [CORE] | Native candidate build <${{ inputs.expected_platform }}>"
    runs-on: ${{ inputs.os }}
    timeout-minutes: ${{ (inputs.expected_platform == 'darwin/amd64' || inputs.expected_platform == 'windows/arm64' || inputs.expected_platform == 'windows/amd64') && 60 || 30 }}
    permissions:
      contents: read
    env:
      GOTOOLCHAIN: local
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.14"
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22.19.0
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "1.27.1"
          check-latest: false
          cache: false
          go-download-base-url: https://go.dev/dl
      - name: Verify exact Go toolchain
        run: python -c "import subprocess; actual = subprocess.check_output(['go', 'env', 'GOVERSION'], text=True).strip(); assert actual == 'go1.27.1', actual"
      - name: Build native qualified candidate
        run: python tools/build-artifacts.py --output "${{ runner.temp }}/artifact-candidate"
      - name: Bind the module-tested candidate to this run
        run: >-
          python .github/scripts/artifact_ci.py stamp
          --candidate "${{ runner.temp }}/artifact-candidate"
          --metadata "${{ runner.temp }}/artifact-candidate-ci.json"
          --platform "${{ inputs.expected_platform }}"
      - name: Share the candidate without claiming complete qualification
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: artifact-candidate-${{ inputs.os }}
          path: |
            ${{ runner.temp }}/artifact-candidate
            ${{ runner.temp }}/artifact-candidate-ci.json
          if-no-files-found: error
          retention-days: 14
          include-hidden-files: false
          overwrite: false


  artifact-bridges:
    name: "[CHECK] | [CORE] | Native adapter checks <${{ inputs.expected_platform }}>"
    needs: artifact-candidate
    if: needs.artifact-candidate.result == 'success'
    runs-on: ${{ inputs.os }}
    timeout-minutes: ${{ (inputs.expected_platform == 'darwin/amd64' || inputs.expected_platform == 'windows/arm64' || inputs.expected_platform == 'windows/amd64') && 60 || 30 }}
    permissions:
      contents: read
    env:
      GOTOOLCHAIN: local
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.14"
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22.19.0
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "1.27.1"
          check-latest: false
          cache: false
          go-download-base-url: https://go.dev/dl
      - name: Verify exact Go toolchain
        run: python -c "import subprocess; actual = subprocess.check_output(['go', 'env', 'GOVERSION'], text=True).strip(); assert actual == 'go1.27.1', actual"
      - name: Download this run's module-tested native candidate
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: artifact-candidate-${{ inputs.os }}
          path: ${{ runner.temp }}
      - name: Verify exact source, run, tool and candidate bytes
        run: >-
          python .github/scripts/artifact_ci.py verify
          --candidate "${{ runner.temp }}/artifact-candidate"
          --metadata "${{ runner.temp }}/artifact-candidate-ci.json"
          --platform "${{ inputs.expected_platform }}"
      - name: Verify protected greenfield population with the candidate
        env:
          ARTIFACT_TEST_INSTALLATION: ${{ runner.temp }}/artifact-candidate
        run: python .github/scripts/test_greenfield_context.py
      - name: Check out the fixed pre-assistive compatibility source
        if: inputs.os == 'ubuntu-24.04'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: 045c0812888f20f4c843677cfb37b802e2084770
          path: .artifact-legacy
          sparse-checkout: core/artifacts
          persist-credentials: false
      - name: Build the schema 0.3.1 compatibility client
        if: inputs.os == 'ubuntu-24.04'
        working-directory: .artifact-legacy/core/artifacts
        env:
          GOTOOLCHAIN: local
          GOPROXY: "off"
          GOSUMDB: "off"
        run: go build -trimpath -buildvcs=false -o "${{ runner.temp }}/artifact-legacy" ./cmd/ca-artifact
      - name: Verify two-client upgrade, complete restore and forward recovery
        if: inputs.os == 'ubuntu-24.04'
        run: >-
          python tools/test-artifact-mixed-schema.py
          --old "${{ runner.temp }}/artifact-legacy"
          --candidate "${{ runner.temp }}/artifact-candidate/ca-artifact-linux-amd64"
      - name: Generate review examples with the native candidate
        run: >-
          python tools/create-artifact-examples.py
          --binary "${{ runner.temp }}/artifact-candidate/${{ inputs.artifact_binary }}"
          --output "${{ runner.temp }}/artifact-review"
      - name: Test host-owned artifact approval capture
        env:
          ARTIFACT_TEST_INSTALLATION: ${{ runner.temp }}/artifact-candidate
        run: python .github/scripts/test_artifact_approval_adapter.py
      - name: Test host-owned artifact prerequisite capture
        env:
          ARTIFACT_TEST_INSTALLATION: ${{ runner.temp }}/artifact-candidate
        run: python .github/scripts/test_artifact_prerequisite_adapter.py
      - name: Test host-owned artifact reconciliation capture
        env:
          ARTIFACT_TEST_INSTALLATION: ${{ runner.temp }}/artifact-candidate
        run: python .github/scripts/test_artifact_reconciliation_adapter.py
      - name: Test forgiving authority reply capture and short codes
        run: python .github/scripts/test_replylib.py
      - name: Verify that the exercised candidate remains unchanged
        run: >-
          python .github/scripts/artifact_ci.py verify
          --candidate "${{ runner.temp }}/artifact-candidate"
          --metadata "${{ runner.temp }}/artifact-candidate-ci.json"
          --platform "${{ inputs.expected_platform }}"

  artifact-conformance:
    name: "[CHECK] | [CORE] | Native conformance checks <${{ inputs.expected_platform }}>"
    needs: artifact-candidate
    if: needs.artifact-candidate.result == 'success'
    runs-on: ${{ inputs.os }}
    timeout-minutes: ${{ (inputs.expected_platform == 'darwin/amd64' || inputs.expected_platform == 'windows/arm64' || inputs.expected_platform == 'windows/amd64') && 60 || 30 }}
    permissions:
      contents: read
    env:
      GOTOOLCHAIN: local
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.14"
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22.19.0
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "1.27.1"
          check-latest: false
          cache: false
          go-download-base-url: https://go.dev/dl
      - name: Verify exact Go toolchain
        run: python -c "import subprocess; actual = subprocess.check_output(['go', 'env', 'GOVERSION'], text=True).strip(); assert actual == 'go1.27.1', actual"
      - name: Create locked reference-validation environment
        run: >-
          python -c "import os,pathlib,subprocess,venv;
          root=pathlib.Path(os.environ['RUNNER_TEMP'])/'artifact-conformance-venv';
          venv.EnvBuilder(with_pip=True).create(root);
          exe=root/('Scripts/python.exe' if os.name=='nt' else 'bin/python');
          subprocess.run([str(exe),'-m','pip','install','--isolated','--require-virtualenv','--disable-pip-version-check','--no-input','--no-cache-dir','--only-binary=:all:','--require-hashes','--no-deps','--index-url','https://pypi.org/simple','-r','.github/requirements/artifact-conformance-py314.lock'],check=True);
          pathlib.Path(os.environ['GITHUB_ENV']).open('a',encoding='utf-8').write('ARTIFACT_CONFORMANCE_PYTHON='+str(exe)+'\n')"
      - name: Download this run's module-tested native candidate
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: artifact-candidate-${{ inputs.os }}
          path: ${{ runner.temp }}
      - name: Verify exact source, run, tool and candidate bytes
        run: >-
          python .github/scripts/artifact_ci.py verify
          --candidate "${{ runner.temp }}/artifact-candidate"
          --metadata "${{ runner.temp }}/artifact-candidate-ci.json"
          --platform "${{ inputs.expected_platform }}"
      - name: Test cross-kind reference and workflow conformance
        env:
          ARTIFACT_TEST_INSTALLATION: ${{ runner.temp }}/artifact-candidate
        run: python -c "import os,subprocess; subprocess.run([os.environ['ARTIFACT_CONFORMANCE_PYTHON'], '.github/scripts/test_artifact_conformance.py'], check=True)"
      - name: Test debug handoff model against the locked reference interpreter
        run: python -c "import os,subprocess; subprocess.run([os.environ['ARTIFACT_CONFORMANCE_PYTHON'], '.github/scripts/test_ci_impact.py', '--run-debug-suite', '.github/scripts/test_debug_handoff.py'], check=True)"
      - name: Verify that the exercised candidate remains unchanged
        run: >-
          python .github/scripts/artifact_ci.py verify
          --candidate "${{ runner.temp }}/artifact-candidate"
          --metadata "${{ runner.temp }}/artifact-candidate-ci.json"
          --platform "${{ inputs.expected_platform }}"

  artifact-authority:
    name: "[CHECK] | [CORE] | Native authority <${{ inputs.expected_platform }}> shard ${{ matrix.shard }}"
    needs: artifact-candidate
    if: needs.artifact-candidate.result == 'success'
    runs-on: ${{ inputs.os }}
    timeout-minutes: 45
    permissions:
      contents: read
    env:
      GOTOOLCHAIN: local
    strategy:
      fail-fast: false
      matrix:
        shard: [0, 1, 2, 3]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.14"
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22.19.0
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "1.27.1"
          check-latest: false
          cache: false
          go-download-base-url: https://go.dev/dl
      - name: Verify exact Go toolchain
        run: python -c "import subprocess; actual = subprocess.check_output(['go', 'env', 'GOVERSION'], text=True).strip(); assert actual == 'go1.27.1', actual"
      - name: Download this run's module-tested native candidate
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: artifact-candidate-${{ inputs.os }}
          path: ${{ runner.temp }}
      - name: Verify exact source, run, tool and candidate bytes
        run: >-
          python .github/scripts/artifact_ci.py verify
          --candidate "${{ runner.temp }}/artifact-candidate"
          --metadata "${{ runner.temp }}/artifact-candidate-ci.json"
          --platform "${{ inputs.expected_platform }}"
      - name: Run exhaustive duration-balanced authority shard
        env:
          ARTIFACT_TEST_INSTALLATION: ${{ runner.temp }}/artifact-candidate
          AUTHORITY_SHARD: ${{ matrix.shard }}
          AUTHORITY_SHARD_COUNT: "4"
          AUTHORITY_TIMING_OUTPUT: ${{ runner.temp }}/authority-timings.json
        run: python .github/scripts/run_artifact_authority_shard.py
      - name: Verify that the exercised authority candidate remains unchanged
        run: >-
          python .github/scripts/artifact_ci.py verify
          --candidate "${{ runner.temp }}/artifact-candidate"
          --metadata "${{ runner.temp }}/artifact-candidate-ci.json"
          --platform "${{ inputs.expected_platform }}"
      - name: Preserve actual shard membership and timings
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: authority-timings-${{ inputs.os }}-${{ matrix.shard }}
          path: ${{ runner.temp }}/authority-timings.json
          if-no-files-found: error
          retention-days: 14
          include-hidden-files: false
          overwrite: false


  artifact-platform-passed:
    name: Native platform verification complete
    needs: [artifact-candidate, artifact-bridges, artifact-conformance, artifact-authority]
    if: ${{ !cancelled() }}
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.14"
      - name: Require every native platform stage to have succeeded
        env:
          NATIVE_RESULTS: ${{ toJSON(needs) }}
        run: python .github/scripts/artifact_ci.py platform-gate
