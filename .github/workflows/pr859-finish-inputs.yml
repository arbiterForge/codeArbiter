name: PR859 finish inputs
on:
  push:
    branches: [prep/pr859-finish-source-20260924]
    paths: [.github/workflows/pr859-finish-inputs.yml]
permissions:
  contents: read
  actions: read
jobs:
  capture:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: e7ad85b6defb0b7ec4ca39e12cfb08bd8e20dab4
          fetch-depth: 0
          persist-credentials: false
      - name: Preserve source and read-only CI summaries
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          out="$RUNNER_TEMP/pr859-inputs"
          mkdir -p "$out"
          git bundle create "$out/source.bundle" HEAD --tags
          git rev-parse HEAD HEAD^{tree} > "$out/identity.txt"
          gh api --paginate repos/arbiterForge/codeArbiter/actions/runs/36019668545/jobs?per_page=100 --jq '.jobs[] | {id,name,status,conclusion,started_at,completed_at,steps}' > "$out/jobs.jsonl"
          gh api repos/arbiterForge/codeArbiter/pulls/859/reviews --jq '.[] | {id,commit_id,state,body}' > "$out/reviews.jsonl"
          cd "$out"
          sha256sum source.bundle identity.txt jobs.jsonl reviews.jsonl > SHA256SUMS
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: pr859-finish-inputs
          path: ${{ runner.temp }}/pr859-inputs/
          retention-days: 1
          if-no-files-found: error
