name: PR862 integration objects
on:
  push:
    branches: [prep/pr862-search-completion-1120]
    paths: [.github/workflows/pr862-integration-objects.yml]
permissions:
  contents: write
jobs:
  prepare:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: 44d736e4590c528a586bd072e75c6149491e07e5
          fetch-depth: 0
          persist-credentials: false
      - name: Preserve main policy and create checked blobs without moving refs
        shell: python
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          import base64, hashlib, json, os, pathlib, subprocess, urllib.request
          main = 'a4842fab60a6e6ee943341861ec4aed0a7b17a50'
          expected = {
              '.github/scripts/test_ci_impact.py': '64723583cfcc03e9ff5b9f6a0bb23284d5ca74ae',
              '.github/workflows/ci.yml': '9b70bb15199c2bda8fd3bc8c758b6a3da1af64a8',
              'site/reviews/CONCEPTS-C04-SOURCES.md': '658c9adc7b5d5ebd39906f7355989a75f6c0cfc2',
              'site/test/content/c04-stack-ci.test.ts': 'c6e9166fc9e1b81b097d3171e80c3f6e2f58ae71',
          }
          def source(ref, name):
              return subprocess.check_output(['git', 'show', f'{ref}:{name}'], text=True)
          name = '.github/workflows/ci.yml'
          text = source(main, name)
          old = '    branches: [main, feat/codex-support-m0]'
          new = '    # The approved Concepts continuation is reviewed as a separate stacked PR.\n    # Run the same gate on its parent branch; remove this exact campaign entry\n    # after the stack lands. No write permission or test selection is changed.\n    branches: [main, feat/codex-support-m0, docs/concepts-decisions-evidence]'
          assert text.count(old) == 1
          pathlib.Path(name).write_text(text.replace(old, new))
          name = '.github/scripts/test_ci_impact.py'
          old_text = source('HEAD', name)
          start = old_text.index('    def test_native_qualification_has_a_bounded_thirty_minute_job_budget(self):')
          end = old_text.index('    def test_artifact_consumer_closure_selects_exactly_one_declared_native_cell(self):', start)
          block = old_text[start:end]
          text = source(main, name)
          anchor = '    def test_artifact_consumer_closure_selects_exactly_one_declared_native_cell(self):'
          assert text.count(anchor) == 1
          pathlib.Path(name).write_text(text.replace(anchor, block + anchor))
          name = 'site/test/content/c04-stack-ci.test.ts'
          text = source('HEAD', name)
          assert text.count('929229354e3a15ae3002c82116b66c837ab43729') == 1
          pathlib.Path(name).write_text(text.replace('929229354e3a15ae3002c82116b66c837ab43729', main))
          name = 'site/reviews/CONCEPTS-C04-SOURCES.md'
          text = source('HEAD', name) + '''
          ### Integration of owner-approved per-target publication

          Main advanced to `a4842fab60a6e6ee943341861ec4aed0a7b17a50` with the implementation
          and preserved acceptance ancestry of ADR-0040. The C04 branch incorporates that
          main without changing its release decision. The former `publish-release` action
          and its obsolete npm-publication assertions stay removed; the replacement
          `publish-target` action and per-target/channel tests are retained from main.
          Codex npm remains deferred under that owning decision, not re-enabled by the site.

          The two conflicting publication-ledger records had identical parsed identities;
          the integration retains main's byte serialization rather than recording new
          identities. The workflow-equivalence test now binds to this retained main commit,
          continuing to permit only the explicit stacked-parent PR-base entry. It compares
          all executable lines and does not restore superseded CI policy to force green.
          Canonical workflow-map sources remain pinned to their separately verified source;
          this integration is not an installed release or permission to publish.
          '''
          pathlib.Path(name).write_text(text)
          entries = []
          for name, expected_sha in expected.items():
              raw = pathlib.Path(name).read_bytes()
              digest = hashlib.sha1(f'blob {len(raw)}\0'.encode() + raw).hexdigest()
              assert digest == expected_sha, (name, digest)
              request = urllib.request.Request('https://api.github.com/repos/arbiterForge/codeArbiter/git/blobs', data=json.dumps({'content':base64.b64encode(raw).decode(),'encoding':'base64'}).encode(), headers={'Authorization':'Bearer '+os.environ['GH_TOKEN'],'Accept':'application/vnd.github+json','Content-Type':'application/json'}, method='POST')
              with urllib.request.urlopen(request, timeout=30) as response:
                  returned = json.load(response)
              assert returned['sha'] == digest
              entries.append({'path':name,'mode':'100644','type':'blob','sha':digest})
          out = pathlib.Path(os.environ['RUNNER_TEMP']) / 'pr862-integration-objects'
          out.mkdir()
          (out/'objects.json').write_text(json.dumps(entries, indent=2)+'\n')
          print(json.dumps(entries))
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: pr862-integration-objects
          path: ${{ runner.temp }}/pr862-integration-objects/
          retention-days: 1
          if-no-files-found: error
