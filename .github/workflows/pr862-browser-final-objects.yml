name: PR862 browser correction objects
on:
  push:
    branches: [prep/pr862-ci-source]
    paths: [.github/workflows/pr862-browser-final-objects.yml]
permissions:
  contents: write
jobs:
  prepare:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: 54d8dfec3fbc58e155ba4222dbaeee9fbed696ba
          persist-credentials: false
      - name: Apply hash-bound patch and store four unreferenced blobs
        shell: python
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          import base64, gzip, hashlib, json, os, pathlib, subprocess, urllib.request
          encoded = ''
          expected = {
            'site/src/scripts/execution-map-navigation.ts':'19ddf288ea3ab9a6ce634e72961e6e254269bdab',
            'site/test/browser/peer-layout.spec.ts':'9e89a631694ab2cab970af7dde969faaa7ac6bd3',
            'site/test/browser/workflow-navigation.spec.ts':'8e39be219f6e0037ec6ff2714144a74ac93e6e1e',
            'site/test/browser/workflow-propagation.spec.ts':'4bb272620a2f1b23bb9cd144aeb15e35d889e4be',
          }
          patch = gzip.decompress(base64.b64decode(encoded, validate=True))
          assert len(patch) == 6600
          assert hashlib.sha256(patch).hexdigest() == '7e5db51af47943aed8da52fe0462e9d65e25a4966ff80d2d7b035b683f16bd76'
          subprocess.run(['git','apply','--check','--index','-'], input=patch, check=True)
          subprocess.run(['git','apply','--index','-'], input=patch, check=True)
          paths = subprocess.check_output(['git','diff','--cached','--name-only'], text=True).splitlines()
          assert sorted(paths) == sorted(expected)
          tree = subprocess.check_output(['git','write-tree'], text=True).strip()
          assert tree == '86cbb6d9b64c0998fe0734817eab0f26d874a5d4'
          for path in paths:
            raw = pathlib.Path(path).read_bytes()
            sha = hashlib.sha1(f'blob {len(raw)}\0'.encode()+raw).hexdigest()
            assert sha == expected[path]
            request = urllib.request.Request('https://api.github.com/repos/arbiterForge/codeArbiter/git/blobs', data=json.dumps({'content':base64.b64encode(raw).decode(),'encoding':'base64'}).encode(), headers={'Authorization':'Bearer '+os.environ['GH_TOKEN'],'Accept':'application/vnd.github+json','Content-Type':'application/json'}, method='POST')
            with urllib.request.urlopen(request, timeout=30) as response:
              assert json.load(response)['sha'] == sha
          print(json.dumps({'tree':tree,'verified_blobs':expected}))
