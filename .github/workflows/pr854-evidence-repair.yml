name: PR854 retry evidence validation (temporary)
on:
  push:
    branches: [codex/farm-readiness-canary-isolation]
    paths: [.github/workflows/pr854-evidence-repair.yml]
permissions:
  contents: read
jobs:
  validate:
    if: github.repository == 'arbiterForge/codeArbiter' && github.ref == 'refs/heads/codex/farm-readiness-canary-isolation'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: e57f006b7db585a2a2a0ad0181d8c2ed90b223c8
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.14'
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: '22.19.0'
      - name: Acquire the exact reviewed correction without executing its payload
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python - <<'PY'
          import base64, hashlib, json, lzma, os, pathlib, urllib.request
          assert os.environ['GITHUB_REPOSITORY']=='arbiterForge/codeArbiter'
          assert os.environ['GITHUB_REF']=='refs/heads/codex/farm-readiness-canary-isolation'
          out=pathlib.Path(os.environ['RUNNER_TEMP'])/'pr854-evidence-repair'
          out.mkdir()
          sha='121179cd8b03118cea219503f838cd01302385b7'
          class NoRedirect(urllib.request.HTTPRedirectHandler):
              def redirect_request(self,*args,**kwargs): raise RuntimeError('Unexpected redirect')
          req=urllib.request.Request('https://api.github.com/repos/arbiterForge/codeArbiter/git/blobs/'+sha,headers={'Authorization':'Bearer '+os.environ['GH_TOKEN'],'Accept':'application/vnd.github+json'})
          with urllib.request.build_opener(NoRedirect).open(req,timeout=45) as response: blob=json.load(response)
          assert blob['sha']==sha and blob['encoding']=='base64'
          packed=base64.b64decode(blob['content'])
          assert hashlib.sha1(b'blob '+str(len(packed)).encode()+b'\0'+packed).hexdigest()==sha
          data=lzma.decompress(packed)
          assert len(data)==16707 and hashlib.sha256(data).hexdigest()=='544c1c99e2b182fd6a60235ab99d79192dc20dee995524ebd2de1ca6cc71caa2'
          payload=json.loads(data)
          assert payload['parent']=='e57f006b7db585a2a2a0ad0181d8c2ed90b223c8'
          assert payload['base_tree']=='2734491a73652fa45010d0d32797eedc5ab8f2a0'
          assert len(payload['files'])==9 and len({x['path'] for x in payload['files']})==9
          for row in payload['files']:
              p=pathlib.PurePosixPath(row['path'])
              assert not p.is_absolute() and '..' not in p.parts and str(p)==row['path']
              assert row['mode'] in {'100644','100755'}
              assert len(row['old_sha'])==40 and len(row['sha'])==40
          (out/'payload.json').write_bytes(data)
          (out/'reviewed.patch').write_text(payload['source_patch'])
          PY
      - name: Apply owning changes, rebuild, and run the complete farm suite
        shell: bash
        run: |
          python - <<'PY'
          import hashlib, json, os, pathlib, subprocess, sys, time, zipfile
          root=pathlib.Path.cwd();out=pathlib.Path(os.environ['RUNNER_TEMP'])/'pr854-evidence-repair'
          payload=json.loads((out/'payload.json').read_text());base=payload['parent']
          assert subprocess.check_output(['git','rev-parse','HEAD'],text=True).strip()==base
          assert subprocess.check_output(['git','rev-parse','HEAD^{tree}'],text=True).strip()==payload['base_tree']
          def oid(path):
              data=(root/path).read_bytes()
              return hashlib.sha1(b'blob '+str(len(data)).encode()+b'\0'+data).hexdigest()
          for row in payload['files']:
              assert oid(row['path'])==row['old_sha'],row['path']
              assert subprocess.check_output(['git','ls-tree','HEAD','--',row['path']],text=True).split()[0]==row['mode']
          subprocess.run(['git','apply','--check','--index',str(out/'reviewed.patch')],check=True)
          subprocess.run(['git','apply','--index',str(out/'reviewed.patch')],check=True)
          tools=root/'plugins/ca/tools'
          subprocess.run(['npm','ci','--ignore-scripts','--no-fund','--no-audit'],cwd=tools,check=True)
          subprocess.run(['npm','audit','--include=dev','--audit-level=high'],cwd=tools,check=True)
          subprocess.run(['npm','run','typecheck'],cwd=tools,check=True)
          subprocess.run(['npm','run','build'],cwd=tools,check=True)
          subprocess.run([sys.executable,'tools/build-surface.py'],check=True)
          expected={row['path'] for row in payload['files']}
          assert set(subprocess.check_output(['git','diff','HEAD','--name-only'],text=True).splitlines())==expected
          for row in payload['files']: assert oid(row['path'])==row['sha'],row['path']
          subprocess.run(['git','add','--',*sorted(expected)],check=True)
          subprocess.run(['git','diff','--cached','--check'],check=True)
          tree=subprocess.check_output(['git','write-tree'],text=True).strip()
          message='fix: preserve farm usage and cleanup on retry reset failure\n\nReturn known task evidence through the existing finalizer after a\nfailed retry reset. Test real Git lock refusal and document the\nexplicit zero-temperature override without changing authority.\n\nCHANGELOG: Preserve farm evidence after retry reset refusal.\n'
          env=dict(os.environ,GIT_AUTHOR_NAME='Validation fixture',GIT_AUTHOR_EMAIL='validation@example.invalid',GIT_COMMITTER_NAME='Validation fixture',GIT_COMMITTER_EMAIL='validation@example.invalid')
          fixture=subprocess.check_output(['git','commit-tree',tree,'-p',base],input=message,text=True,env=env).strip()
          subprocess.run(['git','checkout','--detach',fixture],check=True)
          commands=[(['npm','run','coverage'],tools)]
          commands += [([sys.executable,'.github/scripts/'+name+'.py'],root) for name in ['test_ci_impact','test_host_descriptors','test_routing_and_cleanup_surface','test_build_surface','test_public_codex_docs','test_provenance_wiring']]
          commands += [([sys.executable,tool,'--check'],root) for tool in ['tools/build-surface.py','tools/sync-core.py','tools/build-host-packages.py']]
          commands += [([sys.executable,'.github/scripts/'+name+'.py'],root) for name in ['check_destructive_registry','check_routing_index_parity','check_docs_contract']]
          commands += [([sys.executable,'.github/scripts/check-plugin-refs.py',host],root) for host in ['ca','ca-codex','ca-pi']]
          results=[]
          for i,(args,cwd) in enumerate(commands):
              name=f'{i:02d}-'+('farm-coverage' if args[0]=='npm' else pathlib.Path(args[1]).stem)+'.log'
              start=time.monotonic()
              try:
                  done=subprocess.run(args,cwd=cwd,capture_output=True,text=True,timeout=360,env=dict(os.environ,PYTHONDONTWRITEBYTECODE='1'))
                  code=done.returncode;content=done.stdout+done.stderr
              except subprocess.TimeoutExpired:
                  code=124;content='Timed out; not a passing test.\n'
              (out/name).write_text(content)
              results.append({'command':args,'cwd':str(cwd.relative_to(root)), 'exit_code':code,'seconds':round(time.monotonic()-start,3),'log':name})
              (out/'tests.json').write_text(json.dumps(results,indent=2))
              print(code,' '.join(args),flush=True)
          for row in payload['files']: assert oid(row['path'])==row['sha'],row['path']
          assert not subprocess.check_output(['git','diff','--name-only'],text=True).strip()
          (out/'candidate.diff').write_bytes(subprocess.check_output(['git','diff','--binary','--full-index',base,fixture]))
          with zipfile.ZipFile(out/'candidate-files.zip','w',zipfile.ZIP_DEFLATED) as z:
              for row in payload['files']: z.write(root/row['path'],row['path'])
          report={'source_parent':base,'workflow_head':os.environ['GITHUB_SHA'],'tree':tree,'local_validation_commit':fixture,'files':payload['files'],'message':message,'all_commands_passed':all(r['exit_code']==0 for r in results),'command_count':len(results)}
          (out/'manifest.json').write_text(json.dumps(report,indent=2))
          assert report['all_commands_passed'],'Inspect retained failures; no passing result is inferred.'
          PY
      - name: Retain actual outcomes and candidate bytes
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: pr854-evidence-repair-${{ github.run_id }}
          path: ${{ runner.temp }}/pr854-evidence-repair/
          if-no-files-found: error
          retention-days: 3
