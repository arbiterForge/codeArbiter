name: PR854 Windows fixture identity (temporary)
on:
  push:
    branches: [codex/farm-readiness-canary-isolation]
    paths: [.github/workflows/pr854-windows-fixture.yml]
permissions:
  contents: read
jobs:
  validate:
    if: github.repository == 'arbiterForge/codeArbiter' && github.ref == 'refs/heads/codex/farm-readiness-canary-isolation'
    runs-on: windows-latest
    timeout-minutes: 12
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: 7e7888f90f25b6eac293e7536454bdb949985846
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.14'
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: '20'
      - name: Compare actual fixture directories rather than alias spellings
        shell: bash
        run: |
          python - <<'PY'
          import hashlib,json,os,pathlib,subprocess
          assert os.environ['GITHUB_REPOSITORY']=='arbiterForge/codeArbiter'
          assert os.environ['GITHUB_REF']=='refs/heads/codex/farm-readiness-canary-isolation'
          assert subprocess.check_output(['git','rev-parse','HEAD'],text=True).strip()=='7e7888f90f25b6eac293e7536454bdb949985846'
          out=pathlib.Path(os.environ['RUNNER_TEMP'])/'pr854-windows-fixture';out.mkdir()
          path=pathlib.Path('plugins/ca/tools/farm.test.ts')
          raw=path.read_bytes()
          def oid(data): return hashlib.sha1(b'blob '+str(len(data)).encode()+b'\0'+data).hexdigest()
          assert oid(raw)=='b5ab05337c3fe1e13491814fa34e4a18dad82911'
          text=raw.decode()
          old='import { readFileSync, writeFileSync, mkdirSync, rmSync, existsSync, readdirSync } from "node:fs";'
          new='import { readFileSync, writeFileSync, mkdirSync, rmSync, existsSync, readdirSync, realpathSync } from "node:fs";'
          assert text.count(old)==1;text=text.replace(old,new,1)
          old='        expect(gitIn(created, "rev-parse", "--show-toplevel")).toBe(created.replaceAll("\\\\", "/"));'
          new='''        // Git expands Windows 8.3 names (and platform directory aliases).
                  // Compare the actual directories without weakening the foreign-repo check.
                  expect(realpathSync.native(gitIn(created, "rev-parse", "--show-toplevel")))
                    .toBe(realpathSync.native(created));'''
          # Remove only the extra YAML/Python indentation on continuation lines.
          new=new.replace('\n        ','\n')
          assert text.count(old)==1;text=text.replace(old,new,1)
          data=text.encode()
          assert oid(data)=='80e17fc0e1f0b92370728caf8d6a1bbdb3fd911b'
          path.write_bytes(data)
          assert subprocess.check_output(['git','diff','--name-only'],text=True).splitlines()==[path.as_posix()]
          subprocess.run(['git','diff','--check'],check=True)
          (out/'candidate.diff').write_bytes(subprocess.check_output(['git','diff','--binary','--full-index']))
          (out/'farm.test.ts').write_bytes(data)
          (out/'identity.json').write_text(json.dumps({'path':path.as_posix(),'base':'7e7888f90f25b6eac293e7536454bdb949985846','old_blob':oid(raw),'new_blob':oid(data),'workflow_head':os.environ['GITHUB_SHA']},indent=2))
          PY
      - name: Locked dependencies and typecheck
        working-directory: plugins/ca/tools
        shell: bash
        run: |
          set -euo pipefail
          npm ci --ignore-scripts --no-fund --no-audit
          npm run typecheck
      - name: Execute the complete normal Windows farm coverage suite
        working-directory: plugins/ca/tools
        shell: bash
        run: |
          set -euo pipefail
          OUT="$RUNNER_TEMP/pr854-windows-fixture"
          npx vitest run --coverage --reporter=default --reporter=json --outputFile.json="$OUT/results.json" 2>&1 | tee "$OUT/coverage.log"
          python - <<'PY'
          import hashlib,json,os,pathlib,subprocess
          out=pathlib.Path(os.environ['RUNNER_TEMP'])/'pr854-windows-fixture'
          report=json.loads((out/'results.json').read_text())
          assert report['success'] and report['numFailedTests']==0 and report['numTotalTests']>=622
          test=pathlib.Path('farm.test.ts').read_bytes()
          assert hashlib.sha1(b'blob '+str(len(test)).encode()+b'\0'+test).hexdigest()=='80e17fc0e1f0b92370728caf8d6a1bbdb3fd911b'
          assert subprocess.check_output(['git','diff','--name-only'],text=True).splitlines()==['plugins/ca/tools/farm.test.ts']
          (out/'passed.json').write_text(json.dumps({'total':report['numTotalTests'],'passed':report['numPassedTests'],'pending':report['numPendingTests'],'failed':report['numFailedTests'],'suite_success':report['success'],'product_runtime_changed':False},indent=2))
          PY
      - name: Store the one verified blob without changing a ref
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python - <<'PY'
          import hashlib,json,os,pathlib,urllib.request
          out=pathlib.Path(os.environ['RUNNER_TEMP'])/'pr854-windows-fixture'
          assert json.loads((out/'passed.json').read_text())['suite_success']
          data=(out/'farm.test.ts').read_bytes();sha='80e17fc0e1f0b92370728caf8d6a1bbdb3fd911b'
          assert hashlib.sha1(b'blob '+str(len(data)).encode()+b'\0'+data).hexdigest()==sha
          class NoRedirect(urllib.request.HTTPRedirectHandler):
              def redirect_request(self,*args,**kwargs): raise RuntimeError('Unexpected redirect')
          req=urllib.request.Request('https://api.github.com/repos/arbiterForge/codeArbiter/git/blobs',method='POST',data=json.dumps({'content':data.decode(),'encoding':'utf-8'}).encode(),headers={'Authorization':'Bearer '+os.environ['GH_TOKEN'],'Accept':'application/vnd.github+json','Content-Type':'application/json'})
          with urllib.request.build_opener(NoRedirect).open(req,timeout=45) as response: reply=json.load(response)
          assert reply['sha']==sha
          (out/'uploaded.json').write_text(json.dumps({'sha':sha,'branch_updated':False},indent=2))
          PY
      - name: Retain actual Windows results and exact candidate
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: pr854-windows-fixture-${{ github.run_id }}
          path: ${{ runner.temp }}/pr854-windows-fixture/
          if-no-files-found: error
          retention-days: 3
