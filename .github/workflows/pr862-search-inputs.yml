name: PR862 search inputs
on:
  push:
    branches: [prep/pr862-search-completion-1120]
    paths: [.github/workflows/pr862-search-inputs.yml]
permissions:
  contents: read
jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: 0c989584f0bc14bdf95d62dc80b910bf85c0f0fb
          fetch-depth: 0
          submodules: recursive
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 22
      - name: Preserve source and locked dependencies
        shell: bash
        run: |
          set -euo pipefail
          out="$RUNNER_TEMP/search-inputs"
          mkdir -p "$out"
          git rev-parse HEAD HEAD^{tree} > "$out/identity.txt"
          git bundle create "$out/source.bundle" HEAD --tags
          npm ci --ignore-scripts --prefix site
          tar -czf "$out/site-node-modules.tar.gz" -C site node_modules
      - name: Reproduce unmodified build and inspect output syntax
        shell: bash
        working-directory: site
        run: |
          set -euo pipefail
          out="$RUNNER_TEMP/search-inputs"
          npm run build > "$out/build.log" 2>&1
          cp -r dist/pagefind "$out/pagefind"
          node --check dist/pagefind/pagefind.js > "$out/module-syntax.txt" 2>&1 || result=$?
          printf 'syntax_exit=%s\n' "${result:-0}" >> "$out/module-syntax.txt"
          wc -c dist/pagefind/pagefind.js >> "$out/module-syntax.txt"
          sha256sum dist/pagefind/pagefind.js >> "$out/module-syntax.txt"
          cd "$out"
          sha256sum source.bundle site-node-modules.tar.gz identity.txt build.log module-syntax.txt > SHA256SUMS
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        if: always()
        with:
          name: pr862-search-inputs
          path: ${{ runner.temp }}/search-inputs/
          retention-days: 1
          if-no-files-found: error
