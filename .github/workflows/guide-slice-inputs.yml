name: Guide slice inputs
on:
  push:
    branches: [docs/guide-discovery-and-review-journey]
    paths: [.github/workflows/guide-slice-inputs.yml]
permissions:
  contents: read
jobs:
  capture:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Capture source objects without executing product code
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/guide-source"
          git bundle create "$RUNNER_TEMP/guide-source/source.bundle" HEAD --tags ^b41d9803eacb3acf4b93c8bec81e1aa2f086aec7
          git rev-parse HEAD HEAD^{tree} > "$RUNNER_TEMP/guide-source/identity.txt"
          cd "$RUNNER_TEMP/guide-source"
          sha256sum source.bundle identity.txt > SHA256SUMS
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: guide-slice-inputs
          path: ${{ runner.temp }}/guide-source/
          retention-days: 1
          if-no-files-found: error
