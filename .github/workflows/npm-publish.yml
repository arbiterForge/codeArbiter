# Reusable npm publish channel for ca-pi (ADR-0029). release.yml invokes this
# synchronously after creating the exact annotated tag and GitHub Release, so a
# release run cannot turn green while its npm publication is absent or failed.
#
# No candidate build or dependency install runs here: the published package is
# dependency-free and the extension bundles are committed, reviewed artifacts.
# Post-publication proof does install the exact registry version in a disposable
# directory with lifecycle scripts disabled so npm can verify its signatures and
# provenance. The guard refuses a tag whose synchronized manifests disagree.
name: "[SHIP ] | [PI  ] | npm publish"

on:
  workflow_call:
    inputs:
      tag:
        required: true
        type: string
      expected_sha:
        required: true
        type: string
      ci_run_id:
        required: true
        type: string
      cohort_targets:
        required: true
        type: string
      expected_tag_object_sha:
        required: true
        type: string
      continuation:
        required: false
        default: false
        type: boolean
    secrets:
      NPMJS_TOKEN:
        required: true
  workflow_dispatch:
    inputs:
      tag:
        required: true
        type: string
      expected_sha:
        required: true
        type: string
      ci_run_id:
        required: true
        type: string
      cohort_targets:
        required: true
        type: string
      expected_tag_object_sha:
        required: true
        type: string

permissions:
  actions: read
  # The publisher validates an existing draft immediately before mutation.
  # GitHub hides draft Releases from tokens without push-equivalent access.
  contents: write
  id-token: write

concurrency:
  group: npm-publish-${{ inputs.tag }}
  cancel-in-progress: false

jobs:
  publish:
    name: "[SHIP ] | [PI  ] | Publish @arbiterforge/ca-pi"
    # Reusable workflows inherit the caller's event context. A call from the
    # automatic release workflow therefore still reports `workflow_run`, and a
    # call from its manual lane reports `workflow_dispatch`; neither reports
    # `workflow_call`. The caller jobs already require the exact release route,
    # while this boundary independently keeps publication on protected main.
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out the trusted default-branch verifier
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          path: trusted
          fetch-depth: 0
          persist-credentials: false
      - name: Validate untrusted release inputs before use
        env:
          RELEASE_TAG: ${{ inputs.tag }}
          EXPECTED_SHA: ${{ inputs.expected_sha }}
          TRUSTED_SHA: ${{ github.sha }}
          CONTINUATION: ${{ inputs.continuation }}
        run: |
          set -euo pipefail
          extra=()
          if [ "$CONTINUATION" = true ]; then extra+=(--allow-continuation); fi
          python3 trusted/.github/scripts/_npm_publishlib.py validate \
            --tag "$RELEASE_TAG" --expected-sha "$EXPECTED_SHA" \
            --trusted-sha "$TRUSTED_SHA" "${extra[@]}"
      - name: Download exact promoted host payloads
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: artifact-host-payloads-${{ inputs.expected_sha }}
          path: ${{ runner.temp }}/artifact-publication-stage
          run-id: ${{ inputs.ci_run_id }}
          github-token: ${{ github.token }}
      - name: Download exact normal release package cohort
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: artifact-release-packages-${{ inputs.expected_sha }}
          path: ${{ runner.temp }}/artifact-publication-packages
          run-id: ${{ inputs.ci_run_id }}
          github-token: ${{ github.token }}
      - name: Download exact cold-execution receipt matrix
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: artifact-package-cold-*-${{ inputs.expected_sha }}
          path: ${{ runner.temp }}/artifact-publication-cold
          merge-multiple: false
          run-id: ${{ inputs.ci_run_id }}
          github-token: ${{ github.token }}
      - name: Materialize the exact tagged package as inert data
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ format('refs/tags/{0}', inputs.tag) }}
          path: candidate
          fetch-depth: 0
          fetch-tags: true
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22.23.2"
          registry-url: "https://registry.npmjs.org"
      - name: Acquire reviewed npm@11.19.1 CLI
        id: npm-cli
        env:
          NPM_CLI_VERSION: "11.19.1"
          NPM_CLI_INTEGRITY: "sha512-ztsxKxt/kkIaAs+2i0GU6I+DRmUdrNasxTZKJe9TCdSjKxlhah/4r/hl5ygMD6XAg1qZ9c2TNomR4qgOydp10g=="
        run: |
          set -euo pipefail
          npm_cli_root="$(mktemp -d "$RUNNER_TEMP/npm-cli.XXXXXXXX")"
          archive="$npm_cli_root/npm.tgz"
          curl --disable --fail --show-error --silent --proto '=https' --tlsv1.2 \
            --max-redirs 0 \
            --output "$archive" \
            "https://registry.npmjs.org/npm/-/npm-11.19.1.tgz"
          ACTUAL_INTEGRITY="sha512-$(openssl dgst -sha512 -binary "$archive" | openssl base64 -A)"
          test "$ACTUAL_INTEGRITY" = "$NPM_CLI_INTEGRITY"
          python3 - "$archive" <<'PY'
          import pathlib
          import sys
          import tarfile

          with tarfile.open(sys.argv[1], "r:gz") as archive_file:
              for member in archive_file.getmembers():
                  path = pathlib.PurePosixPath(member.name)
                  if (
                      path.is_absolute()
                      or ".." in path.parts
                      or member.issym()
                      or member.islnk()
                      or member.isdev()
                      or member.isfifo()
                  ):
                      raise SystemExit(f"unsafe npm CLI archive member: {member.name}")
          PY
          tar --extract --gzip --no-same-owner --no-same-permissions \
            --file "$archive" --directory "$npm_cli_root"
          npm_cli="$npm_cli_root/package/bin/npm-cli.js"
          test -f "$npm_cli"
          test ! -L "$npm_cli"
          resolved_cli="$(realpath "$npm_cli")"
          case "$resolved_cli" in
            "$npm_cli_root"/*) ;;
            *) echo "npm CLI escaped its temporary root" >&2; exit 1 ;;
          esac
          npm_cli="$resolved_cli"
          test "$("$npm_cli" --version)" = "$NPM_CLI_VERSION"
          echo "executable=$npm_cli" >> "$GITHUB_OUTPUT"
      - name: Fetch protected main without credentials
        run: git -C candidate fetch --no-tags origin main:refs/remotes/origin/main
      - name: Capture draft-inclusive GitHub Release evidence
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api --paginate --slurp "repos/$GITHUB_REPOSITORY/releases?per_page=100" > "$RUNNER_TEMP/ca-pi-releases.json"
      - name: Reverify the exact retained package cohort
        id: cohort
        env:
          SOURCE_COMMIT: ${{ inputs.expected_sha }}
          CI_RUN_ID: ${{ inputs.ci_run_id }}
          STAGE_ROOT: ${{ runner.temp }}/artifact-publication-stage
          PACKAGE_ROOT: ${{ runner.temp }}/artifact-publication-packages
          COLD_ROOT: ${{ runner.temp }}/artifact-publication-cold
          NPM_CLI: ${{ steps.npm-cli.outputs.executable }}
          TRUSTED_SHA: ${{ github.sha }}
          CONTINUATION: ${{ inputs.continuation }}
        run: |
          set -euo pipefail
          extra=()
          if [ "$CONTINUATION" = true ]; then extra+=(--allow-continuation); fi
          python3 trusted/.github/scripts/_npm_publishlib.py verify-cohort \
            --package-root "$PACKAGE_ROOT" --stage-root "$STAGE_ROOT" --cold-root "$COLD_ROOT" \
            --source-repo candidate --source-commit "$SOURCE_COMMIT" --ci-run-id "$CI_RUN_ID" \
            --workflow-sha "$TRUSTED_SHA" --npm "$NPM_CLI" --trusted-repo trusted \
            --host pi --output "$GITHUB_OUTPUT" "${extra[@]}"
      - name: Verify exact draft cohort-start marker before npm mutation
        env:
          RELEASE_TAG: ${{ inputs.tag }}
          SOURCE_COMMIT: ${{ inputs.expected_sha }}
          SOURCE_TREE: ${{ steps.cohort.outputs.source-tree }}
          CI_RUN_ID: ${{ inputs.ci_run_id }}
          COHORT_SHA256: ${{ steps.cohort.outputs.cohort-sha256 }}
          COHORT_TARGETS: ${{ inputs.cohort_targets }}
        run: |
          python3 - <<'PY'
          import base64, hashlib, json, os, re
          pages=json.load(open(os.path.join(os.environ["RUNNER_TEMP"], "ca-pi-releases.json")))
          found=[r for p in pages for r in p if r.get("tag_name")==os.environ["RELEASE_TAG"]]
          if len(found)!=1 or found[0].get("draft") is not True:
              raise SystemExit("Pi cohort Release must exist exactly once as a draft")
          versions={"ca":json.load(open("candidate/plugins/ca/.claude-plugin/plugin.json"))["version"],
                    "ca-codex":json.load(open("candidate/plugins/ca-codex/.codex-plugin/plugin.json"))["version"],
                    "ca-pi":json.load(open("candidate/plugins/ca-pi/package.json"))["version"]}
          body=found[0].get("body")
          match=re.fullmatch(
              r"(?s)(.*\n)\n<!-- codearbiter-cohort-start-v1:([A-Za-z0-9_-]+) -->\n",
              body if isinstance(body,str) else "")
          if match is None or body.count("codearbiter-cohort-start-v1:")!=1:
              raise SystemExit("Pi cohort-start body is noncanonical or has duplicate markers")
          notes=match.group(1).encode("utf-8")
          marker={"format":"codearbiter.cohort-start/0.1.0","target":"ca-pi","host":"pi",
                  "tag":os.environ["RELEASE_TAG"],"source_commit":os.environ["SOURCE_COMMIT"],
                  "source_tree":os.environ["SOURCE_TREE"],"workflow":".github/workflows/ci.yml",
                  "ci_run_id":os.environ["CI_RUN_ID"],"cohort_sha256":os.environ["COHORT_SHA256"],
                  "release_notes_sha256":hashlib.sha256(notes).hexdigest(),
                  "cohort_tags":{"ca":"v"+versions["ca"],
                                 "ca-codex":"ca-codex-v"+versions["ca-codex"],
                                 "ca-pi":"ca-pi-v"+versions["ca-pi"]},
                  "cohort_targets":os.environ["COHORT_TARGETS"].split(",")}
          observed=base64.urlsafe_b64decode(match.group(2)+"="*(-len(match.group(2))%4))
          expected=json.dumps(marker,sort_keys=True,separators=(",",":")).encode()
          if observed!=expected: raise SystemExit("Pi cohort-start marker identity mismatch")
          with open(os.path.join(os.environ["RUNNER_TEMP"],"pi-cohort-marker.json"),"wb") as stream:
              stream.write(expected+b"\n")
          json.dump(found[0],open(os.path.join(os.environ["RUNNER_TEMP"],"ca-pi-release.json"),"w"))
          PY
      - name: Validate identity, select prebuilt tarball, and classify exact registry state
        id: artifact
        # The helper requires the tag and both manifest versions to match.
        env:
          RELEASE_TAG: ${{ inputs.tag }}
          EXPECTED_SHA: ${{ inputs.expected_sha }}
          TRUSTED_SHA: ${{ github.sha }}
          NPM_CLI: ${{ steps.npm-cli.outputs.executable }}
          CI_RUN_ID: ${{ inputs.ci_run_id }}
          CONTINUATION: ${{ inputs.continuation }}
        run: |
          set -euo pipefail
          TARBALL=$(python3 - <<'PY'
          import json, os
          from pathlib import Path
          root = Path(os.environ["RUNNER_TEMP"]) / "artifact-publication-packages"
          receipt = json.loads((root / "artifact-package-cohort.json").read_text(encoding="utf-8"))
          print(root / receipt["packages"]["pi"]["file"])
          PY
          )
          extra=()
          if [ "$CONTINUATION" = true ]; then extra+=(--allow-continuation); fi
          python3 trusted/.github/scripts/_npm_publishlib.py prepare \
            --repo candidate \
            --trusted-repo trusted \
            --tag "$RELEASE_TAG" \
            --expected-sha "$EXPECTED_SHA" \
            --trusted-sha "$TRUSTED_SHA" \
            --root-manifest package.json \
            --plugin-manifest plugins/ca-pi/package.json \
            --release-json "$RUNNER_TEMP/ca-pi-release.json" \
            --cohort "$RUNNER_TEMP/artifact-publication-packages/artifact-package-cohort.json" \
            --tarball "$TARBALL" \
            --ci-run-id "$CI_RUN_ID" \
            --require-draft \
            --npm "$NPM_CLI" \
            --output "$GITHUB_OUTPUT" "${extra[@]}"
      - name: Require exact annotated tag object before npm mutation
        env:
          RELEASE_TAG: ${{ inputs.tag }}
          EXPECTED_SHA: ${{ inputs.expected_sha }}
          EXPECTED_TAG_OBJECT_SHA: ${{ inputs.expected_tag_object_sha }}
        run: |
          set -euo pipefail
          git -C candidate ls-remote --tags origin "refs/tags/$RELEASE_TAG" \
            "refs/tags/$RELEASE_TAG^{}" > "$RUNNER_TEMP/pi-tag-identity.txt"
          python3 trusted/.github/scripts/_npm_publishlib.py tag-identity \
            --remote "$RUNNER_TEMP/pi-tag-identity.txt" --tag "$RELEASE_TAG" \
            --source "$EXPECTED_SHA" --expected-object "$EXPECTED_TAG_OBJECT_SHA" >/dev/null
      - name: Re-fetch exact empty marker-owned draft immediately before npm publish
        if: steps.artifact.outputs.skip != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.tag }}
        run: |
          set -euo pipefail
          gh api --paginate --slurp "repos/$GITHUB_REPOSITORY/releases?per_page=100" \
            > "$RUNNER_TEMP/pi-immediate-prepublish-releases.json"
          python3 trusted/.github/scripts/_npm_publishlib.py qualified-finalize \
            --releases "$RUNNER_TEMP/pi-immediate-prepublish-releases.json" \
            --tag "$RELEASE_TAG" --marker "$RUNNER_TEMP/pi-cohort-marker.json" >/dev/null
      - name: Publish with provenance
        id: publish
        if: steps.artifact.outputs.skip != 'true'
        run: '"$NPM_CLI" publish "$TARBALL" --ignore-scripts --provenance --access public --registry=https://registry.npmjs.org/ --@arbiterforge:registry=https://registry.npmjs.org/'
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPMJS_TOKEN }}
          NPM_CLI: ${{ steps.npm-cli.outputs.executable }}
          TARBALL: ${{ steps.artifact.outputs.tarball }}
      - name: Verify exact registry publication evidence
        id: registry-readback
        env:
          RELEASE_TAG: ${{ inputs.tag }}
          EXPECTED_SHA: ${{ inputs.expected_sha }}
          TRUSTED_SHA: ${{ github.sha }}
          EXPECTED_INTEGRITY: ${{ steps.artifact.outputs.integrity }}
          PUBLICATION_MODE: ${{ steps.artifact.outputs.publication_mode }}
          NPM_CLI: ${{ steps.npm-cli.outputs.executable }}
          CONTINUATION: ${{ inputs.continuation }}
        run: |
          set -euo pipefail
          extra=()
          if [ "$CONTINUATION" = true ]; then extra+=(--allow-continuation); fi
          python3 trusted/.github/scripts/_npm_publishlib.py verify \
            --repo trusted \
            --tag "$RELEASE_TAG" \
            --expected-sha "$EXPECTED_SHA" \
            --trusted-sha "$TRUSTED_SHA" \
            --integrity "$EXPECTED_INTEGRITY" \
            --npm "$NPM_CLI" \
            --publication-mode "$PUBLICATION_MODE" "${extra[@]}"
      - name: Create immutable durable cohort receipt
        env:
          RELEASE_TAG: ${{ inputs.tag }}
          SOURCE_COMMIT: ${{ inputs.expected_sha }}
          SOURCE_TREE: ${{ steps.cohort.outputs.source-tree }}
          CI_RUN_ID: ${{ inputs.ci_run_id }}
          COHORT_SHA256: ${{ steps.cohort.outputs.cohort-sha256 }}
          PACKAGE_FILE: ${{ steps.cohort.outputs.file }}
          PACKAGE_SHA256: ${{ steps.cohort.outputs.sha256 }}
          TAG_OBJECT_SHA: ${{ inputs.expected_tag_object_sha }}
          COHORT_TARGETS: ${{ inputs.cohort_targets }}
        run: |
          set -euo pipefail
          receipt="$RUNNER_TEMP/codearbiter-cohort-publication-v1.json"
          python3 - "$receipt" <<'PY'
          import json, os, sys
          versions = {"ca": json.load(open("candidate/plugins/ca/.claude-plugin/plugin.json"))["version"],
                      "ca-codex": json.load(open("candidate/plugins/ca-codex/.codex-plugin/plugin.json"))["version"],
                      "ca-pi": json.load(open("candidate/plugins/ca-pi/package.json"))["version"]}
          cohort_targets = os.environ["COHORT_TARGETS"].split(",")
          if (cohort_targets != sorted(set(cohort_targets)) or "ca-pi" not in cohort_targets
                  or not set(cohort_targets) <= {"ca", "ca-codex", "ca-pi"}):
              raise SystemExit("hosted cohort targets are missing, duplicate, or unexpected")
          receipt = {"format": "codearbiter.cohort-publication/0.1.0",
                     "target": "ca-pi", "host": "pi", "tag": os.environ["RELEASE_TAG"],
                     "source_commit": os.environ["SOURCE_COMMIT"],
                     "source_tree": os.environ["SOURCE_TREE"], "ci_run_id": os.environ["CI_RUN_ID"],
                     "cohort_sha256": os.environ["COHORT_SHA256"],
                     "package_file": os.environ["PACKAGE_FILE"],
                     "package_sha256": os.environ["PACKAGE_SHA256"],
                     "tag_object_sha": os.environ["TAG_OBJECT_SHA"],
                     "release_notes_sha256": json.load(open(os.path.join(
                         os.environ["RUNNER_TEMP"], "pi-cohort-marker.json")))["release_notes_sha256"],
                     "cohort_tags": {"ca": "v" + versions["ca"],
                                     "ca-codex": "ca-codex-v" + versions["ca-codex"],
                                     "ca-pi": "ca-pi-v" + versions["ca-pi"]},
                     "cohort_targets": cohort_targets,
                     "readback": "verified", "disposition": "published-and-read-back"}
          with open(sys.argv[1], "x", encoding="utf-8", newline="\n") as stream:
              json.dump(receipt, stream, indent=2, sort_keys=True); stream.write("\n")
          PY
      - name: Stage durable Pi cohort receipt for publisher-isolated retention
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: durable-pi-cohort-receipt-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/codearbiter-cohort-publication-v1.json
          if-no-files-found: error
          retention-days: 90
      - name: Capture npm package publication disposition
        if: ${{ always() }}
        env:
          PUBLISH_OUTCOME: ${{ steps.publish.outcome }}
          READBACK_OUTCOME: ${{ steps.registry-readback.outcome }}
          SOURCE_COMMIT: ${{ inputs.expected_sha }}
          CI_RUN_ID: ${{ inputs.ci_run_id }}
          RELEASE_TAG: ${{ inputs.tag }}
          PACKAGE_VERSION: ${{ steps.artifact.outputs.version }}
          PACKAGE_INTEGRITY: ${{ steps.artifact.outputs.integrity }}
          PUBLICATION_MODE: ${{ steps.artifact.outputs.publication_mode }}
          RECEIPT_PATH: ${{ runner.temp }}/artifact-package-publication-pi-${{ github.run_id }}-${{ github.run_attempt }}.json
        run: |
          python3 - <<'PY'
          import hashlib, json, os
          from pathlib import Path
          root = Path(os.environ["RUNNER_TEMP"]) / "artifact-publication-packages"
          try:
              cohort_path = root / "artifact-package-cohort.json"
              cohort = json.loads(cohort_path.read_text(encoding="utf-8"))
              package = cohort["packages"]["pi"]
              identity = {"cohort_sha256": hashlib.sha256(cohort_path.read_bytes()).hexdigest(),
                          "asset_file": package["file"], "asset_sha256": package["sha256"]}
          except Exception as error:
              identity = {"cohort_error": f"{type(error).__name__}: {error}"}
          receipt = {"format": "codearbiter.artifact-package-publication/0.1.0", "host": "pi",
                     "source_commit": os.environ["SOURCE_COMMIT"], "ci_run_id": os.environ["CI_RUN_ID"],
                     "release_run_id": os.environ["GITHUB_RUN_ID"],
                     "release_run_attempt": os.environ["GITHUB_RUN_ATTEMPT"],
                     "tag": os.environ["RELEASE_TAG"], "version": os.environ["PACKAGE_VERSION"],
                     "integrity": os.environ["PACKAGE_INTEGRITY"],
                     "publication_mode": os.environ["PUBLICATION_MODE"],
                     "publish_outcome": os.environ["PUBLISH_OUTCOME"],
                     "readback_outcome": os.environ["READBACK_OUTCOME"], **identity,
                     "disposition": "published-and-read-back" if os.environ["READBACK_OUTCOME"] == "success" else "partial-publication-stop"}
          with open(os.environ["RECEIPT_PATH"], "x", encoding="utf-8", newline="\n") as stream:
              json.dump(receipt, stream, indent=2, sort_keys=True); stream.write("\n")
          PY
      - name: Retain npm package publication disposition
        if: ${{ always() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: artifact-package-publication-pi-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/artifact-package-publication-pi-${{ github.run_id }}-${{ github.run_attempt }}.json
          if-no-files-found: error
          retention-days: 90
