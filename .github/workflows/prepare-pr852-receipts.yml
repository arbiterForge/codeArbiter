name: Prepare PR852 publication receipts
on:
  push:
    branches: [prep/pr852-publication-receipts-20260924]
    paths: [.github/workflows/prepare-pr852-receipts.yml]
permissions: {}
jobs:
  verify:
    if: github.repository == 'arbiterForge/codeArbiter' && github.ref == 'refs/heads/prep/pr852-publication-receipts-20260924'
    runs-on: ubuntu-latest
    timeout-minutes: 8
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: 831e22bc11ea93eab07098a509ba9ec68f77e073
          persist-credentials: false
      - name: Authenticate original receipts and prepare append-only candidate
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          python3 - <<'PY'
          import hashlib,io,json,os,re,subprocess,sys,zipfile
          from pathlib import Path
          out=Path(os.environ['RUNNER_TEMP'])/'receipts';out.mkdir()
          repo='arbiterForge/codeArbiter';base='831e22bc11ea93eab07098a509ba9ec68f77e073'
          commit='cf90ce4d79c5d87cb88f163535c1035da2315815';run_id=35957243864
          assert subprocess.check_output(['git','rev-parse','HEAD'],text=True).strip()==base
          def api(endpoint):
              return subprocess.check_output(['gh','api','repos/'+repo+'/'+endpoint],timeout=60)
          run=json.loads(api('actions/runs/'+str(run_id)))
          assert (run['head_sha'],run['path'],run['run_attempt'],run['conclusion'],run['repository']['full_name'])==(commit,'.github/workflows/release.yml',1,'success',repo)
          records=[
            ('v2.21.12',10790504318,107498192151,'79cea7db741fac072c4f859f0631f0564084273d5713dadce96b41c2b4e5a962','ef157eab229c8f143c0d13444a45e62b6c571499'),
            ('ca-codex-v0.13.12',10791186306,107498414352,'1d5f0dc30344e4f50eb136339293da144bdd9c228e1e990f9453edb5afc20986','67dff985d712eaae5a5bc829821244ea7f29867d'),
            ('ca-pi-v0.14.12',10790577928,107498693023,'e4a50f2366794e7c63ecb20528c5ddcd0e60e6209782aac1fd56f60cd28089b1','ca1605b16e745bc7a19d76912c499f48d6b61156'),
          ]
          manifest=Path('.github/published-tags.json').resolve();legacy=Path('.github/legacy-published-tags.json').resolve()
          original=manifest.read_bytes();legacy_hash=hashlib.sha256(legacy.read_bytes()).hexdigest()
          assert hashlib.sha256(original).hexdigest()=='d229ae5c4db5663b4ec50b74fd2c869eea7abca668826ee5d3593ffca19b0f4e'
          assert legacy_hash=='d9ae0a45cec0a873c8ed5d28e9f3fc255a6e7cfb4c79e3ccfba80b8294a7e8db'
          current=manifest;evidence=[]
          for index,(tag,artifact_id,job_id,digest,oid) in enumerate(records):
              metadata=json.loads(api('actions/artifacts/'+str(artifact_id)))
              assert metadata['workflow_run']['id']==run_id and metadata['workflow_run']['head_sha']==commit
              assert metadata['digest']=='sha256:'+digest and not metadata['expired']
              raw=api('actions/artifacts/'+str(artifact_id)+'/zip')
              assert len(raw)<32768 and hashlib.sha256(raw).hexdigest()==digest
              (out/(str(artifact_id)+'.zip')).write_bytes(raw)
              with zipfile.ZipFile(io.BytesIO(raw)) as archive:
                  assert len(archive.infolist())==1 and archive.infolist()[0].file_size<16384
                  receipt_bytes=archive.read(archive.infolist()[0])
              receipt=json.loads(receipt_bytes)
              assert receipt['tag']==tag and receipt['identity']=={'object_sha':oid,'object_type':'tag','commit_sha':commit}
              ref=json.loads(api('git/ref/tags/'+tag))
              obj=json.loads(api('git/tags/'+oid))
              assert ref['object']['sha']==oid and ref['object']['type']=='tag'
              assert obj['object']=={'sha':commit,'type':'commit','url':'https://api.github.com/repos/'+repo+'/git/commits/'+commit}
              job=json.loads(api('actions/jobs/'+str(job_id)))
              assert job['run_id']==run_id and job['conclusion']=='success'
              log=api('actions/jobs/'+str(job_id)+'/logs').decode('utf-8-sig')
              fresh=[line for line in log.splitlines() if re.fullmatch(r'\S+Z qualified publish state: marker_durable_tag_created',line)]
              pushed=[line for line in log.splitlines() if '[new tag]' in line and line.rstrip().endswith(tag+' -> '+tag)]
              assert fresh and pushed, 'not original tag creation evidence'
              receipt_path=out/(str(artifact_id)+'.json');receipt_path.write_bytes(receipt_bytes)
              candidate=out/('candidate-'+str(index)+'.json')
              command=[sys.executable,'.github/scripts/reconcile_tag_receipt.py','--receipt',str(receipt_path),'--manifest',str(current),'--legacy-manifest',str(legacy),'--output',str(candidate),'--expected-manifest-sha256',hashlib.sha256(current.read_bytes()).hexdigest(),'--expected-legacy-sha256',legacy_hash,'--expected-repo',repo,'--expected-tag',tag,'--expected-commit',commit,'--expected-run-id',str(run_id),'--expected-run-attempt','1','--expected-workflow-sha',commit]
              subprocess.run(command,check=True);current=candidate
              evidence.append({'tag':tag,'artifact_id':artifact_id,'artifact_sha256':digest,'job_id':job_id,'log_sha256':hashlib.sha256(log.encode()).hexdigest(),'original_creation_lines':fresh+pushed,'identity':receipt['identity']})
          payload=current.read_bytes()
          assert hashlib.sha256(payload).hexdigest()=='71bad5f618bfd39d3694c7e8dbd0ba26ac127f507177bd09cf60345db367cdaf'
          assert hashlib.sha1(b'blob '+str(len(payload)).encode()+b'\0'+payload).hexdigest()=='fb242bb1212a31926c48b85e677b9d1e78351a32'
          manifest.write_bytes(payload)
          for name in ['test_tag_immutability.py','test_tag_publication_receipt.py','test_reconcile_tag_receipt.py']:
              with (out/(name+'.log')).open('w') as log:
                  subprocess.run([sys.executable,'.github/scripts/'+name],stdout=log,stderr=subprocess.STDOUT,check=True,timeout=120)
          with (out/'live-audit.log').open('w') as log:
              subprocess.run([sys.executable,'.github/scripts/check_tag_immutability.py','--repo',repo,'--require-recorded','--manifest',str(manifest),'--legacy-manifest',str(legacy)],stdout=log,stderr=subprocess.STDOUT,check=True,timeout=120)
          assert subprocess.check_output(['git','diff','--name-only'],text=True).splitlines()==['.github/published-tags.json']
          (out/'published-tags.json').write_bytes(payload)
          (out/'evidence.json').write_text(json.dumps({'base':base,'release_run':run_id,'attempt':1,'workflow_sha':commit,'receipts':evidence,'candidate_sha256':hashlib.sha256(payload).hexdigest(),'original_records_preserved':True,'refs_modified':False},indent=2)+'\n')
          PY
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        if: always()
        with:
          name: pr852-original-receipt-evidence
          path: ${{ runner.temp }}/receipts/
          if-no-files-found: error
          retention-days: 3
  store:
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 3
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          name: pr852-original-receipt-evidence
          path: ${{ runner.temp }}/receipts
      - name: Store only the verified ledger blob
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          python3 - <<'PY'
          import hashlib,json,os,urllib.request
          from pathlib import Path
          raw=(Path(os.environ['RUNNER_TEMP'])/'receipts/published-tags.json').read_bytes()
          assert len(raw)<50000 and hashlib.sha256(raw).hexdigest()=='71bad5f618bfd39d3694c7e8dbd0ba26ac127f507177bd09cf60345db367cdaf'
          request=urllib.request.Request('https://api.github.com/repos/arbiterForge/codeArbiter/git/blobs',data=json.dumps({'content':raw.decode(),'encoding':'utf-8'}).encode(),method='POST',headers={'Authorization':'Bearer '+os.environ['GH_TOKEN'],'Accept':'application/vnd.github+json','Content-Type':'application/json'})
          with urllib.request.urlopen(request,timeout=60) as response:result=json.load(response)
          assert result['sha']=='fb242bb1212a31926c48b85e677b9d1e78351a32'
          print('VERIFIED_UNREFERENCED_BLOB='+result['sha'])
          PY
  pi-diagnostic:
    if: github.repository == 'arbiterForge/codeArbiter' && github.ref == 'refs/heads/prep/pr852-publication-receipts-20260924'
    runs-on: macos-latest
    timeout-minutes: 8
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: 831e22bc11ea93eab07098a509ba9ec68f77e073
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 22.19.0
          package-manager-cache: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: 3.x
      - name: Repeat the unchanged pinned install with bounded error output
        shell: bash
        run: |
          python3 - <<'PY'
          import json,os,re,subprocess,sys
          from pathlib import Path
          sys.path.insert(0,str(Path('.github/scripts').resolve()))
          import pi_host_locks
          out=Path(os.environ['RUNNER_TEMP'])/'pi-diagnostic';out.mkdir()
          try:
              result=pi_host_locks.install(Path.cwd(),'0.84.1',out/'host')
          except subprocess.CalledProcessError as error:
              streams={}
              for name,value in [('stdout',error.stdout),('stderr',error.stderr)]:
                  value=value or ''
                  value=re.sub(r'\x1b\[[0-9;]*[A-Za-z]','',value)
                  value=re.sub(r'npm_[A-Za-z0-9]{20,}|gh[pousr]_[A-Za-z0-9]{20,}','[REDACTED]',value)
                  streams[name]=value[:12000]
                  for line in streams[name].splitlines():print('DIAGNOSTIC | '+line)
              (out/'result.json').write_text(json.dumps({'exit_code':error.returncode,'command_class':error.cmd[1:3],**streams},indent=2)+'\n')
              raise SystemExit(error.returncode)
          else:
              (out/'result.json').write_text(json.dumps({'exit_code':0,'result':result,'signature_audit_unchanged':True},indent=2)+'\n')
              print('Pinned Pi installation and unchanged signature audit passed')
          PY
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        if: always()
        with:
          name: pr852-pi-install-diagnostic
          path: ${{ runner.temp }}/pi-diagnostic/result.json
          if-no-files-found: error
          retention-days: 3
