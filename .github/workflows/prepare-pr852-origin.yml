name: Prepare PR852 origin integration
on:
  push:
    branches: [prep/pr852-origin-sync-20260924]
    paths: [.github/workflows/prepare-pr852-origin.yml, .github/pr852-integrate.py]
permissions: {}
jobs:
  verify:
    if: github.repository == 'arbiterForge/codeArbiter' && github.ref == 'refs/heads/prep/pr852-origin-sync-20260924'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.sha }}
          path: control
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: 7fe42851182ac4a231ee2a4c43322d0fd35489e8
          path: candidate
          fetch-depth: 0
          persist-credentials: false
      - name: Verify reviewed driver identity and execute source checks
        shell: bash
        run: |
          python3 - <<'PY'
          import hashlib, os, subprocess, sys
          from pathlib import Path
          root=Path(os.environ['GITHUB_WORKSPACE'])
          out=Path(os.environ['RUNNER_TEMP'])/'pr852-integration'
          out.mkdir()
          raw=(root/'control/.github/pr852-integrate.py').read_bytes()
          (out/'received-driver.py').write_bytes(raw)
          # Two transfer transcription corrections; the final byte identity,
          # not these substitutions, is the execution authority.
          raw=raw.replace(b'ONtb6suBX',b'ONtb6zuBX').replace(b'BSip3HGC6Xp',b'BSip3GC6Xp')
          driver=out/'reviewed-driver.py'
          driver.write_bytes(raw)
          assert hashlib.sha1(b'blob '+str(len(raw)).encode()+b'\0'+raw).hexdigest()=='97cc7c552e766f59deb974449b0331922e5fd87b', 'driver differs from locally reviewed source'
          subprocess.run([sys.executable,str(driver),str(root/'candidate'),str(out)],check=True)
          PY
      - name: Retain exact integration and archived-payload evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: pr852-integration-evidence
          path: ${{ runner.temp }}/pr852-integration/
          retention-days: 3
          if-no-files-found: error
  store:
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          name: pr852-integration-evidence
          path: ${{ runner.temp }}/pr852-integration
      - name: Store checked blobs and tree without changing references
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 - <<'PY'
          import hashlib,json,os,urllib.request
          from pathlib import Path
          out=Path(os.environ['RUNNER_TEMP'])/'pr852-integration'
          raw=(out/'files.json').read_bytes()
          assert len(raw)<3000000 and hashlib.sha256(raw).hexdigest()=='5dababcea627f69313c7d4dcd2fb6f857c063673c984b83021676fb806f1cea1'
          packet=json.loads(raw)
          assert packet['repository']=='arbiterForge/codeArbiter'
          assert packet['pr']=='7fe42851182ac4a231ee2a4c43322d0fd35489e8'
          assert packet['upstream']=='cf90ce4d79c5d87cb88f163535c1035da2315815'
          assert packet['tree']=='7fc1677a32f502ca789e9c4607717aa855974e2e'
          assert packet['base_tree']=='65feb6e0b2f98ac7f104e7ad218fed30cf1d85d4'
          # This job never executes candidate code or downloaded commands.
          def post(kind,payload):
              assert kind in ('blobs','trees')
              req=urllib.request.Request('https://api.github.com/repos/arbiterForge/codeArbiter/git/'+kind,
                  data=json.dumps(payload).encode(),method='POST',headers={
                  'Authorization':'Bearer '+os.environ['GH_TOKEN'],
                  'Accept':'application/vnd.github+json','Content-Type':'application/json',
                  'X-GitHub-Api-Version':'2022-11-28'})
              with urllib.request.urlopen(req,timeout=60) as response:return json.load(response)
          entries=[];stored=set()
          for entry in packet['files']:
              data=entry['content'].encode('utf-8')
              oid=hashlib.sha1(b'blob '+str(len(data)).encode()+b'\0'+data).hexdigest()
              assert oid==entry['sha']
              if oid not in stored:
                  assert post('blobs',{'content':entry['content'],'encoding':'utf-8'})['sha']==oid
                  stored.add(oid)
              entries.append({'path':entry['path'],'mode':entry['mode'],'type':'blob','sha':oid})
          result=post('trees',{'base_tree':packet['base_tree'],'tree':entries})
          assert result['sha']==packet['tree']
          (out/'objects.json').write_text(json.dumps({'tree':result['sha'],'refs_modified':False,'independent_skill_exercise':False},indent=2)+'\n')
          print('VERIFIED_UNREFERENCED_TREE='+result['sha'])
          PY
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: pr852-integration-objects
          path: ${{ runner.temp }}/pr852-integration/objects.json
          retention-days: 3
          if-no-files-found: error
