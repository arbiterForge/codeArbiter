name: PR862 CI inputs
on:
  push:
    branches: [prep/pr862-ci-source]
    paths: [.github/workflows/pr862-ci-inputs.yml]
permissions:
  contents: read
jobs:
  capture:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: a0eec5035c31d804146cc9480324879f1e928856
          fetch-depth: 0
          submodules: true
          persist-credentials: false
      - name: Capture source objects without running candidate code
        shell: bash
        run: |
          set -euo pipefail
          out="$RUNNER_TEMP/pr862-ci-inputs"
          mkdir -p "$out"
          git bundle create "$out/source.bundle" HEAD --tags
          git -C academy-source bundle create "$out/academy.bundle" HEAD
          git rev-parse HEAD HEAD^{tree} > "$out/identity.txt"
          git -C academy-source rev-parse HEAD > "$out/academy-identity.txt"
          cd "$out"
          sha256sum source.bundle academy.bundle identity.txt academy-identity.txt > SHA256SUMS
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: pr862-ci-inputs
          path: ${{ runner.temp }}/pr862-ci-inputs/
          retention-days: 1
          if-no-files-found: error
