name: PR862 CI inputs
on:
  push:
    branches: [prep/pr862-ci-source]
    paths: [.github/workflows/pr862-ci-inputs.yml]
permissions:
  contents: read
jobs:
  capture:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: 703abc9ed45b68d075ff867c75bc81ea06084b6f
          fetch-depth: 0
          persist-credentials: false
      - name: Capture exact source objects without executing candidate code
        shell: bash
        run: |
          set -euo pipefail
          out="$RUNNER_TEMP/pr862-parent-inputs"
          mkdir -p "$out"
          git branch captured-pr862 a0eec5035c31d804146cc9480324879f1e928856
          git branch captured-main 929229354e3a15ae3002c82116b66c837ab43729
          git bundle create "$out/source.bundle" HEAD captured-pr862 captured-main --tags
          git rev-parse HEAD HEAD^{tree} captured-pr862 captured-main > "$out/identity.txt"
          cd "$out"
          sha256sum source.bundle identity.txt > SHA256SUMS
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: pr862-parent-inputs
          path: ${{ runner.temp }}/pr862-parent-inputs/
          retention-days: 1
          if-no-files-found: error
