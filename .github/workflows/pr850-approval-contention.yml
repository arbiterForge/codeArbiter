name: PR850 approval contention validation (temporary)
on:
  push:
    branches: [codex/spec-continuation-checkpoint-remediation]
    paths: [.github/workflows/pr850-approval-contention.yml]
permissions:
  contents: read
jobs:
  validate:
    if: github.repository == 'arbiterForge/codeArbiter' && github.ref == 'refs/heads/codex/spec-continuation-checkpoint-remediation'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.14'
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e
        with:
          go-version: '1.27.1'
          check-latest: false
          cache: false
          go-download-base-url: https://go.dev/dl
      - name: Acquire pinned one-file correction
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python - <<'PY'
          import base64,hashlib,json,lzma,os,pathlib,urllib.request
          assert os.environ['GITHUB_REPOSITORY']=='arbiterForge/codeArbiter'
          assert os.environ['GITHUB_REF']=='refs/heads/codex/spec-continuation-checkpoint-remediation'
          out=pathlib.Path(os.environ['RUNNER_TEMP'])/'approval-contention';out.mkdir()
          sha='0cd4832f8cd38e38e68ed7a051e37e991b0405d1'
          class NoRedirect(urllib.request.HTTPRedirectHandler):
              def redirect_request(self,*args,**kwargs):raise RuntimeError('Unexpected redirect')
          req=urllib.request.Request('https://api.github.com/repos/arbiterForge/codeArbiter/git/blobs/'+sha,headers={'Authorization':'Bearer '+os.environ['GH_TOKEN'],'Accept':'application/vnd.github+json'})
          with urllib.request.build_opener(NoRedirect).open(req,timeout=45) as response:record=json.load(response)
          assert record['sha']==sha and record['encoding']=='base64'
          packed=base64.b64decode(record['content'])
          assert hashlib.sha1(b'blob '+str(len(packed)).encode()+b'\0'+packed).hexdigest()==sha
          raw=lzma.decompress(packed)
          assert len(raw)==4010 and hashlib.sha256(raw).hexdigest()=='673697735e88e4d345bf5742702fe606a059e9b4757e13b90db24d2d5a80ddfb'
          (out/'input.json').write_bytes(raw)
          PY
      - name: Execute unchanged production locking and corrected test oracles
        shell: bash
        run: |
          python - <<'PY'
          import hashlib,json,os,pathlib,subprocess,sys
          out=pathlib.Path(os.environ['RUNNER_TEMP'])/'approval-contention';record=json.loads((out/'input.json').read_text())
          base=record['parent'];head=os.environ['GITHUB_SHA'];temporary='.github/workflows/pr850-approval-contention.yml'
          assert base=='dac0e9c96bb969bca1095d27091310e2ee52f703'
          subprocess.run(['git','merge-base','--is-ancestor',base,head],check=True)
          assert subprocess.check_output(['git','diff','--name-only',base,head],text=True).splitlines()==[temporary]
          assert record['path']=='.github/scripts/test_artifact_approval_adapter.py' and record['mode']=='100644'
          p=pathlib.Path(record['path'])
          def oid():
              data=p.read_bytes();return hashlib.sha1(b'blob '+str(len(data)).encode()+b'\0'+data).hexdigest()
          assert oid()==record['before']
          patch=out/'reviewed.patch';patch.write_text(record['patch'])
          subprocess.run(['git','apply','--check','--index',str(patch)],check=True)
          subprocess.run(['git','apply','--index',str(patch)],check=True)
          assert oid()==record['sha']
          commands=[[sys.executable,'tools/build-artifacts.py','--output',str(out/'installation')],
                    [sys.executable,str(p)],
                    [sys.executable,'.github/scripts/test_artifact_prerequisite_adapter.py'],
                    [sys.executable,'.github/scripts/test_artifact_reconciliation_adapter.py'],
                    [sys.executable,'tools/build-surface.py','--check'],
                    [sys.executable,'tools/sync-core.py','--check'],
                    [sys.executable,'tools/build-host-packages.py','--check']]
          env=dict(os.environ,PYTHONDONTWRITEBYTECODE='1',GOTOOLCHAIN='local')
          results=[]
          for i,args in enumerate(commands):
              if i:env['ARTIFACT_TEST_INSTALLATION']=str(out/'installation')
              done=subprocess.run(args,env=env,capture_output=True,text=True,timeout=360)
              log=f'{i:02d}-'+pathlib.Path(args[1]).stem+'.log';(out/log).write_text(done.stdout+done.stderr)
              results.append({'command':args,'exit_code':done.returncode,'log':log});(out/'tests.json').write_text(json.dumps(results,indent=2))
              print(done.returncode,' '.join(args),flush=True)
              if done.returncode:print((done.stdout+done.stderr)[-12000:])
          assert all(r['exit_code']==0 for r in results)
          assert oid()==record['sha']
          assert subprocess.check_output(['git','diff','HEAD','--name-only'],text=True).splitlines()==[record['path']]
          subprocess.run(['git','rm','--',temporary],check=True)
          subprocess.run(['git','diff','--cached','--check'],check=True)
          tree=subprocess.check_output(['git','write-tree'],text=True).strip()
          (out/'candidate.diff').write_bytes(subprocess.check_output(['git','diff','--cached','--binary',base]))
          (out/'candidate.py').write_bytes(p.read_bytes())
          (out/'manifest.json').write_text(json.dumps({'base':base,'parent':head,'tree':tree,'path':record['path'],'mode':record['mode'],'sha':record['sha'],'all_tests_passed':True,'production_bytes_unchanged':True},indent=2))
          PY
      - name: Store tested candidate without moving a ref
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python - <<'PY'
          import hashlib,json,os,pathlib,urllib.request
          out=pathlib.Path(os.environ['RUNNER_TEMP'])/'approval-contention';report=json.loads((out/'manifest.json').read_text())
          assert report['all_tests_passed'] and report['parent']==os.environ['GITHUB_SHA']
          class NoRedirect(urllib.request.HTTPRedirectHandler):
              def redirect_request(self,*args,**kwargs):raise RuntimeError('Unexpected redirect')
          def api(method,path,data=None):
              req=urllib.request.Request('https://api.github.com/repos/arbiterForge/codeArbiter'+path,method=method,data=None if data is None else json.dumps(data).encode(),headers={'Authorization':'Bearer '+os.environ['GH_TOKEN'],'Content-Type':'application/json','Accept':'application/vnd.github+json'})
              with urllib.request.build_opener(NoRedirect).open(req,timeout=45) as response:return json.load(response)
          assert api('GET','/git/ref/heads/codex/spec-continuation-checkpoint-remediation')['object']['sha']==report['parent']
          data=pathlib.Path(report['path']).read_bytes();assert hashlib.sha1(b'blob '+str(len(data)).encode()+b'\0'+data).hexdigest()==report['sha']
          assert api('POST','/git/blobs',{'content':data.decode(),'encoding':'utf-8'})['sha']==report['sha']
          entries=[{'path':report['path'],'mode':report['mode'],'type':'blob','sha':report['sha']},{'path':'.github/workflows/pr850-approval-contention.yml','mode':'100644','type':'blob','sha':None}]
          previous=api('GET','/git/commits/'+report['parent'])['tree']['sha']
          tree=api('POST','/git/trees',{'base_tree':previous,'tree':entries})['sha'];assert tree==report['tree']
          commit=api('POST','/git/commits',{'message':'test: verify bounded approval contention without native timing assumptions\n\nPermit only the existing APPROVAL_BUSY non-writing outcome for a losing\nobserver while requiring exactly one approval. Exercise a real held OS\nlock deterministically and prove that retry preserves and completes the\noriginal decision. Production locking, timeouts and authority stay unchanged.','tree':tree,'parents':[report['parent']]})['sha']
          (out/'candidate.json').write_text(json.dumps({'commit':commit,'tree':tree,'parent':report['parent'],'branch_updated':False},indent=2))
          PY
      - name: Retain actual logs and tested source only
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: pr850-approval-contention-${{ github.run_id }}
          path: |
            ${{ runner.temp }}/approval-contention/*.json
            ${{ runner.temp }}/approval-contention/*.log
            ${{ runner.temp }}/approval-contention/*.patch
            ${{ runner.temp }}/approval-contention/*.diff
            ${{ runner.temp }}/approval-contention/candidate.py
          if-no-files-found: error
          retention-days: 3
