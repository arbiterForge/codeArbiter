name: PR854 D14 preserving merge qualification (temporary)
on:
  push:
    branches: [codex/farm-readiness-canary-isolation]
    paths: [.github/workflows/pr854-d14-source-capture.yml]
permissions:
  contents: read
jobs:
  validate:
    if: github.repository == 'arbiterForge/codeArbiter' && github.ref == 'refs/heads/codex/farm-readiness-canary-isolation'
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            label: linux
          - os: windows-latest
            label: windows
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: cf326b07078487b7f33ab89b40f5a15b3152b4b1
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.14'
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: '22.19.0'
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e
        with:
          go-version: '1.27.1'
          check-latest: false
          cache: false
          go-download-base-url: https://go.dev/dl
      - name: Acquire hash-bound resolution and validation scripts
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python - <<'PY'
          import os,pathlib,json,urllib.request,base64,hashlib
          assert os.environ['GITHUB_REPOSITORY']=='arbiterForge/codeArbiter'
          assert os.environ['GITHUB_REF']=='refs/heads/codex/farm-readiness-canary-isolation'
          out=pathlib.Path(os.environ['RUNNER_TEMP'])/'pr854-d14-merge';out.mkdir()
          class NoRedirect(urllib.request.HTTPRedirectHandler):
              def redirect_request(self,*args,**kwargs):raise RuntimeError('Unexpected redirect')
          rows=[('resolve_merge.py','c21dd82fd00b6398b344e58ea35046cf21b355ec','b112149a411621895a1117f7eb6e0f8ff55cdbdfe0c24b23926fc4a44215a2ec'),('validate_source.py','b9b569aa4e8ec1abaa21c3a845e67591794e7756','22dd850191c4f2dcb08c20cff5595a527b643093df27a2030b1c9ee553b02c2b')]
          for name,sha,digest in rows:
              req=urllib.request.Request('https://api.github.com/repos/arbiterForge/codeArbiter/git/blobs/'+sha,headers={'Authorization':'Bearer '+os.environ['GH_TOKEN'],'Accept':'application/vnd.github+json'})
              with urllib.request.build_opener(NoRedirect).open(req,timeout=45) as response:row=json.load(response)
              assert row['sha']==sha and row['encoding']=='base64'
              data=base64.b64decode(row['content'])
              assert hashlib.sha1(b'blob '+str(len(data)).encode()+b'\0'+data).hexdigest()==sha
              assert hashlib.sha256(data).hexdigest()==digest
              (out/name).write_bytes(data)
          PY
      - name: Build the independently inspected preserving tree
        shell: bash
        run: |
          python - <<'PY'
          import os,pathlib,subprocess,json
          root=pathlib.Path.cwd();out=pathlib.Path(os.environ['RUNNER_TEMP'])/'pr854-d14-merge'
          def git(*args):return subprocess.check_output(['git',*args])
          source='a469bf51d65ecbd88fae9d21994470f63f78630c';base='cf326b07078487b7f33ab89b40f5a15b3152b4b1';main='3bc62943be35b1593017016c3ecb4bbb2bc2fb88'
          assert git('rev-parse','HEAD').decode().strip()==base
          assert git('rev-parse',os.environ['GITHUB_SHA']+'^').decode().strip()==base
          assert not git('status','--porcelain=v1','--untracked-files=no').strip()
          # Replay verified tracked bytes only in this fresh hosted checkout.
          # This leaves product attributes and user/developer checkouts untouched.
          subprocess.run(['git','config','--local','core.autocrlf','false'],check=True)
          subprocess.run(['git','config','--local','core.eol','lf'],check=True)
          rows=[]
          for raw in git('ls-files','-s','-z').split(b'\0'):
              if not raw:continue
              info,p=raw.split(b'\t',1);mode,sha,stage=info.decode().split()
              if mode in {'100644','100755'}:rows.append((sha,p.decode()))
          data=subprocess.check_output(['git','cat-file','--batch'],input=('\n'.join(r[0] for r in rows)+'\n').encode());pos=0;replayed=[]
          for sha,p in rows:
              end=data.index(b'\n',pos);header=data[pos:end].decode().split();assert header[:2]==[sha,'blob']
              size=int(header[2]);raw=data[end+1:end+1+size];pos=end+size+2
              actual=(root/p).read_bytes();assert actual==raw or (os.name=='nt' and actual.replace(b'\r\n',b'\n')==raw),p
              if actual!=raw:(root/p).write_bytes(raw);replayed.append(p)
          assert pos==len(data)
          subprocess.run(['git','add','-u'],check=True)
          assert git('write-tree').strip()==git('rev-parse','HEAD^{tree}').strip()
          (out/'checkout-replay.json').write_text(json.dumps(replayed,indent=2),encoding='utf-8')
          merged=subprocess.run(['git','-c','user.name=Merge validation','-c','user.email=validation@example.invalid','merge','--no-commit','--no-ff',main],capture_output=True)
          (out/'merge.log').write_bytes(merged.stdout+merged.stderr);assert merged.returncode==1
          subprocess.run(['python',str(out/'resolve_merge.py'),str(root)],check=True)
          tree=git('write-tree').decode().strip();assert tree=='9211b638814bc6fabd3c50a42e32d7a4f7cfc5f1'
          env=dict(os.environ,GIT_AUTHOR_NAME='Merge validation',GIT_AUTHOR_EMAIL='validation@example.invalid',GIT_COMMITTER_NAME='Merge validation',GIT_COMMITTER_EMAIL='validation@example.invalid')
          fixture=subprocess.check_output(['git','commit-tree',tree,'-p',os.environ['GITHUB_SHA'],'-p',main],input=b'Validate D14 and upstream intent repair\n\nCHANGELOG: Preserve reconciliation and current source identities.\n',env=env).decode().strip()
          protected=['core/surface','plugins/ca/tools','core/artifacts','core/hosts.json','.github/workflows/ci.yml','.codearbiter/decisions']
          assert not git('diff','--name-only',source,fixture,'--',*protected).strip()
          for p in ['core/pysrc/_intentlib.py','.github/scripts/test_artifact_authoring.py','plugins/ca/hooks/tests/test_intentlib.py','.github/published-tags.json']:
              assert git('show',fixture+':'+p)==git('show',main+':'+p),p
          subprocess.run(['git','checkout','--detach',fixture],check=True)
          (out/'identity.json').write_text(json.dumps({'source_parent':source,'base':base,'main':main,'workflow_head':os.environ['GITHUB_SHA'],'fixture':fixture,'tree':tree},indent=2),encoding='utf-8')
          PY
      - name: Validate source, host closure and actual upstream native intent consumer
        shell: bash
        run: |
          python "$RUNNER_TEMP/pr854-d14-merge/validate_source.py" "$GITHUB_WORKSPACE" "$RUNNER_TEMP/pr854-d14-merge" --native
      - name: Bind exact files to completed results
        shell: bash
        run: |
          python - <<'PY'
          import pathlib,os,subprocess,json,hashlib,zipfile
          out=pathlib.Path(os.environ['RUNNER_TEMP'])/'pr854-d14-merge';r=json.loads((out/'identity.json').read_text());tests=json.loads((out/'tests.json').read_text())
          assert len(tests)==31 and all(t['exit_code']==0 for t in tests)
          def git(*args):return subprocess.check_output(['git',*args])
          assert not git('diff','--name-only').strip()
          assert git('rev-parse','HEAD^{tree}').decode().strip()==r['tree']
          names=git('diff','--name-only',r['base'],'HEAD').decode().splitlines();files=[]
          with zipfile.ZipFile(out/'candidate-files.zip','w',zipfile.ZIP_DEFLATED) as z:
              for p in names:
                  row=git('ls-tree','HEAD','--',p).decode().split()
                  if not row:
                      assert p=='.github/workflows/pr854-d14-source-capture.yml';files.append({'path':p,'sha':None,'mode':'100644','type':'blob'});continue
                  mode,kind,sha=row[:3];assert mode in {'100644','100755'} and kind=='blob'
                  data=git('show','HEAD:'+p);assert hashlib.sha1(b'blob '+str(len(data)).encode()+b'\0'+data).hexdigest()==sha
                  z.writestr(p,data);files.append({'path':p,'sha':sha,'mode':mode,'type':'blob'})
          assert len(files)==28
          (out/'candidate.diff').write_bytes(git('diff','--binary','--full-index',r['base'],'HEAD'))
          r.update(files=files,all_commands_passed=True,command_count=len(tests))
          (out/'manifest.json').write_text(json.dumps(r,indent=2),encoding='utf-8')
          PY
      - name: Store verified blobs only, never advance a branch
        if: matrix.label == 'linux'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python - <<'PY'
          import pathlib,os,json,urllib.request,subprocess,hashlib
          out=pathlib.Path(os.environ['RUNNER_TEMP'])/'pr854-d14-merge';r=json.loads((out/'manifest.json').read_text())
          assert r['all_commands_passed'] and r['tree']=='9211b638814bc6fabd3c50a42e32d7a4f7cfc5f1'
          class NoRedirect(urllib.request.HTTPRedirectHandler):
              def redirect_request(self,*args,**kwargs):raise RuntimeError('Unexpected redirect')
          def api(method,path,payload=None):
              req=urllib.request.Request('https://api.github.com/repos/arbiterForge/codeArbiter'+path,method=method,data=json.dumps(payload).encode() if payload is not None else None,headers={'Authorization':'Bearer '+os.environ['GH_TOKEN'],'Accept':'application/vnd.github+json','Content-Type':'application/json'})
              with urllib.request.build_opener(NoRedirect).open(req,timeout=45) as response:return json.load(response)
          assert api('GET','/git/ref/heads/codex/farm-readiness-canary-isolation')['object']['sha']==os.environ['GITHUB_SHA']
          for row in r['files']:
              if row['sha'] is None:continue
              data=subprocess.check_output(['git','show','HEAD:'+row['path']])
              assert hashlib.sha1(b'blob '+str(len(data)).encode()+b'\0'+data).hexdigest()==row['sha']
              assert api('POST','/git/blobs',{'content':data.decode('utf-8'),'encoding':'utf-8'})['sha']==row['sha']
          (out/'stored.json').write_text(json.dumps({'tree':r['tree'],'files':r['files'],'branch_updated':False},indent=2),encoding='utf-8')
          PY
      - name: Retain actual exact-tree evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: pr854-d14-merge-${{ matrix.label }}-${{ github.run_id }}
          path: ${{ runner.temp }}/pr854-d14-merge/
          if-no-files-found: error
          retention-days: 3
