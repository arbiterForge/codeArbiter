name: Concepts C04 objects
on:
  push:
    branches: [docs/concepts-workflow-propagation]
    paths: [.github/workflows/concepts-c04-objects.yml]
permissions:
  contents: write
jobs:
  prepare:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Verify fixed patch and create unreferenced blobs only
        shell: python
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          import base64, hashlib, json, lzma, os, pathlib, subprocess, urllib.request
          base = '090773ec6aa98687cd7b207985cb29ebb8f9c8e1'
          expected_tree = 'ac504898390f88772efed86ffb4e743f16951898'
          parts = [pathlib.Path(f'.github/c04-transfer/{i:02}.txt').read_text().strip() for i in range(1, 11)]
          assert [len(part) for part in parts] == [8000] * 9 + [7624]
          patch = lzma.decompress(base64.b64decode(''.join(parts), validate=True), memlimit=128 * 1024 * 1024)
          assert len(patch) == 409802
          assert hashlib.sha256(patch).hexdigest() == '07021959456c92ba8cf9e83b185682fb741e1ccd9f4a6e807770741e16caf721'
          subprocess.run(['git', 'checkout', '--detach', base], check=True)
          subprocess.run(['git', 'apply', '--check', '--index', '-'], input=patch, check=True)
          subprocess.run(['git', 'apply', '--index', '-'], input=patch, check=True)
          tree = subprocess.check_output(['git', 'write-tree'], text=True).strip()
          assert tree == expected_tree, tree
          paths = subprocess.check_output(['git', 'diff', '--cached', '--name-status', '--no-renames'], text=True).splitlines()
          assert len(paths) == 55, len(paths)
          entries = []
          for line in paths:
              status, path = line.split('\t')
              assert path.startswith('site/') or path in ['.github/workflows/ci.yml', '.github/workflows/docs.yml']
              if status == 'D':
                  entries.append({'path': path, 'mode': '100644', 'type': 'blob', 'sha': None})
                  continue
              assert status in ['A', 'M']
              metadata = subprocess.check_output(['git', 'ls-files', '--stage', '--', path], text=True).split()
              mode, expected_blob = metadata[:2]
              assert mode in ['100644', '100755']
              raw = subprocess.check_output(['git', 'show', ':' + path])
              actual_blob = hashlib.sha1(f'blob {len(raw)}\0'.encode() + raw).hexdigest()
              assert actual_blob == expected_blob
              request = urllib.request.Request('https://api.github.com/repos/arbiterForge/codeArbiter/git/blobs', data=json.dumps({'content': base64.b64encode(raw).decode(), 'encoding': 'base64'}).encode(), headers={'Authorization': 'Bearer ' + os.environ['GH_TOKEN'], 'Accept': 'application/vnd.github+json', 'Content-Type': 'application/json'}, method='POST')
              with urllib.request.urlopen(request, timeout=30) as response:
                  returned = json.load(response)
              assert returned['sha'] == expected_blob
              entries.append({'path': path, 'mode': mode, 'type': 'blob', 'sha': expected_blob})
          out = pathlib.Path(os.environ['RUNNER_TEMP']) / 'concepts-c04-objects'
          out.mkdir()
          (out / 'objects.json').write_text(json.dumps({'base': base, 'tree': tree, 'entries': entries}, indent=2) + '\n')
          print(json.dumps({'tree': tree, 'entries': len(entries)}))
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: concepts-c04-objects
          path: ${{ runner.temp }}/concepts-c04-objects/
          retention-days: 1
          if-no-files-found: error
