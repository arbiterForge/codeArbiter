name: PR862 navigation objects
on:
  push:
    branches: [prep/pr862-ci-source]
    paths: [.github/workflows/pr862-navigation-objects.yml]
permissions:
  contents: write
jobs:
  prepare:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: 96c4c5813cc4ef7765fdf81ed49a33c59d05eb64
          persist-credentials: false
      - name: Validate fixed patch and create unreferenced file blobs only
        shell: python
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          import base64, gzip, hashlib, json, os, pathlib, subprocess, urllib.request
          api = 'https://api.github.com/repos/arbiterForge/codeArbiter/git/blobs'
          headers = {'Authorization': 'Bearer ' + os.environ['GH_TOKEN'], 'Accept': 'application/vnd.github+json', 'Content-Type': 'application/json'}
          parts = ['87cc8f0bdc26becba40817e27190a87fd89fbf0f', '42dbd7a5e489e14de342583d59c1cd80bbf6677a', 'cdb16a6d8d2d0ebda853eb84f9ab94621f40a1c1', '9346e3843c52fbac1f9dbf099451d2e724054516', 'e9eb0fde22dac593053c115d83cf39cf964cf57e', 'fd7db840d653e68be9b5d46f4c01f33dd7572028']
          expected = {
            'site/CONCEPTS-OVERHAUL.md': 'a17c5917d17f895019c8a62ad0cff6f29547d2c9',
            'site/DESIGN-SYSTEM.md': 'a79c712e767cc3e977ef6b9d916beddf65872cb1',
            'site/reviews/CONCEPTS-C04-SOURCES.md': '52d1d78e11a05dbe2035a3eb82d34557a9bd92d6',
            'site/scripts/execution-maps/locations.ts': '9f86331fbdce7919472a7adac27224f28009bd44',
            'site/src/components/ExecutionMap.astro': 'e343ce693853e7b907e2f3323d8c13d8e1d24999',
            'site/src/components/WorkflowDirectory.astro': '93062a27882dbdf98603ca15b32a6620da45e56f',
            'site/src/content/docs/concepts/workflow-routes.mdx': 'b2a063112eb1ff53eb00013089a74ee506bec3d9',
            'site/src/scripts/execution-map-navigation.ts': '39d931b1cffd2af3928d96b8e46c918f6ae59ed4',
            'site/test/browser/peer-layout.spec.ts': 'd73d3a55157556fd06085cefa62ee3aefc7bd85b',
            'site/test/browser/workflow-navigation.spec.ts': '652c4a6c1205e6d91d363d0bb7465460d002e424',
            'site/test/browser/workflow-propagation.spec.ts': 'c6c4779a0a5f71ab88f5cf85806796c737350f77',
            'site/test/content/c04-stack-ci.test.ts': 'a56e70f26e3b458119696e98d23254da50a65084',
            'site/test/content/execution-navigation.test.ts': '0a96969d33c3aadf5f588025b7d44a8c1684982c',
          }
          fragments = []
          for sha in parts:
            with urllib.request.urlopen(urllib.request.Request(api + '/' + sha, headers=headers), timeout=30) as response:
              data = json.load(response)
            raw = base64.b64decode(data['content'])
            assert hashlib.sha1(f'blob {len(raw)}\0'.encode() + raw).hexdigest() == sha
            fragments.append(raw)
          compressed = base64.b64decode(b''.join(fragments), validate=True)
          assert hashlib.sha256(compressed).hexdigest() == 'ce9acac326376edc59000387a0efeda88b5945894327120ba8d8f8a374d5377a'
          patch = gzip.decompress(compressed)
          assert len(patch) == 39560
          assert hashlib.sha256(patch).hexdigest() == 'a1740ee673c01402ab2a1ffab6531dccf80d4a24fe7a9eaa3955af42cfc48be3'
          assert subprocess.check_output(['git','rev-parse','HEAD^{tree}'], text=True).strip() == 'c7ac2b6492637cf8dbaf211898264394d00429cf'
          subprocess.run(['git','apply','--check','--index','-'], input=patch, check=True)
          subprocess.run(['git','apply','--index','-'], input=patch, check=True)
          paths = subprocess.check_output(['git','diff','--cached','--name-only'], text=True).splitlines()
          assert sorted(paths) == sorted(expected)
          tree = subprocess.check_output(['git','write-tree'], text=True).strip()
          assert tree == '8b610103620746c1129999913a3f9479b9da222c'
          entries = []
          for path in paths:
            raw = pathlib.Path(path).read_bytes()
            sha = hashlib.sha1(f'blob {len(raw)}\0'.encode() + raw).hexdigest()
            assert sha == expected[path]
            request = urllib.request.Request(api, data=json.dumps({'content': base64.b64encode(raw).decode(), 'encoding': 'base64'}).encode(), headers=headers, method='POST')
            with urllib.request.urlopen(request, timeout=30) as response:
              returned = json.load(response)
            assert returned['sha'] == sha
            entries.append({'path':path, 'mode':'100644', 'type':'blob', 'sha':sha})
          out = pathlib.Path(os.environ['RUNNER_TEMP']) / 'pr862-navigation-objects'
          out.mkdir()
          (out/'objects.json').write_text(json.dumps({'base':'96c4c5813cc4ef7765fdf81ed49a33c59d05eb64','tree':tree,'entries':entries}, indent=2)+'\n')
          print(json.dumps({'tree':tree,'verified_blobs':len(entries)}))
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: pr862-navigation-objects
          path: ${{ runner.temp }}/pr862-navigation-objects/
          retention-days: 1
          if-no-files-found: error
