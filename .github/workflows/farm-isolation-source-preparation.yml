name: Farm isolation validation (temporary)
on:
  push:
    branches: [codex/farm-readiness-canary-isolation]
    paths: [.github/workflows/farm-isolation-source-preparation.yml]
permissions:
  contents: read
jobs:
  validate:
    if: github.repository == 'arbiterForge/codeArbiter' && github.ref == 'refs/heads/codex/farm-readiness-canary-isolation'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          fetch-tags: true
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.14'
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 22.19.0
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e
        with:
          go-version: '1.27.1'
          check-latest: false
          cache: false
          go-download-base-url: https://go.dev/dl
      - name: Acquire the reviewed patch as integrity-checked inert data
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python - <<'PY'
          import base64,hashlib,json,lzma,os,pathlib,urllib.request
          assert os.environ['GITHUB_REPOSITORY']=='arbiterForge/codeArbiter'
          assert os.environ['GITHUB_REF']=='refs/heads/codex/farm-readiness-canary-isolation'
          out=pathlib.Path(os.environ['RUNNER_TEMP'])/'farm-isolation-validation'
          out.mkdir()
          class NoRedirect(urllib.request.HTTPRedirectHandler):
              def redirect_request(self,*args,**kwargs): raise RuntimeError('Unexpected redirect')
          def blob(sha):
              req=urllib.request.Request('https://api.github.com/repos/arbiterForge/codeArbiter/git/blobs/'+sha,headers={'Authorization':'Bearer '+os.environ['GH_TOKEN'],'Accept':'application/vnd.github+json'})
              with urllib.request.build_opener(NoRedirect).open(req,timeout=45) as response: record=json.load(response)
              assert record['sha']==sha and record['encoding']=='base64'
              data=base64.b64decode(record['content'])
              assert hashlib.sha1(b'blob '+str(len(data)).encode()+b'\0'+data).hexdigest()==sha
              return data
          parts=['f9ea36be4a8d52d1ab0fb614e96f4fee0afd3c60','1a6a5fd78e188c51a76006e876c55d8c42bf1824','34938357f19e20f5ca52de7e1988b9ed2470ee97']
          compressed=base64.b64decode(b''.join(blob(sha) for sha in parts),validate=True)
          assert hashlib.sha1(b'blob '+str(len(compressed)).encode()+b'\0'+compressed).hexdigest()=='2da1fc5536b4c2d0234cbe73d461558dedf05751'
          data=lzma.decompress(compressed)
          assert len(data)==61702 and hashlib.sha256(data).hexdigest()=='39869ddfc28422fc2b5af72ad9a6bace5be70d885f3ebbd1ebd168c483a99676'
          manifest=json.loads(data)
          assert manifest['base']=='cf90ce4d79c5d87cb88f163535c1035da2315815'
          assert len(manifest['files'])==26 and len({r['path'] for r in manifest['files']})==26
          for row in manifest['files']:
              path=pathlib.PurePosixPath(row['path'])
              assert not path.is_absolute() and '..' not in path.parts and str(path)==row['path']
              assert row['mode'] in {'100644','100755'} and len(row['sha'])==40
          (out/'manifest-input.json').write_bytes(data)
          (out/'source.patch').write_text(manifest['source_patch'])
          PY
      - name: Apply owning sources and rebuild using the locked toolchain
        shell: bash
        run: |
          python - <<'PY'
          import hashlib,json,os,pathlib,subprocess,sys
          root=pathlib.Path.cwd();out=pathlib.Path(os.environ['RUNNER_TEMP'])/'farm-isolation-validation'
          manifest=json.loads((out/'manifest-input.json').read_text())
          base=manifest['base'];head=os.environ['GITHUB_SHA'];temporary='.github/workflows/farm-isolation-source-preparation.yml'
          assert subprocess.check_output(['git','rev-parse','HEAD'],text=True).strip()==head
          subprocess.run(['git','merge-base','--is-ancestor',base,head],check=True)
          assert subprocess.check_output(['git','diff','--name-only',base,head],text=True).splitlines()==[temporary]
          assert subprocess.check_output(['go','env','GOVERSION'],text=True).strip()=='go1.27.1'
          subprocess.run(['git','apply','--check','--index',str(out/'source.patch')],check=True)
          subprocess.run(['git','apply','--index',str(out/'source.patch')],check=True)
          tools=root/'plugins/ca/tools'
          for args in [['npm','ci','--ignore-scripts','--no-audit','--no-fund'],['npm','run','typecheck'],['npm','run','build']]:
              subprocess.run(args,cwd=tools,check=True)
          for tool in ['tools/sync-core.py','tools/build-surface.py','tools/build-host-packages.py']:
              subprocess.run([sys.executable,tool],check=True)
          def oid(path):
              b=(root/path).read_bytes();return hashlib.sha1(b'blob '+str(len(b)).encode()+b'\0'+b).hexdigest()
          expected={r['path']:r for r in manifest['files']}
          for path,row in expected.items():
              assert oid(path)==row['sha'],path
              assert subprocess.check_output(['git','ls-tree',base,'--',path],text=True).split()[0]==row['mode'],path
          assert set(subprocess.check_output(['git','diff','HEAD','--name-only'],text=True).splitlines())==set(expected)
          for path in ['core/surface/command-routes.json','core/surface/arbiter.md','core/surface/includes/artifacts.md','core/surface/includes/sprint-authority.md','core/surface/skills/commit-gate/SKILL.md','plugins/ca/tools/package-lock.json']:
              assert (root/path).read_bytes()==subprocess.check_output(['git','show',base+':'+path]),path
          subprocess.run(['git','add','--',*sorted(expected)],check=True)
          subprocess.run(['git','rm','--',temporary],check=True)
          subprocess.run(['git','diff','--cached','--check'],check=True)
          tree=subprocess.check_output(['git','write-tree'],text=True).strip()
          message='fix: schedule ready farm tasks and isolate canary evaluation\n\nPrevent unready siblings from reserving prerequisite scopes. Evaluate\neach canary and sample from one frozen base in owned detached worktrees,\nwith accurate model attribution and no integration mutation. Preserve\nquality gates and verify scratch cleanup.\n\nCHANGELOG: Fixed farm readiness and isolated canary comparisons.\n'
          fixture_env=dict(os.environ,GIT_AUTHOR_NAME='Validation fixture',GIT_AUTHOR_EMAIL='validation@example.invalid',GIT_COMMITTER_NAME='Validation fixture',GIT_COMMITTER_EMAIL='validation@example.invalid')
          fixture=subprocess.check_output(['git','commit-tree',tree,'-p',head],input=message,text=True,env=fixture_env).strip()
          subprocess.run(['git','checkout','--detach',fixture],check=True)
          (out/'candidate-state.json').write_text(json.dumps({'base':base,'parent':head,'tree':tree,'local_validation_commit':fixture,'files':manifest['files'],'message':message},indent=2))
          PY
      - name: Run full farm coverage and current contract checks
        shell: bash
        run: |
          python - <<'PY'
          import hashlib,json,os,pathlib,subprocess,sys,time,zipfile
          root=pathlib.Path.cwd();out=pathlib.Path(os.environ['RUNNER_TEMP'])/'farm-isolation-validation'
          report=json.loads((out/'candidate-state.json').read_text());base=report['base']
          jobs=[('plugins/ca/tools',['npm','audit','--audit-level=high']),('plugins/ca/tools',['npm','run','coverage']),('plugins/ca/tools',['npm','run','typecheck'])]
          suites=['test_host_descriptors','test_provenance_wiring','test_routing_and_cleanup_surface','test_build_surface','test_public_codex_docs','test_reconcile_tag_receipt','test_payload_version_gate','test_artifact_farm','check_destructive_registry','check_routing_index_parity','check_docs_contract']
          jobs += [('.', [sys.executable,'.github/scripts/'+name+'.py']) for name in suites]
          jobs += [('.', [sys.executable,'tools/'+name+'.py','--check']) for name in ['sync-core','build-surface','build-host-packages']]
          jobs += [('.', [sys.executable,'.github/scripts/check-plugin-refs.py',host]) for host in ['ca','ca-codex','ca-pi']]
          jobs += [('.', [sys.executable,'.github/scripts/payload_version_gate.py','--plugin',host,'--base',base]) for host in ['plugins/ca','plugins/ca-codex']]
          jobs += [('.', [sys.executable,'tools/build-host-packages.py','--release-guard-base',base]),('.', [sys.executable,'.github/scripts/test_public_codex_docs.py','--require-current-candidate'])]
          results=[];env=dict(os.environ,PYTHONDONTWRITEBYTECODE='1',GOTOOLCHAIN='local')
          for index,(cwd,args) in enumerate(jobs):
              label=pathlib.Path(args[1]).stem
              logfile=f'{index:02d}-{label}.log';started=time.monotonic()
              try:
                  done=subprocess.run(args,cwd=root/cwd,capture_output=True,text=True,timeout=480,env=env)
                  code=done.returncode;content=done.stdout+done.stderr
              except subprocess.TimeoutExpired:
                  code=124;content='Timed out; not a passing result.\n'
              (out/logfile).write_text(content)
              results.append({'cwd':cwd,'command':args,'exit_code':code,'seconds':round(time.monotonic()-started,3),'log':logfile})
              (out/'tests.json').write_text(json.dumps(results,indent=2))
              print(code,cwd,' '.join(args),flush=True)
          for row in report['files']:
              data=(root/row['path']).read_bytes()
              assert hashlib.sha1(b'blob '+str(len(data)).encode()+b'\0'+data).hexdigest()==row['sha'],row['path']
          assert not subprocess.check_output(['git','diff','--name-only'],text=True).strip()
          (out/'candidate.diff').write_bytes(subprocess.check_output(['git','diff','--binary','--full-index',base,'HEAD']))
          with zipfile.ZipFile(out/'candidate-files.zip','w',zipfile.ZIP_DEFLATED) as archive:
              for row in report['files']: archive.write(root/row['path'],row['path'])
          report.update(all_tests_passed=all(r['exit_code']==0 for r in results),total_commands=len(results))
          (out/'manifest.json').write_text(json.dumps(report,indent=2))
          assert report['all_tests_passed'],'Inspect failed checks; no candidate commit uploaded.'
          PY
      - name: Store the tested candidate without changing any ref
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python - <<'PY'
          import hashlib,json,os,pathlib,urllib.request
          out=pathlib.Path(os.environ['RUNNER_TEMP'])/'farm-isolation-validation'
          report=json.loads((out/'manifest.json').read_text())
          assert report['all_tests_passed'] and report['parent']==os.environ['GITHUB_SHA']
          assert os.environ['GITHUB_REPOSITORY']=='arbiterForge/codeArbiter'
          assert os.environ['GITHUB_REF']=='refs/heads/codex/farm-readiness-canary-isolation'
          class NoRedirect(urllib.request.HTTPRedirectHandler):
              def redirect_request(self,*args,**kwargs): raise RuntimeError('Unexpected redirect')
          def api(method,path,payload=None):
              req=urllib.request.Request('https://api.github.com/repos/arbiterForge/codeArbiter'+path,method=method,data=json.dumps(payload).encode() if payload is not None else None,headers={'Authorization':'Bearer '+os.environ['GH_TOKEN'],'Accept':'application/vnd.github+json','Content-Type':'application/json'})
              with urllib.request.build_opener(NoRedirect).open(req,timeout=45) as response: return json.load(response)
          assert api('GET','/git/ref/heads/codex/farm-readiness-canary-isolation')['object']['sha']==report['parent']
          entries=[]
          for row in report['files']:
              data=pathlib.Path(row['path']).read_bytes()
              assert hashlib.sha1(b'blob '+str(len(data)).encode()+b'\0'+data).hexdigest()==row['sha']
              uploaded=api('POST','/git/blobs',{'content':data.decode(),'encoding':'utf-8'})['sha']
              assert uploaded==row['sha']
              entries.append({'path':row['path'],'mode':row['mode'],'type':'blob','sha':uploaded})
          entries.append({'path':'.github/workflows/farm-isolation-source-preparation.yml','mode':'100644','type':'blob','sha':None})
          previous=api('GET','/git/commits/'+report['parent'])['tree']['sha']
          tree=api('POST','/git/trees',{'base_tree':previous,'tree':entries})['sha'];assert tree==report['tree']
          commit=api('POST','/git/commits',{'message':report['message'],'tree':tree,'parents':[report['parent']]})['sha']
          (out/'candidate.json').write_text(json.dumps({'commit':commit,'tree':tree,'parent':report['parent'],'branch_updated':False},indent=2))
          PY
      - name: Retain actual outcomes and exact candidate files
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: farm-isolation-validation-${{ github.run_id }}
          path: ${{ runner.temp }}/farm-isolation-validation/
          if-no-files-found: error
          retention-days: 3
