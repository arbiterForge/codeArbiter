name: Farm isolation toolchain preparation (temporary)
on:
  push:
    branches: [codex/farm-readiness-canary-isolation]
    paths: [.github/workflows/farm-isolation-source-preparation.yml]
permissions:
  contents: read
jobs:
  prepare:
    if: github.repository == 'arbiterForge/codeArbiter' && github.ref == 'refs/heads/codex/farm-readiness-canary-isolation'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: cf90ce4d79c5d87cb88f163535c1035da2315815
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 22.19.0
      - name: Install the unchanged lockfile
        working-directory: plugins/ca/tools
        run: npm ci --no-audit --no-fund
      - name: Preserve locked Linux test dependencies
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = cf90ce4d79c5d87cb88f163535c1035da2315815
          git diff --exit-code
          OUT="$RUNNER_TEMP/farm-isolation-tools"
          mkdir "$OUT"
          tar -czf "$OUT/node_modules.tar.gz" -C plugins/ca/tools node_modules
          cp plugins/ca/tools/package-lock.json "$OUT/"
          node --version > "$OUT/node.txt"
          npm --version > "$OUT/npm.txt"
          cd "$OUT"
          sha256sum node_modules.tar.gz package-lock.json > SHA256SUMS
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: farm-isolation-tools-${{ github.run_id }}
          path: ${{ runner.temp }}/farm-isolation-tools/
          if-no-files-found: error
          retention-days: 3
