name: PR854 quality evidence preparation (temporary)
on:
  push:
    branches: [codex/farm-readiness-canary-isolation]
    paths: [.github/workflows/pr854-quality-evidence.yml]
permissions:
  contents: read
jobs:
  capture:
    if: github.repository == 'arbiterForge/codeArbiter' && github.ref == 'refs/heads/codex/farm-readiness-canary-isolation'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: a3e085c55d79a8bf8b253e2ccc783b66b00c967c
          fetch-depth: 0
          persist-credentials: false
      - name: Capture committed source without executing product code
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = a3e085c55d79a8bf8b253e2ccc783b66b00c967c
          OUT="$RUNNER_TEMP/pr854-quality-source"
          mkdir "$OUT"
          git archive --format=zip --output="$OUT/source.zip" HEAD
          git bundle create "$OUT/source.bundle" HEAD
          git rev-parse HEAD > "$OUT/commit.txt"
          git rev-parse 'HEAD^{tree}' > "$OUT/tree.txt"
          cd "$OUT"
          sha256sum source.zip source.bundle > SHA256SUMS
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: pr854-quality-source-${{ github.run_id }}
          path: ${{ runner.temp }}/pr854-quality-source/
          if-no-files-found: error
          retention-days: 3
