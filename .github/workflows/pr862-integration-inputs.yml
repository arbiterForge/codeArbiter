name: PR862 integration inputs
on:
  push:
    branches: [prep/pr862-search-completion-1120]
    paths: [.github/workflows/pr862-integration-inputs.yml]
permissions:
  contents: read
jobs:
  capture:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: 44d736e4590c528a586bd072e75c6149491e07e5
          fetch-depth: 0
          persist-credentials: false
      - name: Preserve both exact source histories and merge diagnostics
        shell: bash
        run: |
          set -euo pipefail
          out="$RUNNER_TEMP/pr862-integration"
          mkdir -p "$out"
          git branch captured-review 44d736e4590c528a586bd072e75c6149491e07e5
          git branch captured-main a4842fab60a6e6ee943341861ec4aed0a7b17a50
          git bundle create "$out/source.bundle" captured-review captured-main --tags
          git rev-parse captured-review captured-review^{tree} captured-main captured-main^{tree} > "$out/identity.txt"
          result=0
          git merge-tree --write-tree captured-review captured-main > "$out/merge.txt" || result=$?
          printf '\nmerge_exit=%s\n' "$result" >> "$out/merge.txt"
          git diff --name-status captured-review...captured-main > "$out/main-changes.txt"
          cd "$out"
          sha256sum source.bundle identity.txt merge.txt main-changes.txt > SHA256SUMS
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: pr862-integration-inputs
          path: ${{ runner.temp }}/pr862-integration/
          retention-days: 1
          if-no-files-found: error
