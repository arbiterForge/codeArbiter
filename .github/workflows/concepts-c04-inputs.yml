name: Concepts C04 inputs
on:
  push:
    branches: [docs/concepts-workflow-propagation]
    paths: [.github/workflows/concepts-c04-inputs.yml]
permissions:
  contents: read
jobs:
  capture:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: 090773ec6aa98687cd7b207985cb29ebb8f9c8e1
          fetch-depth: 0
          persist-credentials: false
      - name: Capture source objects without running candidate code
        shell: bash
        run: |
          set -euo pipefail
          out="$RUNNER_TEMP/concepts-c04"
          mkdir -p "$out"
          git bundle create "$out/source.bundle" HEAD
          git rev-parse HEAD HEAD^{tree} > "$out/identity.txt"
          cd "$out"
          sha256sum source.bundle identity.txt > SHA256SUMS
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: concepts-c04-inputs
          path: ${{ runner.temp }}/concepts-c04/
          retention-days: 1
          if-no-files-found: error
