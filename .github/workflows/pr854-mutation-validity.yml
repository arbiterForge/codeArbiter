name: PR854 mutation validity validation (temporary)
on:
  push:
    branches: [codex/farm-readiness-canary-isolation]
    paths: [.github/workflows/pr854-mutation-validity.yml]
permissions:
  contents: read
jobs:
  validate:
    if: github.repository == 'arbiterForge/codeArbiter' && github.ref == 'refs/heads/codex/farm-readiness-canary-isolation'
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            node: '22.19.0'
            label: linux
          - os: windows-latest
            node: '20'
            label: windows
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: 01e91f4d053a531a62a7fc3ee085ffafb25440bf
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.14'
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: ${{ matrix.node }}
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e
        with:
          go-version: '1.27.1'
          check-latest: false
          cache: false
          go-download-base-url: https://go.dev/dl
      - name: Acquire the exact patch as inert data
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python - <<'PY'
          import base64,hashlib,json,lzma,os,pathlib,urllib.request
          assert os.environ['GITHUB_REPOSITORY']=='arbiterForge/codeArbiter'
          assert os.environ['GITHUB_REF']=='refs/heads/codex/farm-readiness-canary-isolation'
          out=pathlib.Path(os.environ['RUNNER_TEMP'])/'pr854-validity';out.mkdir()
          class NoRedirect(urllib.request.HTTPRedirectHandler):
              def redirect_request(self,*args,**kwargs): raise RuntimeError('Unexpected redirect')
          sha='e219f0d59fccd3290d5e62d987dc7c86f7913705'
          req=urllib.request.Request('https://api.github.com/repos/arbiterForge/codeArbiter/git/blobs/'+sha,headers={'Authorization':'Bearer '+os.environ['GH_TOKEN'],'Accept':'application/vnd.github+json'})
          with urllib.request.build_opener(NoRedirect).open(req,timeout=45) as response: row=json.load(response)
          assert row['sha']==sha and row['encoding']=='base64'
          packed=base64.b64decode(row['content'])
          assert len(packed)==9616 and hashlib.sha1(b'blob '+str(len(packed)).encode()+b'\0'+packed).hexdigest()==sha
          data=lzma.decompress(packed)
          assert len(data)==34764 and hashlib.sha256(data).hexdigest()=='55ce5d388348c4169585ddf145cd69a55d915792500880982d5fe54ad4f417d0'
          payload=json.loads(data)
          assert payload['parent']=='01e91f4d053a531a62a7fc3ee085ffafb25440bf'
          assert payload['base_tree']=='626fe054fe424cca164b6fa00c714cb95facfa1d'
          assert len(payload['files'])==13 and len({x['path'] for x in payload['files']})==13
          for row in payload['files']:
              path=pathlib.PurePosixPath(row['path'])
              assert not path.is_absolute() and '..' not in path.parts and str(path)==row['path']
              assert row['mode'] in {'100644','100755'}
          test=next(r for r in payload['files'] if r['path']=='plugins/ca/tools/farm.test.ts')
          assert test['sha']=='7b06b2d1020e78db238c8e2a539bb93b77ba57d7'
          test['sha']='b5fc8bc82b4d97ec71fe08584771a4e8632bfeba'
          (out/'payload-original.json').write_bytes(data)
          (out/'payload.json').write_bytes(json.dumps(payload,indent=2).encode('utf-8'))
          (out/'reviewed.patch').write_bytes(payload['source_patch'].encode('utf-8'))
          PY
      - name: Rebuild and test the preserving candidate
        shell: bash
        env:
          PLATFORM_LABEL: ${{ matrix.label }}
        run: |
          python - <<'PY'
          import hashlib,json,os,pathlib,subprocess,sys,time,zipfile
          root=pathlib.Path.cwd();out=pathlib.Path(os.environ['RUNNER_TEMP'])/'pr854-validity'
          payload=json.loads((out/'payload.json').read_bytes());base=payload['parent']
          assert subprocess.check_output(['git','rev-parse','HEAD'],text=True,encoding='utf-8').strip()==base
          assert subprocess.check_output(['git','rev-parse','HEAD^{tree}'],text=True,encoding='utf-8').strip()==payload['base_tree']
          assert subprocess.check_output(['go','env','GOVERSION'],text=True,encoding='utf-8').strip()=='go1.27.1'
          def oid(path):
              data=(root/path).read_bytes();return hashlib.sha1(b'blob '+str(len(data)).encode()+b'\0'+data).hexdigest()
          for row in payload['files']:
              assert oid(row['path'])==row['old_sha'],row['path']
              assert subprocess.check_output(['git','ls-tree','HEAD','--',row['path']],text=True,encoding='utf-8').split()[0]==row['mode']
          subprocess.run(['git','apply','--check','--index','--unidiff-zero',str(out/'reviewed.patch')],check=True)
          subprocess.run(['git','apply','--index','--unidiff-zero',str(out/'reviewed.patch')],check=True)
          path=root/'plugins/ca/tools/farm.test.ts'
          assert oid('plugins/ca/tools/farm.test.ts')=='7b06b2d1020e78db238c8e2a539bb93b77ba57d7'
          text=path.read_bytes().decode('utf-8')
          replacements=[
            ('    // Worker returns a multi-branch impl; the narrow test only exercises one path,\n    // so mutating the unexercised branch/operator survives \u2192 low mutation score.',
             '    // The narrow test misses two changes and rejects one. Bare exits cannot\n    // establish why that rerun failed; preserve the adverse upper bound, not a\n    // measured score. The task still enters independent review with a warning.'),
            ('    // Score is low but not near-zero (the "small" return IS killed), so it warns\n    // into Phase 3 rather than hard-escalating: task stays green with a warning.',
             '    // Two passes and one nonzero exit bound the rejection rate at 1/3. This is\n    // below the warning threshold, but neither near-zero nor five evaluated\n    // reruns: preserve the existing green authoring + independent-review route.'),
            ('    expect(r.mutationScore).toBeLessThan(0.5);\n    expect(r.warning).toMatch(/mutation-risk/);',
             '    expect(r.mutationScore).toBeNull();\n    expect(r.warning).toMatch(/^builtin-mutation-failed:/);\n    expect(r.warning).toContain("1 unclassified nonzero rerun(s), 2 passed, 3 completed");\n    expect(r.warning).toContain("upper bound 0.333 is not a measured score");'),
          ]
          for before,after in replacements:
              assert text.count(before)==1
              text=text.replace(before,after,1)
          path.write_bytes(text.encode('utf-8'))
          assert oid('plugins/ca/tools/farm.test.ts')=='b5fc8bc82b4d97ec71fe08584771a4e8632bfeba'
          tools=root/'plugins/ca/tools'
          for cmd in [['npm','ci','--ignore-scripts','--no-fund','--no-audit'],['npm','audit','--include=dev','--audit-level=high'],['npm','run','typecheck'],['npm','run','build']]:
              subprocess.run(cmd,cwd=tools,check=True,shell=os.name=='nt')
          subprocess.run([sys.executable,'tools/build-surface.py'],check=True)
          expected={row['path'] for row in payload['files']}
          assert set(subprocess.check_output(['git','diff','HEAD','--name-only'],text=True,encoding='utf-8').splitlines())==expected
          for row in payload['files']: assert oid(row['path'])==row['sha'],row['path']
          for path in ['plugins/ca/tools/farm.ts','plugins/ca/tools/exec.ts','plugins/ca/tools/worktree-fs.ts','plugins/ca/tools/package-lock.json','plugins/ca/tools/vitest.config.ts','core/surface/arbiter.md','core/surface/command-routes.json','core/surface/includes/maturity-coverage.md']:
              assert (root/path).read_bytes()==subprocess.check_output(['git','show',base+':'+path])
          module='plugins/ca/tools/mutation.ts';old=subprocess.check_output(['git','show',base+':'+module]).decode('utf-8');new=(root/module).read_bytes().decode('utf-8')
          for begin,end in [('type LiteralAtom =','// mutation guard'),('function generateMutants(','// #525:'),('export function parseMutationHookOutput(','  // Built-in text mutation.')]:
              assert old[old.index(begin):old.index(end)]==new[new.index(begin):new.index(end)],begin
          subprocess.run(['git','add','--',*sorted(expected)],check=True)
          subprocess.run(['git','diff','--cached','--check'],check=True)
          tree=subprocess.check_output(['git','write-tree'],text=True,encoding='utf-8').strip()
          assert tree=='50bf041f6aed49283838c77e2615f851c855c5f7'
          message='fix: keep ambiguous mutation rejections out of measured scores\n\nPreserve completed nonzero exits as unclassified evidence rather than\nassertion kills. Retain adverse upper bounds and count floors without\nnew authoring or approval steps. Keep external frameworks, lexical\nguards, restoration and process-containment behavior unchanged.\n\nCHANGELOG: Avoid false mutation scores from compiler and loader failures.\n'
          env=dict(os.environ,GIT_AUTHOR_NAME='Validation fixture',GIT_AUTHOR_EMAIL='validation@example.invalid',GIT_COMMITTER_NAME='Validation fixture',GIT_COMMITTER_EMAIL='validation@example.invalid')
          fixture=subprocess.check_output(['git','commit-tree',tree,'-p',base],input=message,text=True,encoding='utf-8',env=env).strip()
          subprocess.run(['git','checkout','--detach',fixture],check=True)
          commands=[(['npm','run','coverage'],tools)]
          commands += [([sys.executable,'.github/scripts/'+name+'.py'],root) for name in ['test_ci_impact','test_host_descriptors','test_routing_and_cleanup_surface','test_build_surface','test_public_codex_docs','test_provenance_wiring','test_payload_version_gate','test_artifact_farm']]
          commands += [([sys.executable,tool,'--check'],root) for tool in ['tools/build-surface.py','tools/sync-core.py','tools/build-host-packages.py']]
          commands += [([sys.executable,'.github/scripts/'+name+'.py'],root) for name in ['check_destructive_registry','check_routing_index_parity','check_docs_contract']]
          commands += [([sys.executable,'.github/scripts/check-plugin-refs.py',host],root) for host in ['ca','ca-codex','ca-pi']]
          results=[]
          for i,(args,cwd) in enumerate(commands):
              name=f'{i:02d}-'+('coverage' if args[0]=='npm' else pathlib.Path(args[1]).stem)+'.log';start=time.monotonic()
              try:
                  done=subprocess.run(args,cwd=cwd,capture_output=True,text=True,encoding='utf-8',errors='replace',timeout=420,env=dict(os.environ,PYTHONDONTWRITEBYTECODE='1'),shell=os.name=='nt' and args[0]=='npm')
                  code=done.returncode;content=done.stdout+done.stderr
              except subprocess.TimeoutExpired:
                  code=124;content='Timed out; not a passing result.\n'
              (out/name).write_bytes(content.encode('utf-8'))
              results.append({'command':args,'exit_code':code,'seconds':round(time.monotonic()-start,3),'log':name})
              (out/'tests.json').write_bytes(json.dumps(results,indent=2).encode('utf-8'));print(code,' '.join(args),flush=True)
          for row in payload['files']: assert oid(row['path'])==row['sha'],row['path']
          assert not subprocess.check_output(['git','diff','--name-only'],text=True,encoding='utf-8').strip()
          (out/'candidate.diff').write_bytes(subprocess.check_output(['git','diff','--binary','--full-index',base,fixture]))
          with zipfile.ZipFile(out/'candidate-files.zip','w',zipfile.ZIP_DEFLATED) as z:
              for row in payload['files']: z.write(root/row['path'],row['path'])
          report={'source_parent':base,'workflow_head':os.environ['GITHUB_SHA'],'platform':os.environ['PLATFORM_LABEL'],'tree':tree,'files':payload['files'],'message':message,'all_commands_passed':all(r['exit_code']==0 for r in results),'command_count':len(results)}
          (out/'manifest.json').write_bytes(json.dumps(report,indent=2).encode('utf-8'))
          assert report['all_commands_passed'],'Validation failed: inspect logs; no passing result inferred.'
          PY
      - name: Store verified blobs without moving a ref
        if: matrix.label == 'linux'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python - <<'PY'
          import hashlib,json,os,pathlib,urllib.request
          out=pathlib.Path(os.environ['RUNNER_TEMP'])/'pr854-validity';report=json.loads((out/'manifest.json').read_bytes())
          assert report['all_commands_passed'] and report['workflow_head']==os.environ['GITHUB_SHA']
          assert os.environ['GITHUB_REPOSITORY']=='arbiterForge/codeArbiter' and os.environ['GITHUB_REF']=='refs/heads/codex/farm-readiness-canary-isolation'
          class NoRedirect(urllib.request.HTTPRedirectHandler):
              def redirect_request(self,*args,**kwargs): raise RuntimeError('Unexpected redirect')
          def api(method,path,payload=None):
              req=urllib.request.Request('https://api.github.com/repos/arbiterForge/codeArbiter'+path,method=method,data=json.dumps(payload).encode('utf-8') if payload is not None else None,headers={'Authorization':'Bearer '+os.environ['GH_TOKEN'],'Accept':'application/vnd.github+json','Content-Type':'application/json'})
              with urllib.request.build_opener(NoRedirect).open(req,timeout=45) as response: return json.load(response)
          assert api('GET','/git/ref/heads/codex/farm-readiness-canary-isolation')['object']['sha']==report['workflow_head']
          for row in report['files']:
              data=pathlib.Path(row['path']).read_bytes();assert hashlib.sha1(b'blob '+str(len(data)).encode()+b'\0'+data).hexdigest()==row['sha']
              assert api('POST','/git/blobs',{'content':data.decode('utf-8'),'encoding':'utf-8'})['sha']==row['sha']
          (out/'uploaded-blobs.json').write_bytes(json.dumps({'files':report['files'],'branch_updated':False},indent=2).encode('utf-8'))
          PY
      - name: Retain platform evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: pr854-validity-${{ matrix.label }}-${{ github.run_id }}
          path: ${{ runner.temp }}/pr854-validity/
          if-no-files-found: error
          retention-days: 3
