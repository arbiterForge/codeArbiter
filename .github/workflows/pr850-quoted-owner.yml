name: PR850 quoted owner validation (temporary)
on:
  push:
    branches: [codex/spec-continuation-checkpoint-remediation]
    paths: [.github/workflows/pr850-quoted-owner.yml]
permissions:
  contents: read
jobs:
  validate:
    if: github.repository == 'arbiterForge/codeArbiter' && github.ref == 'refs/heads/codex/spec-continuation-checkpoint-remediation'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.14'
      - name: Acquire exact reviewed three-file correction
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python - <<'PY'
          import base64,hashlib,json,lzma,os,pathlib,urllib.request
          out=pathlib.Path(os.environ['RUNNER_TEMP'])/'quoted-owner';out.mkdir()
          sha='87a94cf74cea5330fede019f5ec322fa1c42be68'
          class NoRedirect(urllib.request.HTTPRedirectHandler):
              def redirect_request(self,*args,**kwargs):raise RuntimeError('Unexpected redirect')
          req=urllib.request.Request('https://api.github.com/repos/arbiterForge/codeArbiter/git/blobs/'+sha,headers={'Authorization':'Bearer '+os.environ['GH_TOKEN'],'Accept':'application/vnd.github+json'})
          with urllib.request.build_opener(NoRedirect).open(req,timeout=45) as response:record=json.load(response)
          assert record['sha']==sha and record['encoding']=='base64'
          data=base64.b64decode(record['content'])
          assert hashlib.sha1(b'blob '+str(len(data)).encode()+b'\0'+data).hexdigest()==sha
          raw=lzma.decompress(data)
          assert len(raw)==7652 and hashlib.sha256(raw).hexdigest()=='46951b37e2588064091458c67c4a369272604cdc379e3eb65bdbf2c517fd06be'
          (out/'input.json').write_bytes(raw)
          PY
      - name: Apply minimal correction and execute source and projection checks
        shell: bash
        run: |
          python - <<'PY'
          import hashlib,json,os,pathlib,subprocess,sys,zipfile
          out=pathlib.Path(os.environ['RUNNER_TEMP'])/'quoted-owner';doc=json.loads((out/'input.json').read_text())
          base='9a8e2e465f7c5da068e31c6d7e83b4365b506737';head=os.environ['GITHUB_SHA'];temp='.github/workflows/pr850-quoted-owner.yml'
          assert os.environ['GITHUB_REPOSITORY']=='arbiterForge/codeArbiter'
          assert os.environ['GITHUB_REF']=='refs/heads/codex/spec-continuation-checkpoint-remediation'
          subprocess.run(['git','merge-base','--is-ancestor',base,head],check=True)
          assert subprocess.check_output(['git','diff','--name-only',base,head],text=True).splitlines()==[temp]
          def oid(p):
              b=pathlib.Path(p).read_bytes();return hashlib.sha1(b'blob '+str(len(b)).encode()+b'\0'+b).hexdigest()
          expected={r['path']:r for r in doc['files']}
          assert set(expected)=={'tools/build-surface.py','.github/scripts/test_host_descriptors.py','.github/scripts/test_build_surface.py'}
          for p,row in expected.items():assert oid(p)==row['before'],p
          patch=out/'reviewed.patch';patch.write_text(doc['patch'])
          subprocess.run(['git','apply','--check','--index',str(patch)],check=True)
          subprocess.run(['git','apply','--index',str(patch)],check=True)
          for p,row in expected.items():assert oid(p)==row['sha'],p
          commands=[[sys.executable,'.github/scripts/'+name+'.py'] for name in ['test_build_surface','test_host_descriptors','test_routing_and_cleanup_surface','test_command_catalog','test_command_route_compatibility','check_command_catalog','check_docs_contract','check_routing_index_parity','check_destructive_registry']]
          commands += [[sys.executable,t,'--check'] for t in ['tools/build-surface.py','tools/sync-core.py','tools/build-host-packages.py']]
          commands += [[sys.executable,'.github/scripts/check-plugin-refs.py',h] for h in ['ca','ca-codex','ca-pi']]
          results=[];env=dict(os.environ,PYTHONDONTWRITEBYTECODE='1')
          for i,args in enumerate(commands):
              done=subprocess.run(args,env=env,capture_output=True,text=True,timeout=120)
              log=f'{i:02d}-'+pathlib.Path(args[1]).stem+'.log';(out/log).write_text(done.stdout+done.stderr)
              results.append({'command':args,'exit_code':done.returncode,'log':log});(out/'tests.json').write_text(json.dumps(results,indent=2))
              print(done.returncode,' '.join(args),flush=True)
              if done.returncode:print((done.stdout+done.stderr)[-10000:])
          assert all(r['exit_code']==0 for r in results)
          assert set(subprocess.check_output(['git','diff','HEAD','--name-only'],text=True).splitlines())==set(expected)
          for p,row in expected.items():assert oid(p)==row['sha'],p
          subprocess.run(['git','rm','--',temp],check=True)
          subprocess.run(['git','diff','--cached','--check'],check=True)
          tree=subprocess.check_output(['git','write-tree'],text=True).strip()
          with zipfile.ZipFile(out/'candidate-files.zip','w',zipfile.ZIP_DEFLATED) as z:
              for p in expected:z.write(p,p)
          (out/'candidate.diff').write_bytes(subprocess.check_output(['git','diff','--cached','--binary',base]))
          (out/'manifest.json').write_text(json.dumps({'base':base,'parent':head,'tree':tree,'files':doc['files'],'all_tests_passed':True,'commands':len(results)},indent=2))
          PY
      - name: Store tested objects without updating the branch
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python - <<'PY'
          import hashlib,json,os,pathlib,urllib.request
          out=pathlib.Path(os.environ['RUNNER_TEMP'])/'quoted-owner';report=json.loads((out/'manifest.json').read_text())
          assert report['all_tests_passed'] and report['parent']==os.environ['GITHUB_SHA']
          class NoRedirect(urllib.request.HTTPRedirectHandler):
              def redirect_request(self,*args,**kwargs):raise RuntimeError('Unexpected redirect')
          def api(method,path,payload=None):
              req=urllib.request.Request('https://api.github.com/repos/arbiterForge/codeArbiter'+path,method=method,data=None if payload is None else json.dumps(payload).encode(),headers={'Authorization':'Bearer '+os.environ['GH_TOKEN'],'Content-Type':'application/json','Accept':'application/vnd.github+json'})
              with urllib.request.build_opener(NoRedirect).open(req,timeout=45) as response:return json.load(response)
          assert api('GET','/git/ref/heads/codex/spec-continuation-checkpoint-remediation')['object']['sha']==report['parent']
          entries=[]
          for row in report['files']:
              data=pathlib.Path(row['path']).read_bytes();assert hashlib.sha1(b'blob '+str(len(data)).encode()+b'\0'+data).hexdigest()==row['sha']
              assert api('POST','/git/blobs',{'content':data.decode(),'encoding':'utf-8'})['sha']==row['sha']
              entries.append({'path':row['path'],'mode':row['mode'],'type':'blob','sha':row['sha']})
          previous=api('GET','/git/commits/'+report['parent'])['tree']['sha']
          entries.append({'path':'.github/workflows/pr850-quoted-owner.yml','mode':'100644','type':'blob','sha':None})
          tree=api('POST','/git/trees',{'base_tree':previous,'tree':entries})['sha'];assert tree==report['tree']
          commit=api('POST','/git/commits',{'message':'fix: preserve explicitly quoted command-owner scalars\n\nRetain JSON string intent through host frontmatter and the independent\noracle; test comments, scalar types, sigils and whitespace. Generated\ncurrent entries and all native authority code remain byte-identical.','tree':tree,'parents':[report['parent']]})['sha']
          (out/'candidate.json').write_text(json.dumps({'commit':commit,'tree':tree,'parent':report['parent'],'branch_updated':False},indent=2))
          PY
      - name: Retain exact test evidence and candidate files
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: pr850-quoted-owner-${{ github.run_id }}
          path: ${{ runner.temp }}/quoted-owner/
          if-no-files-found: error
          retention-days: 3
