name: Temporary site review workspace

# Branch-only source/dependency transfer for the requested documentation PR.
# No write token, deployment, tag, release, or branch update is performed.
on:
  pull_request:
    paths:
      - .github/workflows/site-review-workspace.yml
permissions:
  contents: read
jobs:
  export:
    if: github.head_ref == 'docs/human-experience-artifact-window' && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          submodules: recursive
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 22
      - name: Install exact existing site dependency lock
        working-directory: site
        run: npm ci
      - name: Export source, Git objects and locked dependencies without credentials
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/site-review-export"
          git bundle create "$RUNNER_TEMP/site-review-export/source.bundle" --all
          git rev-parse HEAD > "$RUNNER_TEMP/site-review-export/source-commit.txt"
          tar --exclude='./.git' --exclude='./academy-source/.git' -czf "$RUNNER_TEMP/site-review-export/workspace.tgz" .
          cd "$RUNNER_TEMP/site-review-export"
          sha256sum source.bundle workspace.tgz > SHA256SUMS
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: site-review-workspace
          path: ${{ runner.temp }}/site-review-export/
          retention-days: 1
