name: Temporary site review workspace

# Branch-only fixture preparation for the requested documentation PR.
# No write token, deployment, tag, release, or branch update is performed.
on:
  pull_request:
    paths:
      - .github/workflows/site-review-workspace.yml
permissions:
  contents: read
jobs:
  export:
    if: github.head_ref == 'docs/human-experience-artifact-window' && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          submodules: recursive
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e
        with:
          go-version: '1.27.1'
          check-latest: false
          cache: false
          go-download-base-url: https://go.dev/dl
      - name: Prepare exact source renderer for documentation fixtures
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/site-review-native"
          test "$(go env GOVERSION)" = go1.27.1
          git -C academy-source bundle create "$RUNNER_TEMP/site-review-native/academy.bundle" --all
          git -C academy-source rev-parse HEAD > "$RUNNER_TEMP/site-review-native/academy-commit.txt"
          git rev-parse HEAD > "$RUNNER_TEMP/site-review-native/source-commit.txt"
          go version > "$RUNNER_TEMP/site-review-native/toolchain.txt"
          cd core/artifacts
          go build -trimpath -o "$RUNNER_TEMP/site-review-native/ca-artifact" ./cmd/ca-artifact
          cd "$RUNNER_TEMP/site-review-native"
          sha256sum academy.bundle ca-artifact > SHA256SUMS
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: site-review-native-context
          path: ${{ runner.temp }}/site-review-native/
          retention-days: 1
