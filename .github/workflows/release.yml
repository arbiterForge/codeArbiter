name: release

# Manual publish path for the `ca` plugin, driven by workflow_dispatch so a
# release can be cut without a local machine. The runner's GITHUB_TOKEN carries
# `contents: write`, so it can create the tag and GitHub Release that a
# fine-grained integration token may not. This is the mechanical publish only:
# the version, the README/badge surfaces, and the CHANGELOG section must already
# be merged to the default branch (that is the /ca:release skill's Phase 1). The
# job asserts the requested version equals plugins/ca/.claude-plugin/plugin.json,
# extracts the matching CHANGELOG section as the notes, and is idempotent — a
# re-run at the SAME commit is a no-op, not a failure.

# Every plugin versions and releases independently (ADR-0007 for the sibling
# split, ADR-0011 for the Codex host), and each brings its own tag namespace,
# manifest, and CHANGELOG to this one dispatched workflow:
#
#   ca          v*             plugins/ca/.claude-plugin/plugin.json         CHANGELOG.md
#   ca-codex    ca-codex-v*    plugins/ca-codex/.codex-plugin/plugin.json    plugins/ca-codex/CHANGELOG.md
#   ca-sandbox  ca-sandbox-v*  plugins/ca-sandbox/.claude-plugin/plugin.json plugins/ca-sandbox/CHANGELOG.md
#   ca-pi       ca-pi-v*       plugins/ca-pi/package.json (+ root package.json)
#                                                                            plugins/ca-pi/CHANGELOG.md
#
# The ca-sandbox and ca-pi lanes are issue #382. Before them the repository
# enforced independent ca-sandbox-v*/ca-pi-v* version guards in CI and the
# README told users to install a pinned `ca-pi-v<version>` tag, while no
# workflow or sanctioned skill could create one — a documented install nothing
# could satisfy, and a standing invitation to hand-cut a tag outside the
# changelog, freshness, and read-back guarantees below.
#
# The four publisher jobs are deliberately thin. The mechanical publish they
# share — version/manifest agreement, notes extraction, the #380 tag classifier,
# and the #380 read-back — lives once in `.github/actions/publish-release`,
# because four copies of an irreversible-publish guard is three copies that will
# not get the next fix.

# AUTHORIZATION MODEL (issues #378, #385). Everything this workflow publishes is
# public and irreversible, so the decision to publish is made ONCE, by a job that
# holds no write token, and both publishers depend on it:
#
#   preflight (contents: read, checks: read)
#     1. refuses a dispatch off the default branch;
#     2. resolves EXACTLY ONE target from the four confirmation inputs — none
#        filled, or more than one filled, is a refusal, not a guess (#378: the
#        jobs used to test only their own input, so one dispatch supplying two
#        started two write-token publishers);
#     3. requires a green `[GATE ] | [REPO] | Merge readiness` check run for
#        GITHUB_SHA itself (#385: branch protection proves how a commit ENTERED
#        main, not that post-merge evidence exists for the exact commit being
#        tagged; the release skill's hard rules say MUST NOT tag on a red suite).
#
# Each publisher then runs only for the one resolved target. Their conditions
# carry no always()/!cancelled() escape, so a failed preflight skips them.
# .github/scripts/test_release_workflow.py asserts all of that against this file.

on:
  workflow_dispatch:
    inputs:
      confirm:
        description: "ca version to release (must equal plugins/ca/.claude-plugin/plugin.json), e.g. 2.6.1 — leave every other version input blank"
        required: false
        default: ""
      summary:
        description: "Optional release-title summary (appended after the version)"
        required: false
        default: ""
      codex_confirm:
        description: "ca-codex version to release (must equal plugins/ca-codex/.codex-plugin/plugin.json), e.g. 0.1.0 — leave every other version input blank"
        required: false
        default: ""
      codex_summary:
        description: "Optional release-title summary for the ca-codex release"
        required: false
        default: ""
      sandbox_confirm:
        description: "ca-sandbox version to release (must equal plugins/ca-sandbox/.claude-plugin/plugin.json), e.g. 0.1.5 — leave every other version input blank"
        required: false
        default: ""
      sandbox_summary:
        description: "Optional release-title summary for the ca-sandbox release"
        required: false
        default: ""
      pi_confirm:
        description: "ca-pi version to release (must equal plugins/ca-pi/package.json AND the root package.json), e.g. 0.1.28 — leave every other version input blank"
        required: false
        default: ""
      pi_summary:
        description: "Optional release-title summary for the ca-pi release"
        required: false
        default: ""
  # Auto-tag-on-merge (drift-prevention campaign, adjacent to issue #645).
  # Fires when `ci` finishes running on a push to `main` — NOT on `push`
  # directly, because a push-triggered job here would race ci.yml's OWN
  # concurrent re-run for the same commit and could read "pending" or
  # "missing" merge-readiness evidence for its own SHA. `workflow_run` only
  # dispatches once the upstream run has fully concluded, so
  # `github.event.workflow_run.conclusion` is authoritative with no race,
  # and no second evidence-fetch is needed the way the manual preflight's
  # own check-runs query is (#385).
  #
  # This trigger always resolves the workflow FILE as committed on the
  # default branch, regardless of which ref the upstream `ci` run analyzed —
  # the standard, safe shape for a downstream automation that holds a write
  # token, and why `auto-preflight` below checks out `head_sha` explicitly
  # rather than trusting an ambient ref.
  workflow_run:
    workflows: ["ci"]
    types: [completed]
    branches: [main]

# Least privilege by default. Only the publishing jobs widen this to
# `contents: write`; the preflight that authorizes them never holds a write
# token, so the job deciding whether to publish cannot itself publish.
permissions:
  contents: read

# Qualified auto-publication is one hosted cohort at a time. Manual dispatches
# keep their own run identity (and only sandbox can pass their preflight), so
# sandbox remains independent from qualified-target success/failure ordering.
concurrency:
  group: release-${{ github.event_name == 'workflow_run' && 'hosted-cohort' || github.run_id }}
  cancel-in-progress: false

jobs:
  preflight:
    name: "[GATE ] | [RELEASE] | Dispatch preflight"
    # Read-only authorization for the write-token publishers below. Fails
    # closed on every path: a refusal here skips both of them.
    #
    # Gated to the trigger that supplies its inputs (#654). This job resolves
    # a target from the four dispatch confirmations, which exist on
    # `workflow_dispatch` alone — on the auto-tag `workflow_run` path it read
    # four empty inputs, resolved `none`, and exited 1, concluding every
    # merge's `release` run `failure` while the auto-tag lanes below it
    # tagged correctly. Nothing was mis-published (it fails closed, and the
    # publishers skipped with it); what it destroyed was the signal, since a
    # permanently-red run is indistinguishable from a real auto-tag failure.
    # The four publishers need no guard of their own — `needs: preflight`
    # skips them with it, and their conditions carry no status escape.
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      actions: read
      contents: read
      checks: read
    outputs:
      target: ${{ steps.target.outputs.target }}
      cohort-run-id: ${{ steps.cohort.outputs.run-id }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Refuse a dispatch off the default branch
        run: |
          set -euo pipefail
          if [ "$GITHUB_REF" != "refs/heads/main" ]; then
            echo "::error::release dispatches are only valid on refs/heads/main (got '$GITHUB_REF')"
            exit 1
          fi

      - name: Require complete prior tag provenance
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 .github/scripts/check_tag_immutability.py --repo "$GITHUB_REPOSITORY" --require-recorded \
            --manifest .github/published-tags.json \
            --legacy-manifest .github/legacy-published-tags.json

      - name: Resolve exactly one release target
        id: target
        env:
          CONFIRM: ${{ github.event.inputs.confirm }}
          CODEX_CONFIRM: ${{ github.event.inputs.codex_confirm }}
          SANDBOX_CONFIRM: ${{ github.event.inputs.sandbox_confirm }}
          PI_CONFIRM: ${{ github.event.inputs.pi_confirm }}
        run: |
          set -euo pipefail
          # The helper prints a label and never raises; the '*' arm below is the
          # fail-closed default, so an unknown label refuses too — and a helper
          # that crashed prints nothing and trips `set -e` on the assignment.
          # NAME-KEYED (A-4.2). Each input carries the target it belongs
          # to, so selection never depends on the order these are passed.
          # The previous positional form aligned by index against the
          # declared row order — correct only while the two agreed, which
          # nothing enforced. A row inserted at the front of the declared
          # file shifted every confirmation by one, and this dispatch would
          # have published the wrong plugin while holding contents:write,
          # with every downstream check passing because the wrong release
          # is internally consistent.
          TARGET=$(python3 .github/scripts/_releaselib.py select-target-named \
            "ca=$CONFIRM" "ca-codex=$CODEX_CONFIRM" \
            "ca-sandbox=$SANDBOX_CONFIRM" "ca-pi=$PI_CONFIRM")
          case "$TARGET" in
            ca|ca-codex|ca-sandbox|ca-pi)
              echo "resolved release target: $TARGET"
              ;;
            multiple)
              echo "::error::this dispatch selected more than one plugin — supply exactly one version input, never two"
              exit 1
              ;;
            none)
              echo "::error::this dispatch selected no plugin — supply exactly one version input"
              exit 1
              ;;
            unknown)
              echo "::error::a version input names a target that .codearbiter/release-targets.md does not declare — the workflow's inputs and the declared file disagree. Reconcile them; do not add the name here alone."
              exit 1
              ;;
            *)
              echo "::error::could not resolve a release target (got '$TARGET')"
              exit 1
              ;;
          esac
          if [ "$TARGET" != "ca-sandbox" ]; then
            echo "::error::$TARGET is owned by the serialized hosted CI cohort; independent manual publication is prohibited"
            exit 1
          fi
          # Per-release evidence is not a per-PR CI gate (AC-6.8). Execute
          # the selected declaration through the check-only runner before
          # authorizing any publisher. No token or Actions output channel is
          # inherited by declared commands; checkout credentials are absent.
          PYTHON=$(python3 -c 'import sys; print(sys.executable)')
          env -i PATH="$PATH" SYSTEMROOT="${SYSTEMROOT:-}" \
            "$PYTHON" core/pysrc/_releaselib.py run-pre-tag "$TARGET"
          echo "target=$TARGET" >> "$GITHUB_OUTPUT"

      - name: Require green merge readiness for this exact commit
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          # Evidence is resolved for GITHUB_SHA itself, and the classifier
          # re-checks each run's head_sha — a green gate on a neighbouring
          # commit is not evidence for this one.
          # One page, deliberately: `--paginate` with `--jq` concatenates one
          # array per page, which is not valid JSON. A commit here carries a
          # few dozen check runs, and an over-full first page would land on
          # `missing` — a refusal, not a silent pass.
          gh api \
            "repos/${GITHUB_REPOSITORY}/commits/${GITHUB_SHA}/check-runs?per_page=100" \
            --jq '.check_runs' > checks.json
          STATE=$(python3 .github/scripts/_releaselib.py merge-readiness "$GITHUB_SHA" checks.json)
          case "$STATE" in
            green)
              echo "merge readiness is green for $GITHUB_SHA"
              ;;
            *)
              echo "::error::merge-readiness evidence for $GITHUB_SHA is '$STATE' — refusing to tag (release SKILL.md: MUST NOT tag on a red suite)"
              exit 1
              ;;
          esac

      - name: Locate the protected successful exact-commit package cohort
        id: cohort
        if: steps.target.outputs.target != 'ca-sandbox'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh api "repos/${GITHUB_REPOSITORY}/actions/workflows/ci.yml/runs?head_sha=${GITHUB_SHA}&branch=main&event=push&status=success&per_page=100" > cohort-runs.json
          RUN_ID=$(python3 - <<'PY'
          import json, os
          runs = json.load(open("cohort-runs.json", encoding="utf-8")).get("workflow_runs", [])
          eligible = [run for run in runs if run.get("head_sha") == os.environ["GITHUB_SHA"]
                      and run.get("head_branch") == "main" and run.get("event") == "push"
                      and run.get("conclusion") == "success"
                      and run.get("repository", {}).get("full_name") == os.environ["GITHUB_REPOSITORY"]]
          if not eligible:
              raise SystemExit("no protected successful CI run owns the exact release commit cohort")
          chosen = max(eligible, key=lambda run: (run.get("run_attempt", 0), run["id"]))
          print(chosen["id"])
          PY
          )
          echo "run-id=$RUN_ID" >> "$GITHUB_OUTPUT"

  release:
    name: CA | [Release] - Publish
    # The repository's primary release, and the only lane that claims the
    # "Latest" badge. Publish only from the default branch, where the merged
    # CHANGELOG section lives, and only when the read-only preflight resolved
    # `ca` as the single target. `needs: preflight` IS the authorization: the
    # condition below carries no status function, so a failed preflight skips
    # this job rather than letting it run anyway.
    needs: preflight
    if: github.ref == 'refs/heads/main' && needs.preflight.outputs.target == 'ca'
    permissions:
      actions: read
      contents: write
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - uses: ./.github/actions/publish-release
        with:
          target: ca
          manifest: plugins/ca/.claude-plugin/plugin.json
          changelog: CHANGELOG.md
          tag-prefix: v
          title-prefix: codeArbiter
          requested-version: ${{ github.event.inputs.confirm }}
          summary: ${{ github.event.inputs.summary }}
          mark-latest: "true"
          package-host: claude
          ci-run-id: ${{ needs.preflight.outputs.cohort-run-id }}
          source-commit: ${{ github.sha }}
          github-token: ${{ github.token }}

  codex-provenance:
    name: "[GATE ] | [CDX ] | Release candidate provenance"
    needs: preflight
    if: github.ref == 'refs/heads/main' && needs.preflight.outputs.target == 'ca-codex'
    permissions:
      contents: read
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Verify the exact static Codex candidate
        run: |
          set -euo pipefail
          python3 .github/scripts/verify_codex_candidate_provenance.py \
            --repo . --final-ref ${{ github.sha }} --json

  release-codex:
    name: CA-Codex | [Release] - Publish
    # An independently versioned sibling, never the repository's primary
    # release: the tag is namespaced so it cannot collide with ca's bare v*
    # series, and `mark-latest` stays false so it cannot take ca's "Latest"
    # badge. Publish only from the default branch, and only for the one
    # target the read-only preflight resolved.
    needs: [preflight, codex-provenance]
    if: github.ref == 'refs/heads/main' && needs.preflight.outputs.target == 'ca-codex'
    permissions:
      actions: read
      contents: write
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - uses: ./.github/actions/publish-release
        with:
          target: ca-codex
          manifest: plugins/ca-codex/.codex-plugin/plugin.json
          changelog: plugins/ca-codex/CHANGELOG.md
          tag-prefix: ca-codex-v
          title-prefix: ca-codex
          requested-version: ${{ github.event.inputs.codex_confirm }}
          summary: ${{ github.event.inputs.codex_summary }}
          mark-latest: "false"
          package-host: codex
          ci-run-id: ${{ needs.preflight.outputs.cohort-run-id }}
          source-commit: ${{ github.sha }}
          github-token: ${{ github.token }}

  release-sandbox:
    name: CA-Sandbox | [Release] - Publish
    # An independently versioned sibling, never the repository's primary
    # release: the tag is namespaced so it cannot collide with ca's bare v*
    # series, and `mark-latest` stays false so it cannot take ca's "Latest"
    # badge. Publish only from the default branch, and only for the one
    # target the read-only preflight resolved.
    needs: preflight
    if: github.ref == 'refs/heads/main' && needs.preflight.outputs.target == 'ca-sandbox'
    permissions:
      contents: write
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - uses: ./.github/actions/publish-release
        with:
          target: ca-sandbox
          manifest: plugins/ca-sandbox/.claude-plugin/plugin.json
          changelog: plugins/ca-sandbox/CHANGELOG.md
          tag-prefix: ca-sandbox-v
          title-prefix: ca-sandbox
          requested-version: ${{ github.event.inputs.sandbox_confirm }}
          summary: ${{ github.event.inputs.sandbox_summary }}
          mark-latest: "false"
          github-token: ${{ github.token }}

  release-pi:
    name: CA-Pi | [Release] - Publish
    # An independently versioned sibling, never the repository's primary
    # release: the tag is namespaced so it cannot collide with ca's bare v*
    # series, and `mark-latest` stays false so it cannot take ca's "Latest"
    # badge. Publish only from the default branch, and only for the one
    # target the read-only preflight resolved.
    #
    # Pi installs the REPOSITORY ROOT as the package (`pi install
    # git:github.com/arbiterForge/codeArbiter@ca-pi-v<version>`), so the root
    # package.json is a second manifest that must already agree with the
    # plugin's — hence `companion-manifest`. A root disagreeing with the tag
    # would install a package claiming a version the tag does not name.
    needs: preflight
    if: github.ref == 'refs/heads/main' && needs.preflight.outputs.target == 'ca-pi'
    permissions:
      contents: write
    runs-on: ubuntu-latest
    timeout-minutes: 20
    outputs:
      tag-object-sha: ${{ steps.release.outputs.tag-object-sha }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - uses: ./.github/actions/publish-release
        with:
          target: ca-pi
          manifest: plugins/ca-pi/package.json
          companion-manifest: package.json
          changelog: plugins/ca-pi/CHANGELOG.md
          tag-prefix: ca-pi-v
          title-prefix: ca-pi
          requested-version: ${{ github.event.inputs.pi_confirm }}
          summary: ${{ github.event.inputs.pi_summary }}
          mark-latest: "false"
          github-token: ${{ github.token }}
        id: release

  publish-pi-npm:
    name: CA-Pi | [Release] - Publish npm
    needs: [preflight, release-pi]
    if: github.ref == 'refs/heads/main' && needs.preflight.outputs.target == 'ca-pi'
    permissions:
      actions: read
      contents: read
      id-token: write
    uses: ./.github/workflows/npm-publish.yml
    with:
      tag: ca-pi-v${{ github.event.inputs.pi_confirm }}
      expected_sha: ${{ github.sha }}
      ci_run_id: ${{ needs.preflight.outputs.cohort-run-id }}
      cohort_targets: ca-pi
      expected_tag_object_sha: ${{ needs.release-pi.outputs.tag-object-sha }}
    secrets:
      NPMJS_TOKEN: ${{ secrets.NPMJS_TOKEN }}

  # ------------------------------------------------------------------------- #
  # Auto-publish-on-merge. Every push to main that advances a target's manifest
  # past its last published tag creates that tag and its GitHub Release after
  # CI completes successfully — no human dispatch, no batching, and no drift
  # between an installable tag and a visible release. A target whose manifest
  # advanced but
  # whose CHANGELOG carries no matching section fails loudly (the shared
  # action's own "no CHANGELOG section found" guard) rather than tagging
  # silently or inventing content — the exact gap that let ca-codex drift 11
  # undocumented versions before anyone noticed.
  # ------------------------------------------------------------------------- #

  auto-preflight:
    name: "[GATE ] | [RELEASE] | Auto-tag preflight"
    if: github.event_name == 'workflow_run' && github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.head_branch == 'main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    outputs:
      ca: ${{ steps.eligible.outputs.ca }}
      ca-codex: ${{ steps.eligible.outputs.ca-codex }}
      ca-sandbox: ${{ steps.eligible.outputs.ca-sandbox }}
      ca-pi: ${{ steps.eligible.outputs.ca-pi }}
      ca-pi-version: ${{ steps.eligible.outputs.ca-pi-version }}
      cohort-targets: ${{ steps.eligible.outputs.cohort-targets }}
      cohort-run-id: ${{ github.event.workflow_run.id }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          fetch-tags: true
          persist-credentials: false

      - name: Determine which targets have untagged work
        id: eligible
        env:
          GH_TOKEN: ${{ github.token }}
          UPSTREAM_EVENT: ${{ github.event.workflow_run.event }}
          UPSTREAM_CONCLUSION: ${{ github.event.workflow_run.conclusion }}
          UPSTREAM_BRANCH: ${{ github.event.workflow_run.head_branch }}
          UPSTREAM_REPOSITORY: ${{ github.event.workflow_run.head_repository.full_name }}
          UPSTREAM_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          set -euo pipefail
          # Execute only the independently selected trusted workflow tree.
          # An older or foreign event candidate remains inert, even when its
          # branch is named main or it reports a successful CI conclusion.
          if [ "$UPSTREAM_EVENT" != push ] || [ "$UPSTREAM_CONCLUSION" != success ] || \
             [ "$UPSTREAM_BRANCH" != main ] || [ "$UPSTREAM_REPOSITORY" != "$GITHUB_REPOSITORY" ] || \
             [ "$UPSTREAM_SHA" != "$GITHUB_SHA" ] || [ "$(git rev-parse HEAD)" != "$GITHUB_SHA" ]; then
            echo "::error::upstream is not a same-repository main push at the trusted workflow revision"
            exit 1
          fi
          # "Eligible" mirrors payload_version_gate.py's own question, asked
          # again here rather than trusted from the PR that merged: is the
          # manifest ACTUALLY ahead of what is already tagged, right now, at
          # this exact commit? A target whose manifest did not move in this
          # push is silently skipped — not an error, just nothing to do.
          TAGS=$(git tag -l)
          PYTHON=$(python3 -c 'import sys; print(sys.executable)')
          OUTPUTS=()
          COHORT_TARGETS=()
          ANY_ELIGIBLE=false
          for row in \
            "ca plugins/ca/.claude-plugin/plugin.json v" \
            "ca-codex plugins/ca-codex/.codex-plugin/plugin.json ca-codex-v" \
            "ca-sandbox plugins/ca-sandbox/.claude-plugin/plugin.json ca-sandbox-v" \
            "ca-pi plugins/ca-pi/package.json ca-pi-v"
          do
            set -- $row
            TARGET="$1"; MANIFEST="$2"; PREFIX="$3"
            VERSION=$(node -p "require('./$MANIFEST').version")
            ELIGIBLE=$(printf '%s' "$TAGS" \
              | python3 .github/scripts/_releaselib.py auto-eligible "$VERSION" "$PREFIX")
            echo "$TARGET: manifest=$VERSION eligible=$ELIGIBLE"
            if [ "$ELIGIBLE" = "true" ]; then
              ANY_ELIGIBLE=true
              if [ "$TARGET" != "ca-sandbox" ]; then COHORT_TARGETS+=("$TARGET"); fi
              # Same canonical, check-only release guard as manual dispatch;
              # ineligible siblings need no new per-release evidence.
              env -i PATH="$PATH" SYSTEMROOT="${SYSTEMROOT:-}" \
                "$PYTHON" core/pysrc/_releaselib.py run-pre-tag "$TARGET"
            fi
            OUTPUTS+=("$TARGET=$ELIGIBLE")
            if [ "$TARGET" = "ca-pi" ]; then
              OUTPUTS+=("ca-pi-version=$VERSION")
            fi
          done
          IFS=,; OUTPUTS+=("cohort-targets=${COHORT_TARGETS[*]}"); unset IFS
          if [ "$ANY_ELIGIBLE" = true ]; then
            python3 .github/scripts/check_tag_immutability.py --repo "$GITHUB_REPOSITORY" --require-recorded \
              --manifest .github/published-tags.json \
              --legacy-manifest .github/legacy-published-tags.json
          fi
          # A late target failure must not leave earlier authorizations behind.
          printf '%s\n' "${OUTPUTS[@]}" >> "$GITHUB_OUTPUT"

  auto-release:
    name: CA | [Auto-tag]
    needs: [auto-preflight, auto-cohort-reconciliation]
    if: github.event_name == 'workflow_run' && github.event.workflow_run.head_branch == 'main' && needs.auto-cohort-reconciliation.result == 'success' && (needs.auto-preflight.outputs.ca == 'true' || needs.auto-cohort-reconciliation.outputs.repair-ca == 'true')
    permissions:
      actions: read
      contents: write
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      GITHUB_SHA: ${{ github.event.workflow_run.head_sha }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          fetch-depth: 0

      - uses: ./.github/actions/publish-release
        with:
          target: ca
          manifest: plugins/ca/.claude-plugin/plugin.json
          changelog: CHANGELOG.md
          tag-prefix: v
          title-prefix: codeArbiter
          requested-version: ""
          summary: ""
          mark-latest: "true"
          create-release: "true"
          package-host: claude
          ci-run-id: ${{ needs.auto-preflight.outputs.cohort-run-id }}
          source-commit: ${{ github.event.workflow_run.head_sha }}
          cohort-targets: ${{ needs.auto-cohort-reconciliation.outputs.cohort-targets }}
          github-token: ${{ github.token }}

  auto-cohort-reconciliation:
    name: "[GATE ] | [COHORT] | Reconcile durable publication state"
    needs: auto-preflight
    if: github.event_name == 'workflow_run' && github.event.workflow_run.head_branch == 'main'
    permissions:
      actions: read
      contents: read
    outputs:
      mode: ${{ steps.durable.outputs.mode }}
      cohort-targets: ${{ steps.durable.outputs.cohort-targets }}
      repair-ca: ${{ steps.durable.outputs.repair-ca }}
      repair-ca-codex: ${{ steps.durable.outputs.repair-ca-codex }}
      repair-ca-pi: ${{ steps.durable.outputs.repair-ca-pi }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      SOURCE_COMMIT: ${{ github.event.workflow_run.head_sha }}
      CI_RUN_ID: ${{ needs.auto-preflight.outputs.cohort-run-id }}
      GH_TOKEN: ${{ github.token }}
      ELIGIBLE_CA: ${{ needs.auto-preflight.outputs.ca }}
      ELIGIBLE_CODEX: ${{ needs.auto-preflight.outputs.ca-codex }}
      ELIGIBLE_PI: ${{ needs.auto-preflight.outputs.ca-pi }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Download exact retained package cohort identity
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: artifact-release-packages-${{ github.event.workflow_run.head_sha }}
          path: ${{ runner.temp }}/artifact-publication-packages
          run-id: ${{ needs.auto-preflight.outputs.cohort-run-id }}
          github-token: ${{ github.token }}
      - name: Refuse cross-run cohort mixing before publication
        id: durable
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import base64, hashlib, json, os, pathlib, re, subprocess, sys
          sys.path.insert(0, ".github/scripts")
          from _npm_publishlib import (_validate_qualified_release_body,
                                       reject_markerless_current_tag)
          root = pathlib.Path(os.environ["RUNNER_TEMP"])
          package_root = root / "artifact-publication-packages"
          cohort_path = package_root / "artifact-package-cohort.json"
          cohort = json.loads(cohort_path.read_text(encoding="utf-8"))
          if (cohort.get("source_commit") != os.environ["SOURCE_COMMIT"]
                  or cohort.get("workflow") != ".github/workflows/ci.yml"
                  or cohort.get("run_id") != os.environ["CI_RUN_ID"]
                  or re.fullmatch(r"[0-9a-f]{40}", cohort.get("source_tree", "")) is None):
              raise SystemExit("retained cohort identity does not match this exact release run")
          versions = {
              "ca": json.load(open("plugins/ca/.claude-plugin/plugin.json", encoding="utf-8"))["version"],
              "ca-codex": json.load(open("plugins/ca-codex/.codex-plugin/plugin.json", encoding="utf-8"))["version"],
              "ca-pi": json.load(open("plugins/ca-pi/package.json", encoding="utf-8"))["version"],
          }
          config = {"ca": "v" + versions["ca"],
                    "ca-codex": "ca-codex-v" + versions["ca-codex"],
                    "ca-pi": "ca-pi-v" + versions["ca-pi"]}
          enabled = {"ca": os.environ["ELIGIBLE_CA"] == "true",
                     "ca-codex": os.environ["ELIGIBLE_CODEX"] == "true",
                     "ca-pi": os.environ["ELIGIBLE_PI"] == "true"}
          cohort_tags = dict(config)
          current = {"source_commit": cohort["source_commit"], "source_tree": cohort["source_tree"],
                     "workflow": cohort["workflow"],
                     "ci_run_id": cohort["run_id"],
                     "cohort_sha256": hashlib.sha256(cohort_path.read_bytes()).hexdigest(),
                     "cohort_tags": cohort_tags,
                     "eligible_targets": sorted(target for target, value in enabled.items() if value)}
          def unique(pairs):
              result = {}
              for key, value in pairs:
                  if key in result: raise SystemExit(f"duplicate durable receipt field: {key}")
                  result[key] = value
              return result
          pages = json.loads(subprocess.run(
              ["gh", "api", "--paginate", "--slurp",
               f"repos/{os.environ['GITHUB_REPOSITORY']}/releases?per_page=100"],
              text=True, capture_output=True, check=True).stdout)
          releases = [release for page in pages for release in page]
          by_tag = {release.get("tag_name"): release for release in releases}
          receipts = []
          markers = []
          draft_markers = []
          for release in releases:
              body = release.get("body") or ""
              matched = re.fullmatch(
                  r"(?s)(.*\n)\n<!-- codearbiter-cohort-start-v1:([A-Za-z0-9_-]+) -->\n",
                  body)
              marker_mentions = body.count("codearbiter-cohort-start-v1:")
              if matched is None and marker_mentions == 0:
                  continue
              if matched is None or marker_mentions != 1:
                  raise SystemExit(f"Release {release.get('tag_name')} has malformed or duplicate cohort markers")
              try:
                  marker_bytes = base64.urlsafe_b64decode(
                      matched.group(2) + "=" * (-len(matched.group(2)) % 4))
                  marker = json.loads(marker_bytes, object_pairs_hook=unique)
              except Exception as error:
                  raise SystemExit("cohort-start marker is not canonical JSON") from error
              _validate_qualified_release_body(
                  body, release.get("tag_name"), marker_bytes)
              if marker.get("tag") != release.get("tag_name"):
                  raise SystemExit("cohort-start marker is attached to the wrong Release")
              markers.append(marker)
              if release.get("draft") is True:
                  draft_markers.append(marker)
              assets = release.get("assets", [])
              durable = [asset for asset in assets if isinstance(asset.get("name"), str)
                         and asset["name"].startswith("codearbiter-cohort-publication")]
              if not durable:
                  if release.get("draft") is not True:
                      raise SystemExit("marker-owned Release was published without its durable receipt")
                  continue
              if len(durable) != 1 or durable[0]["name"] != "codearbiter-cohort-publication-v1.json":
                  raise SystemExit(f"Release {release.get('tag_name')} has extra durable receipts")
              response = subprocess.run(
                  ["gh", "api", "-H", "Accept: application/octet-stream", durable[0]["url"]],
                  capture_output=True, check=True)
              receipt = json.loads(response.stdout.decode("utf-8"), object_pairs_hook=unique)
              if receipt.get("tag") != release.get("tag_name"):
                  raise SystemExit("durable receipt is attached to the wrong Release")
              package_assets = [asset for asset in assets
                                if asset.get("name") == receipt.get("package_file")]
              if receipt.get("host") != "pi":
                  if len(package_assets) != 1:
                      raise SystemExit("historical durable receipt is missing its exact package asset")
                  package_bytes = subprocess.run(
                      ["gh", "api", "-H", "Accept: application/octet-stream",
                       package_assets[0]["url"]], capture_output=True, check=True).stdout
                  if hashlib.sha256(package_bytes).hexdigest() != receipt.get("package_sha256"):
                      raise SystemExit("historical durable package asset digest mismatch")
              receipts.append(receipt)
          missing = []
          for target, tag in config.items():
              remote = subprocess.run(["git", "ls-remote", "--tags", "origin", f"refs/tags/{tag}",
                                       f"refs/tags/{tag}^{{}}"], text=True, capture_output=True, check=True)
              release = by_tag.get(tag)
              matching_markers = [marker for marker in markers
                                  if marker.get("target") == target and marker.get("tag") == tag]
              if len(matching_markers) > 1:
                  raise SystemExit(f"current {target} Release marker is duplicate")
              try:
                  reject_markerless_current_tag(
                      remote.stdout, tag, cohort["source_commit"],
                      has_marker=len(matching_markers) == 1)
              except ValueError as error:
                  raise SystemExit(str(error)) from error
          state = {"receipts": receipts, "markers": markers,
                   "missing_current": sorted(missing),
                   "draft_markers": draft_markers}
          (root / "current-cohort.json").write_text(json.dumps(current), encoding="utf-8")
          (root / "durable-state.json").write_text(json.dumps(state), encoding="utf-8")
          PY
          python3 .github/scripts/_npm_publishlib.py reconcile-state \
            --current "$RUNNER_TEMP/current-cohort.json" --state "$RUNNER_TEMP/durable-state.json" \
            --output "$GITHUB_OUTPUT"

  auto-claude-cohort-gate:
    name: "[GATE ] | [COHORT] | Claude publication complete"
    needs: [auto-preflight, auto-cohort-reconciliation, auto-release]
    if: always() && github.event_name == 'workflow_run' && needs.auto-preflight.result == 'success' && needs.auto-cohort-reconciliation.result == 'success' && ((needs.auto-preflight.outputs.ca != 'true' && needs.auto-cohort-reconciliation.outputs.repair-ca != 'true') || needs.auto-release.result == 'success')
    runs-on: ubuntu-latest
    permissions: {}
    steps:
      - run: echo "Claude cohort stage is complete or ineligible"

  auto-codex-provenance:
    name: "[GATE ] | [CDX ] | Auto-tag candidate provenance"
    needs: [auto-preflight, auto-cohort-reconciliation, auto-claude-cohort-gate]
    if: github.event_name == 'workflow_run' && github.event.workflow_run.head_branch == 'main' && needs.auto-cohort-reconciliation.result == 'success' && (needs.auto-preflight.outputs.ca-codex == 'true' || needs.auto-cohort-reconciliation.outputs.repair-ca-codex == 'true')
    permissions:
      contents: read
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out the trusted default-branch verifier
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          path: trusted
          fetch-depth: 0
          persist-credentials: false
      - name: Materialize the exact completed-run candidate as inert data
        env:
          CANDIDATE_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          set -euo pipefail
          case "$CANDIDATE_SHA" in
            ""|*[!0-9a-f]*) echo "::error::candidate SHA must be lowercase hexadecimal"; exit 1 ;;
          esac
          if [ "${#CANDIDATE_SHA}" -ne 40 ]; then
            echo "::error::candidate SHA must contain exactly 40 hexadecimal characters"
            exit 1
          fi
          git -C trusted cat-file -e "$CANDIDATE_SHA^{commit}"
          git -C trusted merge-base --is-ancestor "$CANDIDATE_SHA" "${{ github.sha }}"
          git -C trusted worktree add --detach ../candidate "$CANDIDATE_SHA"
      - name: Verify the exact static Codex candidate
        env:
          CANDIDATE_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          set -euo pipefail
          python3 trusted/.github/scripts/verify_codex_candidate_provenance.py \
            --repo candidate --final-ref "$CANDIDATE_SHA" --json

  auto-release-codex:
    name: CA-Codex | [Auto-tag]
    needs: [auto-preflight, auto-cohort-reconciliation, auto-codex-provenance]
    if: github.event_name == 'workflow_run' && github.event.workflow_run.head_branch == 'main' && needs.auto-cohort-reconciliation.result == 'success' && (needs.auto-preflight.outputs.ca-codex == 'true' || needs.auto-cohort-reconciliation.outputs.repair-ca-codex == 'true')
    permissions:
      actions: read
      contents: write
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      GITHUB_SHA: ${{ github.event.workflow_run.head_sha }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          fetch-depth: 0

      - uses: ./.github/actions/publish-release
        with:
          target: ca-codex
          manifest: plugins/ca-codex/.codex-plugin/plugin.json
          changelog: plugins/ca-codex/CHANGELOG.md
          tag-prefix: ca-codex-v
          title-prefix: ca-codex
          requested-version: ""
          summary: ""
          mark-latest: "false"
          create-release: "true"
          package-host: codex
          ci-run-id: ${{ needs.auto-preflight.outputs.cohort-run-id }}
          source-commit: ${{ github.event.workflow_run.head_sha }}
          cohort-targets: ${{ needs.auto-cohort-reconciliation.outputs.cohort-targets }}
          github-token: ${{ github.token }}

  auto-codex-cohort-gate:
    name: "[GATE ] | [COHORT] | Codex publication complete"
    needs: [auto-preflight, auto-cohort-reconciliation, auto-claude-cohort-gate, auto-release-codex]
    if: always() && github.event_name == 'workflow_run' && needs.auto-preflight.result == 'success' && needs.auto-cohort-reconciliation.result == 'success' && needs.auto-claude-cohort-gate.result == 'success' && ((needs.auto-preflight.outputs.ca-codex != 'true' && needs.auto-cohort-reconciliation.outputs.repair-ca-codex != 'true') || needs.auto-release-codex.result == 'success')
    runs-on: ubuntu-latest
    permissions: {}
    steps:
      - run: echo "Codex cohort stage is complete or ineligible"

  auto-release-sandbox:
    name: CA-Sandbox | [Auto-tag]
    needs: auto-preflight
    if: github.event_name == 'workflow_run' && github.event.workflow_run.head_branch == 'main' && needs.auto-preflight.outputs.ca-sandbox == 'true'
    permissions:
      contents: write
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      GITHUB_SHA: ${{ github.event.workflow_run.head_sha }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          fetch-depth: 0

      - uses: ./.github/actions/publish-release
        with:
          target: ca-sandbox
          manifest: plugins/ca-sandbox/.claude-plugin/plugin.json
          changelog: plugins/ca-sandbox/CHANGELOG.md
          tag-prefix: ca-sandbox-v
          title-prefix: ca-sandbox
          requested-version: ""
          summary: ""
          mark-latest: "false"
          create-release: "true"
          github-token: ${{ github.token }}

  auto-release-pi:
    name: CA-Pi | [Auto-tag]
    needs: [auto-preflight, auto-cohort-reconciliation, auto-codex-cohort-gate]
    if: github.event_name == 'workflow_run' && github.event.workflow_run.head_branch == 'main' && needs.auto-cohort-reconciliation.result == 'success' && (needs.auto-preflight.outputs.ca-pi == 'true' || needs.auto-cohort-reconciliation.outputs.repair-ca-pi == 'true')
    permissions:
      actions: read
      contents: write
    runs-on: ubuntu-latest
    timeout-minutes: 20
    outputs:
      tag-object-sha: ${{ steps.release.outputs.tag-object-sha }}
    env:
      GITHUB_SHA: ${{ github.event.workflow_run.head_sha }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          fetch-depth: 0

      - uses: ./.github/actions/publish-release
        with:
          target: ca-pi
          manifest: plugins/ca-pi/package.json
          companion-manifest: package.json
          changelog: plugins/ca-pi/CHANGELOG.md
          tag-prefix: ca-pi-v
          title-prefix: ca-pi
          requested-version: ""
          summary: ""
          mark-latest: "false"
          create-release: "true"
          package-host: pi
          attach-package: "false"
          finalize-release: "false"
          ci-run-id: ${{ needs.auto-preflight.outputs.cohort-run-id }}
          source-commit: ${{ github.event.workflow_run.head_sha }}
          cohort-targets: ${{ needs.auto-cohort-reconciliation.outputs.cohort-targets }}
          github-token: ${{ github.token }}
        id: release

  auto-publish-pi-npm:
    name: CA-Pi | [Auto-publish npm]
    needs: [auto-preflight, auto-cohort-reconciliation, auto-codex-cohort-gate, auto-release-pi]
    if: github.event_name == 'workflow_run' && github.event.workflow_run.head_branch == 'main' && needs.auto-cohort-reconciliation.result == 'success' && (needs.auto-preflight.outputs.ca-pi == 'true' || needs.auto-cohort-reconciliation.outputs.repair-ca-pi == 'true')
    permissions:
      actions: read
      contents: read
      id-token: write
    uses: ./.github/workflows/npm-publish.yml
    with:
      tag: ca-pi-v${{ needs.auto-preflight.outputs.ca-pi-version }}
      expected_sha: ${{ github.event.workflow_run.head_sha }}
      ci_run_id: ${{ needs.auto-preflight.outputs.cohort-run-id }}
      cohort_targets: ${{ needs.auto-cohort-reconciliation.outputs.cohort-targets }}
      expected_tag_object_sha: ${{ needs.auto-release-pi.outputs.tag-object-sha }}
    secrets:
      NPMJS_TOKEN: ${{ secrets.NPMJS_TOKEN }}

  auto-retain-pi-cohort-receipt:
    name: CA-Pi | [Auto-publish receipt]
    needs: [auto-preflight, auto-cohort-reconciliation, auto-publish-pi-npm]
    if: github.event_name == 'workflow_run' && github.event.workflow_run.head_branch == 'main' && needs.auto-cohort-reconciliation.result == 'success' && (needs.auto-preflight.outputs.ca-pi == 'true' || needs.auto-cohort-reconciliation.outputs.repair-ca-pi == 'true')
    permissions:
      actions: read
      contents: write
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Download exact retained Pi package cohort
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: artifact-release-packages-${{ github.event.workflow_run.head_sha }}
          path: ${{ runner.temp }}/artifact-publication-packages
          run-id: ${{ needs.auto-preflight.outputs.cohort-run-id }}
          github-token: ${{ github.token }}
      - name: Acquire reviewed npm@11.19.1 CLI for final readback
        id: npm-cli
        run: |
          set -euo pipefail
          root="$(mktemp -d "$RUNNER_TEMP/npm-final.XXXXXXXX")"
          archive="$root/npm.tgz"
          curl --disable --fail --show-error --silent --proto '=https' --tlsv1.2 --max-redirs 0 \
            --output "$archive" "https://registry.npmjs.org/npm/-/npm-11.19.1.tgz"
          actual="sha512-$(openssl dgst -sha512 -binary "$archive" | openssl base64 -A)"
          test "$actual" = "sha512-ztsxKxt/kkIaAs+2i0GU6I+DRmUdrNasxTZKJe9TCdSjKxlhah/4r/hl5ygMD6XAg1qZ9c2TNomR4qgOydp10g=="
          python3 - "$archive" <<'PY'
          import pathlib,sys,tarfile
          with tarfile.open(sys.argv[1],"r:gz") as stream:
              for member in stream.getmembers():
                  path=pathlib.PurePosixPath(member.name)
                  if (path.is_absolute() or ".." in path.parts or member.issym()
                          or member.islnk() or member.isdev() or member.isfifo()):
                      raise SystemExit(f"unsafe npm CLI archive member: {member.name}")
          PY
          tar --extract --gzip --no-same-owner --no-same-permissions --file "$archive" --directory "$root"
          cli="$(realpath "$root/package/bin/npm-cli.js")"
          case "$cli" in "$root"/*) ;; *) exit 1 ;; esac
          test ! -L "$cli" && test "$("$cli" --version)" = "11.19.1"
          echo "executable=$cli" >> "$GITHUB_OUTPUT"
      - name: Download publisher-isolated durable Pi receipt
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: durable-pi-cohort-receipt-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/durable-pi-receipt
      - name: Retain and read back immutable Pi receipt on the Release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ca-pi-v${{ needs.auto-preflight.outputs.ca-pi-version }}
          SOURCE_COMMIT: ${{ github.event.workflow_run.head_sha }}
          CI_RUN_ID: ${{ needs.auto-preflight.outputs.cohort-run-id }}
          NPM_CLI: ${{ steps.npm-cli.outputs.executable }}
        run: |
          set -euo pipefail
          receipt="$RUNNER_TEMP/durable-pi-receipt/codearbiter-cohort-publication-v1.json"
          marker="$RUNNER_TEMP/pi-cohort-marker.json"
          python3 - "$receipt" "$marker" <<'PY'
          import json,sys
          receipt=json.load(open(sys.argv[1], encoding="utf-8"))
          marker={"format":"codearbiter.cohort-start/0.1.0","target":receipt["target"],
                  "host":receipt["host"],"tag":receipt["tag"],
                  "source_commit":receipt["source_commit"],"source_tree":receipt["source_tree"],
                  "workflow":".github/workflows/ci.yml","ci_run_id":receipt["ci_run_id"],
                  "cohort_sha256":receipt["cohort_sha256"],"cohort_tags":receipt["cohort_tags"],
                  "release_notes_sha256":receipt["release_notes_sha256"],
                  "cohort_targets":receipt["cohort_targets"]}
          with open(sys.argv[2],"w",encoding="utf-8",newline="\n") as stream:
              json.dump(marker,stream,sort_keys=True,separators=(",",":")); stream.write("\n")
          PY
          python3 .github/scripts/_npm_publishlib.py cohort-receipt \
            --receipt "$receipt" --marker "$marker"
          releases="$RUNNER_TEMP/pi-draft-releases.json"
          require_exact_draft() {
            gh api --paginate --slurp "repos/$GITHUB_REPOSITORY/releases?per_page=100" > "$releases"
            python3 .github/scripts/_npm_publishlib.py qualified-draft \
              --releases "$releases" --tag "$RELEASE_TAG" --marker "$marker" \
              --asset codearbiter-cohort-publication-v1.json
          }
          read -r RELEASE_ID RECEIPT_URL < <(require_exact_draft)
          if [ "$RECEIPT_URL" = missing ]; then
            read -r RELEASE_ID RECEIPT_URL < <(require_exact_draft)
            if [ "$RECEIPT_URL" = missing ]; then
              gh api --method POST -H "Content-Type: application/json" --input "$receipt" \
                "repos/$GITHUB_REPOSITORY/releases/$RELEASE_ID/assets?name=codearbiter-cohort-publication-v1.json" >/dev/null
            fi
          fi
          read -r RELEASE_ID RECEIPT_URL < <(require_exact_draft)
          [ "$RECEIPT_URL" != missing ]
          gh api -H "Accept: application/octet-stream" "$RECEIPT_URL" > "$RUNNER_TEMP/pi-receipt-readback.json"
          cmp "$receipt" "$RUNNER_TEMP/pi-receipt-readback.json"

          # Final, fresh Release validation: exact draft+marker, receipt-only
          # asset set, exact retained tgz digest, registry integrity/provenance,
          # and annotated tag identity all precede the undraft mutation.
          gh api --paginate --slurp "repos/$GITHUB_REPOSITORY/releases?per_page=100" > "$releases"
          read -r RELEASE_ID RECEIPT_URL < <(
            python3 .github/scripts/_npm_publishlib.py qualified-finalize \
              --releases "$releases" --tag "$RELEASE_TAG" --marker "$marker" \
              --asset codearbiter-cohort-publication-v1.json)
          gh api -H "Accept: application/octet-stream" "$RECEIPT_URL" > "$RUNNER_TEMP/pi-final-receipt.json"
          cmp "$receipt" "$RUNNER_TEMP/pi-final-receipt.json"
          python3 .github/scripts/_npm_publishlib.py cohort-receipt \
            --receipt "$RUNNER_TEMP/pi-final-receipt.json" --marker "$marker"
          read -r TARBALL INTEGRITY < <(python3 - "$receipt" "$RUNNER_TEMP" <<'PY'
          import base64,hashlib,json,pathlib,sys
          receipt=json.load(open(sys.argv[1],encoding="utf-8"))
          path=pathlib.Path(sys.argv[2]) / "artifact-publication-packages" / receipt["package_file"]
          data=path.read_bytes()
          if hashlib.sha256(data).hexdigest()!=receipt["package_sha256"]:
              raise SystemExit("Pi retained package digest changed before final publication")
          print(path, "sha512-"+base64.b64encode(hashlib.sha512(data).digest()).decode())
          PY
          )
          python3 .github/scripts/_npm_publishlib.py verify --repo . \
            --tag "$RELEASE_TAG" --expected-sha "$SOURCE_COMMIT" --trusted-sha "$SOURCE_COMMIT" \
            --integrity "$INTEGRITY" --npm "$NPM_CLI" --publication-mode existing
          TAG_OBJECT_SHA=$(python3 - "$RUNNER_TEMP/pi-final-receipt.json" <<'PY'
          import json,sys
          print(json.load(open(sys.argv[1],encoding="utf-8"))["tag_object_sha"])
          PY
          )
          git ls-remote --tags origin "refs/tags/$RELEASE_TAG" "refs/tags/$RELEASE_TAG^{}" > "$RUNNER_TEMP/pi-final-tag.txt"
          python3 .github/scripts/_npm_publishlib.py tag-identity \
            --remote "$RUNNER_TEMP/pi-final-tag.txt" --tag "$RELEASE_TAG" \
            --source "$SOURCE_COMMIT" --expected-object "$TAG_OBJECT_SHA" >/dev/null
          python3 - "$RUNNER_TEMP/pi-final-asset-identity.json" "$RECEIPT_URL" <<'PY'
          import json,sys
          with open(sys.argv[1],"w",encoding="utf-8",newline="\n") as stream:
              json.dump({"codearbiter-cohort-publication-v1.json":sys.argv[2]},stream,
                        sort_keys=True,separators=(",",":")); stream.write("\n")
          PY
          # A second full inventory read is the literal final operation before
          # publication, so late body/draft/asset drift cannot reuse the prior snapshot.
          gh api --paginate --slurp "repos/$GITHUB_REPOSITORY/releases?per_page=100" > "$releases"
          read -r RELEASE_ID _ < <(
            python3 .github/scripts/_npm_publishlib.py qualified-finalize \
              --releases "$releases" --tag "$RELEASE_TAG" --marker "$marker" \
              --asset codearbiter-cohort-publication-v1.json \
              --expected-assets "$RUNNER_TEMP/pi-final-asset-identity.json")
          gh api --method PATCH -F draft=false -f make_latest=false \
            "repos/$GITHUB_REPOSITORY/releases/$RELEASE_ID" >/dev/null
          gh api "repos/$GITHUB_REPOSITORY/releases/tags/$RELEASE_TAG" --jq '.draft == false' | grep -qx true

  auto-command-route-release-audit:
    name: "[GATE ] | [RELEASE] | Command-route publication"
    needs: [auto-preflight, auto-cohort-reconciliation, auto-claude-cohort-gate, auto-codex-cohort-gate, auto-release, auto-release-codex, auto-release-pi, auto-publish-pi-npm, auto-retain-pi-cohort-receipt]
    # `always()` is required because an ineligible publisher is skipped. This
    # read-only success receipt runs after every required RA-11 publisher has
    # succeeded or been proven ineligible. An eligible npm failure suppresses
    # this receipt while the npm publisher itself remains independently red.
    # Every declared first-containing Release must also read back below.
    if: always() && github.event_name == 'workflow_run' && github.event.workflow_run.head_branch == 'main' && needs.auto-preflight.result == 'success' && needs.auto-cohort-reconciliation.result == 'success' && ((needs.auto-preflight.outputs.ca-pi != 'true' && needs.auto-cohort-reconciliation.outputs.repair-ca-pi != 'true') || needs.auto-retain-pi-cohort-receipt.result == 'success')
    permissions:
      contents: read
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out the trusted default-branch release auditor
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          path: trusted
          fetch-depth: 0
          fetch-tags: true
          persist-credentials: false

      - name: Materialize the exact completed-run release candidate as inert data
        env:
          CANDIDATE_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          set -euo pipefail
          case "$CANDIDATE_SHA" in
            ""|*[!0-9a-f]*) echo "::error::candidate SHA must be lowercase hexadecimal"; exit 1 ;;
          esac
          if [ "${#CANDIDATE_SHA}" -ne 40 ]; then
            echo "::error::candidate SHA must contain exactly 40 hexadecimal characters"
            exit 1
          fi
          git -C trusted cat-file -e "$CANDIDATE_SHA^{commit}"
          git -C trusted merge-base --is-ancestor "$CANDIDATE_SHA" "${{ github.sha }}"
          git -C trusted worktree add --detach ../candidate "$CANDIDATE_SHA"

      - name: Capture exact GitHub Release API evidence
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -u
          EVIDENCE_DIR="$RUNNER_TEMP/command-route-release-state"
          mkdir -p "$EVIDENCE_DIR"
          python3 trusted/.github/scripts/check_command_route_release_state.py plan \
            --repo candidate > "$EVIDENCE_DIR/plan.tsv"
          while IFS=$'\t' read -r TARGET TAG; do
            set +e
            gh api --include \
              "repos/$GITHUB_REPOSITORY/releases/tags/$TAG" \
              > "$EVIDENCE_DIR/$TARGET.http" \
              2> "$EVIDENCE_DIR/$TARGET.stderr"
            STATUS=$?
            set -e
            printf '%s\n' "$STATUS" > "$EVIDENCE_DIR/$TARGET.exit"
          done < "$EVIDENCE_DIR/plan.tsv"

      - name: Require every first-containing candidate to be published
        run: |
          python3 trusted/.github/scripts/check_command_route_release_state.py observe \
            --repo candidate \
            --evidence-dir "$RUNNER_TEMP/command-route-release-state"
