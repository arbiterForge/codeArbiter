name: release

# Manual publish path for the `ca` plugin, driven by workflow_dispatch so a
# release can be cut without a local machine. The runner's GITHUB_TOKEN carries
# `contents: write`, so it can create the tag and GitHub Release that a
# fine-grained integration token may not. This is the mechanical publish only:
# the version, the README/badge surfaces, and the CHANGELOG section must already
# be merged to the default branch (that is the /ca:release skill's Phase 1). The
# job asserts the requested version equals plugins/ca/.claude-plugin/plugin.json,
# extracts the matching CHANGELOG section as the notes, and is idempotent — a
# re-run at the SAME commit is a no-op, not a failure.

# Every plugin versions and releases independently (ADR-0007 for the sibling
# split, ADR-0011 for the Codex host), and each brings its own tag namespace,
# manifest, and CHANGELOG to this one dispatched workflow:
#
#   ca          v*             plugins/ca/.claude-plugin/plugin.json         CHANGELOG.md
#   ca-codex    ca-codex-v*    plugins/ca-codex/.codex-plugin/plugin.json    plugins/ca-codex/CHANGELOG.md
#   ca-sandbox  ca-sandbox-v*  plugins/ca-sandbox/.claude-plugin/plugin.json plugins/ca-sandbox/CHANGELOG.md
#   ca-pi       ca-pi-v*       plugins/ca-pi/package.json (+ root package.json)
#                                                                            plugins/ca-pi/CHANGELOG.md
#
# The ca-sandbox and ca-pi lanes are issue #382. Before them the repository
# enforced independent ca-sandbox-v*/ca-pi-v* version guards in CI and the
# README told users to install a pinned `ca-pi-v<version>` tag, while no
# workflow or sanctioned skill could create one — a documented install nothing
# could satisfy, and a standing invitation to hand-cut a tag outside the
# changelog, freshness, and read-back guarantees below.
#
# The four publisher jobs are deliberately thin. The mechanical publish they
# share — version/manifest agreement, notes extraction, the #380 tag classifier,
# and the #380 read-back — lives once in `.github/actions/publish-release`,
# because four copies of an irreversible-publish guard is three copies that will
# not get the next fix.

# AUTHORIZATION MODEL (issues #378, #385). Everything this workflow publishes is
# public and irreversible, so the decision to publish is made ONCE, by a job that
# holds no write token, and both publishers depend on it:
#
#   preflight (contents: read, checks: read)
#     1. refuses a dispatch off the default branch;
#     2. resolves EXACTLY ONE target from the four confirmation inputs — none
#        filled, or more than one filled, is a refusal, not a guess (#378: the
#        jobs used to test only their own input, so one dispatch supplying two
#        started two write-token publishers);
#     3. requires a green `[GATE ] | [REPO] | Merge readiness` check run for
#        GITHUB_SHA itself (#385: branch protection proves how a commit ENTERED
#        main, not that post-merge evidence exists for the exact commit being
#        tagged; the release skill's hard rules say MUST NOT tag on a red suite).
#
# Each publisher then runs only for the one resolved target. Their conditions
# carry no always()/!cancelled() escape, so a failed preflight skips them.
# .github/scripts/test_release_workflow.py asserts all of that against this file.

on:
  workflow_dispatch:
    inputs:
      confirm:
        description: "ca version to release (must equal plugins/ca/.claude-plugin/plugin.json), e.g. 2.6.1 — leave every other version input blank"
        required: false
        default: ""
      summary:
        description: "Optional release-title summary (appended after the version)"
        required: false
        default: ""
      codex_confirm:
        description: "ca-codex version to release (must equal plugins/ca-codex/.codex-plugin/plugin.json), e.g. 0.1.0 — leave every other version input blank"
        required: false
        default: ""
      codex_summary:
        description: "Optional release-title summary for the ca-codex release"
        required: false
        default: ""
      sandbox_confirm:
        description: "ca-sandbox version to release (must equal plugins/ca-sandbox/.claude-plugin/plugin.json), e.g. 0.1.5 — leave every other version input blank"
        required: false
        default: ""
      sandbox_summary:
        description: "Optional release-title summary for the ca-sandbox release"
        required: false
        default: ""
      pi_confirm:
        description: "ca-pi version to release (must equal plugins/ca-pi/package.json AND the root package.json), e.g. 0.1.28 — leave every other version input blank"
        required: false
        default: ""
      pi_summary:
        description: "Optional release-title summary for the ca-pi release"
        required: false
        default: ""
  # Auto-tag-on-merge (drift-prevention campaign, adjacent to issue #645).
  # Fires when `ci` finishes running on a push to `main` — NOT on `push`
  # directly, because a push-triggered job here would race ci.yml's OWN
  # concurrent re-run for the same commit and could read "pending" or
  # "missing" merge-readiness evidence for its own SHA. `workflow_run` only
  # dispatches once the upstream run has fully concluded, so
  # `github.event.workflow_run.conclusion` is authoritative with no race,
  # and no second evidence-fetch is needed the way the manual preflight's
  # own check-runs query is (#385).
  #
  # This trigger always resolves the workflow FILE as committed on the
  # default branch, regardless of which ref the upstream `ci` run analyzed —
  # the standard, safe shape for a downstream automation that holds a write
  # token, and why `auto-preflight` below checks out `head_sha` explicitly
  # rather than trusting an ambient ref.
  workflow_run:
    workflows: ["ci"]
    types: [completed]
    branches: [main]

# Least privilege by default. Only the publishing jobs widen this to
# `contents: write`; the preflight that authorizes them never holds a write
# token, so the job deciding whether to publish cannot itself publish.
permissions:
  contents: read

jobs:
  preflight:
    name: "[GATE ] | [RELEASE] | Dispatch preflight"
    # Read-only authorization for the write-token publishers below. Fails
    # closed on every path: a refusal here skips both of them.
    #
    # Gated to the trigger that supplies its inputs (#654). This job resolves
    # a target from the four dispatch confirmations, which exist on
    # `workflow_dispatch` alone — on the auto-tag `workflow_run` path it read
    # four empty inputs, resolved `none`, and exited 1, concluding every
    # merge's `release` run `failure` while the auto-tag lanes below it
    # tagged correctly. Nothing was mis-published (it fails closed, and the
    # publishers skipped with it); what it destroyed was the signal, since a
    # permanently-red run is indistinguishable from a real auto-tag failure.
    # The four publishers need no guard of their own — `needs: preflight`
    # skips them with it, and their conditions carry no status escape.
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      checks: read
    outputs:
      target: ${{ steps.target.outputs.target }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Refuse a dispatch off the default branch
        run: |
          set -euo pipefail
          if [ "$GITHUB_REF" != "refs/heads/main" ]; then
            echo "::error::release dispatches are only valid on refs/heads/main (got '$GITHUB_REF')"
            exit 1
          fi

      - name: Resolve exactly one release target
        id: target
        env:
          CONFIRM: ${{ github.event.inputs.confirm }}
          CODEX_CONFIRM: ${{ github.event.inputs.codex_confirm }}
          SANDBOX_CONFIRM: ${{ github.event.inputs.sandbox_confirm }}
          PI_CONFIRM: ${{ github.event.inputs.pi_confirm }}
        run: |
          set -euo pipefail
          # The helper prints a label and never raises; the '*' arm below is the
          # fail-closed default, so an unknown label refuses too — and a helper
          # that crashed prints nothing and trips `set -e` on the assignment.
          # NAME-KEYED (A-4.2). Each input carries the target it belongs
          # to, so selection never depends on the order these are passed.
          # The previous positional form aligned by index against the
          # declared row order — correct only while the two agreed, which
          # nothing enforced. A row inserted at the front of the declared
          # file shifted every confirmation by one, and this dispatch would
          # have published the wrong plugin while holding contents:write,
          # with every downstream check passing because the wrong release
          # is internally consistent.
          TARGET=$(python3 .github/scripts/_releaselib.py select-target-named \
            "ca=$CONFIRM" "ca-codex=$CODEX_CONFIRM" \
            "ca-sandbox=$SANDBOX_CONFIRM" "ca-pi=$PI_CONFIRM")
          case "$TARGET" in
            ca|ca-codex|ca-sandbox|ca-pi)
              echo "resolved release target: $TARGET"
              ;;
            multiple)
              echo "::error::this dispatch selected more than one plugin — supply exactly one version input, never two"
              exit 1
              ;;
            none)
              echo "::error::this dispatch selected no plugin — supply exactly one version input"
              exit 1
              ;;
            unknown)
              echo "::error::a version input names a target that .codearbiter/release-targets.md does not declare — the workflow's inputs and the declared file disagree. Reconcile them; do not add the name here alone."
              exit 1
              ;;
            *)
              echo "::error::could not resolve a release target (got '$TARGET')"
              exit 1
              ;;
          esac
          echo "target=$TARGET" >> "$GITHUB_OUTPUT"

      - name: Require green merge readiness for this exact commit
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          # Evidence is resolved for GITHUB_SHA itself, and the classifier
          # re-checks each run's head_sha — a green gate on a neighbouring
          # commit is not evidence for this one.
          # One page, deliberately: `--paginate` with `--jq` concatenates one
          # array per page, which is not valid JSON. A commit here carries a
          # few dozen check runs, and an over-full first page would land on
          # `missing` — a refusal, not a silent pass.
          gh api \
            "repos/${GITHUB_REPOSITORY}/commits/${GITHUB_SHA}/check-runs?per_page=100" \
            --jq '.check_runs' > checks.json
          STATE=$(python3 .github/scripts/_releaselib.py merge-readiness "$GITHUB_SHA" checks.json)
          case "$STATE" in
            green)
              echo "merge readiness is green for $GITHUB_SHA"
              ;;
            *)
              echo "::error::merge-readiness evidence for $GITHUB_SHA is '$STATE' — refusing to tag (release SKILL.md: MUST NOT tag on a red suite)"
              exit 1
              ;;
          esac

  release:
    name: CA | [Release] - Publish
    # The repository's primary release, and the only lane that claims the
    # "Latest" badge. Publish only from the default branch, where the merged
    # CHANGELOG section lives, and only when the read-only preflight resolved
    # `ca` as the single target. `needs: preflight` IS the authorization: the
    # condition below carries no status function, so a failed preflight skips
    # this job rather than letting it run anyway.
    needs: preflight
    if: github.ref == 'refs/heads/main' && needs.preflight.outputs.target == 'ca'
    permissions:
      contents: write
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - uses: ./.github/actions/publish-release
        with:
          target: ca
          manifest: plugins/ca/.claude-plugin/plugin.json
          changelog: CHANGELOG.md
          tag-prefix: v
          title-prefix: codeArbiter
          requested-version: ${{ github.event.inputs.confirm }}
          summary: ${{ github.event.inputs.summary }}
          mark-latest: "true"
          github-token: ${{ github.token }}

  release-codex:
    name: CA-Codex | [Release] - Publish
    # An independently versioned sibling, never the repository's primary
    # release: the tag is namespaced so it cannot collide with ca's bare v*
    # series, and `mark-latest` stays false so it cannot take ca's "Latest"
    # badge. Publish only from the default branch, and only for the one
    # target the read-only preflight resolved.
    needs: preflight
    if: github.ref == 'refs/heads/main' && needs.preflight.outputs.target == 'ca-codex'
    permissions:
      contents: write
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - uses: ./.github/actions/publish-release
        with:
          target: ca-codex
          manifest: plugins/ca-codex/.codex-plugin/plugin.json
          changelog: plugins/ca-codex/CHANGELOG.md
          tag-prefix: ca-codex-v
          title-prefix: ca-codex
          requested-version: ${{ github.event.inputs.codex_confirm }}
          summary: ${{ github.event.inputs.codex_summary }}
          mark-latest: "false"
          github-token: ${{ github.token }}

  release-sandbox:
    name: CA-Sandbox | [Release] - Publish
    # An independently versioned sibling, never the repository's primary
    # release: the tag is namespaced so it cannot collide with ca's bare v*
    # series, and `mark-latest` stays false so it cannot take ca's "Latest"
    # badge. Publish only from the default branch, and only for the one
    # target the read-only preflight resolved.
    needs: preflight
    if: github.ref == 'refs/heads/main' && needs.preflight.outputs.target == 'ca-sandbox'
    permissions:
      contents: write
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - uses: ./.github/actions/publish-release
        with:
          target: ca-sandbox
          manifest: plugins/ca-sandbox/.claude-plugin/plugin.json
          changelog: plugins/ca-sandbox/CHANGELOG.md
          tag-prefix: ca-sandbox-v
          title-prefix: ca-sandbox
          requested-version: ${{ github.event.inputs.sandbox_confirm }}
          summary: ${{ github.event.inputs.sandbox_summary }}
          mark-latest: "false"
          github-token: ${{ github.token }}

  release-pi:
    name: CA-Pi | [Release] - Publish
    # An independently versioned sibling, never the repository's primary
    # release: the tag is namespaced so it cannot collide with ca's bare v*
    # series, and `mark-latest` stays false so it cannot take ca's "Latest"
    # badge. Publish only from the default branch, and only for the one
    # target the read-only preflight resolved.
    #
    # Pi installs the REPOSITORY ROOT as the package (`pi install
    # git:github.com/arbiterForge/codeArbiter@ca-pi-v<version>`), so the root
    # package.json is a second manifest that must already agree with the
    # plugin's — hence `companion-manifest`. A root disagreeing with the tag
    # would install a package claiming a version the tag does not name.
    needs: preflight
    if: github.ref == 'refs/heads/main' && needs.preflight.outputs.target == 'ca-pi'
    permissions:
      contents: write
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - uses: ./.github/actions/publish-release
        with:
          target: ca-pi
          manifest: plugins/ca-pi/package.json
          companion-manifest: package.json
          changelog: plugins/ca-pi/CHANGELOG.md
          tag-prefix: ca-pi-v
          title-prefix: ca-pi
          requested-version: ${{ github.event.inputs.pi_confirm }}
          summary: ${{ github.event.inputs.pi_summary }}
          mark-latest: "false"
          github-token: ${{ github.token }}

  # ------------------------------------------------------------------------- #
  # Auto-publish-on-merge. Every push to main that advances a target's manifest
  # past its last published tag creates that tag and its GitHub Release after
  # CI completes successfully — no human dispatch, no batching, and no drift
  # between an installable tag and a visible release. A target whose manifest
  # advanced but
  # whose CHANGELOG carries no matching section fails loudly (the shared
  # action's own "no CHANGELOG section found" guard) rather than tagging
  # silently or inventing content — the exact gap that let ca-codex drift 11
  # undocumented versions before anyone noticed.
  # ------------------------------------------------------------------------- #

  auto-preflight:
    name: "[GATE ] | [RELEASE] | Auto-tag preflight"
    if: github.event_name == 'workflow_run' && github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.head_branch == 'main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    outputs:
      ca: ${{ steps.eligible.outputs.ca }}
      ca-codex: ${{ steps.eligible.outputs.ca-codex }}
      ca-sandbox: ${{ steps.eligible.outputs.ca-sandbox }}
      ca-pi: ${{ steps.eligible.outputs.ca-pi }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          fetch-depth: 0
          fetch-tags: true

      - name: Determine which targets have untagged work
        id: eligible
        run: |
          set -euo pipefail
          # "Eligible" mirrors payload_version_gate.py's own question, asked
          # again here rather than trusted from the PR that merged: is the
          # manifest ACTUALLY ahead of what is already tagged, right now, at
          # this exact commit? A target whose manifest did not move in this
          # push is silently skipped — not an error, just nothing to do.
          TAGS=$(git tag -l)
          for row in \
            "ca plugins/ca/.claude-plugin/plugin.json v" \
            "ca-codex plugins/ca-codex/.codex-plugin/plugin.json ca-codex-v" \
            "ca-sandbox plugins/ca-sandbox/.claude-plugin/plugin.json ca-sandbox-v" \
            "ca-pi plugins/ca-pi/package.json ca-pi-v"
          do
            set -- $row
            TARGET="$1"; MANIFEST="$2"; PREFIX="$3"
            VERSION=$(node -p "require('./$MANIFEST').version")
            ELIGIBLE=$(printf '%s' "$TAGS" \
              | python3 .github/scripts/_releaselib.py auto-eligible "$VERSION" "$PREFIX")
            echo "$TARGET: manifest=$VERSION eligible=$ELIGIBLE"
            echo "$TARGET=$ELIGIBLE" >> "$GITHUB_OUTPUT"
          done

  auto-release:
    name: CA | [Auto-tag]
    needs: auto-preflight
    if: github.event_name == 'workflow_run' && github.event.workflow_run.head_branch == 'main' && needs.auto-preflight.outputs.ca == 'true'
    permissions:
      contents: write
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      GITHUB_SHA: ${{ github.event.workflow_run.head_sha }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          fetch-depth: 0

      - uses: ./.github/actions/publish-release
        with:
          target: ca
          manifest: plugins/ca/.claude-plugin/plugin.json
          changelog: CHANGELOG.md
          tag-prefix: v
          title-prefix: codeArbiter
          requested-version: ""
          summary: ""
          mark-latest: "true"
          create-release: "true"
          github-token: ${{ github.token }}

  auto-release-codex:
    name: CA-Codex | [Auto-tag]
    needs: auto-preflight
    if: github.event_name == 'workflow_run' && github.event.workflow_run.head_branch == 'main' && needs.auto-preflight.outputs.ca-codex == 'true'
    permissions:
      contents: write
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      GITHUB_SHA: ${{ github.event.workflow_run.head_sha }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          fetch-depth: 0

      - uses: ./.github/actions/publish-release
        with:
          target: ca-codex
          manifest: plugins/ca-codex/.codex-plugin/plugin.json
          changelog: plugins/ca-codex/CHANGELOG.md
          tag-prefix: ca-codex-v
          title-prefix: ca-codex
          requested-version: ""
          summary: ""
          mark-latest: "false"
          create-release: "true"
          github-token: ${{ github.token }}

  auto-release-sandbox:
    name: CA-Sandbox | [Auto-tag]
    needs: auto-preflight
    if: github.event_name == 'workflow_run' && github.event.workflow_run.head_branch == 'main' && needs.auto-preflight.outputs.ca-sandbox == 'true'
    permissions:
      contents: write
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      GITHUB_SHA: ${{ github.event.workflow_run.head_sha }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          fetch-depth: 0

      - uses: ./.github/actions/publish-release
        with:
          target: ca-sandbox
          manifest: plugins/ca-sandbox/.claude-plugin/plugin.json
          changelog: plugins/ca-sandbox/CHANGELOG.md
          tag-prefix: ca-sandbox-v
          title-prefix: ca-sandbox
          requested-version: ""
          summary: ""
          mark-latest: "false"
          create-release: "true"
          github-token: ${{ github.token }}

  auto-release-pi:
    name: CA-Pi | [Auto-tag]
    needs: auto-preflight
    if: github.event_name == 'workflow_run' && github.event.workflow_run.head_branch == 'main' && needs.auto-preflight.outputs.ca-pi == 'true'
    permissions:
      contents: write
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      GITHUB_SHA: ${{ github.event.workflow_run.head_sha }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          fetch-depth: 0

      - uses: ./.github/actions/publish-release
        with:
          target: ca-pi
          manifest: plugins/ca-pi/package.json
          companion-manifest: package.json
          changelog: plugins/ca-pi/CHANGELOG.md
          tag-prefix: ca-pi-v
          title-prefix: ca-pi
          requested-version: ""
          summary: ""
          mark-latest: "false"
          create-release: "true"
          github-token: ${{ github.token }}
