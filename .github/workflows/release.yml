name: release

# Release on merge, one plugin at a time (ADR-0040).
#
# When `ci` succeeds for a push to main, every plugin whose manifest advanced
# (or whose own tag exists but whose Release is not yet published) releases
# independently:
#
#   ca          v*             Claude Code  -> Release + ca-marketplace branch
#   ca-codex    ca-codex-v*    Codex        -> Release + ca-codex-marketplace (git dist tag)
#   ca-pi       ca-pi-v*       Pi           -> Release + npm @arbiterforge/ca-pi
#   ca-sandbox  ca-sandbox-v*  Claude Code  -> Release (plain plugin, no engine payload)
#
# There is no cross-plugin cohort: a failed plugin never blocks the others,
# and there is no resume state. Every publish step observes the remote first
# and does only what is missing. To recover a half-finished release, use
# "Re-run failed jobs" on the original run: it reuses that run's planned
# commit and CI artifacts, while they are retained. A manual dispatch
# publishes main's CURRENT head, so it helps only while the version's tag is
# not yet cut or still names that head. The only refusals are ones that
# protect users: a version whose tag already names another commit (bump and
# merge again), a package cohort that does not verify, or published bytes that
# do not read back.

on:
  workflow_run:
    workflows: ["ci"]
    types: [completed]
    branches: [main]
  workflow_dispatch:
    inputs:
      target:
        description: "Plugin to (re)publish from main's current head"
        required: true
        type: choice
        options: [ca, ca-codex, ca-pi, ca-sandbox]

permissions:
  contents: read

jobs:
  preflight:
    name: "[GATE ] | [RELEASE] | Plan"
    if: >-
      (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main') ||
      (github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.event == 'push' &&
       github.event.workflow_run.head_branch == 'main' &&
       github.event.workflow_run.head_repository.full_name == github.repository)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      actions: read
      # Draft Releases are only visible to a token with push access.
      contents: write
    outputs:
      source: ${{ steps.source.outputs.source }}
      ci-run-id: ${{ steps.source.outputs.ci-run-id }}
      ca: ${{ steps.eligible.outputs.ca }}
      ca-codex: ${{ steps.eligible.outputs.ca-codex }}
      ca-pi: ${{ steps.eligible.outputs.ca-pi }}
      ca-sandbox: ${{ steps.eligible.outputs.ca-sandbox }}
      failed: ${{ steps.eligible.outputs.failed }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: refs/heads/main
          fetch-depth: 0
          fetch-tags: true
          persist-credentials: false

      - name: Resolve the release commit and its successful CI run
        id: source
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_SHA: ${{ github.event.workflow_run.head_sha }}
          RUN_ID: ${{ github.event.workflow_run.id }}
        run: |
          set -euo pipefail
          if [ "$GITHUB_EVENT_NAME" = workflow_run ]; then
            # Release this run's own commit even if main has moved on: a later
            # merge may start no CI run (path filters) or fail CI, and skipping
            # here would lose this release. Overlap is safe: the planner refuses
            # a spent tag, and each release job re-checks before publishing.
            SOURCE="$RUN_SHA"; CI_RUN_ID="$RUN_ID"
          else
            # Dispatch: the newest main commit with a successful push CI run
            # (and therefore a retained package cohort), not necessarily HEAD.
            read -r SOURCE CI_RUN_ID < <(gh api \
              "repos/$GITHUB_REPOSITORY/actions/workflows/ci.yml/runs?branch=main&event=push&status=success&per_page=1" \
              --jq '.workflow_runs[0] | "\(.head_sha) \(.id)"')
            [ -n "${SOURCE:-}" ] && [ "$SOURCE" != null ] || {
              echo "::error::no successful push CI run on main; re-run CI on main first"; exit 1; }
          fi
          git merge-base --is-ancestor "$SOURCE" HEAD || {
            echo "::error::$SOURCE is not on main"; exit 1; }
          # Plan from the release commit's own manifests and changelogs.
          git checkout --quiet --detach "$SOURCE"
          echo "source=$SOURCE" >> "$GITHUB_OUTPUT"
          echo "ci-run-id=${CI_RUN_ID:-}" >> "$GITHUB_OUTPUT"

      # A moved or deleted recorded tag blocks; an unrecorded new tag only warns
      # (ADR-0040) — the tag rulesets already refuse moving or deleting one.
      - name: Require recorded published tags to be unmoved
        if: steps.source.outputs.source != ''
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 .github/scripts/check_tag_immutability.py --repo "$GITHUB_REPOSITORY" \
            --manifest .github/published-tags.json \
            --legacy-manifest .github/legacy-published-tags.json

      - name: Decide which plugins release
        id: eligible
        if: steps.source.outputs.source != ''
        env:
          GH_TOKEN: ${{ github.token }}
          DISPATCHED: ${{ inputs.target }}
        run: |
          set -euo pipefail
          git tag -l > "$RUNNER_TEMP/tags.txt"
          gh api --paginate --slurp "repos/$GITHUB_REPOSITORY/releases?per_page=100" > "$RUNNER_TEMP/releases.json"
          FAILED=""
          for row in \
            "ca plugins/ca/.claude-plugin/plugin.json v" \
            "ca-codex plugins/ca-codex/.codex-plugin/plugin.json ca-codex-v" \
            "ca-pi plugins/ca-pi/package.json ca-pi-v" \
            "ca-sandbox plugins/ca-sandbox/.claude-plugin/plugin.json ca-sandbox-v"
          do
            set -- $row
            TARGET="$1"; MANIFEST="$2"; PREFIX="$3"
            # One plugin's planning error must not block the others: mark only
            # that target ineligible and fail the run afterwards (ADR-0040).
            if ! VERSION=$(node -p "require('./$MANIFEST').version") \
              || ! ELIGIBLE=$(python3 .github/scripts/release_target.py eligible --version "$VERSION" \
                --prefix "$PREFIX" --tags "$RUNNER_TEMP/tags.txt" --releases "$RUNNER_TEMP/releases.json"); then
              echo "::error::$TARGET eligibility could not be decided; it will not release this run"
              ELIGIBLE=false; FAILED="$FAILED $TARGET"
            fi
            if [ -n "$DISPATCHED" ] && [ "$DISPATCHED" != "$TARGET" ]; then ELIGIBLE=false; fi
            echo "$TARGET: manifest=$VERSION eligible=$ELIGIBLE"
            echo "$TARGET=$ELIGIBLE" >> "$GITHUB_OUTPUT"
            if [ "$ELIGIBLE" = true ]; then
              # Advisory: release-skill proof freshness and ledger checks warn only.
              python3 core/pysrc/_releaselib.py run-pre-tag "$TARGET" \
                || echo "::warning::$TARGET pre-tag advisory checks did not pass (not blocking)"
            fi
          done
          echo "failed=${FAILED# }" >> "$GITHUB_OUTPUT"

  # Surfaces a per-target planning error as a red run without holding back
  # the targets that planned cleanly.
  eligibility-errors:
    needs: preflight
    if: needs.preflight.outputs.failed != ''
    runs-on: ubuntu-latest
    steps:
      - name: Fail for targets whose eligibility errored
        env:
          FAILED: ${{ needs.preflight.outputs.failed }}
        run: |
          echo "::error::eligibility errored for: $FAILED (see the preflight log)"
          exit 1

  release-ca:
    name: CA | [Release]
    needs: preflight
    if: needs.preflight.outputs.ca == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    concurrency: { group: release-ca, cancel-in-progress: false }
    permissions:
      actions: read
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.preflight.outputs.source }}
          fetch-depth: 0
          persist-credentials: false
      # A newer overlapping run may already have published this version;
      # then there is nothing left to do (ADR-0040).
      - name: Re-check that this version is still unpublished
        id: recheck
        env:
          GH_TOKEN: ${{ github.token }}
          MANIFEST: plugins/ca/.claude-plugin/plugin.json
          PREFIX: v
        run: |
          set -euo pipefail
          VERSION=$(node -p "require('./$MANIFEST').version")
          git tag -l > "$RUNNER_TEMP/tags.txt"
          gh api --paginate --slurp "repos/$GITHUB_REPOSITORY/releases?per_page=100" > "$RUNNER_TEMP/releases.json"
          GO=$(python3 .github/scripts/release_target.py eligible --version "$VERSION" \
            --prefix "$PREFIX" --tags "$RUNNER_TEMP/tags.txt" --releases "$RUNNER_TEMP/releases.json")
          [ "$GO" = true ] || echo "::notice::$PREFIX$VERSION is already published; nothing to do"
          echo "go=$GO" >> "$GITHUB_OUTPUT"
      - uses: ./.github/actions/publish-target
        if: steps.recheck.outputs.go == 'true'
        with:
          target: ca
          manifest: plugins/ca/.claude-plugin/plugin.json
          changelog: CHANGELOG.md
          tag-prefix: v
          title-prefix: codeArbiter
          mark-latest: "true"
          host: claude
          source-commit: ${{ needs.preflight.outputs.source }}
          ci-run-id: ${{ needs.preflight.outputs.ci-run-id }}
          github-token: ${{ github.token }}

  release-codex:
    name: CA-Codex | [Release]
    needs: preflight
    if: needs.preflight.outputs.ca-codex == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    concurrency: { group: release-ca-codex, cancel-in-progress: false }
    environment: codex-distribution
    permissions:
      actions: read
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.preflight.outputs.source }}
          fetch-depth: 0
          persist-credentials: false
      # Static candidate provenance is advisory under ADR-0040; the package
      # cohort verify inside publish-target is the consumer-safety gate.
      - name: Verify the static Codex candidate provenance (advisory)
        env:
          CANDIDATE_SHA: ${{ needs.preflight.outputs.source }}
        run: |
          python3 .github/scripts/verify_codex_candidate_provenance.py \
            --repo . --final-ref "$CANDIDATE_SHA" --json \
            || echo "::warning::Codex candidate provenance check did not pass (not blocking)"
      # The ca-codex-marketplace branch and ca-codex-dist-v* tags are
      # ruleset-protected; only the dedicated distribution App may write them.
      - name: Mint Codex distribution publisher token
        id: codex-publisher
        env:
          APP_ID: ${{ secrets.CODEX_DISTRIBUTION_APP_ID }}
          INSTALLATION_ID: ${{ secrets.CODEX_DISTRIBUTION_APP_INSTALLATION_ID }}
          PRIVATE_KEY: ${{ secrets.CODEX_DISTRIBUTION_APP_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          umask 077
          key="$RUNNER_TEMP/codex-distribution-app.pem"
          trap 'rm -f "$key"' EXIT
          printf '%s' "$PRIVATE_KEY" > "$key"
          python3 .github/scripts/create_codex_distribution_token.py \
            --app-id "$APP_ID" --installation-id "$INSTALLATION_ID" --private-key "$key"
      - name: Mint Codex ruleset verifier token (advisory)
        id: codex-ruleset-verifier
        continue-on-error: true
        env:
          APP_ID: ${{ secrets.CODEX_RULESET_VERIFIER_APP_ID }}
          INSTALLATION_ID: ${{ secrets.CODEX_RULESET_VERIFIER_APP_INSTALLATION_ID }}
          PRIVATE_KEY: ${{ secrets.CODEX_RULESET_VERIFIER_APP_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          umask 077
          key="$RUNNER_TEMP/codex-verifier-app.pem"
          trap 'rm -f "$key"' EXIT
          printf '%s' "$PRIVATE_KEY" > "$key"
          python3 .github/scripts/create_codex_distribution_token.py \
            --app-id "$APP_ID" --installation-id "$INSTALLATION_ID" --private-key "$key"
      # A newer overlapping run may already have published this version;
      # then there is nothing left to do (ADR-0040).
      - name: Re-check that this version is still unpublished
        id: recheck
        env:
          GH_TOKEN: ${{ github.token }}
          MANIFEST: plugins/ca-codex/.codex-plugin/plugin.json
          PREFIX: ca-codex-v
        run: |
          set -euo pipefail
          VERSION=$(node -p "require('./$MANIFEST').version")
          git tag -l > "$RUNNER_TEMP/tags.txt"
          gh api --paginate --slurp "repos/$GITHUB_REPOSITORY/releases?per_page=100" > "$RUNNER_TEMP/releases.json"
          GO=$(python3 .github/scripts/release_target.py eligible --version "$VERSION" \
            --prefix "$PREFIX" --tags "$RUNNER_TEMP/tags.txt" --releases "$RUNNER_TEMP/releases.json")
          [ "$GO" = true ] || echo "::notice::$PREFIX$VERSION is already published; nothing to do"
          echo "go=$GO" >> "$GITHUB_OUTPUT"
      - uses: ./.github/actions/publish-target
        if: steps.recheck.outputs.go == 'true'
        with:
          target: ca-codex
          manifest: plugins/ca-codex/.codex-plugin/plugin.json
          changelog: plugins/ca-codex/CHANGELOG.md
          tag-prefix: ca-codex-v
          title-prefix: ca-codex
          host: codex
          source-commit: ${{ needs.preflight.outputs.source }}
          ci-run-id: ${{ needs.preflight.outputs.ci-run-id }}
          github-token: ${{ steps.codex-publisher.outputs.token }}
          codex-ruleset-verifier-token: ${{ steps.codex-ruleset-verifier.outputs.token }}
          codex-publisher-actor-id: ${{ secrets.CODEX_DISTRIBUTION_APP_ID }}
          codex-ruleset-verifier-actor-id: ${{ secrets.CODEX_RULESET_VERIFIER_APP_ID }}

  release-pi:
    name: CA-Pi | [Release]
    needs: preflight
    if: needs.preflight.outputs.ca-pi == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    concurrency: { group: release-ca-pi, cancel-in-progress: false }
    permissions:
      actions: read
      contents: write
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.preflight.outputs.source }}
          fetch-depth: 0
          persist-credentials: false
      # A newer overlapping run may already have published this version;
      # then there is nothing left to do (ADR-0040).
      - name: Re-check that this version is still unpublished
        id: recheck
        env:
          GH_TOKEN: ${{ github.token }}
          MANIFEST: plugins/ca-pi/package.json
          PREFIX: ca-pi-v
        run: |
          set -euo pipefail
          VERSION=$(node -p "require('./$MANIFEST').version")
          git tag -l > "$RUNNER_TEMP/tags.txt"
          gh api --paginate --slurp "repos/$GITHUB_REPOSITORY/releases?per_page=100" > "$RUNNER_TEMP/releases.json"
          GO=$(python3 .github/scripts/release_target.py eligible --version "$VERSION" \
            --prefix "$PREFIX" --tags "$RUNNER_TEMP/tags.txt" --releases "$RUNNER_TEMP/releases.json")
          [ "$GO" = true ] || echo "::notice::$PREFIX$VERSION is already published; nothing to do"
          echo "go=$GO" >> "$GITHUB_OUTPUT"
      - uses: ./.github/actions/publish-target
        if: steps.recheck.outputs.go == 'true'
        with:
          target: ca-pi
          manifest: plugins/ca-pi/package.json
          companion-manifest: package.json
          changelog: plugins/ca-pi/CHANGELOG.md
          tag-prefix: ca-pi-v
          title-prefix: ca-pi
          host: pi
          source-commit: ${{ needs.preflight.outputs.source }}
          ci-run-id: ${{ needs.preflight.outputs.ci-run-id }}
          github-token: ${{ github.token }}
          npm-token: ${{ secrets.NPMJS_TOKEN }}

  release-sandbox:
    name: CA-Sandbox | [Release]
    needs: preflight
    if: needs.preflight.outputs.ca-sandbox == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    concurrency: { group: release-ca-sandbox, cancel-in-progress: false }
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.preflight.outputs.source }}
          fetch-depth: 0
          persist-credentials: false
      # A newer overlapping run may already have published this version;
      # then there is nothing left to do (ADR-0040).
      - name: Re-check that this version is still unpublished
        id: recheck
        env:
          GH_TOKEN: ${{ github.token }}
          MANIFEST: plugins/ca-sandbox/.claude-plugin/plugin.json
          PREFIX: ca-sandbox-v
        run: |
          set -euo pipefail
          VERSION=$(node -p "require('./$MANIFEST').version")
          git tag -l > "$RUNNER_TEMP/tags.txt"
          gh api --paginate --slurp "repos/$GITHUB_REPOSITORY/releases?per_page=100" > "$RUNNER_TEMP/releases.json"
          GO=$(python3 .github/scripts/release_target.py eligible --version "$VERSION" \
            --prefix "$PREFIX" --tags "$RUNNER_TEMP/tags.txt" --releases "$RUNNER_TEMP/releases.json")
          [ "$GO" = true ] || echo "::notice::$PREFIX$VERSION is already published; nothing to do"
          echo "go=$GO" >> "$GITHUB_OUTPUT"
      - uses: ./.github/actions/publish-target
        if: steps.recheck.outputs.go == 'true'
        with:
          target: ca-sandbox
          manifest: plugins/ca-sandbox/.claude-plugin/plugin.json
          changelog: plugins/ca-sandbox/CHANGELOG.md
          tag-prefix: ca-sandbox-v
          title-prefix: ca-sandbox
          source-commit: ${{ needs.preflight.outputs.source }}
          github-token: ${{ github.token }}
