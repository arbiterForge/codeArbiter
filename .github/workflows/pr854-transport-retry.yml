name: PR854 transport retry validation (temporary)
on:
  push:
    branches: [codex/farm-readiness-canary-isolation]
    paths: [.github/workflows/pr854-transport-retry.yml]
permissions:
  contents: read
jobs:
  validate:
    if: github.repository == 'arbiterForge/codeArbiter' && github.ref == 'refs/heads/codex/farm-readiness-canary-isolation'
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            node: '22.19.0'
            label: linux
          - os: windows-latest
            node: '20'
            label: windows
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: 4e7ff2139480c25fe28bca5def14b8f857f8ffd6
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.14'
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: ${{ matrix.node }}
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e
        with:
          go-version: '1.27.1'
          check-latest: false
          cache: false
          go-download-base-url: https://go.dev/dl
      - name: Acquire exact reviewed changes as inert data
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python - <<'PY'
          import base64,hashlib,json,lzma,os,pathlib,urllib.request
          assert os.environ['GITHUB_REPOSITORY']=='arbiterForge/codeArbiter'
          assert os.environ['GITHUB_REF']=='refs/heads/codex/farm-readiness-canary-isolation'
          out=pathlib.Path(os.environ['RUNNER_TEMP'])/'pr854-transport';out.mkdir()
          class NoRedirect(urllib.request.HTTPRedirectHandler):
              def redirect_request(self,*args,**kwargs):raise RuntimeError('Unexpected redirect')
          def api(path):
              req=urllib.request.Request('https://api.github.com/repos/arbiterForge/codeArbiter'+path,headers={'Authorization':'Bearer '+os.environ['GH_TOKEN'],'Accept':'application/vnd.github+json'})
              with urllib.request.build_opener(NoRedirect).open(req,timeout=45) as response:return json.load(response)
          chunks=[]
          for sha in ['7d68a69dbb05ce86352dd8ab99f44e71934b3805','61673405ec308ebf1099a2089ed4d0d03935af3b']:
              record=api('/git/blobs/'+sha);assert record['sha']==sha and record['encoding']=='base64'
              raw=base64.b64decode(record['content'])
              assert hashlib.sha1(b'blob '+str(len(raw)).encode()+b'\0'+raw).hexdigest()==sha
              chunks.append(raw)
          packed=b''.join(chunks);assert len(packed)==13304
          data=lzma.decompress(packed)
          assert len(data)==48770 and hashlib.sha256(data).hexdigest()=='63e389a0e10141ef1442963cbad08c5ffb9a8fb5eabc369b138ac8976489c3fe'
          payload=json.loads(data)
          assert payload['parent']=='4e7ff2139480c25fe28bca5def14b8f857f8ffd6'
          assert payload['base_tree']=='c185e17de06b86aef889be5bcb594878fa98d4a8'
          assert payload['tree']=='3d72611e9ec5dfc2911d248fa34d244b39229e2c'
          assert len(payload['files'])==13 and len({r['path'] for r in payload['files']})==13
          for row in payload['files']:
              p=pathlib.PurePosixPath(row['path'])
              assert not p.is_absolute() and '..' not in p.parts and str(p)==row['path']
              assert row['mode'] in {'100644','100755'}
          (out/'payload.json').write_bytes(data)
          (out/'reviewed.patch').write_bytes(payload['source_patch'].encode('utf-8'))
          jobs=api('/actions/runs/36079154677/jobs?per_page=100')
          assert jobs['total_count']<=100
          (out/'prior-run-jobs.json').write_bytes(json.dumps([{'id':j['id'],'name':j['name'],'status':j['status'],'conclusion':j['conclusion']} for j in jobs['jobs']],indent=2).encode('utf-8'))
          PY
      - name: Apply and rebuild the exact preserving tree
        shell: bash
        run: |
          python - <<'PY'
          import hashlib,json,os,pathlib,subprocess
          root=pathlib.Path.cwd();out=pathlib.Path(os.environ['RUNNER_TEMP'])/'pr854-transport'
          payload=json.loads((out/'payload.json').read_bytes());base=payload['parent'];head=os.environ['GITHUB_SHA']
          def git(*args):return subprocess.check_output(['git',*args])
          def oid(data):return hashlib.sha1(b'blob '+str(len(data)).encode()+b'\0'+data).hexdigest()
          assert git('rev-parse','HEAD').decode().strip()==base
          assert git('rev-parse',base+'^{tree}').decode().strip()==payload['base_tree']
          subprocess.run(['git','merge-base','--is-ancestor',base,head],check=True)
          assert git('diff','--name-only',base,head).decode().splitlines()==['.github/workflows/pr854-transport-retry.yml']
          assert not git('status','--porcelain=v1','--untracked-files=no').strip()
          assert subprocess.check_output(['go','env','GOVERSION'],text=True).strip()=='go1.27.1'
          subprocess.run(['git','config','--local','core.autocrlf','false'],check=True)
          subprocess.run(['git','config','--local','core.eol','lf'],check=True)
          paths=[row['path'] for row in payload['files']]
          for row in payload['files']:
              p=root/row['path'];raw=git('show',base+':'+row['path']);before=p.read_bytes()
              assert oid(raw)==row['old_sha']
              assert before==raw or (os.name=='nt' and before.replace(b'\r\n',b'\n')==raw),row['path']
              assert git('ls-tree',base,'--',row['path']).decode().split()[0]==row['mode']
              p.write_bytes(raw)
          subprocess.run(['git','add','--',*paths],check=True)
          assert git('write-tree').decode().strip()==payload['base_tree']
          subprocess.run(['git','apply','--check','--index','--unidiff-zero',str(out/'reviewed.patch')],check=True)
          subprocess.run(['git','apply','--index','--unidiff-zero',str(out/'reviewed.patch')],check=True)
          tools=root/'plugins/ca/tools'
          for args in [['npm','ci','--ignore-scripts','--no-fund','--no-audit'],['npm','audit','--include=dev','--audit-level=high'],['npm','run','typecheck'],['npm','run','build']]:
              subprocess.run(args,cwd=tools,check=True,shell=os.name=='nt')
          for tool in ['tools/build-surface.py','tools/sync-core.py','tools/build-host-packages.py']:
              subprocess.run(['python',tool],check=True)
          assert set(git('diff','HEAD','--name-only').decode().splitlines())==set(paths)
          for row in payload['files']:assert oid((root/row['path']).read_bytes())==row['sha'],row['path']
          subprocess.run(['git','add','--',*paths],check=True)
          subprocess.run(['git','diff','--cached','--check'],check=True)
          tree=git('write-tree').decode().strip();assert tree==payload['tree']
          env=dict(os.environ,GIT_AUTHOR_NAME='Validation fixture',GIT_AUTHOR_EMAIL='validation@example.invalid',GIT_COMMITTER_NAME='Validation fixture',GIT_COMMITTER_EMAIL='validation@example.invalid')
          fixture=subprocess.check_output(['git','commit-tree',tree,'-p',head],input='Qualify bounded transport retry and Pi test isolation\n',text=True,env=env).strip()
          subprocess.run(['git','checkout','--detach',fixture],check=True)
          (out/'fixture.json').write_bytes(json.dumps({'tree':tree,'parent':head,'fixture':fixture}).encode('utf-8'))
          PY
      - name: Execute farm and generated-resource regressions
        shell: bash
        run: |
          python - <<'PY'
          import json,os,pathlib,subprocess,sys,time
          root=pathlib.Path.cwd();out=pathlib.Path(os.environ['RUNNER_TEMP'])/'pr854-transport'
          commands=[(['npm','run','coverage'],root/'plugins/ca/tools')]
          suites=['test_ci_impact','test_host_descriptors','test_routing_and_cleanup_surface','test_build_surface','test_public_codex_docs','test_provenance_wiring','test_payload_version_gate','test_artifact_farm']
          commands += [([sys.executable,'.github/scripts/'+name+'.py'],root) for name in suites]
          commands += [([sys.executable,tool,'--check'],root) for tool in ['tools/build-surface.py','tools/sync-core.py','tools/build-host-packages.py']]
          commands += [([sys.executable,'.github/scripts/'+name+'.py'],root) for name in ['check_destructive_registry','check_routing_index_parity','check_docs_contract']]
          commands += [([sys.executable,'.github/scripts/check-plugin-refs.py',host],root) for host in ['ca','ca-codex','ca-pi']]
          results=[]
          for i,(args,cwd) in enumerate(commands):
              log=f'{i:02d}-'+('farm-coverage' if args[0]=='npm' else pathlib.Path(args[1]).stem)+'.log';start=time.monotonic()
              try:
                  done=subprocess.run(args,cwd=cwd,capture_output=True,text=True,encoding='utf-8',errors='replace',timeout=420,env=dict(os.environ,PYTHONDONTWRITEBYTECODE='1'),shell=os.name=='nt' and args[0]=='npm')
                  code=done.returncode;content=done.stdout+done.stderr
              except subprocess.TimeoutExpired:code=124;content='Timed out; not a passing result.\n'
              (out/log).write_bytes(content.encode('utf-8'))
              results.append({'command':args,'exit_code':code,'seconds':round(time.monotonic()-start,3),'log':log})
              (out/'farm-tests.json').write_bytes(json.dumps(results,indent=2).encode('utf-8'));print(code,' '.join(args),flush=True)
          assert all(r['exit_code']==0 for r in results),'Inspect actual farm/static failures.'
          PY
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: '22.19.0'
      - name: Install the existing locked Pi host fixture
        shell: bash
        run: python .github/scripts/pi_host_locks.py install --version 0.84.1 --prefix "$RUNNER_TEMP/pi-host-0.84.1"
      - name: Execute full Pi coverage without modifying production deadlines
        shell: bash
        working-directory: plugins/ca-pi/tools
        run: |
          set -euo pipefail
          npm ci --ignore-scripts --no-fund --no-audit
          npm audit --include=dev --audit-level=high
          npm run typecheck
          OUT="$RUNNER_TEMP/pr854-transport"
          npx vitest run --coverage --reporter=default --reporter=json --outputFile.json="$OUT/pi-results.json" 2>&1 | tee "$OUT/pi-coverage.log"
          python - <<'PY'
          import json,os,pathlib
          out=pathlib.Path(os.environ['RUNNER_TEMP'])/'pr854-transport';data=json.loads((out/'pi-results.json').read_bytes())
          assert data['success'] and data['numFailedTests']==0 and data['numTotalTests']>=878
          (out/'pi-passed.json').write_bytes(json.dumps({'total':data['numTotalTests'],'passed':data['numPassedTests'],'pending':data['numPendingTests'],'failed':data['numFailedTests']},indent=2).encode('utf-8'))
          PY
      - name: Bind results to exact tree and preserve candidate bytes
        shell: bash
        env:
          PLATFORM_LABEL: ${{ matrix.label }}
        run: |
          python - <<'PY'
          import hashlib,json,os,pathlib,subprocess,zipfile
          root=pathlib.Path.cwd();out=pathlib.Path(os.environ['RUNNER_TEMP'])/'pr854-transport'
          payload=json.loads((out/'payload.json').read_bytes());tests=json.loads((out/'farm-tests.json').read_bytes())
          assert all(r['exit_code']==0 for r in tests)
          assert json.loads((out/'pi-passed.json').read_bytes())['failed']==0
          assert subprocess.check_output(['git','rev-parse','HEAD^{tree}'],text=True).strip()==payload['tree']
          assert not subprocess.check_output(['git','diff','--name-only'],text=True).strip()
          for row in payload['files']:
              data=(root/row['path']).read_bytes();assert hashlib.sha1(b'blob '+str(len(data)).encode()+b'\0'+data).hexdigest()==row['sha'],row['path']
          with zipfile.ZipFile(out/'candidate-files.zip','w',zipfile.ZIP_DEFLATED) as z:
              for row in payload['files']:z.write(root/row['path'],row['path'])
          (out/'candidate.diff').write_bytes(subprocess.check_output(['git','diff','--binary','--full-index',payload['parent'],'HEAD']))
          (out/'manifest.json').write_bytes(json.dumps({'source_parent':payload['parent'],'workflow_head':os.environ['GITHUB_SHA'],'tree':payload['tree'],'files':payload['files'],'platform':os.environ['PLATFORM_LABEL'],'farm_commands':len(tests),'pi_suite_passed':True,'all_checks_passed':True},indent=2).encode('utf-8'))
          PY
      - name: Store verified blobs without changing a branch
        if: matrix.label == 'linux'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python - <<'PY'
          import hashlib,json,os,pathlib,urllib.request
          out=pathlib.Path(os.environ['RUNNER_TEMP'])/'pr854-transport';report=json.loads((out/'manifest.json').read_bytes())
          assert report['all_checks_passed'] and report['workflow_head']==os.environ['GITHUB_SHA']
          assert os.environ['GITHUB_REPOSITORY']=='arbiterForge/codeArbiter' and os.environ['GITHUB_REF']=='refs/heads/codex/farm-readiness-canary-isolation'
          class NoRedirect(urllib.request.HTTPRedirectHandler):
              def redirect_request(self,*args,**kwargs):raise RuntimeError('Unexpected redirect')
          def api(method,path,payload=None):
              req=urllib.request.Request('https://api.github.com/repos/arbiterForge/codeArbiter'+path,method=method,data=json.dumps(payload).encode('utf-8') if payload is not None else None,headers={'Authorization':'Bearer '+os.environ['GH_TOKEN'],'Accept':'application/vnd.github+json','Content-Type':'application/json'})
              with urllib.request.build_opener(NoRedirect).open(req,timeout=45) as response:return json.load(response)
          assert api('GET','/git/ref/heads/codex/farm-readiness-canary-isolation')['object']['sha']==report['workflow_head']
          for row in report['files']:
              data=pathlib.Path(row['path']).read_bytes();assert hashlib.sha1(b'blob '+str(len(data)).encode()+b'\0'+data).hexdigest()==row['sha']
              assert api('POST','/git/blobs',{'content':data.decode('utf-8'),'encoding':'utf-8'})['sha']==row['sha']
          (out/'uploaded-blobs.json').write_bytes(json.dumps({'files':report['files'],'branch_updated':False},indent=2).encode('utf-8'))
          PY
      - name: Retain actual outcomes, including any failure
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: pr854-transport-${{ matrix.label }}-${{ github.run_id }}
          path: ${{ runner.temp }}/pr854-transport/
          if-no-files-found: error
          retention-days: 3
