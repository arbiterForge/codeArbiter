name: PR 851 continuation inputs
on:
  push:
    branches: [docs/guide-discovery-and-review-journey]
    paths: [.github/workflows/pr851-continuation-inputs.yml]
permissions:
  contents: read
jobs:
  capture:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Capture source and identity without executing repository code
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/pr851-inputs"
          git rev-parse HEAD HEAD^{tree} > "$RUNNER_TEMP/pr851-inputs/identity.txt"
          git bundle create "$RUNNER_TEMP/pr851-inputs/source.bundle" HEAD ^cf92aff7d00d0f7e1f21681e44af3b800ddc7448
          cd "$RUNNER_TEMP/pr851-inputs"
          sha256sum identity.txt source.bundle > SHA256SUMS
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: pr851-continuation-inputs
          path: ${{ runner.temp }}/pr851-inputs/
          retention-days: 1
          if-no-files-found: error
