name: PR862 search objects
on:
  push:
    branches: [prep/pr862-search-completion-1120]
    paths: [.github/workflows/pr862-search-objects.yml]
permissions:
  contents: write
jobs:
  prepare:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: 0c989584f0bc14bdf95d62dc80b910bf85c0f0fb
          persist-credentials: false
      - name: Verify the tested patch and create unreferenced blobs only
        shell: python
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          import base64, gzip, hashlib, json, os, pathlib, subprocess, urllib.request
          expected = {
              'site/astro.config.mjs': '54fe7a3fb02da8135df8aef30dbe229d1d064098',
              'site/package-lock.json': '1bd3deefda25a9b433b0bad8232a54903bcfd37c',
              'site/package.json': '55d8f2af90c895162551538285162301d675730a',
              'site/reviews/CONCEPTS-C04-SOURCES.md': '6816ec83743d70861e32a0c1d76ac5db6306433e',
              'site/reviews/PR862-SEARCH-INTEGRITY.md': '08dc961122af8d121bb7338003fc97b986de9c01',
              'site/scripts/pagefind-build.test.ts': 'b9362892cc2111338690cfdac1f6e72c55097372',
              'site/scripts/pagefind-build.ts': 'bd58968e3c7798d9152a600cbaec213486fbaba3',
              'site/test/browser/search-bundle.spec.ts': '7b6977b554df18cebc3cee0519a8bd44e5309410',
          }
          encoded = '?'
          # The complete reviewed patch is provided by the next step only after its
          # individual source blobs have been explicitly supplied and verified.
          # Refuse an incomplete transfer; never publish partial correction objects.
          raise RuntimeError('Patch transfer intentionally incomplete: no objects or refs written')
