name: PR862 search objects
on:
  push:
    branches: [prep/pr862-search-completion-1120]
    paths: [.github/workflows/pr862-search-objects.yml]
permissions:
  contents: write
jobs:
  prepare:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: 0c989584f0bc14bdf95d62dc80b910bf85c0f0fb
          persist-credentials: false
      - name: Apply four bounded edits and upload verified unreferenced blobs
        shell: python
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          import base64, hashlib, json, os, pathlib, subprocess, urllib.request
          assert subprocess.check_output(['git','rev-parse','HEAD'], text=True).strip() == '0c989584f0bc14bdf95d62dc80b910bf85c0f0fb'
          expected = {
              'site/astro.config.mjs': '54fe7a3fb02da8135df8aef30dbe229d1d064098',
              'site/package-lock.json': '1bd3deefda25a9b433b0bad8232a54903bcfd37c',
              'site/package.json': '55d8f2af90c895162551538285162301d675730a',
              'site/reviews/CONCEPTS-C04-SOURCES.md': '6816ec83743d70861e32a0c1d76ac5db6306433e',
          }
          for name in ['site/package.json', 'site/package-lock.json']:
              path = pathlib.Path(name)
              value = json.loads(path.read_text())
              original_nodes = {k:v for k,v in value.get('packages', {}).items() if k}
              root = value['packages'][''] if name.endswith('lock.json') else value
              root['devDependencies']['pagefind'] = '1.5.2'
              root['devDependencies'] = dict(sorted(root['devDependencies'].items()))
              assert original_nodes == {k:v for k,v in value.get('packages', {}).items() if k}
              path.write_text(json.dumps(value, indent=2)+'\n')
          path = pathlib.Path('site/astro.config.mjs')
          text = path.read_text()
          replacements = [
              ('import starlight from "@astrojs/starlight";', 'import starlight from "@astrojs/starlight";\nimport { completePagefind } from "./scripts/pagefind-build.ts";'),
              ('      title: "codeArbiter",', '      // The custom integration below uses the same indexer but awaits and verifies\n      // all output bytes. Our existing Search override remains the reader UI.\n      pagefind: false,\n      title: "codeArbiter",'),
              ('      sidebar: buildJourneySidebar(referenceGroups, academySidebarItems),\n    }),', '      sidebar: buildJourneySidebar(referenceGroups, academySidebarItems),\n    }),\n    completePagefind(),'),
          ]
          for old, new in replacements:
              assert text.count(old) == 1
              text = text.replace(old, new)
          path.write_text(text)
          path = pathlib.Path('site/reviews/CONCEPTS-C04-SOURCES.md')
          text = path.read_text() + '\n### Search output at final publication\n\nThe latest exact-head browser run exposed an incomplete served Pagefind module,\nnot a workflow-map content or navigation failure. Its evidence and the new awaited,\nbyte-verified build boundary are recorded in [PR862-SEARCH-INTEGRITY.md](./PR862-SEARCH-INTEGRITY.md).\nThe six real search checks remain unchanged. The completed C04 maps and chapter\nnavigation are retained while this final publication prerequisite is verified.\n'
          path.write_text(text)
          entries = []
          for name, expected_sha in expected.items():
              raw = pathlib.Path(name).read_bytes()
              digest = hashlib.sha1(f'blob {len(raw)}\0'.encode()+raw).hexdigest()
              assert digest == expected_sha, (name, digest)
              request = urllib.request.Request('https://api.github.com/repos/arbiterForge/codeArbiter/git/blobs', data=json.dumps({'content':base64.b64encode(raw).decode(),'encoding':'base64'}).encode(), headers={'Authorization':'Bearer '+os.environ['GH_TOKEN'],'Accept':'application/vnd.github+json','Content-Type':'application/json'}, method='POST')
              with urllib.request.urlopen(request, timeout=30) as response:
                  returned = json.load(response)
              assert returned['sha'] == digest
              entries.append({'path':name,'mode':'100644','type':'blob','sha':digest})
          out = pathlib.Path(os.environ['RUNNER_TEMP'])/'pr862-search-objects'
          out.mkdir()
          (out/'objects.json').write_text(json.dumps(entries, indent=2)+'\n')
          print(json.dumps(entries))
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: pr862-search-objects
          path: ${{ runner.temp }}/pr862-search-objects/
          retention-days: 1
          if-no-files-found: error
