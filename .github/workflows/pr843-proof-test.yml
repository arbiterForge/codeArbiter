name: PR843 proof-test preparation (temporary)
on:
  push:
    branches: [codex/autonomy-routing-integration]
    paths: [.github/workflows/pr843-proof-test.yml]
permissions:
  contents: read
jobs:
  prepare:
    if: github.repository == 'arbiterForge/codeArbiter' && github.ref == 'refs/heads/codex/autonomy-routing-integration'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.13'
      - name: Repair test isolation and verify the real release refusal remains
        shell: bash
        run: |
          python - <<'PY'
          import hashlib, json, os, pathlib, subprocess, sys
          root=pathlib.Path.cwd()
          out=pathlib.Path(os.environ['RUNNER_TEMP'])/'pr843-proof-test'
          out.mkdir()
          path=root/'.github/scripts/test_public_codex_docs.py'
          raw=path.read_bytes()
          assert hashlib.sha1(b'blob '+str(len(raw)).encode()+b'\0'+raw).hexdigest()=='04c0bcdc5cbff4a156137245d046e2fb140c63bc'
          subprocess.run(['git','merge-base','--is-ancestor','25667b59f6af3020aaebdc56a82f64361b80b735','HEAD'],check=True)
          def check(name,args):
              result=subprocess.run([sys.executable,str(path),*args],capture_output=True,text=True,timeout=90)
              (out/name).write_text(result.stdout+result.stderr)
              return result
          red=check('red.log',['PublicCodexDocsTest.test_codex_live_baseline_rejects_candidate_digest_corruption'])
          assert red.returncode==1 and 'FAILED (failures=1)' in red.stderr and 'ERROR:' not in red.stderr
          text=raw.decode()
          start=text.index('    def test_codex_live_baseline_rejects_candidate_digest_corruption(self):')
          end=text.index('    def test_codex_live_baseline_rejects_duplicate_metadata_markers',start)
          replacement='''    def test_codex_live_baseline_rejects_candidate_digest_corruption(self):
                  """Isolate the digest guard from an independently stale manifest version."""
                  runbook = (ROOT / "docs" / "codex-parity-testing.md").read_text(encoding="utf-8")
                  marker = live_baseline_marker(runbook)
                  # A retained live baseline is allowed to lag development. Match the
                  # fixture version, then corrupt only the simulated CURRENT bytes. Do
                  # not rewrite the retained marker or publish this fixture as evidence.
                  fixture_manifest = {"version": marker["adapter_version"]}
                  with mock.patch.object(self, "_tracked_candidate_package_sha256", return_value="0" * 64) as current_digest:
                      with self.assertRaisesRegex(AssertionError, "exact current candidate package"):
                          self._assert_live_baseline_marker(
                              runbook, fixture_manifest, require_current_candidate=True
                          )
                      current_digest.assert_called_once_with()
          
              def test_codex_release_rejects_stale_version_before_digest(self):
                  """A version mismatch remains a release refusal, not a skipped check."""
                  runbook = (ROOT / "docs" / "codex-parity-testing.md").read_text(encoding="utf-8")
                  marker = live_baseline_marker(runbook)
                  fixture_manifest = {"version": marker["adapter_version"] + "-different"}
                  with mock.patch.object(self, "_tracked_candidate_package_sha256") as current_digest:
                      with self.assertRaisesRegex(AssertionError, "current package manifest"):
                          self._assert_live_baseline_marker(
                              runbook, fixture_manifest, require_current_candidate=True
                          )
                      current_digest.assert_not_called()
          
          '''
          # YAML removes the common ten-space block indentation; explicit
          # leading spaces inside this literal preserve Python class indentation.
          text=text[:start]+replacement+text[end:]
          assert text.count('import unittest\n')==1
          text=text.replace('import unittest\n','import unittest\nfrom unittest import mock\n',1)
          compiled=compile(text,str(path),'exec')
          path.write_text(text,encoding='utf-8',newline='\n')
          data=path.read_bytes()
          expected='bd3c338d87d64e6f7e0b7ea3fd4587891dfb87db'
          assert hashlib.sha1(b'blob '+str(len(data)).encode()+b'\0'+data).hexdigest()==expected
          green=check('ordinary-contract.log',[])
          assert green.returncode==0 and 'Ran 19 tests' in green.stderr
          refusal=check('release-refusal.log',['--require-current-candidate'])
          assert refusal.returncode==1 and 'FAILED (failures=1)' in refusal.stderr and 'current package manifest' in refusal.stderr and 'ERROR:' not in refusal.stderr
          subprocess.run(['git','diff','--check'],check=True)
          assert subprocess.check_output(['git','diff','--name-only'],text=True).strip()=='.github/scripts/test_public_codex_docs.py'
          (out/'candidate-test.py').write_bytes(data)
          (out/'validation.json').write_text(json.dumps({'ordinary_contract_tests':19,'ordinary_pass':True,'release_gate':'blocked: current candidate lacks matching live proof','head':os.environ['GITHUB_SHA'],'blob':expected},indent=2))
          PY
      - name: Create test-only candidate objects, never update a ref
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python - <<'PY'
          import hashlib,json,os,pathlib,subprocess,urllib.request
          out=pathlib.Path(os.environ['RUNNER_TEMP'])/'pr843-proof-test'
          proof=json.loads((out/'validation.json').read_text())
          sha=os.environ['GITHUB_SHA']
          assert proof['head']==sha
          assert os.environ['GITHUB_REPOSITORY']=='arbiterForge/codeArbiter'
          assert os.environ['GITHUB_REF']=='refs/heads/codex/autonomy-routing-integration'
          class NoRedirect(urllib.request.HTTPRedirectHandler):
              def redirect_request(self,*args,**kwargs):
                  raise RuntimeError('Unexpected redirect')
          def api(method,path,payload=None):
              request=urllib.request.Request('https://api.github.com/repos/arbiterForge/codeArbiter'+path,method=method,data=json.dumps(payload).encode() if payload is not None else None,headers={'Authorization':'Bearer '+os.environ['GH_TOKEN'],'Content-Type':'application/json','Accept':'application/vnd.github+json'})
              with urllib.request.build_opener(NoRedirect).open(request,timeout=45) as response:
                  return json.load(response)
          assert api('GET','/git/ref/heads/codex/autonomy-routing-integration')['object']['sha']==sha
          data=(out/'candidate-test.py').read_bytes()
          assert hashlib.sha1(b'blob '+str(len(data)).encode()+b'\0'+data).hexdigest()==proof['blob']
          blob=api('POST','/git/blobs',{'content':data.decode(),'encoding':'utf-8'})['sha']
          assert blob==proof['blob']
          # Environment passed to the Git reader has no API credential.
          env={k:v for k,v in os.environ.items() if k not in {'GH_TOKEN','GITHUB_TOKEN'}}
          base=subprocess.check_output(['git','rev-parse','HEAD^{tree}'],text=True,env=env).strip()
          tree=api('POST','/git/trees',{'base_tree':base,'tree':[{'path':'.github/scripts/test_public_codex_docs.py','mode':'100644','type':'blob','sha':blob},{'path':'.github/workflows/pr843-proof-test.yml','mode':'100644','type':'blob','sha':None}]})['sha']
          commit=api('POST','/git/commits',{'message':'test: isolate version and digest release-proof refusals\n\nAllow ordinary development checks to retain an older truthful live marker.\nThe current-candidate release gate still requires exact new live evidence.\nNo recorded proof, payload, or release policy changes.','tree':tree,'parents':[sha]})['sha']
          (out/'candidate.json').write_text(json.dumps({'commit':commit,'tree':tree,'parent':sha,'blob':blob,'branch_updated':False},indent=2))
          PY
      - name: Retain exact test evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: pr843-proof-test-${{ github.run_id }}
          path: ${{ runner.temp }}/pr843-proof-test/
          if-no-files-found: error
          retention-days: 3
