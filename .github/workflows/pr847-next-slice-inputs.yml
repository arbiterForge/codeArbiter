name: PR 847 next-slice inputs
on:
  push:
    branches: [docs/human-experience-artifact-window]
    paths: [.github/workflows/pr847-next-slice-inputs.yml]
permissions:
  contents: read
jobs:
  capture:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: e1da12e8b1a9c82eebeb800c98f5fbf111010c08
          fetch-depth: 0
          persist-credentials: false
      - name: Capture exact source objects without executing product code
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = e1da12e8b1a9c82eebeb800c98f5fbf111010c08
          mkdir -p "$RUNNER_TEMP/pr847-next-inputs"
          git branch captured-pr847-next HEAD
          git bundle create "$RUNNER_TEMP/pr847-next-inputs/source.bundle" refs/heads/captured-pr847-next ^20437a96b4dd9914d7e4a3b506030f911c25e194
          git rev-parse HEAD HEAD^{tree} > "$RUNNER_TEMP/pr847-next-inputs/identity.txt"
          cd "$RUNNER_TEMP/pr847-next-inputs"
          sha256sum source.bundle identity.txt > SHA256SUMS
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: pr847-next-slice-inputs
          path: ${{ runner.temp }}/pr847-next-inputs/
          retention-days: 1
          if-no-files-found: error
