<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 28" width="160" height="28" role="img" aria-label="codeArbiter">
  <title>codeArbiter</title>
  <desc>An unproven commit crosses a governed gate and leaves as a proven decision.</desc>
  <defs>
    <linearGradient id="ca-gate-gold" x1="6" y1="4" x2="26" y2="23" gradientUnits="userSpaceOnUse">
      <stop stop-color="#f3c958"/>
      <stop offset="1" stop-color="#d89920"/>
    </linearGradient>
  </defs>

  <g aria-hidden="true">
    <path
      data-brand-element="commit-line"
      d="M2 20h24"
      fill="none"
      stroke="#465565"
      stroke-width="1.5"
      stroke-linecap="round"
    />
    <circle
      data-brand-element="unproven-node"
      cx="4"
      cy="20"
      r="2"
      fill="#090d12"
      stroke="#7f8d9d"
      stroke-width="1.3"
    />
    <g
      data-brand-element="gate-posts"
      fill="none"
      stroke="url(#ca-gate-gold)"
      stroke-width="2.15"
      stroke-linecap="round"
    >
      <path d="M11 10v12"/>
      <path d="M17 10v12"/>
    </g>
    <rect
      data-brand-element="gate-beam"
      x="6"
      y="7"
      width="16"
      height="2.75"
      rx=".55"
      fill="url(#ca-gate-gold)"
    />
    <path
      data-brand-element="terminal-chevron"
      d="m11.9 3.5 2.1 3 2.1-3"
      fill="none"
      stroke="#f3c958"
      stroke-width="1.55"
      stroke-linecap="round"
      stroke-linejoin="round"
    />
    <circle
      data-brand-element="proven-node"
      cx="24"
      cy="20"
      r="2.55"
      fill="#e5ad2c"
    />
  </g>

  <text
    x="34"
    y="20.75"
    font-family="'Manrope Variable', 'Segoe UI Variable', 'Segoe UI', sans-serif"
    font-size="16"
    letter-spacing="-.25"
  >
    <tspan fill="#e7edf4" font-weight="430">code</tspan><tspan fill="#e6ad2c" font-weight="750">Arbiter</tspan>
  </text>
</svg>
